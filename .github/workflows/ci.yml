name: CI

# Every branch of this repository, not just master: a change now lands
# through a gate that waits for these checks on the exact commit it is
# about to put on master (see docs/ci-gate.md), so they have to run while
# the work is still on its own branch. Pull requests keep their own run,
# which is what a fork's change gets (a fork never has a branch here).
on:
  pull_request:
  push:
    branches: ['**']

# One version list, everywhere. GitHub, the pre-commit hook and the live
# server all install from uv.lock, so a test that passes here passes there.
# Before this, GitHub took the newest of everything, the hook took whatever
# was in ~/.local, and the server took the lock file — and the three
# disagreed enough to keep master red for eight days.
env:
  UV_FROZEN: "1"

# One run per branch: a second push while the first is still going cancels
# it, because nobody is waiting on a commit that has already been replaced.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run mypy temper_ai/ --ignore-missing-imports

  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Off, deliberately. With fail-fast on, 3.11 failing cancelled 3.12
      # mid-run, so a version-specific break looked like a break everywhere
      # and half the evidence was thrown away.
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev

      - name: Show what is installed
        run: uv run python scripts/show_versions.py

      # No -x. Stopping at the first failure hid every other one, so each red
      # run told you about a single test and you found the next only after
      # fixing that. -n auto: the runners have 2-4 cores.
      - name: Run the tests
        run: uv run pytest tests/ --timeout=60 -n auto --junitxml=junit.xml

      - name: Summarise
        if: always()
        run: uv run python scripts/junit_summary.py junit.xml --title "Python ${{ matrix.python-version }} · SQLite"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.python-version }}
          path: junit.xml
          retention-days: 7

  test-postgres:
    # The database tier. Everything else runs on in-memory SQLite, which is
    # fast but is not what temper runs on: the time-zone handling, the unique
    # constraints and the row locking are all Postgres's. This job runs the
    # tests that touch the database against a real one. (The workflow started
    # a Postgres before this and no test ever connected to it.)
    name: tests (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: temper_ai_test
          POSTGRES_USER: temper_ai
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --frozen --extra dev

      - name: Show what is installed
        run: uv run python scripts/show_versions.py

      - name: Run the tests, with the database tier on Postgres
        env:
          TEMPER_TEST_DATABASE_URL: postgresql://temper_ai:test@127.0.0.1:5432/temper_ai_test
        run: uv run pytest tests/ --timeout=120 -n auto --junitxml=junit-pg.xml

      - name: Summarise
        if: always()
        run: uv run python scripts/junit_summary.py junit-pg.xml --title "Python 3.12 · Postgres tier"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-postgres
          path: junit-pg.xml
          retention-days: 7

  frontend:
    # The dashboard had no CI at all: its unit tests had been failing for
    # months and type errors could land unnoticed.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run --reporter=default --reporter=junit --outputFile=vitest-junit.xml
      - name: Summarise
        if: always()
        run: python3 ../scripts/junit_summary.py vitest-junit.xml --title "Dashboard unit tests"
      - run: npm run build

  e2e:
    # The browser tests that need no temper. No temper is started here, not
    # even a throwaway one: AGENTS.md rule 15 allows no copy of Temper but the
    # live one, GitHub's included. The spec files listed in
    # frontend/e2e/server-free.txt answer every API call themselves and run
    # against this commit's own build, served by scripts/e2e_static_server.py
    # (frontend/playwright.server-free.config.ts). The live dashboard is looked
    # at by temper-ci after every deploy (docs/ci-gate.md). The job keeps its
    # name: master's branch protection and `wt land` wait for it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Which browser tests need no temper
        id: list
        run: |
          specs=$(sed -e 's/#.*//' -e 's/[[:space:]]//g' frontend/e2e/server-free.txt | grep -v '^$' || true)
          count=$(printf '%s\n' "$specs" | grep -c . || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "### Browser tests"
            echo
            echo "No temper is started here (AGENTS.md rule 15: no copy of Temper but the live one, GitHub's included)."
            echo "temper-ci looks at the live dashboard after every deploy (docs/ci-gate.md)."
            echo
            if [ "$count" = 0 ]; then
              echo "No spec file is listed in \`frontend/e2e/server-free.txt\`, so none ran."
            else
              echo "$count spec file(s) from \`frontend/e2e/server-free.txt\`, against this commit's own build:"
              printf -- '- %s\n' $specs
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        if: steps.list.outputs.count != '0'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the dashboard
        if: steps.list.outputs.count != '0'
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install the browser
        if: steps.list.outputs.count != '0'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the browser tests that need no temper
        if: steps.list.outputs.count != '0'
        working-directory: frontend
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: playwright-junit.xml
        run: npx playwright test -c playwright.server-free.config.ts --reporter=list,junit

      - name: Summarise
        if: always() && steps.list.outputs.count != '0'
        working-directory: frontend
        run: python3 ../scripts/junit_summary.py playwright-junit.xml --title "Browser tests"

      # Named, not fatal. Failing the commit on a flake would push everyone
      # into re-running until green, which is the habit we are trying to
      # lose. The nightly repeats the suite and does treat flakiness as a
      # failure, and that is what sends the message.
      - name: Say which tests only passed on their retry
        if: always() && steps.list.outputs.count != '0'
        working-directory: frontend
        run: python3 ../scripts/flaky_report.py playwright-junit.xml --title "Browser tests" --soft

      - uses: actions/upload-artifact@v4
        if: always() && steps.list.outputs.count != '0'
        with:
          name: e2e-failures
          path: |
            frontend/test-results/
            frontend/playwright-junit.xml
          retention-days: 7
