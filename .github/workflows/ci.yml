name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

# One version list, everywhere. GitHub, the pre-commit hook and the live
# server all install from uv.lock, so a test that passes here passes there.
# Before this, GitHub took the newest of everything, the hook took whatever
# was in ~/.local, and the server took the lock file — and the three
# disagreed enough to keep master red for eight days.
env:
  UV_FROZEN: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run mypy temper_ai/ --ignore-missing-imports

  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Off, deliberately. With fail-fast on, 3.11 failing cancelled 3.12
      # mid-run, so a version-specific break looked like a break everywhere
      # and half the evidence was thrown away.
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev

      - name: Show what is installed
        run: uv run python scripts/show_versions.py

      # No -x. Stopping at the first failure hid every other one, so each red
      # run told you about a single test and you found the next only after
      # fixing that. -n auto: the runners have 2-4 cores.
      - name: Run the tests
        run: uv run pytest tests/ --timeout=60 -n auto --junitxml=junit.xml

      - name: Summarise
        if: always()
        run: uv run python scripts/junit_summary.py junit.xml --title "Python ${{ matrix.python-version }} · SQLite"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.python-version }}
          path: junit.xml
          retention-days: 7

  test-postgres:
    # The database tier. Everything else runs on in-memory SQLite, which is
    # fast but is not what temper runs on: the time-zone handling, the unique
    # constraints and the row locking are all Postgres's. This job runs the
    # tests that touch the database against a real one. (The workflow started
    # a Postgres before this and no test ever connected to it.)
    name: tests (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: temper_ai_test
          POSTGRES_USER: temper_ai
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --frozen --extra dev

      - name: Show what is installed
        run: uv run python scripts/show_versions.py

      - name: Run the tests, with the database tier on Postgres
        env:
          TEMPER_TEST_DATABASE_URL: postgresql://temper_ai:test@127.0.0.1:5432/temper_ai_test
        run: uv run pytest tests/ --timeout=120 -n auto --junitxml=junit-pg.xml

      - name: Summarise
        if: always()
        run: uv run python scripts/junit_summary.py junit-pg.xml --title "Python 3.12 · Postgres tier"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-postgres
          path: junit-pg.xml
          retention-days: 7

  frontend:
    # The dashboard had no CI at all: its unit tests had been failing for
    # months and type errors could land unnoticed.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run --reporter=default --reporter=junit --outputFile=vitest-junit.xml
      - name: Summarise
        if: always()
        run: python3 ../scripts/junit_summary.py vitest-junit.xml --title "Dashboard unit tests"
      - run: npm run build

  e2e:
    # Browser tests against a real server serving the built dashboard. They
    # create their own data with the zero-cost `smoke_test` workflow, so no
    # API key and no seeded database are needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: uv sync --frozen
      - name: Build the dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the server
        env:
          TEMPER_DATABASE_URL: sqlite:///e2e.db
        run: |
          uv run temper serve --port 8420 > server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8420/api/health && break
            sleep 1
          done
          # Fail here, loudly, if the server never came up. Without this the
          # job carried on and every browser test failed with a connection
          # error, hiding a one-line import failure behind twelve of them.
          if ! curl -sf http://127.0.0.1:8420/api/health > /dev/null; then
            echo "::error::server did not start"
            cat server.log
            exit 1
          fi

      - name: Run end-to-end tests
        working-directory: frontend
        env:
          # 127.0.0.1, not localhost: the server binds IPv4 and the runner
          # resolves localhost to ::1 first.
          TEMPER_E2E_BASE_URL: http://127.0.0.1:8420
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: playwright-junit.xml
        run: npx playwright test --reporter=list,junit

      - name: Summarise
        if: always()
        working-directory: frontend
        run: python3 ../scripts/junit_summary.py playwright-junit.xml --title "Browser tests"

      # Named, not fatal. Failing the commit on a flake would push everyone
      # into re-running until green, which is the habit we are trying to
      # lose. The nightly repeats the suite and does treat flakiness as a
      # failure, and that is what sends the message.
      - name: Say which tests only passed on their retry
        if: always()
        working-directory: frontend
        run: python3 ../scripts/flaky_report.py playwright-junit.xml --title "Browser tests" --soft

      # The server holds uv's cache lock for as long as it runs, and
      # setup-uv's own cleanup prunes that cache once the job is over. Left
      # alive, it made that prune wait five minutes and then exit 2, which
      # failed a job whose 22 browser tests had all passed. A job should not
      # walk away from a running server in any case.
      - name: Stop the server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-failures
          path: |
            frontend/test-results/
            frontend/playwright-junit.xml
            server.log
          retention-days: 7
