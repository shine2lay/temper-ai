name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: mypy temper_ai/ --ignore-missing-imports

  frontend:
    # The dashboard had no CI at all: its unit tests had been failing for
    # months and type errors could land unnoticed.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build

  e2e:
    # Browser tests against a real server serving the built dashboard. They
    # create their own data with the zero-cost `smoke_test` workflow, so no
    # API key and no seeded database are needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: pip install -e .
      - name: Build the dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the server
        env:
          TEMPER_DATABASE_URL: sqlite:///e2e.db
        run: |
          temper serve --port 8420 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8420/api/health && break
            sleep 1
          done

      - name: Run end-to-end tests
        working-directory: frontend
        env:
          TEMPER_E2E_BASE_URL: http://localhost:8420
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failures
          path: frontend/test-results/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: temper_ai_test
          POSTGRES_USER: temper_ai
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -x --timeout=60
        env:
          TEMPER_DATABASE_URL: postgresql://temper_ai:test@localhost:5432/temper_ai_test
