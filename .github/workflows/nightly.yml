name: Nightly

# Two questions the per-commit checks cannot answer:
#
#   1. Would temper still work if its libraries were upgraded? The lock file
#      is what ships, so CI tests the lock file — but then an upgrade is a
#      surprise every time. This tries the newest of everything and reports.
#      It is information only: nothing here changes what is pinned.
#
#   2. Which tests are flaky? A test that fails one run in ten passes every
#      time you look. So the suite is run several times, in a different
#      order each time, and any test that gave two different answers is
#      named. A flaky test gets fixed, never skipped.
#
# Failing here does not block anything; it sends a message (the watcher on
# the box reads these runs and DMs Slack).

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC, well clear of the working day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newest-versions:
    name: newest libraries (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: temper_ai_test
          POSTGRES_USER: temper_ai
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # --upgrade resolves fresh instead of reading uv.lock. The lock file is
      # not written back: what temper ships is decided on purpose, not by
      # whatever PyPI published last night.
      - name: Install the newest of everything
        run: uv sync --upgrade --extra dev

      - name: Show what that turned out to be
        run: uv run python scripts/show_versions.py

      - name: Run the tests
        env:
          TEMPER_TEST_DATABASE_URL: postgresql://temper_ai:test@127.0.0.1:5432/temper_ai_test
        run: uv run pytest tests/ --timeout=120 -n auto --junitxml=junit-newest.xml

      - name: Summarise
        if: always()
        run: uv run python scripts/junit_summary.py junit-newest.xml --title "Newest libraries · Python ${{ matrix.python-version }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-newest-${{ matrix.python-version }}
          path: junit-newest.xml
          retention-days: 14

  repeat-python:
    name: the suite, three times over
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: temper_ai_test
          POSTGRES_USER: temper_ai
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --frozen --extra dev

      # A different order each time, and the seed printed: pytest-randomly
      # shuffles, so a test that only passes after another one has run shows
      # up here instead of in someone's commit three weeks later.
      - name: Run it three times, each in a different order
        continue-on-error: true
        env:
          TEMPER_TEST_DATABASE_URL: postgresql://temper_ai:test@127.0.0.1:5432/temper_ai_test
        run: |
          for i in 1 2 3; do
            echo "::group::run $i"
            uv run pytest tests/ --timeout=120 -n auto \
              -p randomly --randomly-seed=$((RANDOM)) \
              --junitxml="junit-repeat-$i.xml" || echo "run $i had failures"
            echo "::endgroup::"
          done

      - name: Which tests did not agree with themselves
        if: always()
        run: uv run python scripts/flaky_report.py junit-repeat-*.xml --title "Python suite · 3 runs"

      - name: What failed
        if: always()
        run: uv run python scripts/junit_summary.py junit-repeat-1.xml --title "Python suite · run 1"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-repeats
          path: junit-repeat-*.xml
          retention-days: 14

  repeat-e2e:
    name: the browser tests, three times over
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: uv sync --frozen
      - name: Build the dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the server
        env:
          TEMPER_DATABASE_URL: sqlite:///e2e.db
        run: |
          uv run temper serve --port 8420 > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8420/api/health && break
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8420/api/health > /dev/null; then
            echo "::error::server did not start"
            cat server.log
            exit 1
          fi

      # No retries here, on purpose. Retries are what hid the Compare flake
      # for weeks: a test that needs a second go is the thing being looked
      # for, so let it fail and be named.
      - name: Run the browser tests three times
        continue-on-error: true
        working-directory: frontend
        env:
          TEMPER_E2E_BASE_URL: http://127.0.0.1:8420
        run: |
          for i in 1 2 3; do
            echo "::group::run $i"
            PLAYWRIGHT_JUNIT_OUTPUT_NAME="playwright-$i.xml" \
              npx playwright test --reporter=list,junit --retries=0 || echo "run $i had failures"
            echo "::endgroup::"
          done

      - name: Which tests did not agree with themselves
        if: always()
        working-directory: frontend
        run: python3 ../scripts/flaky_report.py playwright-*.xml --title "Browser tests · 3 runs"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-e2e
          path: |
            frontend/playwright-*.xml
            frontend/test-results/
            server.log
          retention-days: 14
