# @description OPPORTUNITY BRIEF step 0 (product role). No model. Writes the run's input
# (state/brief/input.md: the idea, its research pointers and its free-signal evidence) and two
# helpers into the workspace: cite.py (exact page text through curl's default user agent,
# PDFs through pdftotext; every page read is kept in state/brief/pages/ so its words can be
# checked again) and check_brief.py (the brief's mechanical check, run by the synthesizer
# before it finishes and by brief_check at the end). Part of workflows/opportunity_brief.yaml.
# POSIX sh. No dollar-brace env syntax anywhere in this file (config-loader substitution) and
# no Jinja delimiters inside the helpers.
agent:
  name: brief_setup
  version: 1
  type: script
  timeout_seconds: 60
  script_template: |
    #!/bin/sh
    set -e
    cd {{ workspace_path }}
    mkdir -p state/brief/lenses state/brief/pages
    PY=python3
    command -v python3 >/dev/null 2>&1 || PY="$TEMPER_PYTHON"
    "$PY" - <<'PYEOF'
    import os
    import time

    idea = (os.environ.get("{{ idea | env }}") or "").strip()
    evidence = (os.environ.get("{{ signal_evidence | env }}") or "").strip()
    focus = (os.environ.get("{{ focus | default('', true) | env }}") or "").strip()
    if not idea or not evidence:
        raise SystemExit("opportunity_brief needs two inputs: idea and signal_evidence")
    parts = [
        "# Opportunity brief input",
        "",
        "Written by brief_setup, " + time.strftime("%Y-%m-%d %H:%M %Z") + ".",
        "",
        "## Idea",
        "",
        idea,
        "",
        "## Research pointers for this idea",
        "",
        focus or "(none given)",
        "",
        "## Free-signal evidence (Rung 0: demand is already screened; build on it, don't redo it)",
        "",
        evidence,
        "",
    ]
    with open(os.path.join("state", "brief", "input.md"), "w", encoding="utf-8") as f:
        f.write("\n".join(parts))
    PYEOF
    cat > cite.py <<'CITEEOF'
    #!/usr/bin/env python3
    """Exact page text for citing (opportunity_brief). Plain curl with its default user agent;
    PDFs through pdftotext. A page that doesn't answer 200 is INACCESSIBLE: log it and move on,
    never work around it. Every page read is kept in state/brief/pages/ (first line: its URL,
    HTTP code and fetch time; then the text) so its words can be checked later.

      python3 cite.py page <url> [kw1,kw2]   status, dates on the page, text near the keywords
      python3 cite.py quote <url> "<words>"  FOUND / NOT FOUND: are these exact words on the page?
    """
    import hashlib
    import html
    import json
    import os
    import re
    import subprocess
    import sys
    import time

    HERE = os.path.dirname(os.path.abspath(__file__))
    PAGES = os.path.join(HERE, "state", "brief", "pages")
    META_DATE = (r"(?:datePublished|dateModified|published_time|modified_time|updated_time|"
                 r"dateCreated)[^0-9<>]{0,40}(\d{4}-\d{2}-\d{2})")
    TEXT_DATE = (r"(?i)\b(last updated|last modified|updated|effective(?: date)?|published|posted|"
                 r"release date|revised)\s*(?:on|:)?\s*([A-Z][a-z]{2,8}\.? \d{1,2},? \d{4}|"
                 r"\d{4}-\d{2}-\d{2}|\d{1,2}/\d{1,2}/\d{2,4})")


    def norm(s):
        for a, b in (("\u2019", "'"), ("\u2018", "'"), ("\u201c", '"'), ("\u201d", '"'),
                     ("\u2013", "-"), ("\u2014", "-"), ("\u00a0", " ")):
            s = s.replace(a, b)
        return re.sub(r"\s+", " ", s).strip()


    def pdf_text(path):
        try:
            out = subprocess.run(["pdftotext", "-layout", path, "-"], capture_output=True,
                                 timeout=120)
            return norm(out.stdout.decode("utf-8", "replace")), ""
        except (OSError, subprocess.TimeoutExpired):
            return "", ("PDF but no pdftotext here: read it with WebFetch and tag its claims "
                        "how: webfetch, with no quote")


    def html_text(raw):
        body = raw.decode("utf-8", "replace")
        dates = set(re.findall(META_DATE, body))
        dates |= set(re.findall(r'<time[^>]*datetime="(\d{4}-\d{2}-\d{2})', body))
        body = re.sub(r"(?is)<(script|style|noscript|svg)[^>]*>.*?</(script|style|noscript|svg)>",
                      " ", body)
        text = norm(html.unescape(re.sub(r"<[^>]+>", " ", body)))
        return text, sorted(dates)


    def fetch(url):
        os.makedirs(PAGES, exist_ok=True)
        path = os.path.join(PAGES, hashlib.sha1(url.encode()).hexdigest()[:16] + ".txt")
        if os.path.exists(path):
            with open(path, encoding="utf-8") as f:
                head, _, text = f.read().partition("\n")
            return json.loads(head), text
        raw_path = "%s.%d.raw" % (path, os.getpid())
        out = subprocess.run(["curl", "-sS", "-L", "--compressed", "--max-time", "45", "-o", raw_path,
                              "-w", "%{http_code}\t%{content_type}\t%{url_effective}", url],
                             capture_output=True, text=True)
        code, ctype, final = (out.stdout.split("\t") + ["", "", ""])[:3]
        meta = {"url": url, "final_url": final or url, "http": code or "000",
                "content_type": ctype, "fetched": time.strftime("%Y-%m-%d %H:%M %Z")}
        text = ""
        if meta["http"] == "200" and os.path.exists(raw_path):
            with open(raw_path, "rb") as f:
                raw = f.read()
            if "pdf" in ctype.lower() or raw[:5] == b"%PDF-":
                text, note = pdf_text(raw_path)
                meta["pdf"] = True
            else:
                text, meta["dates_on_page"] = html_text(raw)
                note = ""
            meta["dated_text"] = ["%s %s" % pair for pair in re.findall(TEXT_DATE, text)[:6]]
            if not note and not text.strip():
                note = ("200 but no readable text (a script-only page?): read it with WebFetch "
                        "and tag its claims how: webfetch, with no quote")
            if note:
                meta["note"] = note
        elif out.stderr.strip():
            meta["error"] = out.stderr.strip()[:200]
        if os.path.exists(raw_path):
            os.remove(raw_path)
        if meta["http"] == "200" or meta["http"].startswith("4"):
            # Kept, so its words can be checked later and a block is never asked twice. A timeout
            # or a server error is not kept. Lenses run side by side: write whole, then move.
            tmp = "%s.%d.tmp" % (path, os.getpid())
            with open(tmp, "w", encoding="utf-8") as f:
                f.write(json.dumps(meta) + "\n" + text[:3000000])
            os.replace(tmp, path)
        return meta, text


    def header(meta):
        print("HTTP", meta["http"], meta.get("final_url"), "|", meta.get("content_type", ""),
              "| fetched", meta.get("fetched"))
        if meta["http"] != "200":
            print("-> INACCESSIBLE (%s): log it, never work around it" % meta.get("error", "status"))
            return False
        if meta.get("dates_on_page") or meta.get("dated_text"):
            print("dates on page:", meta.get("dates_on_page", []), meta.get("dated_text", []))
        if meta.get("note"):
            print("->", meta["note"])
        return True


    def page(url, keywords=""):
        meta, text = fetch(url)
        if not header(meta):
            return
        kws = [k.strip() for k in keywords.split(",") if k.strip()]
        if not kws:
            print(text[:5000])
            return
        spots = sorted(m.start() for k in kws for m in re.finditer(re.escape(k), text, re.I))
        hits, shown_to = 0, -1
        for pos in spots:
            if pos < shown_to:
                continue
            print("...", text[max(0, pos - 350):pos + 450], "...")
            shown_to, hits = pos + 450, hits + 1
            if hits >= 12:
                break
        print("keyword hits shown:", hits, "of", len(spots), "| page length", len(text))


    def quote(url, words):
        meta, text = fetch(url)
        if not header(meta):
            return
        want = norm(words).lower()
        flat = norm(text)
        at = flat.lower().find(want)
        if at < 0:
            print("NOT FOUND on the page: don't cite these words; quote what the page says")
            return
        print("FOUND: ..." + flat[max(0, at - 200):at + len(want) + 200] + "...")


    def main(argv):
        if len(argv) > 2 and argv[1] == "page":
            page(argv[2], argv[3] if len(argv) > 3 else "")
        elif len(argv) > 3 and argv[1] == "quote":
            quote(argv[2], argv[3])
        else:
            print(__doc__)


    if __name__ == "__main__":
        main(sys.argv)
    CITEEOF
    cat > check_brief.py <<'CHECKEOF'
    #!/usr/bin/env python3
    """Mechanical check of an opportunity brief (opportunity_brief workflow).

      python3 check_brief.py           what is missing, one line each (the synthesizer runs it)
      python3 check_brief.py --final   the same as one JSON object (the workflow's last step)

    It counts the structural items of the bar: Cagan's 10 questions, the 5 risk rows, the
    riskiest assumptions and kill criteria, the recommendation. It confirms that every cited
    claim exists with a URL and a date, that a claim read with cite.py has its quote on the
    page cite.py kept, and that the brief invents no source. It draws the 10-claim spot-check
    sample (seed 7) that a person re-fetches by hand. Whether a source is really primary is
    for that person to judge, not this script.

    With --final it also fails a brief that a research lens left without usable output, and
    names the lens: lenses/<lens>.json (an object with claims) and lenses/<lens>.md must exist
    and be neither empty nor an account-limit or error message, and the lens's final answer,
    which the workflow passes in as --answer <lens>=<environment variable>, must not be one
    either. Run 99732fd1 lost its competition lens to "You've hit your session limit" and its
    brief still passed.

    It checks the brief's derived figures (brief.json "figures"): each is recomputed from its
    inputs, its units are followed through its formula (only like units add; the result is the
    figure's unit), and each sourced input holds to its source's own words: its value is a number
    the quote states, and what its unit counts (clicks, leads, installs, payers) is what the source
    counts. A derived number in the viability or go-to-market row or the recommendation that is
    neither a figure nor quoted fails, and so does a comparison of figures counted over different
    things. Quote checks passed run 57dc513d, which weighed $175 per paying user against $9.50 of
    margin per active user, and run fc575760, which divided a $2.14 cost per click by a 5.83% lead
    rate (leads / clicks) as if it were the share of clickers who start the quiz.

    It recomputes the call from the brief's deal-breakers (queue #39): the six checklist questions
    K1-K6, each answered yes, no or unknown with its claims, and each yes marked fixed or not by the
    one named wedge change. Any yes the wedge does not fix -> kill; every yes fixed -> change_wedge;
    no yes -> advance. A brief whose decision, rule or listed deal-breakers differ from that fails.
    The same travel and business evidence got different calls from the synthesizer's own judgment
    (b512682b advance, 542baf8b change_wedge on the same lens files; bdfca8d0 kill, a80bc9a7
    change_wedge on the same lens files).
    """
    import ast
    import glob
    import hashlib
    import json
    import os
    import random
    import re
    import sys

    ROWS = ["value", "usability", "feasibility", "viability", "go_to_market"]
    VERDICTS = ["low", "med", "high"]
    DECISIONS = ["advance", "change_wedge", "kill"]
    POOL_KINDS = ("price", "api", "rule", "date")
    QUESTIONS = [
        "Exactly what problem will this solve? (value proposition)",
        "For whom do we solve that problem? (target market)",
        "How big is the opportunity? (market size)",
        "What alternatives are out there? (competitive landscape)",
        "Why are we best suited to pursue this? (our differentiator)",
        "Why now? (market window)",
        "How will we get this product to market? (go-to-market strategy)",
        "How will we measure success/make money from this product? (metrics/revenue strategy)",
        "What factors are critical to success? (solution requirements)",
        "Given the above, what's the recommendation? (go or no-go)",
    ]
    BRIEF_DIR = os.path.join("state", "brief")
    LENSES = ["feasibility", "viability", "gtm", "competition"]
    # The call rule (queue #39): the decision follows from the deal-breaker checklist, so the same
    # evidence gives the same call. Ids and rows are fixed here; the questions' words are the
    # synthesizers' DEAL-BREAKERS block (the same block in both, test-enforced).
    DEAL_BREAKERS = [("K1", "value"), ("K2", "feasibility"), ("K3", "feasibility"),
                     ("K4", "viability"), ("K5", "viability"), ("K6", "go_to_market")]
    ANSWERS = ["yes", "no", "unknown"]
    RULES = {
        "kill": "an open deal-breaker that the named wedge change does not fix",
        "change_wedge": "the one named wedge change fixes every open deal-breaker",
        "advance": "no open deal-breaker",
    }


    def call_of(open_ids, fixed):
        """The call the rule gives: open_ids are the yes answers, fixed the ones the named wedge fixes."""
        if not open_ids:
            return "advance"
        return "change_wedge" if all(k in fixed for k in open_ids) else "kill"

    # What a part says when its account or the service stopped it, instead of research.
    NON_ANSWER = re.compile(
        r"session limit|usage limit|weekly limit|daily limit|rate[ _-]?limit|limit (?:reached|exceeded)"
        r"|hit (?:your|the) (?:\w+ )?limit|quota|overloaded|too many requests|credit balance"
        r"|pool exhausted|try again later|resets? (?:at |in |on )?\d|api error|authentication_error"
        r"|oauth token|not logged in|/login|invalid api key|out of (?:extra )?usage|prompt is too long"
        r"|\Aerror: ",  # the Claude provider's failed call: "Error: <stderr>", "Error: Claude Code CLI timed out"
        re.I)
    # The Claude provider's other failed call, whatever its length: "[claude_code error] stream ended
    # with no result event: <stderr>". Its finish_reason "error" is not read yet (temper #55).
    PROVIDER_ERROR = re.compile(r"\[claude_code error\]", re.I)
    NOT_PASSED = "__unwired__"  # what the workflow passes for an answer it could not find
    # Derived figures (queue #25). Rows whose derived numbers must each be a figure:
    FIGURE_ROWS = ("viability", "go_to_market")
    CURRENCY = {"usd": "USD", "us$": "USD", "$": "USD", "dollar": "USD", "eur": "EUR", "euro": "EUR",
                "gbp": "GBP", "pound": "GBP"}
    TIME = {"year": "year", "yr": "year", "annum": "year", "month": "month", "mo": "month", "week": "week",
            "wk": "week", "day": "day", "hour": "hour", "hr": "hour", "minute": "minute", "min": "minute"}
    # One counted thing under its usual names; a unit may use any of them.
    SAME_THING = {
        "payer": ("payer", "paying_user", "paid_user", "paying_customer", "paid_customer", "subscriber",
                  "paid_subscriber", "paying_subscriber", "purchaser"),
        "install": ("install", "installation", "download", "app_install", "app_download"),
        "click": ("click", "ad_click", "paid_click", "tap"),
        "lead": ("lead", "enquiry", "inquiry", "form_fill", "form_submission"),
        "active_user": ("active_user", "active_planner", "monthly_active_user", "mau"),
        "booking": ("booking", "booked_trip", "reservation"),
        "trip": ("trip", "vacation", "holiday", "journey"),
        "person": ("person", "people", "adult", "resident", "individual"),
        "visit": ("visit", "session", "site_visit"),
        "conversation": ("conversation", "chat", "planning_conversation"),
        # An API prices its calls as billable events (run 57dc513d: Places calls priced per 1000 events).
        "event": ("event", "call", "api_call", "billable_event", "api_request"),
    }
    # The words a source uses when that thing is what it counts.
    SAYS = {
        "payer": ("pay", "paid", "payer", "paying", "subscriber", "subscription", "purchase", "purchaser",
                  "buyer", "premium"),
        "install": ("install", "installation", "download"),
        "click": ("click", "cpc", "tap"),
        "lead": ("lead",),
        "active_user": ("active",),
        "booking": ("book", "booking", "booked", "reservation"),
        "trip": ("trip", "travel", "vacation", "holiday", "journey"),
        "person": ("person", "people", "adult", "resident", "population", "individual", "american", "consumer"),
        "visit": ("visit", "session"),
        "conversation": ("conversation", "chat", "query", "request"),
        "event": ("event", "call", "request", "api"),
    }
    # A price is paid by whoever buys it: USD / payer needs no source word for the payer.
    PRICE_PAYERS = ("payer", "customer", "user", "seat", "account", "member", "site", "location", "office")
    VAGUE = ("conversion", "rate", "share", "percent", "percentage", "ratio", "fraction", "number", "count",
             "amount", "value", "unit", "thing", "item")
    CONVERSIONS = {("month", "year"): 12, ("week", "year"): 52, ("day", "year"): 365, ("day", "week"): 7,
                   ("hour", "day"): 24, ("day", "month"): 30.4, ("week", "month"): 4.35, ("minute", "hour"): 60}
    # A count kept in thousands or millions ("$32.00 per 1000 events", "$2 / MTok") is a thing of its own,
    # k_event or m_token, and a DEFINITION input (1000 event / k_event) converts between them.
    SCALES = {"k": "k", "1k": "k", "thousand": "k", "1000": "k", "m": "m", "1m": "m", "mm": "m", "million": "m",
              "1000000": "m"}
    SCALE_FACTORS = {"k": 1000, "m": 1000000}
    SCALED_WORDS = {"ktok": ("k", "token"), "mtok": ("m", "token"), "mtoken": ("m", "token")}
    # A source limited to one kind of trip or one region carries that limit into what it measures.
    LIMITS = (("international", r"\binternational\b|outside (?:of )?the (?:united states|u\.?s\.?a?\b)|\boverseas\b"
                                r"|\babroad\b|\boutbound\b|\bforeign\b"),
              ("domestic", r"\bdomestic\b|within the (?:united states|u\.?s\.?a?\b)"))
    REGIONS = (("the US", r"\bU\.?S\.?A?(?![A-Za-z])|[Uu]nited [Ss]tates|\bAmericans?\b"),
               ("Europe", r"[Ee]urope|\bEU\b|\bUK\b|[Uu]nited [Kk]ingdom|[Bb]ritain|[Gg]ermany|[Ff]rance"))
    COMPARE = re.compile(r"\b(?:repa(?:y|ys|id)|pa(?:y|ys|id)(?: (?:it|itself|them|for itself))? back|payback"
                         r"|recoup\w*|cover(?:s|ed)?|against|versus|vs\b|while|exceed\w*|more than|less than"
                         r"|outweigh\w*|cheaper than|higher than|lower than|above|below)", re.I)
    MONEY = re.compile(r"(?:US)?\$\s?(\d[\d,]*(?:\.\d+)?)(?:\s?(k|thousand|m|mn|million|b|bn|billion)\b)?", re.I)
    PERCENT = re.compile(r"(?<![\w.$])(\d+(?:\.\d+)?)\s?%")
    COUNT = re.compile(r"(?<![\w.$,])(\d[\d,]*(?:\.\d+)?)\s?(k|thousand|m|mn|million|b|bn|billion)\b", re.I)
    SCALE = {"k": 1e3, "thousand": 1e3, "m": 1e6, "mn": 1e6, "million": 1e6, "b": 1e9, "bn": 1e9, "billion": 1e9}
    # What the text says a number is per: "$9.50 of gross margin per active user".
    PER = re.compile(r"[^$;.]{0,40}?\bper\s+(?:a |an |each |one |every )?([a-z][a-z-]*)(?: ([a-z][a-z-]*))?", re.I)


    def norm(s):
        for a, b in (("\u2019", "'"), ("\u2018", "'"), ("\u201c", '"'), ("\u201d", '"'),
                     ("\u2013", "-"), ("\u2014", "-"), ("\u00a0", " ")):
            s = s.replace(a, b)
        return re.sub(r"\s+", " ", s).strip()


    def load_json(path):
        try:
            with open(path, encoding="utf-8") as f:
                return json.load(f), ""
        except FileNotFoundError:
            return None, "missing"
        except ValueError as exc:
            return None, "not valid JSON (%s)" % exc


    def kept_page(url):
        name = hashlib.sha1(url.encode()).hexdigest()[:16] + ".txt"
        path = os.path.join(BRIEF_DIR, "pages", name)
        if not os.path.exists(path):
            return None, None
        with open(path, encoding="utf-8") as f:
            head, _, text = f.read().partition("\n")
        try:
            meta = json.loads(head)
        except ValueError:
            meta = {}
        return meta, text


    def id_key(cid):
        m = re.match(r"([A-Za-z]+)(\d+)$", str(cid))
        return (m.group(1), int(m.group(2))) if m else (str(cid), 0)


    def text_of(value):
        return value.strip() if isinstance(value, str) else ""


    def non_answer(text):
        """Why a part's text is no research ('' when it may be): empty, a short message about an
        account limit, a quota, an overload, a login or a failed call with no JSON in it, or the
        Claude provider's failed-call text."""
        text = (text or "").strip()
        if not text:
            return "empty"
        if PROVIDER_ERROR.match(text) or (
                len(text) <= 600 and text[0] not in "{[" and "```" not in text and NON_ANSWER.search(text)):
            return 'an account-limit or error message ("%s")' % norm(text)[:160]
        return ""


    def passed_answers(argv):
        """--answer <lens>=<variable>: that lens's final answer, read from the environment. An
        answer the workflow could not find is left out; that lens's files are still checked."""
        answers = {}
        for i, arg in enumerate(argv[:-1]):
            if arg == "--answer":
                lens, _, variable = argv[i + 1].partition("=")
                value = os.environ.get(variable)
                if lens in LENSES and value is not None and value != NOT_PASSED:
                    answers[lens] = value
        return answers


    def lens_parts(answers):
        """{lens: 'ok' or why it left no usable output}, from its two files and its final answer."""
        parts = {}
        for lens in LENSES:
            found = []
            for ext in ("json", "md"):
                name = "lenses/%s.%s" % (lens, ext)
                try:
                    with open(os.path.join(BRIEF_DIR, name), encoding="utf-8") as f:
                        text = f.read()
                except FileNotFoundError:
                    found.append(name + " is missing")
                    continue
                except (OSError, ValueError) as exc:
                    found.append("%s is unreadable (%s)" % (name, exc))
                    continue
                why = non_answer(text)
                if why:
                    found.append("%s is %s" % (name, why))
                elif ext == "json":
                    try:
                        data = json.loads(text)
                    except ValueError as exc:
                        found.append("%s is not valid JSON (%s)" % (name, exc))
                        continue
                    if not isinstance(data, dict):
                        found.append(name + " is not a JSON object")
                    elif not isinstance(data.get("claims"), list) or not data["claims"]:
                        found.append(name + " has no claims")
            if lens in answers:
                why = non_answer(answers[lens])
                if why:
                    found.append("its final answer is " + why)
            parts[lens] = "; ".join(found) or "ok"
        return parts


    def singular(word):
        for tail, new in (("ies", "y"), ("sses", "ss"), ("ches", "ch"), ("shes", "sh"), ("xes", "x"), ("s", "")):
            if word.endswith(tail) and not word.endswith("ss") and len(word) - len(tail) >= 3:
                return word[:len(word) - len(tail)] + new
        return word


    def stem(word):
        word = word.lower()
        for tail in ("ings", "ing", "ers", "er", "ies", "es", "ed", "s"):
            if word.endswith(tail) and len(word) - len(tail) >= 3:
                return word[:len(word) - len(tail)]
        return word


    def canon(phrase):
        """A counted thing's one name: 'Paying users' -> payer, 'downloads' -> install, 'a year' -> year."""
        text = re.sub(r"(?<=\d),(?=\d\d\d)", "", phrase.lower().replace("us$", "usd"))
        words = [singular(w) for w in re.findall(r"[a-z0-9$]+", text)]
        words = [w for w in words if w not in ("a", "an", "the", "each", "every", "one", "per", "of")]
        if any(w in CURRENCY for w in words):
            return CURRENCY[next(w for w in words if w in CURRENCY)]
        scale = ""
        if len(words) > 1 and words[0] in SCALES:
            scale, words = SCALES[words[0]], words[1:]
        elif len(words) == 1 and words[0] in SCALED_WORDS:
            scale, words = SCALED_WORDS[words[0]][0], [SCALED_WORDS[words[0]][1]]
        name = "_".join(words)
        if name in TIME:
            name = TIME[name]
        for thing, names in SAME_THING.items():
            if name in names:
                name = thing
        return scale + "_" + name if scale and name else name


    def conversion(pair):
        """The factor a DEFINITION input may carry for [thing above, thing below]: 12 month / year,
        1000 event / k_event, or the other way round."""
        known = dict(CONVERSIONS)
        for a, b in [pair, pair[::-1]]:
            scale, _, base = b.partition("_")
            if scale in SCALE_FACTORS and base == a:
                known[(a, b)] = SCALE_FACTORS[scale]
        if tuple(pair) in known:
            return known[tuple(pair)]
        if tuple(pair[::-1]) in known:
            return 1.0 / known[tuple(pair[::-1])]
        return None


    def parse_unit(text):
        """'USD / active_user / year' (or 'USD per active user per year') -> ({thing: power}, '') or (None, why)."""
        text = text.strip().lower() if isinstance(text, str) else ""
        if not text:
            return None, "is missing: write what is counted per what, like USD / active_user / year"
        if "%" in text:
            return None, ("'%s' is a percentage: write what is counted over what, like lead / click, and "
                          "the value as a fraction" % text)
        unit = {}
        for i, part in enumerate(re.split(r"/|\bper\b", text)):
            for factor in re.split(r"\*|\u00d7|\bx\b|\btimes\b", part):
                if factor.strip() in ("", "1"):
                    continue
                thing = canon(factor)
                if not thing:
                    continue
                if any(w in VAGUE for w in thing.split("_")):
                    return None, ("'%s' names a rate or a share, not what is counted: write the counted "
                                  "things, like lead / click or payer / install" % factor.strip())
                unit[thing] = unit.get(thing, 0) + (1 if i == 0 else -1)
        return {t: e for t, e in unit.items() if e}, ""


    def times(a, b, sign):
        out = dict(a)
        for thing, power in b.items():
            out[thing] = out.get(thing, 0) + sign * power
        return {t: e for t, e in out.items() if e}


    def show(unit):
        order = sorted(unit, key=lambda t: (t in TIME.values(), t not in CURRENCY.values(), t))
        top = [t for t in order for _ in range(unit[t]) if unit[t] > 0]
        text = " * ".join(top) or "1"
        for t in order:
            text += " / " + t if unit[t] < 0 else ""
            text += (" / " + t) * (-unit[t] - 1) if unit[t] < -1 else ""
        return text


    def counted(unit):
        """What a unit is counted per: its non-money, non-time things below the line."""
        return frozenset(t for t, e in unit.items()
                         if e < 0 and t not in TIME.values() and t not in CURRENCY.values())


    def is_money(unit):
        return any(unit.get(c, 0) > 0 for c in set(CURRENCY.values()))


    class FormulaError(Exception):
        pass


    class KindError(Exception):
        pass


    def evaluate(formula, env):
        """(value, unit, names used) of a formula over its inputs: + - * / and brackets, no number but 1."""
        try:
            tree = ast.parse(formula, mode="eval")
        except SyntaxError:
            raise FormulaError("does not parse: use its inputs' names, + - * / and brackets")
        used = set()

        def ev(node):
            if isinstance(node, ast.BinOp) and isinstance(node.op, (ast.Add, ast.Sub, ast.Mult, ast.Div)):
                (lv, lu), (rv, ru) = ev(node.left), ev(node.right)
                if isinstance(node.op, (ast.Add, ast.Sub)):
                    if lu != ru:
                        raise KindError("it adds or subtracts %s and %s" % (show(lu), show(ru)))
                    return (lv + rv if isinstance(node.op, ast.Add) else lv - rv), lu
                if isinstance(node.op, ast.Mult):
                    return lv * rv, times(lu, ru, 1)
                if rv == 0:
                    raise FormulaError("divides by zero")
                return lv / rv, times(lu, ru, -1)
            if isinstance(node, ast.UnaryOp) and isinstance(node.op, (ast.USub, ast.UAdd)):
                value, unit = ev(node.operand)
                return (-value if isinstance(node.op, ast.USub) else value), unit
            if isinstance(node, ast.Name):
                if node.id not in env:
                    raise FormulaError("uses %s, which is not one of its inputs" % node.id)
                used.add(node.id)
                return env[node.id]
            if isinstance(node, ast.Constant) and not isinstance(node.value, bool) and node.value == 1:
                return 1.0, {}
            raise FormulaError("may use only its inputs' names, + - * / and brackets, and no number but 1 "
                               "(every number is an input with its source)")

        value, unit = ev(tree.body)
        return value, unit, used


    def number(value):
        if isinstance(value, bool) or not isinstance(value, (int, float)):
            return None
        return float(value)


    def fmt(value):
        return ("%.6g" % value) if value is not None else "?"


    def half_unit(digits):
        """Half the last written digit: '175' -> 0.5, '9.50' -> 0.005."""
        return 0.5 * 10 ** -len(digits.partition(".")[2])


    def close(a, b, rel, slack=0.0):
        return abs(a - b) <= max(rel * max(abs(a), abs(b)), slack)


    def stated_numbers(text):
        """Every number a text states, as written and as meant: 5.83% -> 5.83 and 0.0583, $1.2M -> 1.2e6.
        Each comes with half its last digit, so a number written rounded still matches."""
        found = []
        for m in re.finditer(r"(\d[\d,]*(?:\.\d+)?)\s?(%|percent\b|k\b|thousand\b|m\b|mn\b|million\b|b\b|bn\b|billion\b)?",
                             text or "", re.I):
            digits = m.group(1).replace(",", "")
            try:
                n = float(digits)
            except ValueError:
                continue
            half = half_unit(digits)
            tail = (m.group(2) or "").lower()
            found.append((n, half))
            if tail in ("%", "percent"):
                found.append((n / 100, half / 100))
            elif tail:
                found.append((n * SCALE[tail], half * SCALE[tail]))
        return found


    def mentions(text):
        """Money amounts, percentages and large counts in a brief's text: (start, end, kind, [(value, half)])."""
        found = []
        for m in MONEY.finditer(text):
            digits = m.group(1).replace(",", "")
            scale = SCALE.get((m.group(2) or "").lower(), 1)
            values = [(float(digits) * scale, half_unit(digits) * scale)]
            found.append((m.start(), m.end(), "money", values))
        for m in PERCENT.finditer(text):
            n, half = float(m.group(1)), half_unit(m.group(1))
            found.append((m.start(), m.end(), "percent", [(n, half), (n / 100, half / 100)]))
        for m in COUNT.finditer(text):
            digits = m.group(1).replace(",", "")
            scale = SCALE[m.group(2).lower()]
            found.append((m.start(), m.end(), "count", [(float(digits) * scale, half_unit(digits) * scale)]))
        return sorted(found)


    def says(thing, stems):
        """Do these words (stemmed) count this thing?"""
        scale, _, base = thing.partition("_")
        if scale in SCALE_FACTORS and base:
            thing = base
        if thing in SAYS:
            return any(stem(w) in stems for w in SAYS[thing])
        words = [w for w in thing.split("_") if len(w) >= 3 and w not in ("the", "and", "who", "that", "with")]
        return bool(words) and all(stem(w) in stems for w in words)


    def marks(text):
        """The trip kinds and regions a text limits itself to."""
        found = {name for name, pattern in LIMITS if re.search(pattern, text or "", re.I)}
        return found | {name for name, pattern in REGIONS if re.search(pattern, text or "")}


    def check_figures(brief, resolve, input_text):
        """brief.json "figures": each derived figure recomputed from its inputs, its units followed through
        its formula, each sourced input held to its source's own words; and the brief's text read for
        derived numbers with no figure and for comparisons of figures counted over different things.
        Returns (ok, problems, claim ids the figures cite, notes)."""
        problems, notes, cited = [], [], set()
        raw = brief.get("figures")
        if raw is None:
            raw = []
        if not isinstance(raw, list):
            return False, ["figures: must be a list of derived figures"], cited, notes
        figures = {}
        for n, f in enumerate(raw, 1):
            fid = str(f.get("id", "")) if isinstance(f, dict) else ""
            if not re.match(r"D\d+$", fid):
                problems.append("figure %d: needs an id D1, D2.. (D for derived)" % n)
            elif fid in figures:
                problems.append("figure %s: the id is used twice" % fid)
            else:
                figures[fid] = f
        settled, state, built_from, inputs_seen = {}, {}, {}, []

        def settle(fid):
            """(value, unit) the figure declares, once it has been checked; None if unusable."""
            if state.get(fid) == "busy":
                problems.append("figure %s: its inputs loop back to itself" % fid)
                return None
            if fid not in settled:
                state[fid] = "busy"
                settled[fid] = check_one(fid, figures[fid])
                state[fid] = "done"
            return settled[fid]

        def check_one(fid, f):
            label = "figure %s (%s)" % (fid, text_of(f.get("name")) or "no name")
            unit, why = parse_unit(f.get("unit"))
            value = number(f.get("value"))
            if why:
                problems.append("%s: unit %s" % (label, why))
            if value is None:
                problems.append("%s: value must be a number" % label)
            for field in ("population", "scope"):
                if len(text_of(f.get(field))) < 2:
                    problems.append("%s: say its %s" % (label, field))
            declared = (value, unit) if unit is not None and value is not None else None
            formula, inputs = text_of(f.get("formula")), f.get("inputs")
            if not formula or not isinstance(inputs, list) or not inputs:
                problems.append("%s: needs a formula and the inputs it uses" % label)
                return declared
            built_from[fid] = set()
            env, complete = {}, True
            where_text = text_of(f.get("population")) + " " + text_of(f.get("scope"))
            for inp in inputs:
                got = check_input(label, fid, inp, where_text)
                if got is None:
                    complete = False
                    continue
                name, got_value, got_unit = got
                if name in env:
                    problems.append("%s: two inputs are named %s" % (label, name))
                env[name] = (got_value, got_unit)
            if not complete or declared is None:
                return declared
            try:
                got_value, got_unit, used = evaluate(formula, env)
            except FormulaError as exc:
                problems.append("%s: formula %s %s" % (label, formula, exc))
                return declared
            except KindError as exc:
                problems.append("%s: inputs don't match in kind: %s (%s). Add or subtract only like with "
                                "like" % (label, exc, formula))
                return declared
            unused = sorted(set(env) - used)
            if unused:
                problems.append("%s: inputs %s are listed but the formula does not use them" % (label, ", ".join(unused)))
            if got_unit != unit:
                over = times(got_unit, unit, -1)
                extra = [t for t, e in over.items() if e > 0] + [t for t, e in over.items() if e < 0]
                problems.append(
                    "%s: inputs don't match in kind: %s gives %s, but the figure is %s (left over: %s). A number "
                    "counted over one thing is used for another; take each input's unit from what its source "
                    "counts, and table the step between them as an input with its own source or as an "
                    "ASSUMPTION that says why" % (label, formula, show(got_unit), show(unit),
                                                   show(over) if extra else "nothing"))
            elif not close(got_value, value, 0.03):
                problems.append("%s: arithmetic: %s gives %s, but the figure says %s"
                                % (label, formula, fmt(got_value), fmt(value)))
            return declared

        def check_input(label, fid, inp, where_text):
            if not isinstance(inp, dict):
                problems.append("%s: an input is not an object" % label)
                return None
            name = text_of(inp.get("name"))
            if not re.match(r"[A-Za-z_][A-Za-z0-9_]*$", name):
                problems.append("%s: input name '%s' must be one word (letters, digits, _)" % (label, name))
                return None
            where = "%s, input %s" % (label, name)
            source = text_of(inp.get("source"))
            value = number(inp.get("value"))
            if value is not None:
                inputs_seen.append(value)
            if re.match(r"D\d+$", source):
                if source not in figures:
                    problems.append("%s: there is no figure %s" % (where, source))
                    return None
                built_from[fid].add(source)
                got = settle(source)
                if got is None:
                    return None
                if value is not None and not close(value, got[0], 0.03):
                    problems.append("%s: value %s, but %s is %s" % (where, fmt(value), source, fmt(got[0])))
                if text_of(inp.get("unit")):
                    unit, why = parse_unit(inp.get("unit"))
                    if unit is not None and unit != got[1]:
                        problems.append("%s: unit %s, but %s is %s" % (where, show(unit), source, show(got[1])))
                return name, got[0], got[1]
            unit, why = parse_unit(inp.get("unit"))
            if value is None:
                problems.append("%s: value must be a number" % where)
            if why:
                problems.append("%s: unit %s" % (where, why))
            if value is None or unit is None:
                return None
            if source.upper() == "DEFINITION":
                pair = [t for t, e in unit.items() if e > 0] + [t for t, e in unit.items() if e < 0]
                expect = conversion(pair) if len(unit) == 2 and len(pair) == 2 else None
                if expect is None or not close(value, expect, 0.01):
                    problems.append("%s: DEFINITION is only for unit conversions (12 month / year, 1000 event / "
                                    "k_event, 1000000 token / m_token)"
                                    % where)
                    return None
                return name, value, unit
            if source.upper() == "ASSUMPTION":
                if len(text_of(inp.get("why"))) < 10:
                    problems.append("%s: an ASSUMPTION says why (what it is set against)" % where)
                return name, value, unit
            claim = resolve(source) if source else None
            if claim is None:
                problems.append("%s: source must be a claim id that exists, a figure D.., ASSUMPTION or "
                                "DEFINITION (it is '%s')" % (where, source))
                return None
            cited.add(source)
            for field in ("population", "scope"):
                if len(text_of(inp.get(field))) < 2:
                    problems.append("%s: say its %s" % (where, field))
            quote = text_of(claim.get("quote"))
            measures = text_of(inp.get("measures"))
            meta, page = kept_page(text_of(claim.get("url")))
            pages = [p for p in (quote, page, input_text if claim.get("how") == "input" else "") if p]
            if not measures:
                problems.append("%s: measures: copy the words on %s's page that say what the number counts"
                                % (where, source))
            elif not any(norm(measures).lower() in norm(p).lower() for p in pages):
                problems.append("%s: its measures words are not on %s's kept page or in its quote" % (where, source))
                measures = ""
            words = quote + " " + measures
            if not any(close(value, n, 0.005, half) for n, half in stated_numbers(words)):
                problems.append("%s: value %s is not a number that %s's quote or measures words state (a "
                                "percentage goes in as a fraction: 5.83%% -> 0.0583; anything computed from it "
                                "is a step in the formula)" % (where, fmt(value), source))
            found = re.findall(r"[a-z]+", words.lower())
            stems = {stem(w) for w in found} | {SCALED_WORDS[w][1] for w in found if w in SCALED_WORDS}
            for thing, power in sorted(unit.items()):
                if thing in TIME.values() or thing in CURRENCY.values():
                    continue
                if power < 0 and thing in PRICE_PAYERS and is_money(unit):
                    continue  # a price is paid by whoever buys it
                if not says(thing, stems):
                    problems.append(
                        "%s: its unit counts %s, but %s's own words (quote and measures) never do: a number "
                        "measures what its source counts. Use the source's thing in the unit and make the "
                        "step to %s an input of its own" % (where, thing, source, thing))
            source_marks = marks(words)
            own_marks = marks(text_of(inp.get("population")) + " " + text_of(inp.get("scope")))
            unsaid = sorted((source_marks - own_marks) & {n for n, _ in LIMITS})
            if unsaid:
                problems.append("%s: %s's words limit it to %s; say so in its scope"
                                % (where, source, " and ".join(unsaid)))
            figure_marks = marks(where_text)
            narrower = sorted(m for m in (source_marks | own_marks) & {n for n, _ in LIMITS} if m not in figure_marks)
            regions = {n for n, _ in REGIONS}
            mine, theirs = (source_marks | own_marks) & regions, figure_marks & regions
            clash = sorted(mine - theirs) if mine and theirs and not mine & theirs else []
            if narrower or clash:
                limit = " and ".join(narrower or clash)
                if len(text_of(inp.get("bridge"))) >= 20:
                    notes.append("%s covers only %s; bridged: %s" % (where, limit, text_of(inp["bridge"])))
                else:
                    problems.append("%s: covers only %s, but the figure does not: use a source that covers "
                                    "the figure, or say in bridge why it carries over" % (where, limit))
            return name, value, unit

        for fid in figures:
            settle(fid)

        def below(fid, seen=None):
            seen = set() if seen is None else seen
            for src in built_from.get(fid, ()):
                if src not in seen:
                    seen.add(src)
                    below(src, seen)
            return seen

        tabled = [v for v, _ in (settled[f] for f in settled if settled[f])] + inputs_seen
        money = {fid: settled[fid] for fid in settled if settled[fid] and is_money(settled[fid][1])}
        quoted = []
        for c in brief.get("claims") or []:
            if isinstance(c, dict):
                quoted += stated_numbers(text_of(c.get("quote")))
        for cid in cited:
            quoted += stated_numbers(text_of((resolve(cid) or {}).get("quote")))

        def figures_at(values):
            # A number in the text is that figure when they agree within 5%, not within its last digit:
            # "$1 or more per session" is not a figure of 0.89.
            return [fid for fid, (v, u) in money.items() if any(close(n, v, 0.05) for n, half in values)]

        rows = {text_of(r.get("row")): r for r in brief.get("risks") or [] if isinstance(r, dict)}
        rec = brief.get("recommendation") if isinstance(brief.get("recommendation"), dict) else {}
        texts = [("risk row " + row, text_of((rows.get(row) or {}).get("why"))) for row in ROWS]
        texts.append(("recommendation", text_of(rec.get("reason"))))
        for q in brief.get("questions") or []:
            if isinstance(q, dict):
                texts.append(("question %s" % q.get("n"), text_of(q.get("answer"))))
        for n, k in enumerate(brief.get("kill_criteria") or [], 1):
            texts.append(("kill criterion %d" % n, text_of(k)))
        for n, a in enumerate(brief.get("assumptions") or [], 1):
            if isinstance(a, dict):
                texts.append(("assumption %d" % n, " ".join(text_of(a.get(f)) for f in ("assumption", "kill_if"))))

        flagged = set()
        for where, text in texts:
            found = mentions(text)
            # A derived number in the viability and go-to-market rows or the recommendation is tabled.
            if where in ["risk row " + r for r in FIGURE_ROWS] + ["recommendation"]:
                for start, end, kind, values in found:
                    if any(close(n, v, 0.05, half) for n, half in values for v in tabled):
                        continue
                    if any(close(n, q, 0.01, max(half, qh)) for n, half in values for q, qh in quoted):
                        continue
                    problems.append('%s: "%s" is a derived number with no figure: table it in figures (D..) '
                                    "with its formula and inputs, or cite the claim that states it"
                                    % (where, norm(text[max(0, start - 30):end + 30])))
            spots = [(start, end, figures_at(values)) for start, end, kind, values in found if kind == "money"]
            spots = [s for s in spots if s[2]]
            # The text says what a figure is per; the figure's unit must agree.
            for start, end, fids in spots:
                per = PER.match(text[end:end + 60])
                if not per:
                    continue
                one, two = canon(per.group(1)), canon(per.group(1) + " " + (per.group(2) or ""))
                thing = two if per.group(2) and two in SAME_THING else one
                if thing in TIME.values() or not thing:
                    continue
                wanted = {stem(w) for w in thing.split("_")}
                if not any(thing in counted(money[f][1])
                           or wanted & {stem(w) for t in counted(money[f][1]) for w in t.split("_")} for f in fids):
                    problems.append('%s: "%s" says per %s, but figure %s is %s' % (
                        where, norm(text[start:end + per.end()]), thing, fids[0], show(money[fids[0]][1])))
            # Weighing one figure against another compares like with like.
            for cue in COMPARE.finditer(text):
                bounds = [0] + [m.end() for m in re.finditer(r"[.!?;](?=\s)", text)] + [len(text)]
                s0 = max(b for b in bounds if b <= cue.start())
                s1 = min(b for b in bounds if b > cue.start())
                before = [s for s in spots if s[1] <= cue.start() and s[0] >= s0]
                after = [s for s in spots if s[0] >= cue.end() and s[0] < s1]
                if not before:
                    continue
                a = before[-1]
                b = after[0] if after else None
                if b is None:
                    for s in reversed([s for s in spots if s[1] <= a[0]]):
                        if not any(x in below(y) or y in below(x) for x in a[2] for y in s[2]):
                            b = s
                            break
                if b is None:
                    continue
                if any(x == y or x in below(y) or y in below(x) or not counted(money[x][1])
                       or not counted(money[y][1]) or counted(money[x][1]) == counted(money[y][1])
                       for x in a[2] for y in b[2]):
                    continue
                x, y = a[2][0], b[2][0]
                if (where, x, y) in flagged:
                    continue
                flagged.add((where, x, y))
                problems.append(
                    '%s weighs "%s" (figure %s, %s) against "%s" (figure %s, %s): figures counted per %s and '
                    "per %s don't match in kind. Compare like with like, or table the comparison as a figure "
                    "whose units work out" % (
                        where, norm(text[a[0]:a[1]]), x, show(money[x][1]), norm(text[b[0]:b[1]]), y,
                        show(money[y][1]), " and ".join(sorted(counted(money[x][1]))),
                        " and ".join(sorted(counted(money[y][1])))))
        return not problems, problems, cited, notes


    def check_call(brief, rec, decision, resolve):
        """The deal-breaker checklist and the call it gives (queue #39).

        Every checklist question K1-K6 is answered once, on its row: yes (the cited evidence shows the
        deal-breaker), no (the cited evidence shows it isn't one) or unknown (the evidence doesn't
        settle it; it goes to the next test, so it names what that test checks). A yes or a no cites a
        claim; a yes says whether the one named wedge change fixes it, and how. The decision, the rule
        named in recommendation.rule and the open ids in recommendation.deal_breakers must be the ones
        the rule gives. Returns (ok, problems, claim ids cited, {"rule", "open", "answers"}).
        """
        problems, cited = [], set()
        entries = brief.get("deal_breakers")
        if not isinstance(entries, list) or not entries:
            return False, ["deal_breakers: missing; answer each of %s yes, no or unknown"
                           % ", ".join(k for k, _ in DEAL_BREAKERS)], cited, {}
        by_id = {}
        for n, entry in enumerate(entries, 1):
            if not isinstance(entry, dict):
                problems.append("deal_breakers entry %d is not an object" % n)
                continue
            kid = text_of(entry.get("id"))
            if kid in by_id:
                problems.append("deal-breaker %s: answered twice" % kid)
            by_id[kid] = entry
        rows = dict(DEAL_BREAKERS)
        extra = sorted(set(by_id) - set(rows))
        if extra:
            problems.append("deal_breakers: unknown ids %s (the checklist is %s)"
                            % (", ".join(extra), ", ".join(k for k, _ in DEAL_BREAKERS)))
        answers, open_ids, fixed = {}, [], set()
        for kid, row in DEAL_BREAKERS:
            entry = by_id.get(kid)
            if entry is None:
                problems.append("deal-breaker %s (%s): not answered" % (kid, row))
                continue
            answer = text_of(entry.get("answer")).lower()
            answers[kid] = answer
            if text_of(entry.get("row")) != row:
                problems.append("deal-breaker %s: row must be %s" % (kid, row))
            if answer not in ANSWERS:
                problems.append("deal-breaker %s: answer must be yes, no or unknown" % kid)
                continue
            if len(text_of(entry.get("why"))) < 40:
                problems.append("deal-breaker %s: no reason given" % kid)
            ids = [str(c) for c in entry.get("claims") or []]
            cited.update(ids)
            good = [c for c in ids if resolve(c)]
            if answer in ("yes", "no") and not good:
                problems.append("deal-breaker %s: a %s cites no claim that exists with a URL and a date "
                                "(evidence that settles nothing makes it unknown)" % (kid, answer))
            if answer == "unknown" and len(text_of(entry.get("test"))) < 20:
                problems.append("deal-breaker %s: unknown, so say what the next test checks" % kid)
            if answer != "yes":
                continue
            open_ids.append(kid)
            flag = entry.get("fixed_by_wedge")
            if not isinstance(flag, bool):
                problems.append("deal-breaker %s: a yes needs fixed_by_wedge true or false" % kid)
            elif flag:
                fixed.add(kid)
                if len(text_of(entry.get("fix"))) < 40:
                    problems.append("deal-breaker %s: fixed_by_wedge, so say how the named wedge fixes it" % kid)
        complete = len(answers) == len(DEAL_BREAKERS) and all(a in ANSWERS for a in answers.values())
        rule = call_of(open_ids, fixed) if complete else None
        if rule:
            stated = rec.get("deal_breakers")
            stated = sorted(str(k) for k in stated) if isinstance(stated, list) else None
            if decision != rule:
                problems.append("call rule: the deal-breakers give %s (%s; open: %s), but the decision is %s"
                                % (rule, RULES[rule], ", ".join(open_ids) or "none", decision or "missing"))
            if text_of(rec.get("rule")) != rule:
                problems.append("recommendation.rule must name the rule that fired: %s" % rule)
            if stated != sorted(open_ids):
                problems.append("recommendation.deal_breakers must list the open deal-breakers: [%s]"
                                % ", ".join(open_ids))
        return not problems, problems, cited, {"rule": rule, "open": open_ids, "answers": answers}


    def check():
        problems = []
        index = {}
        for path in sorted(glob.glob(os.path.join(BRIEF_DIR, "lenses", "*.json"))):
            data, err = load_json(path)
            if err or not isinstance(data, dict):
                problems.append("%s is %s" % (path, err or "not a JSON object"))
                continue
            for claim in data.get("claims") or []:
                if isinstance(claim, dict) and claim.get("id"):
                    index[str(claim["id"])] = dict(claim, _file=os.path.basename(path))
        brief_path = os.path.join(BRIEF_DIR, "brief.json")
        brief, err = load_json(brief_path)
        if err or not isinstance(brief, dict):
            problems.append("%s is %s" % (brief_path, err or "not a JSON object"))
            return {"verdict": "fail", "problems": problems, "items": {}}
        if not os.path.exists(os.path.join(BRIEF_DIR, "brief.md")):
            problems.append("state/brief/brief.md is missing")
        try:
            with open(os.path.join(BRIEF_DIR, "input.md"), encoding="utf-8") as f:
                input_text = f.read()
        except FileNotFoundError:
            input_text = ""
        copies = {}
        for claim in brief.get("claims", []) or []:
            if isinstance(claim, dict) and claim.get("id"):
                copies[str(claim["id"])] = claim

        bad_claims = {}

        def resolve(cid):
            cid = str(cid)
            claim = index.get(cid)
            copy = copies.get(cid)
            if claim is None and copy is not None and copy.get("how") == "input":
                if text_of(copy.get("url")) and copy["url"] in input_text:
                    claim = dict(copy, _file="input.md")
                else:
                    bad_claims[cid] = "input claim whose URL is not in input.md"
                    return None
            if claim is None:
                bad_claims[cid] = "cited but in no lens file (and not an input claim)"
                return None
            if copy is not None and text_of(copy.get("url")) != text_of(claim.get("url")):
                bad_claims[cid] = "the brief's copy has a different URL from %s" % claim["_file"]
            if not text_of(claim.get("url")).startswith("http"):
                bad_claims[cid] = "no URL"
                return None
            if not (text_of(claim.get("date")) or text_of(claim.get("fetched"))):
                bad_claims[cid] = "no date"
                return None
            return claim

        items = {}
        cited = set()

        # 1. Cagan's 10 questions, each citing >= 1 claim.
        questions = brief.get("questions") or []
        q_ok = len(questions) == 10
        if not q_ok:
            problems.append("questions: %d entries, need exactly 10" % len(questions))
        for n, q in enumerate(questions[:10], 1):
            if not isinstance(q, dict):
                q_ok = False
                problems.append("question %d is not an object" % n)
                continue
            if text_of(q.get("question")) != QUESTIONS[n - 1]:
                q_ok = False
                problems.append("question %d should read exactly: %s" % (n, QUESTIONS[n - 1]))
            if len(text_of(q.get("answer"))) < 40:
                q_ok = False
                problems.append("question %d: no real answer" % n)
            ids = [str(c) for c in q.get("claims") or []]
            cited.update(ids)
            good = [c for c in ids if resolve(c)]
            if not good:
                q_ok = False
                problems.append("question %d: cites no claim that exists with a URL and a date" % n)
        items["questions"] = q_ok

        # 2. Five rows, each with a verdict and >= 2 claims from >= 2 URLs, >= 1 primary read with cite.py.
        rows = {}
        for r in brief.get("risks") or []:
            if isinstance(r, dict):
                rows[text_of(r.get("row"))] = r
        r_ok = True
        for row in ROWS:
            r = rows.get(row)
            if r is None:
                r_ok = False
                problems.append("risk row %s is missing" % row)
                continue
            if text_of(r.get("verdict")) not in VERDICTS:
                r_ok = False
                problems.append("risk row %s: verdict must be low, med or high" % row)
            if len(text_of(r.get("why"))) < 40:
                r_ok = False
                problems.append("risk row %s: no reason given" % row)
            ids = [str(c) for c in r.get("claims") or []]
            cited.update(ids)
            good = [resolve(c) for c in ids]
            good = [c for c in good if c]
            urls = {text_of(c.get("url")) for c in good}
            primary = [c for c in good if c.get("quality") == "primary" and c.get("how") in ("cite", "input")]
            if len(good) < 2 or len(urls) < 2:
                r_ok = False
                problems.append("risk row %s: %d usable claims from %d URLs, need >= 2 from >= 2"
                                % (row, len(good), len(urls)))
            if not primary:
                r_ok = False
                problems.append("risk row %s: no primary claim read with cite.py" % row)
        extra = sorted(set(rows) - set(ROWS))
        if extra:
            problems.append("unknown risk rows: %s (use %s)" % (", ".join(extra), ", ".join(ROWS)))
        items["rows"] = r_ok

        # 4. >= 3 riskiest assumptions with a test and a kill result, and explicit kill criteria.
        assumptions = [a for a in brief.get("assumptions") or [] if isinstance(a, dict)]
        a_ok = len(assumptions) >= 3
        if not a_ok:
            problems.append("assumptions: %d, need >= 3" % len(assumptions))
        for n, a in enumerate(assumptions, 1):
            cited.update(str(c) for c in a.get("claims") or [])
            for field in ("assumption", "test", "kill_if"):
                if len(text_of(a.get(field))) < 10:
                    a_ok = False
                    problems.append("assumption %d: no %s" % (n, field))
        kills = [k for k in brief.get("kill_criteria") or [] if len(text_of(k)) >= 10]
        if not kills:
            a_ok = False
            problems.append("kill_criteria: none")
        items["assumptions_and_kill"] = a_ok

        # 5. One clear recommendation with its reason.
        rec = brief.get("recommendation") or {}
        decision = text_of(rec.get("decision")) if isinstance(rec, dict) else ""
        rec_ok = decision in DECISIONS and len(text_of(rec.get("reason"))) >= 40
        if decision not in DECISIONS:
            problems.append("recommendation.decision must be one of %s" % ", ".join(DECISIONS))
        elif len(text_of(rec.get("reason"))) < 40:
            problems.append("recommendation: no reason given")
        if decision == "advance" and len(text_of(rec.get("first_paid_test"))) < 20:
            rec_ok = False
            problems.append("recommendation advance: say what the first paid test should test")
        if decision == "change_wedge" and len(text_of(rec.get("new_wedge"))) < 20:
            rec_ok = False
            problems.append("recommendation change_wedge: name the new wedge")
        items["recommendation"] = rec_ok

        # 5b. The call follows the rule over the deal-breaker checklist (queue #39).
        call_ok, call_problems, call_claims, call = check_call(brief, rec if isinstance(rec, dict) else {},
                                                               decision, resolve)
        cited.update(call_claims)
        problems.extend(call_problems)
        items["call_rule"] = call_ok

        # 6. Derived figures: shown, recomputed, and counted over matching things (queue #25).
        figures_ok, figure_problems, figure_claims, figure_notes = check_figures(brief, resolve, input_text)
        cited.update(figure_claims)
        problems.extend(figure_problems)
        items["figures"] = figures_ok

        # Every cited claim: exists, and a cite.py claim's quote is on the page cite.py kept.
        quote_ok = True
        resolved = {}
        for cid in sorted(cited, key=id_key):
            claim = resolve(cid)
            if not claim:
                continue
            resolved[cid] = claim
            if claim.get("how") != "cite":
                continue
            meta, page = kept_page(text_of(claim.get("url")))
            quote = norm(text_of(claim.get("quote"))).lower()
            if page is None:
                quote_ok = False
                bad_claims[cid] = "how is cite, but cite.py never read this URL"
            elif not quote:
                quote_ok = False
                bad_claims[cid] = "how is cite, but no quote"
            elif quote not in norm(page).lower():
                quote_ok = False
                bad_claims[cid] = "quote is not on the page cite.py kept"
        for cid in sorted(bad_claims, key=id_key):
            problems.append("claim %s: %s" % (cid, bad_claims[cid]))
        items["claims_and_quotes"] = quote_ok and not bad_claims

        # The spot-check sample: load-bearing kinds first, seed 7 over ids in order; reserve after.
        pool = sorted((c for c in resolved if resolved[c].get("kind") in POOL_KINDS), key=id_key)
        rest = sorted((c for c in resolved if resolved[c].get("kind") not in POOL_KINDS), key=id_key)
        order = random.Random(7).sample(pool, len(pool)) + random.Random(7).sample(rest, len(rest))
        sample = [{"id": c, "kind": resolved[c].get("kind"), "claim": resolved[c].get("claim"),
                   "quote": resolved[c].get("quote"), "url": resolved[c].get("url"),
                   "date": resolved[c].get("date"), "quality": resolved[c].get("quality"),
                   "how": resolved[c].get("how")} for c in order[:10]]
        verdict = "pass" if all(items.values()) and not problems else "fail"
        return {
            "verdict": verdict,
            "items": items,
            "problems": problems,
            "decision": decision,
            "rule": call.get("rule"),
            "open_deal_breakers": call.get("open"),
            "deal_breaker_answers": call.get("answers"),
            "claims_cited": len(resolved),
            "primary_cited": sum(1 for c in resolved.values() if c.get("quality") == "primary"),
            "spot_check": sample,
            "spot_check_reserve": order[10:],
            "figures_checked": len(brief.get("figures") or []) if isinstance(brief.get("figures"), list) else 0,
            "figure_notes": figure_notes,
            "brief_path": os.path.join(BRIEF_DIR, "brief.md"),
        }


    def main(argv):
        result = check()
        if "--final" in argv:
            answers = passed_answers(argv)
            parts = lens_parts(answers)
            lost = ["%s lens left no usable output: %s" % (lens, why) for lens, why in parts.items() if why != "ok"]
            result["parts"] = parts
            result["answers_checked"] = [lens for lens in LENSES if lens in answers]
            if lost:
                result["problems"] = lost + result["problems"]
                result["verdict"] = "fail"
            print(json.dumps(result, indent=1))
            return 0
        for name, ok in result.get("items", {}).items():
            print("%-22s %s" % (name, "ok" if ok else "NOT MET"))
        for problem in result["problems"]:
            print("- " + problem)
        print("verdict:", result["verdict"], "| claims cited:", result.get("claims_cited"),
              "| primary:", result.get("primary_cited"))
        return 0 if result["verdict"] == "pass" else 1


    if __name__ == "__main__":
        sys.exit(main(sys.argv))
    CHECKEOF
    echo '{"status": "completed", "input_path": "state/brief/input.md", "helpers": ["cite.py", "check_brief.py"]}'
