# Zero-LLM agent: what a run box and its agent tools can read, by NAME only.
#
# A script step is an agent tool process, so its own environment shows what an
# agent's Bash sees; /proc/*/environ shows what every process in the box started
# with (the box's own process included), as far as this user can read it.
# Prints names, never values, and fails (exit 1) when it finds a name that must
# not be there (docs/boxes.md). Used by the machine check's smoke set and as the
# live probe after a change to the box list.
#
# It also checks the box's profile (docs/boxes.md, "The box profile"): the box was
# started with one, it matches its digest, it says what it leaves open (BS2-BS6 and a
# network recorded as mixed), and, in a sealed box, the paths a sealed box never has
# are not there and the runner's own files can't be written. Facts and path names only.
#
# In a oneshot box (BS2, TEMPER_BOX_SECRET_BOOTSTRAP=oneshot) it also checks that no
# process it can read started with a secret-like name or a delivered one, that the
# runner's environ and memory refuse it, that the delivery folder holds only the
# runner's acknowledgement, and that the profile records the CLI token's exposure.
agent:
  name: ci_box_env
  type: script
  timeout_seconds: 60
  script_template: |
    #!/bin/bash
    set -u
    python3 - <<'PY'
    import json, os, sys
    from pathlib import Path

    # Never in a box at all: only the server reads them.
    SERVER_ONLY = {
        "SLACK_BOT_TOKEN", "SLACK_APP_TOKEN", "SLACK_SIGNING_SECRET", "TELEGRAM_BOT_TOKEN",
        "GITHUB_APP_PRIVATE_KEY", "GITHUB_APP_WEBHOOK_SECRET", "GITHUB_APP_CLIENT_SECRET",
        "LINEAR_WEBHOOK_SECRET", "NOTION_WEBHOOK_SECRET", "TEMPER_SLACK_TEST_TOKEN",
        "INTERNAL_API_TOKEN", "TEMPER_API_TOKENS_FILE", "TEMPER_SPAWNER",
        "TEMPER_EXECUTION_MODE", "TEMPER_DOCKER_TEMPLATE_CONTAINER",
        # Pi steps never run in a run box (configs/boxes/env.yaml, docs/pi-agent.md).
        "TEMPER_PI_AGENT", "TEMPER_PI_BOX_CONFIG",
    }
    # Never in an agent tool's own environment.
    NOT_FOR_TOOLS = SERVER_ONLY | {
        "TEMPER_DATABASE_URL", "DATABASE_URL", "TEMPER_SECRET_KEY", "TEMPER_REDIS_URL",
        "REDIS_URL", "TEMPER_API_TOKEN",
    }
    SECRET_ENDINGS = ("_KEY", "_TOKEN", "_TOKENS", "_SECRET", "_PASSWORD", "_CREDENTIALS")

    tool = sorted(os.environ)
    box, unreadable = set(), 0
    for path in Path("/proc").glob("[0-9]*/environ"):
        try:
            raw = path.read_bytes()
        except OSError:
            unreadable += 1
            continue
        for item in raw.split(b"\0"):
            if b"=" in item:
                box.add(item.split(b"=", 1)[0].decode("ascii", "replace"))

    leaks = sorted({n for n in tool if n in NOT_FOR_TOOLS or n.endswith(SECRET_ENDINGS)}
                   | (box & SERVER_ONLY))

    # The box profile, as the box was started with it (the first process that has it).
    import hashlib
    PROFILE_VARS = ("TEMPER_BOX_PROFILE", "TEMPER_BOX_PROFILE_DIGEST",
                    "TEMPER_BOX_PROFILE_GENERATION")
    started = ({k: os.environ.get(k, "") for k in PROFILE_VARS}
               if PROFILE_VARS[0] in os.environ else {})
    for path in [] if started else sorted(Path("/proc").glob("[0-9]*/environ"), key=lambda p: int(p.parent.name)):
        try:
            items = path.read_bytes().split(b"\0")
        except OSError:
            continue
        found = dict(i.decode("utf-8", "replace").split("=", 1) for i in items if b"=" in i)
        if PROFILE_VARS[0] in found:
            started = {k: found.get(k, "") for k in PROFILE_VARS}
            break
    problems, profile = [], {}
    if not started:
        problems.append("the box was started without a profile")
    else:
        try:
            doc = json.loads(started[PROFILE_VARS[0]])
        except ValueError:
            doc = None
        if not isinstance(doc, dict):
            problems.append("the box's profile is not a document")
            doc = {}
        text = json.dumps(doc, sort_keys=True, separators=(",", ":"), ensure_ascii=True)
        digest = "sha256:" + hashlib.sha256(text.encode("ascii")).hexdigest()
        steps = sorted({r.get("step") for r in doc.get("residuals") or []} - {None})
        profile = {"boundary": doc.get("boundary"), "generation": doc.get("generation"),
                   "hardening": doc.get("hardening"), "digest": digest[:19],
                   "residuals": steps, "network": (doc.get("closure") or {}).get("network")}
        if digest != started[PROFILE_VARS[1]]:
            problems.append("the profile does not match its digest")
        if str(doc.get("generation")) != started[PROFILE_VARS[2]]:
            problems.append("the profile's generation is not the one the box was given")
        if doc.get("schema_version") != 2 or doc.get("hardening") != "partial":
            problems.append("the profile is not schema 2 with partial hardening")
        missing = {"BS2", "BS3", "BS4", "BS5", "BS6", "network"} - set(steps)
        if missing:
            problems.append("the profile doesn't list what it leaves open: " + ", ".join(sorted(missing)))
        if profile["network"] != "negative":
            problems.append("the profile claims a closed network")
        runtime = doc.get("runtime") or {}
        # The paths a sealed box must not have come from its profile, not from this text.
        absent = runtime.get("absent") or []
        visible = [p for p in absent if os.path.lexists(p)]
        profile["absent_paths_visible"] = visible
        if doc.get("boundary") == "sealed":
            if not absent:
                problems.append("a sealed profile names no paths its box must not have")
            if visible:
                problems.append("a sealed box has " + ", ".join(visible))
            writable = [p for p in runtime.get("immutable") or []
                        if os.path.exists(p) and os.access(p, os.W_OK)]
            writable += [p for p in runtime.get("path") or []
                         if os.path.isdir(p) and os.access(p, os.W_OK)]
            if writable:
                problems.append("a sealed box can write " + ", ".join(sorted(set(writable))))
        elif doc.get("boundary") != "legacy":
            problems.append(f"the profile's boundary is {doc.get('boundary')!r}")
        boot = doc.get("bootstrap") or {}
        profile["bootstrap"] = boot.get("mode", "env (no section)")
        if boot.get("mode") == "oneshot":
            # GPG_KEY: the python base image's public release-key fingerprint (the spawner
            # lets it through only when its value is a fingerprint).
            named = sorted(n for n in box if n != "GPG_KEY"
                           and (n in NOT_FOR_TOOLS or n.endswith(SECRET_ENDINGS)))
            delivered = sorted(box & set(boot.get("names") or []))
            if named or delivered:
                problems.append("a oneshot box's processes started with secret or delivered "
                                "names: " + ", ".join(sorted(set(named + delivered))))
            folder = Path(boot.get("dir") or "/run/temper-boot")
            try:
                left = sorted(p.name for p in folder.iterdir())
                ack = json.loads((folder / "ack").read_text())
            except (OSError, ValueError):
                left, ack = ["(unreadable)"], {}
            profile["delivery_folder"] = left
            if left != ["ack"] or ack.get("state") != "consumed":
                problems.append("the delivery folder holds more than a consumed acknowledgement")
            runner = ack.get("pid")
            refused = []
            for part in ("environ", "mem"):
                try:
                    with open(f"/proc/{runner}/{part}", "rb") as fh:
                        fh.read(1)
                except PermissionError:
                    refused.append(part)
                except OSError:
                    pass
            profile["runner_refuses"] = refused
            if refused != ["environ", "mem"]:
                problems.append("the runner's environ or memory can be read")
            steps_now = {r.get("step"): r.get("still") for r in doc.get("residuals") or []}
            if steps_now.get("BS2") != "partial" or "cli credential" not in steps_now:
                problems.append("a oneshot profile doesn't record BS2 as partial and the CLI "
                                "token's exposure")

    print(json.dumps({"tool_env": tool, "box_env": sorted(box),
                      "unreadable_proc": unreadable, "leaks": leaks,
                      "profile": profile, "profile_problems": problems}))
    sys.exit(1 if leaks or problems else 0)
    PY
