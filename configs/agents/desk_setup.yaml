# @description DESK CHECK step 0 (product role). No model. Writes the run's input (state/desk/
# input.md: the hypothesis, the evidence rules - fixed ones and the defaults a bar may set aside
# in its own words - and every assumption with its pass and kill bars; one file per
# assumption in state/desk/assumptions/) and three helpers into state/desk/: cite.py (exact page
# text through curl's default user agent, every page read kept in state/desk/pages/; public
# datasets downloaded whole into state/desk/data/), pdftext.py (the PDF reader cite.py uses:
# standard library only, so a PDF reads the same in every container; pdftotext only when it finds
# no text) and check_desk.py (the mechanical check, run by the researchers, the synthesizer and
# desk_final; it also works out what kind of evidence carried each verdict). Clears the
# previous run's files first (state/desk/history/ is left alone). Prints the assumption slots
# (A1..An) that decide which researcher slots run. Part of workflows/desk_check.yaml.
# From the command line, run it with --workspace <folder>: without it `temper run` gives script
# steps no workspace_path, and this step stops rather than write into the home folder.
# POSIX sh. No dollar-brace env syntax anywhere in this file (config-loader substitution) and
# no Jinja delimiters inside the helpers. The script runs as one `sh -c` argument and Linux caps
# one argument at 128 KB: keep the rendered script under 120,000 bytes (a test checks it).
agent:
  name: desk_setup
  version: 1
  type: script
  timeout_seconds: 60
  script_template: |
    #!/bin/sh
    set -e
    WS={{ workspace_path }}
    if [ -z "$WS" ]; then echo "desk_check needs a workspace: run it with --workspace <folder>" >&2; exit 1; fi
    cd "$WS"
    mkdir -p state/desk
    PY=python3
    command -v python3 >/dev/null 2>&1 || PY="$TEMPER_PYTHON"
    "$PY" - <<'PYEOF'
    import ast
    import json
    import os
    import shutil
    import time

    DESK = os.path.join("state", "desk")
    hypothesis = (os.environ.get("{{ hypothesis | env }}") or "").strip()
    raw = (os.environ.get("{{ assumptions | env }}") or "").strip()
    if not hypothesis or not raw:
        raise SystemExit("desk_check needs two inputs: hypothesis and assumptions")
    try:
        items = json.loads(raw)
    except ValueError:
        try:
            items = ast.literal_eval(raw)    # the CLI parses a JSON input into a list
        except (ValueError, SyntaxError):
            raise SystemExit("assumptions must be a JSON list")
    if isinstance(items, str):
        items = json.loads(items)
    if not isinstance(items, list) or not 1 <= len(items) <= 6:
        raise SystemExit("assumptions: a list of 1 to 6 entries")
    for n, item in enumerate(items, 1):
        if not isinstance(item, dict):
            raise SystemExit("assumption %d is not an object" % n)
        if str(item.get("id", "")).strip() != "A%d" % n:
            raise SystemExit("assumption %d: its id must be A%d (ids A1..An in order)" % (n, n))
        for key in ("assumption", "pass_if", "kill_if"):
            if not str(item.get(key) or "").strip():
                raise SystemExit("assumption A%d has no %s" % (n, key))

    for sub in ("assumptions", "checks", "pages", "data", "work"):
        shutil.rmtree(os.path.join(DESK, sub), ignore_errors=True)
        os.makedirs(os.path.join(DESK, sub))
    for name in ("report.json", "report.md", "input.md", "setup.json"):
        if os.path.exists(os.path.join(DESK, name)):
            os.remove(os.path.join(DESK, name))

    # The evidence rules check_desk.py applies to a pass or a kill. The bar governs: D1-D3 are
    # defaults, held only where an assumption's own pass or kill words are silent on them.
    rules = [
        "## Evidence rules",
        "",
        "Each assumption is judged by its own pass and kill bars, below. state/desk/check_desk.py "
        "checks every pass or kill against these rules.",
        "",
        "Fixed, whatever the bar says:",
        "- F1 checkable claims: every claim has a URL, a date and its tags (quality, party, stake "
        "when interested, source, signal, how); a quoted claim's words are on the page cite.py "
        "kept; a counted claim's script, run again, prints its result.",
        "- F2 no listicles or snippets: listicles and search-snippet claims never count as support.",
        "- F3 one checked claim: a pass or a kill rests on at least one usable decisive claim read "
        "with cite.py or counted from a public dataset (a WebFetch summary has no checked quote).",
        "",
        "Defaults, held only where an assumption's own bar is silent on them:",
        "- D1 two sources: a pass or a kill rests on at least 2 usable decisive claims from at "
        "least 2 different sources.",
        "- D2 a neutral source: the F3 claim comes from a party with no stake in the answer, not "
        "a company about its own product, a vendor about its own results or a group about its "
        "own cause.",
        "- D3 a primary source: the F3 claim is the original document (the study, the dataset, "
        "the company's own page about its own product), not a report about it.",
        "",
        "A bar sets a default aside only by saying so in its own pass or kill words, for example "
        "\"the operator's own stated figure counts\" (D2), \"one source is enough\" (D1) or "
        "\"a trade-press report of the figure counts\" (D3). A verdict that relies on that names "
        "the default and quotes those words (rules.set_aside). The hypothesis, the pointers and a "
        "researcher's or reviewer's judgement never set a default aside. A verdict held at unknown "
        "because its evidence meets the bar's words but not a default names that default "
        "(rules.decided_by).",
        "",
        "## Who is speaking, and what the evidence shows",
        "",
        "Every claim carries these tags. check_desk.py checks them and shows them on each verdict. "
        "They inform a verdict and its caveats; they never move a bar or a rule above.",
        "- party: neutral, or interested when its source gains from the answer (a seller's own "
        "survey, a vendor's case study, a company about its own product, a group about its own "
        "cause).",
        "- stake (interested claims): who gains from the answer and how, in a few words.",
        "- source: who stands behind the evidence (the body that ran the survey, published the "
        "data or made the statement), as the page names it. One source has one party within an "
        "assumption.",
        "- signal: what the evidence shows. pays: money actually spent (revenue, paid users, "
        "purchases, paid bookings). does: behaviour observed or logged (usage, searches, visits, "
        "trips or completions counted by a system or an observer). says: what people tell a survey "
        "or an interviewer (opinions, intentions, preferences, or their own account of what they "
        "did or spent). fact: not about what people say, do or pay (a rule, a price, a feature, a "
        "count of firms, an event).",
        "",
        "A verdict is carried by the strongest signal among its usable decisive claims: pays, then "
        "does, then says, then fact (none without a usable decisive claim). Money weighs more than "
        "behaviour and behaviour more than words, so a verdict carried by says, or only by "
        "interested sources, states that as a caveat; the bar still decides the verdict.",
        "",
    ]
    parts = ["# Desk check input", "", "Written by desk_setup, " + time.strftime("%Y-%m-%d %H:%M %Z") + ".",
             "", "## Hypothesis", "", hypothesis, ""] + rules + [
             "## Assumptions (bars fixed before the run: judge against them as written, never move them)", ""]
    slots = []
    for item in items:
        slot = "A%d" % (len(slots) + 1)
        slots.append(slot)
        entry = {
            "id": slot,
            "assumption": str(item["assumption"]).strip(),
            "pass_if": str(item["pass_if"]).strip(),
            "kill_if": str(item["kill_if"]).strip(),
            "fatal": item.get("fatal", True) is not False,
            "pointers": item.get("pointers") or [],
        }
        if isinstance(entry["pointers"], str):
            entry["pointers"] = [entry["pointers"]]
        with open(os.path.join(DESK, "assumptions", slot + ".json"), "w", encoding="utf-8") as f:
            json.dump(entry, f, indent=1)
        parts += ["### %s. %s" % (slot, entry["assumption"]), "",
                  "- Pass if: " + entry["pass_if"],
                  "- Kill if: " + entry["kill_if"],
                  "- Fatal: " + ("yes, a kill ends the hypothesis" if entry["fatal"] else "no"),
                  ]
        parts += ["- Pointer: " + str(p) for p in entry["pointers"]]
        parts.append("")
    with open(os.path.join(DESK, "input.md"), "w", encoding="utf-8") as f:
        f.write("\n".join(parts))
    with open(os.path.join(DESK, "setup.json"), "w", encoding="utf-8") as f:
        json.dump({"status": "completed", "input_path": "state/desk/input.md", "slots": slots,
                   "helpers": ["state/desk/cite.py", "state/desk/pdftext.py",
                               "state/desk/check_desk.py"]}, f)
    PYEOF
    cat > state/desk/cite.py <<'CITEEOF'
    #!/usr/bin/env python3
    """Exact page text for citing, and public datasets for counting (desk_check). Plain curl with
    its default user agent; PDFs through pdftext.py (pdftotext only when it finds no text). A page
    or file that doesn't answer 200 is INACCESSIBLE: log it and move on, never work around it. A
    PDF its publisher locks (a password, or copying its text not allowed) is not read either.
    Run from the workspace root.

      python3 state/desk/cite.py page <url> [kw1,kw2]   status, dates on the page, text near the keywords
      python3 state/desk/cite.py quote <url> "<words>"  FOUND / NOT FOUND: are these exact words on the page?
      python3 state/desk/cite.py data <url> <name>      download a public dataset whole to state/desk/data/<name>

    Every page read is kept in state/desk/pages/ (first line: its URL, HTTP code and fetch time;
    then the text) so its words can be checked later. A dataset keeps its own record next to it
    (<name>.meta.json: URL, HTTP code, fetch time, size), which the check reads.
    """
    import hashlib
    import html
    import json
    import os
    import re
    import subprocess
    import sys
    import time

    HERE = os.path.dirname(os.path.abspath(__file__))
    PAGES = os.path.join(HERE, "pages")
    DATA = os.path.join(HERE, "data")
    META_DATE = (r"(?:datePublished|dateModified|published_time|modified_time|updated_time|"
                 r"dateCreated)[^0-9<>]{0,40}(\d{4}-\d{2}-\d{2})")
    TEXT_DATE = (r"(?i)\b(last updated|last modified|updated|effective(?: date)?|published|posted|"
                 r"release date|revised)\s*(?:on|:)?\s*([A-Z][a-z]{2,8}\.? \d{1,2},? \d{4}|"
                 r"\d{4}-\d{2}-\d{2}|\d{1,2}/\d{1,2}/\d{2,4})")


    def norm(s):
        for a, b in (("\u2019", "'"), ("\u2018", "'"), ("\u201c", '"'), ("\u201d", '"'),
                     ("\u2013", "-"), ("\u2014", "-"), ("\u00a0", " ")):
            s = s.replace(a, b)
        return re.sub(r"\s+", " ", s).strip()


    LOCKED = {
        "password": "a PDF that needs a password: INACCESSIBLE, log it and move on",
        "no-copy": ("a PDF whose publisher does not allow copying its text: not read; log it and "
                    "cite a page that publishes the figure instead"),
        "encrypted": "an encrypted PDF the reader can't open: INACCESSIBLE, log it and move on",
    }


    def pdf_text(path):
        """(text, note, info) of a saved PDF: pdftext.py first, the same text in every container;
        pdftotext only when that finds none. A locked PDF stays unread, never worked around."""
        info = {"pdf_reader": "pdftext.py"}
        with open(path, "rb") as f:
            data = f.read()
        try:
            sys.dont_write_bytecode = True
            if HERE not in sys.path:
                sys.path.insert(0, HERE)
            import pdftext
            pages, total, why = pdftext.pdf_pages(data)
        except Exception as e:    # a PDF the reader can't parse: pdftotext may
            pages, total, why = [], 0, "reader: " + type(e).__name__
            if isinstance(e, ImportError):    # a copy of this file with no pdftext.py beside it
                info["pdf_reader"], why = "none", "no reader"
            if b"/Encrypt" in data:    # a lock the reader couldn't check: pdftotext ignores locks
                why = "encrypted"
        info["pdf_pages"] = "%d of %d" % (len(pages), total)
        if why in LOCKED:
            info["pdf_locked"] = why
            return "", LOCKED[why], info
        if why:
            info["pdf_reader_note"] = "stopped after 60 s" if why == "time" else why
        text = norm(" ".join(pages))
        if text:
            return text, "", info
        try:
            out = subprocess.run(["pdftotext", path, "-"], capture_output=True, timeout=120)
            text = norm(out.stdout.decode("utf-8", "replace"))
        except (OSError, subprocess.TimeoutExpired):
            text = ""
        if text:
            info["pdf_reader"] = "pdftotext"
            return text, "", info
        if why == "no reader":
            return "", ("PDF but no PDF reader here: read it with WebFetch and tag its claims "
                        "how: webfetch, with no quote"), info
        return "", ("PDF with no text to read (a scan without a text layer?): read it with "
                    "WebFetch and tag its claims how: webfetch, with no quote"), info


    def forms(text):
        """The page text as quote() and check_desk.py match it: lower case, and with a word broken
        at a line end ("classifica- tion", "cross- border") joined both ways."""
        flat = norm(text).lower()
        return (flat, re.sub(r"(\w)- (\w)", r"\1\2", flat), re.sub(r"(\w)- (\w)", r"\1-\2", flat))


    def html_text(raw):
        body = raw.decode("utf-8", "replace")
        dates = set(re.findall(META_DATE, body))
        dates |= set(re.findall(r'<time[^>]*datetime="(\d{4}-\d{2}-\d{2})', body))
        body = re.sub(r"(?is)<(script|style|noscript|svg)[^>]*>.*?</(script|style|noscript|svg)>",
                      " ", body)
        text = norm(html.unescape(re.sub(r"<[^>]+>", " ", body)))
        return text, sorted(dates)


    def curl(url, dest, max_time):
        out = subprocess.run(["curl", "-sS", "-L", "--compressed", "--max-time", str(max_time),
                              "--max-filesize", "400000000", "-o", dest,
                              "-w", "%{http_code}\t%{content_type}\t%{url_effective}", url],
                             capture_output=True, text=True)
        code, ctype, final = (out.stdout.split("\t") + ["", "", ""])[:3]
        meta = {"url": url, "final_url": final or url, "http": code or "000",
                "content_type": ctype, "fetched": time.strftime("%Y-%m-%d %H:%M %Z")}
        if meta["http"] != "200" and out.stderr.strip():
            meta["error"] = out.stderr.strip()[:200]
        return meta


    def fetch(url):
        os.makedirs(PAGES, exist_ok=True)
        path = os.path.join(PAGES, hashlib.sha1(url.encode()).hexdigest()[:16] + ".txt")
        if os.path.exists(path):
            with open(path, encoding="utf-8") as f:
                head, _, text = f.read().partition("\n")
            return json.loads(head), text
        raw_path = "%s.%d.raw" % (path, os.getpid())
        meta = curl(url, raw_path, 45)
        text = ""
        if meta["http"] == "200" and os.path.exists(raw_path):
            with open(raw_path, "rb") as f:
                raw = f.read()
            if "pdf" in meta["content_type"].lower() or raw[:5] == b"%PDF-":
                text, note, info = pdf_text(raw_path)
                meta["pdf"] = True
                meta.update(info)
            else:
                text, meta["dates_on_page"] = html_text(raw)
                note = ""
            meta["dated_text"] = ["%s %s" % pair for pair in re.findall(TEXT_DATE, text)[:6]]
            if not note and not text.strip():
                note = ("200 but no readable text (a script-only page?): read it with WebFetch "
                        "and tag its claims how: webfetch, with no quote")
            if note:
                meta["note"] = note
        if os.path.exists(raw_path):
            os.remove(raw_path)
        if meta["http"] == "200" or meta["http"].startswith("4"):
            # Kept, so its words can be checked later and a block is never asked twice. A timeout
            # or a server error is not kept. Researchers run side by side: write whole, then move.
            tmp = "%s.%d.tmp" % (path, os.getpid())
            with open(tmp, "w", encoding="utf-8") as f:
                f.write(json.dumps(meta) + "\n" + text[:3000000])
            os.replace(tmp, path)
        return meta, text


    def header(meta):
        print("HTTP", meta["http"], meta.get("final_url"), "|", meta.get("content_type", ""),
              "| fetched", meta.get("fetched"))
        if meta["http"] != "200":
            print("-> INACCESSIBLE (%s): log it, never work around it" % meta.get("error", "status"))
            return False
        if meta.get("pdf"):
            print("PDF read by", meta.get("pdf_reader", "?"), "| pages:", meta.get("pdf_pages", "?"),
                  meta.get("pdf_reader_note", ""))
        if meta.get("dates_on_page") or meta.get("dated_text"):
            print("dates on page:", meta.get("dates_on_page", []), meta.get("dated_text", []))
        if meta.get("note"):
            print("->", meta["note"])
        return True


    def page(url, keywords=""):
        meta, text = fetch(url)
        if not header(meta):
            return
        kws = [k.strip() for k in keywords.split(",") if k.strip()]
        if not kws:
            print(text[:5000])
            return
        spots = sorted(m.start() for k in kws for m in re.finditer(re.escape(k), text, re.I))
        hits, shown_to = 0, -1
        for pos in spots:
            if pos < shown_to:
                continue
            print("...", text[max(0, pos - 350):pos + 450], "...")
            shown_to, hits = pos + 450, hits + 1
            if hits >= 12:
                break
        print("keyword hits shown:", hits, "of", len(spots), "| page length", len(text))


    def quote(url, words):
        meta, text = fetch(url)
        if not header(meta):
            return
        want = norm(words).lower()
        for flat in forms(text):
            at = flat.find(want)
            if at >= 0:
                print("FOUND: ..." + flat[max(0, at - 200):at + len(want) + 200] + "...")
                return
        print("NOT FOUND on the page: don't cite these words; quote what the page says")


    def data(url, name):
        if not re.match(r"^[A-Za-z0-9][A-Za-z0-9._-]{0,80}$", name) or name.endswith(".meta.json"):
            print("name: letters, digits, dots, dashes and underscores (e.g. hospital_owners.csv)")
            return
        os.makedirs(DATA, exist_ok=True)
        path = os.path.join(DATA, name)
        meta_path = path + ".meta.json"
        if os.path.exists(meta_path):
            with open(meta_path, encoding="utf-8") as f:
                meta = json.load(f)
            if meta.get("url") != url:
                print("state/desk/data/%s holds another URL (%s): pick another name" % (name, meta.get("url")))
                return
            print("already fetched:", json.dumps(meta))
            return
        part = "%s.%d.part" % (path, os.getpid())
        meta = curl(url, part, 600)
        if meta["http"] == "200" and os.path.exists(part):
            os.replace(part, path)
            digest = hashlib.sha1()
            lines = 0
            with open(path, "rb") as f:
                for chunk in iter(lambda: f.read(1 << 20), b""):
                    digest.update(chunk)
                    lines += chunk.count(b"\n")
            meta.update({"file": "state/desk/data/" + name, "bytes": os.path.getsize(path),
                         "lines": lines, "sha1": digest.hexdigest()})
        elif os.path.exists(part):
            os.remove(part)
        with open(meta_path, "w", encoding="utf-8") as f:
            json.dump(meta, f, indent=1)
        if not header(meta):
            return
        print("saved state/desk/data/%s: %d bytes, %d lines" % (name, meta["bytes"], meta["lines"]))
        with open(path, "rb") as f:
            head = f.read(4000).decode("utf-8", "replace").splitlines()
        for line in head[:5]:
            print("  " + line[:400])


    def main(argv):
        if len(argv) > 2 and argv[1] == "page":
            page(argv[2], argv[3] if len(argv) > 3 else "")
        elif len(argv) > 3 and argv[1] == "quote":
            quote(argv[2], argv[3])
        elif len(argv) > 3 and argv[1] == "data":
            data(argv[2], argv[3])
        else:
            print(__doc__)


    if __name__ == "__main__":
        main(sys.argv)
    CITEEOF
    cat > state/desk/pdftext.py <<'PDFEOF'
    #!/usr/bin/env python3
    """Plain text of a PDF, Python standard library only (desk_check: cite.py reads PDFs with it).

      python3 state/desk/pdftext.py <file.pdf>    the text, pages split by a form feed

    Reads the text a PDF draws, in the order it draws it: fonts with a ToUnicode map, the standard
    encodings and custom ones, embedded Type 1 encodings, two-byte fonts; words are spaced from
    the glyph widths and positions. An encrypted PDF is read the way any viewer opens it (no
    password, RC4 or AES) when its publisher allows copying its text; one that needs a password
    or forbids copying stays unread. It cannot see words inside images (a scan without a text
    layer): those give no text.
    """
    import hashlib
    import math
    import re
    import struct
    import sys
    import time
    import unicodedata
    import zlib


    class PdfError(Exception):
        pass


    class Name(str):
        pass


    class Ref(object):
        __slots__ = ("num", "gen")

        def __init__(self, num, gen):
            self.num, self.gen = num, gen


    class Stream(object):
        __slots__ = ("dict", "raw", "_data", "num", "gen")

        def __init__(self, sdict, raw, num=0, gen=0):
            self.dict, self.raw, self._data, self.num, self.gen = sdict, raw, None, num, gen


    LEX = re.compile(
        rb"(?P<sp>[\x00\t\n\x0c\r ]+|%[^\r\n]*)"
        rb"|(?P<num>[+-]?(?:[0-9]+\.?[0-9]*|\.[0-9]+))"
        rb"|(?P<name>/[^\x00\t\n\x0c\r ()<>\[\]{}/%]*)"
        rb"|(?P<lit>\()"
        rb"|(?P<hex><(?!<)[^>]*>)"
        rb"|(?P<open><<|\[|\{)"
        rb"|(?P<close>>>|\]|\})"
        rb"|(?P<op>[^\x00\t\n\x0c\r ()<>\[\]{}/%]+)"
        rb"|(?P<bad>[\s\S])")
    SPECIAL = re.compile(rb"[\\()]")
    ESCAPES = {ord("n"): b"\n", ord("r"): b"\r", ord("t"): b"\t", ord("b"): b"\b", ord("f"): b"\f"}
    OBJ = re.compile(rb"(?<![0-9])([0-9]{1,10})\s+([0-9]{1,5})\s+obj(?![A-Za-z])")
    HEXDIGITS = re.compile(rb"[^0-9A-Fa-f]")
    NAME_ESC = re.compile(r"#([0-9A-Fa-f]{2})")


    def lit_string(data, i):
        """The literal string whose '(' ends at i: (its bytes, the index after its ')')."""
        out, depth = [], 1
        while True:
            m = SPECIAL.search(data, i)
            if not m:
                out.append(data[i:])
                return b"".join(out), len(data)
            j = m.start()
            out.append(data[i:j])
            c = data[j]
            if c == 0x5c:
                k = j + 1
                if k >= len(data):
                    return b"".join(out), len(data)
                e = data[k]
                if e in ESCAPES:
                    out.append(ESCAPES[e])
                    i = k + 1
                elif 0x30 <= e <= 0x37:
                    end = k
                    while end < len(data) and end < k + 3 and 0x30 <= data[end] <= 0x37:
                        end += 1
                    out.append(bytes([int(data[k:end], 8) & 255]))
                    i = end
                elif e == 0x0d:
                    i = k + 2 if data[k + 1:k + 2] == b"\n" else k + 1
                elif e == 0x0a:
                    i = k + 1
                else:
                    out.append(data[k:k + 1])
                    i = k + 1
            elif c == 0x28:
                depth += 1
                out.append(b"(")
                i = j + 1
            else:
                depth -= 1
                if depth == 0:
                    return b"".join(out), j + 1
                out.append(b")")
                i = j + 1


    def unhex(body):
        body = HEXDIGITS.sub(b"", body)
        if len(body) % 2:
            body += b"0"
        return bytes.fromhex(body.decode("ascii"))


    def unname(raw):
        text = raw[1:].decode("latin-1")
        if "#" in text:
            text = NAME_ESC.sub(lambda m: chr(int(m.group(1), 16)), text)
        return Name(text)


    def number(raw):
        try:
            return float(raw) if b"." in raw else int(raw)
        except ValueError:
            return 0


    def to_dict(items):
        out = dict()
        for k in range(0, len(items) - 1, 2):
            if isinstance(items[k], Name):
                out[str(items[k])] = items[k + 1]
        return out


    def parse(data, i=0, stop_at_keyword=True):
        """Objects from data[i:] up to a keyword at the top level (endobj, stream, ...) or the end:
        (list of top-level values, index of the keyword or the end, the keyword or b'')."""
        stack = [[]]
        n = len(data)
        while i < n:
            m = LEX.match(data, i)
            kind = m.lastgroup
            start, i = i, m.end()
            if kind == "sp" or kind == "bad":
                continue
            top = stack[-1]
            if kind == "num":
                top.append(number(m.group()))
            elif kind == "name":
                top.append(unname(m.group()))
            elif kind == "lit":
                s, i = lit_string(data, i)
                top.append(s)
            elif kind == "hex":
                top.append(unhex(m.group()[1:-1]))
            elif kind == "open":
                stack.append([m.group()])
            elif kind == "close":
                if len(stack) == 1:
                    continue
                items = stack.pop()
                stack[-1].append(to_dict(items[1:]) if items[0] == b"<<" else items[1:])
            else:
                word = m.group()
                if word == b"R" and len(top) >= 2 and type(top[-1]) is int and type(top[-2]) is int:
                    gen = top.pop()
                    top[-1] = Ref(top[-1], gen)
                elif word == b"true" or word == b"false":
                    top.append(word == b"true")
                elif word == b"null":
                    top.append(None)
                elif len(stack) == 1 and stop_at_keyword:
                    return top, start, word
        while len(stack) > 1:
            items = stack.pop()
            stack[-1].append(to_dict(items[1:]) if items[0] == b"<<" else items[1:])
        return stack[0], n, b""


    # ---- filters ----------------------------------------------------------------------------------


    def inflate(data):
        for wbits in (15, -15):
            d = zlib.decompressobj(wbits)
            out = []
            try:
                for k in range(0, len(data), 1 << 16):
                    out.append(d.decompress(data[k:k + (1 << 16)]))
                out.append(d.flush())
            except zlib.error:
                pass
            got = b"".join(out)
            if got or wbits == -15:
                return got
        return b""


    def lzw(data, early=1):
        out, table = bytearray(), [bytes([k]) for k in range(256)] + [b"", b""]
        bits, buf, nbits, prev = 9, 0, 0, None
        for byte in data:
            buf, nbits = (buf << 8) | byte, nbits + 8
            while nbits >= bits:
                nbits -= bits
                code = (buf >> nbits) & ((1 << bits) - 1)
                if code == 256:
                    table, bits, prev = table[:258], 9, None
                    continue
                if code == 257:
                    return bytes(out)
                if code < len(table):
                    entry = table[code]
                    if prev is not None:
                        table.append(prev + entry[:1])
                elif prev is not None:
                    entry = prev + prev[:1]
                    table.append(entry)
                else:
                    continue
                out += entry
                prev = entry
                if len(table) + early >= (1 << bits) and bits < 12:
                    bits += 1
        return bytes(out)


    def ascii85(data):
        data = re.sub(rb"\s", b"", data)
        if data.startswith(b"<~"):
            data = data[2:]
        data = data.split(b"~>")[0]
        out, group = bytearray(), []
        for c in data:
            if c == 0x7a and not group:
                out += b"\0\0\0\0"
                continue
            if not 0x21 <= c <= 0x75:
                continue
            group.append(c - 33)
            if len(group) == 5:
                v = 0
                for g in group:
                    v = v * 85 + g
                out += (v & 0xffffffff).to_bytes(4, "big")
                group = []
        if group:
            n = len(group)
            v = 0
            for g in group + [84] * (5 - n):
                v = v * 85 + g
            out += (v & 0xffffffff).to_bytes(4, "big")[:n - 1]
        return bytes(out)


    def runlength(data):
        out, k = bytearray(), 0
        while k < len(data):
            n = data[k]
            if n == 128:
                break
            if n < 128:
                out += data[k + 1:k + 2 + n]
                k += n + 2
            else:
                out += data[k + 1:k + 2] * (257 - n)
                k += 2
        return bytes(out)


    def unpredict(data, parms):
        predictor = parms.get("Predictor", 1) if isinstance(parms, dict) else 1
        if not isinstance(predictor, int) or predictor < 10:
            return data
        colors = parms.get("Colors", 1) or 1
        bpc = parms.get("BitsPerComponent", 8) or 8
        cols = parms.get("Columns", 1) or 1
        bpp = max(1, colors * bpc // 8)
        row = (cols * colors * bpc + 7) // 8
        out, prev = bytearray(), bytearray(row)
        for k in range(0, len(data), row + 1):
            kind, line = data[k], bytearray(data[k + 1:k + 1 + row])
            line += bytes(row - len(line))
            if kind == 1:
                for x in range(bpp, row):
                    line[x] = (line[x] + line[x - bpp]) & 255
            elif kind == 2:
                for x in range(row):
                    line[x] = (line[x] + prev[x]) & 255
            elif kind == 3:
                for x in range(row):
                    left = line[x - bpp] if x >= bpp else 0
                    line[x] = (line[x] + ((left + prev[x]) >> 1)) & 255
            elif kind == 4:
                for x in range(row):
                    a = line[x - bpp] if x >= bpp else 0
                    b, c = prev[x], prev[x - bpp] if x >= bpp else 0
                    p = a + b - c
                    pa, pb, pc = abs(p - a), abs(p - b), abs(p - c)
                    line[x] = (line[x] + (a if pa <= pb and pa <= pc else b if pb <= pc else c)) & 255
            out += line
            prev = line
        return bytes(out)


    IMAGE_FILTERS = ("DCTDecode", "DCT", "JPXDecode", "CCITTFaxDecode", "CCF", "JBIG2Decode", "Crypt")


    # ---- encryption: the standard security handler, opened without a password ----------------------

    PASSWORD_PAD = bytes.fromhex("28BF4E5E4E758A4164004E56FFFA01082E2E00B6D0683E802F0CA9FE6453697A")


    def rc4(key, data):
        s, j = list(range(256)), 0
        for i in range(256):
            j = (j + s[i] + key[i % len(key)]) & 255
            s[i], s[j] = s[j], s[i]
        out, i, j = bytearray(len(data)), 0, 0
        for k, byte in enumerate(data):
            i = (i + 1) & 255
            j = (j + s[i]) & 255
            s[i], s[j] = s[j], s[i]
            out[k] = byte ^ s[(s[i] + s[j]) & 255]
        return bytes(out)


    class Aes(object):
        """AES (FIPS-197) with a 16- or 32-byte key: CBC decryption for streams, CBC encryption for
        the revision 6 password hash."""
        tables = None

        @classmethod
        def _tables(cls):
            if cls.tables:
                return cls.tables
            exp, log, x = [0] * 510, [0] * 256, 1
            for i in range(255):
                exp[i], log[x] = x, i
                x ^= (x << 1) ^ (0x11B if x & 0x80 else 0)
            for i in range(255, 510):
                exp[i] = exp[i - 255]

            def mul(a, b):
                return exp[log[a] + log[b]] if a and b else 0

            sbox, inv = [0] * 256, [0] * 256
            for a in range(256):
                b = exp[255 - log[a]] if a else 0
                s = b ^ 0x63
                for k in range(1, 5):
                    s ^= ((b << k) | (b >> (8 - k))) & 255
                sbox[a], inv[s] = s, a
            te, td = [[0] * 256 for _ in range(4)], [[0] * 256 for _ in range(4)]
            for a in range(256):
                s, r = sbox[a], inv[a]
                w = (mul(s, 2) << 24) | (s << 16) | (s << 8) | mul(s, 3)
                v = (mul(r, 14) << 24) | (mul(r, 9) << 16) | (mul(r, 13) << 8) | mul(r, 11)
                for k in range(4):
                    te[k][a], td[k][a] = w, v
                    w, v = ((w >> 8) | (w << 24)) & 0xFFFFFFFF, ((v >> 8) | (v << 24)) & 0xFFFFFFFF
            cls.tables = (sbox, inv, te, td)
            return cls.tables

        def __init__(self, key):
            sbox, inv, te, td = self._tables()
            nk = len(key) // 4
            self.rounds = nr = nk + 6
            w, rcon = list(struct.unpack(">%dI" % nk, key)), 1

            def sub(t):
                return sbox[t >> 24] << 24 | sbox[(t >> 16) & 255] << 16 | sbox[(t >> 8) & 255] << 8 | sbox[t & 255]

            for i in range(nk, 4 * (nr + 1)):
                t = w[i - 1]
                if i % nk == 0:
                    t = sub(((t << 8) | (t >> 24)) & 0xFFFFFFFF) ^ (rcon << 24)
                    rcon = (rcon << 1) ^ (0x11B if rcon & 0x80 else 0)
                elif nk > 6 and i % nk == 4:
                    t = sub(t)
                w.append(w[i - nk] ^ t)
            self.ek, self.dk = w, []
            for r in range(nr, -1, -1):
                words = w[4 * r:4 * r + 4]
                if 0 < r < nr:
                    words = [td[0][sbox[x >> 24]] ^ td[1][sbox[(x >> 16) & 255]] ^ td[2][sbox[(x >> 8) & 255]]
                             ^ td[3][sbox[x & 255]] for x in words]
                self.dk.extend(words)

        def encrypt_block(self, s0, s1, s2, s3):
            sbox, _, (t0, t1, t2, t3), _ = self.tables
            ek = self.ek
            s0, s1, s2, s3, k = s0 ^ ek[0], s1 ^ ek[1], s2 ^ ek[2], s3 ^ ek[3], 4
            for _ in range(self.rounds - 1):
                s0, s1, s2, s3 = (
                    t0[s0 >> 24] ^ t1[(s1 >> 16) & 255] ^ t2[(s2 >> 8) & 255] ^ t3[s3 & 255] ^ ek[k],
                    t0[s1 >> 24] ^ t1[(s2 >> 16) & 255] ^ t2[(s3 >> 8) & 255] ^ t3[s0 & 255] ^ ek[k + 1],
                    t0[s2 >> 24] ^ t1[(s3 >> 16) & 255] ^ t2[(s0 >> 8) & 255] ^ t3[s1 & 255] ^ ek[k + 2],
                    t0[s3 >> 24] ^ t1[(s0 >> 16) & 255] ^ t2[(s1 >> 8) & 255] ^ t3[s2 & 255] ^ ek[k + 3])
                k += 4
            return (
                (sbox[s0 >> 24] << 24 | sbox[(s1 >> 16) & 255] << 16 | sbox[(s2 >> 8) & 255] << 8 | sbox[s3 & 255]) ^ ek[k],
                (sbox[s1 >> 24] << 24 | sbox[(s2 >> 16) & 255] << 16 | sbox[(s3 >> 8) & 255] << 8 | sbox[s0 & 255]) ^ ek[k + 1],
                (sbox[s2 >> 24] << 24 | sbox[(s3 >> 16) & 255] << 16 | sbox[(s0 >> 8) & 255] << 8 | sbox[s1 & 255]) ^ ek[k + 2],
                (sbox[s3 >> 24] << 24 | sbox[(s0 >> 16) & 255] << 16 | sbox[(s1 >> 8) & 255] << 8 | sbox[s2 & 255]) ^ ek[k + 3])

        def cbc_encrypt(self, iv, data):
            """Whole blocks, no padding."""
            words, (c0, c1, c2, c3), out = struct.unpack(">%dI" % (len(data) // 4), data), struct.unpack(">4I", iv), []
            for b in range(0, len(words), 4):
                c0, c1, c2, c3 = self.encrypt_block(words[b] ^ c0, words[b + 1] ^ c1, words[b + 2] ^ c2, words[b + 3] ^ c3)
                out.extend((c0, c1, c2, c3))
            return struct.pack(">%dI" % len(out), *out)

        def cbc_decrypt(self, iv, data):
            """Whole blocks; a stray tail shorter than a block is dropped."""
            data = data[:len(data) // 16 * 16]
            if not data:
                return b""
            _, inv, _, (t0, t1, t2, t3) = self.tables
            dk, words, out = self.dk, struct.unpack(">%dI" % (len(data) // 4), data), []
            for b in range(0, len(words), 4):
                s0, s1, s2, s3, k = words[b] ^ dk[0], words[b + 1] ^ dk[1], words[b + 2] ^ dk[2], words[b + 3] ^ dk[3], 4
                for _ in range(self.rounds - 1):
                    s0, s1, s2, s3 = (
                        t0[s0 >> 24] ^ t1[(s3 >> 16) & 255] ^ t2[(s2 >> 8) & 255] ^ t3[s1 & 255] ^ dk[k],
                        t0[s1 >> 24] ^ t1[(s0 >> 16) & 255] ^ t2[(s3 >> 8) & 255] ^ t3[s2 & 255] ^ dk[k + 1],
                        t0[s2 >> 24] ^ t1[(s1 >> 16) & 255] ^ t2[(s0 >> 8) & 255] ^ t3[s3 & 255] ^ dk[k + 2],
                        t0[s3 >> 24] ^ t1[(s2 >> 16) & 255] ^ t2[(s1 >> 8) & 255] ^ t3[s0 & 255] ^ dk[k + 3])
                    k += 4
                out.extend((
                    (inv[s0 >> 24] << 24 | inv[(s3 >> 16) & 255] << 16 | inv[(s2 >> 8) & 255] << 8 | inv[s1 & 255]) ^ dk[k],
                    (inv[s1 >> 24] << 24 | inv[(s0 >> 16) & 255] << 16 | inv[(s3 >> 8) & 255] << 8 | inv[s2 & 255]) ^ dk[k + 1],
                    (inv[s2 >> 24] << 24 | inv[(s1 >> 16) & 255] << 16 | inv[(s0 >> 8) & 255] << 8 | inv[s3 & 255]) ^ dk[k + 2],
                    (inv[s3 >> 24] << 24 | inv[(s2 >> 16) & 255] << 16 | inv[(s1 >> 8) & 255] << 8 | inv[s0 & 255]) ^ dk[k + 3]))
            plain = struct.pack(">%dI" % len(out), *out)
            chain = iv + data[:-16]
            return (int.from_bytes(plain, "big") ^ int.from_bytes(chain, "big")).to_bytes(len(plain), "big")


    def unpad(data):
        n = data[-1] if data else 0
        return data[:-n] if 1 <= n <= 16 and data.endswith(bytes([n]) * n) else data


    def hash_r6(password, salt, udata):
        """The revision 6 password hash (ISO 32000-2, algorithm 2.B)."""
        k, i = hashlib.sha256(password + salt + udata).digest(), 0
        while True:
            e = Aes(k[:16]).cbc_encrypt(k[16:32], (password + k + udata) * 64)
            k = (hashlib.sha256, hashlib.sha384, hashlib.sha512)[sum(e[:16]) % 3](e).digest()
            i += 1
            if i >= 64 and e[-1] <= i - 32:
                return k[:32]


    class Security(object):
        """An encrypted PDF opened the way any viewer opens it: the standard security handler with
        the empty user password. note says why its text stays unread: 'password' (it needs one),
        'no-copy' (its publisher does not allow copying its text) or 'encrypted' (another handler)."""

        def __init__(self, doc, enc, ids):
            self.note, self.key, self.cipher, self.streams = "", b"", "", True
            try:
                self._open(doc, enc, ids)
            except Exception:
                self.note = "encrypted"

        def _open(self, doc, enc, ids):
            get = doc.get
            if not isinstance(enc, dict) or get(enc.get("Filter")) != "Standard":
                self.note = "encrypted"
                return
            v, r, p = get(enc.get("V")) or 0, get(enc.get("R")) or 0, get(enc.get("P"))
            o, u = get(enc.get("O")) or b"", get(enc.get("U")) or b""
            p = p if isinstance(p, int) else 0
            if v >= 4:
                cf, stmf = get(enc.get("CF")), get(enc.get("StmF")) or "Identity"
                cfd = get(cf.get(stmf)) if isinstance(cf, dict) else None
                cfm = get(cfd.get("CFM")) if isinstance(cfd, dict) else None
                self.streams = stmf != "Identity" and cfm not in (None, "None")
                self.cipher = {"V2": "rc4", "AESV2": "aes", "AESV3": "aes"}.get(cfm, "") if self.streams else "none"
            else:
                self.cipher = "rc4"
            if r >= 5:
                u = bytes(u[:48])
                if r == 5:
                    ok = hashlib.sha256(u[32:40]).digest() == u[:32]
                    inter = hashlib.sha256(u[40:48]).digest()
                else:
                    ok = hash_r6(b"", u[32:40], b"") == u[:32]
                    inter = hash_r6(b"", u[40:48], b"") if ok else b""
                if ok:
                    self.key = Aes(inter).cbc_decrypt(bytes(16), bytes(get(enc.get("UE")) or b"")[:32])
            else:
                n = 5 if r == 2 else max(5, min(16, (get(enc.get("Length")) or 40) // 8 if v in (2, 3) else 16))
                id0 = ids[0] if isinstance(ids, list) and ids and isinstance(ids[0], bytes) else b""
                h = hashlib.md5(PASSWORD_PAD + bytes(o[:32]) + struct.pack("<i", p if p < 2 ** 31 else p - 2 ** 32) + id0)
                if r >= 4 and get(enc.get("EncryptMetadata")) is False:
                    h.update(b"\xff\xff\xff\xff")
                key = h.digest()[:n]
                if r >= 3:
                    for _ in range(50):
                        key = hashlib.md5(key).digest()[:n]
                    x = rc4(key, hashlib.md5(PASSWORD_PAD + id0).digest())
                    for i in range(1, 20):
                        x = rc4(bytes(b ^ i for b in key), x)
                    ok = x == bytes(u[:16])
                else:
                    ok = rc4(key, PASSWORD_PAD) == bytes(u[:32])
                self.key = key if ok else b""
            if not self.key:
                self.note = "password"
            elif not p & 16:    # bit 5: copy or otherwise extract text and graphics
                self.note, self.key = "no-copy", b""
            elif not self.cipher:
                self.note, self.key = "encrypted", b""

        def stream(self, stream, data):
            if not self.streams or stream.dict.get("Type") == "XRef":
                return data
            if len(self.key) == 32:
                return unpad(Aes(self.key).cbc_decrypt(data[:16], data[16:]))
            salt = b"sAlT" if self.cipher == "aes" else b""
            key = hashlib.md5(self.key + struct.pack("<I", stream.num)[:3] + struct.pack("<I", stream.gen)[:2]
                              + salt).digest()[:min(len(self.key) + 5, 16)]
            if self.cipher == "aes":
                return unpad(Aes(key).cbc_decrypt(data[:16], data[16:]))
            return rc4(key, data)


    # ---- the document -----------------------------------------------------------------------------


    class Document(object):
        def __init__(self, data):
            self.data, self.security = data, None
            self.objects, self.where, self.trailers = dict(), dict(), []
            self._scan()

        def _scan(self):
            data, pos = self.data, 0
            streams = []
            while True:
                m = OBJ.search(data, pos)
                if not m:
                    break
                num, gen, at = int(m.group(1)), int(m.group(2)), m.start()
                values, end, word = parse(data, m.end())
                if word == b"obj":    # no endobj: the next object's header ended this one
                    values, pos = values[:-2], m.end()
                else:
                    pos = end + len(word) if word else end
                value = values[0] if values else None
                if word == b"stream" and isinstance(value, dict):
                    s = end + 6
                    if data[s:s + 2] == b"\r\n":
                        s += 2
                    elif data[s:s + 1] in (b"\n", b"\r"):
                        s += 1
                    length, e = value.get("Length"), -1
                    if isinstance(length, int) and length >= 0 and \
                            data[s + length:s + length + 40].lstrip().startswith(b"endstream"):
                        e = s + length
                    else:
                        e = data.find(b"endstream", s)
                        if e < 0:
                            e = len(data)
                        while e > s and data[e - 1:e] in (b"\n", b"\r"):
                            e -= 1
                    value = Stream(value, data[s:e], num, gen)
                    pos = e
                    if value.dict.get("Type") == "ObjStm":
                        streams.append((at, value))
                    if value.dict.get("Type") == "XRef":
                        self.trailers.append((at, value.dict))
                self._put(num, value, at)
            for m in re.finditer(rb"trailer\s*<<", data):
                values, _, _ = parse(data, m.end() - 2)
                if values and isinstance(values[0], dict):
                    self.trailers.append((m.start(), values[0]))
            last = [t for _, t in sorted(self.trailers, key=lambda x: x[0]) if "Encrypt" in t]
            if last:
                self.security = Security(self, self.get(last[-1].get("Encrypt")), self.get(last[-1].get("ID")))
            for at, stream in streams:
                self._unpack(at, stream)

        def _put(self, num, value, at):
            if num not in self.where or at >= self.where[num]:
                self.objects[num], self.where[num] = value, at

        def _unpack(self, at, stream):
            data = self.decode(stream)
            first, count = stream.dict.get("First"), stream.dict.get("N")
            if not data or not isinstance(first, int) or not isinstance(count, int):
                return
            head = parse(data[:first], 0, False)[0]
            pairs = [(head[k], head[k + 1]) for k in range(0, min(len(head) - 1, 2 * count), 2)]
            for k, (num, off) in enumerate(pairs):
                if not isinstance(num, int) or not isinstance(off, int):
                    continue
                end = pairs[k + 1][1] if k + 1 < len(pairs) and isinstance(pairs[k + 1][1], int) else len(data) - first
                values = parse(data[first + off:first + end], 0, False)[0]
                if values:
                    self._put(num, values[0], at)

        def get(self, value, depth=0):
            while isinstance(value, Ref) and depth < 32:
                value, depth = self.objects.get(value.num), depth + 1
            return value

        def decode(self, stream):
            """A stream's decoded bytes, or b'' for images and filters this reader can't undo."""
            if not isinstance(stream, Stream):
                return b""
            if stream._data is not None:
                return stream._data
            filters = self.get(stream.dict.get("Filter"))
            parms = self.get(stream.dict.get("DecodeParms"))
            filters = filters if isinstance(filters, list) else [filters] if filters else []
            parms = parms if isinstance(parms, list) else [parms] * len(filters)
            data = stream.raw
            if self.security is not None:
                data = self.security.stream(stream, data) if self.security.key else b""
            for k, f in enumerate(self.get(f) for f in filters):
                p = self.get(parms[k]) if k < len(parms) else None
                p = p if isinstance(p, dict) else dict()
                if f in ("FlateDecode", "Fl"):
                    data = unpredict(inflate(data), p)
                elif f in ("LZWDecode", "LZW"):
                    data = unpredict(lzw(data, p.get("EarlyChange", 1)), p)
                elif f in ("ASCIIHexDecode", "AHx"):
                    data = unhex(data.split(b">")[0])
                elif f in ("ASCII85Decode", "A85"):
                    data = ascii85(data)
                elif f in ("RunLengthDecode", "RL"):
                    data = runlength(data)
                else:
                    data = b""
                    break
            stream._data = data
            return data

        def pages(self):
            """[(page dict, resources)] in page order (all page objects if the page tree is broken)."""
            roots = [self.get(t.get("Root")) for _, t in sorted(self.trailers, key=lambda x: x[0])]
            roots = [r for r in roots if isinstance(r, dict)]
            if not roots:
                roots = self._of_type("Catalog")
            out, seen = [], set()
            if roots:
                self._walk(roots[-1].get("Pages"), None, out, seen, 0)
            if not out:
                out = [(o, self.get(o.get("Resources"))) for o in self._of_type("Page")]
            return out

        def _of_type(self, kind):
            """The objects of one /Type in file order (the objects packed in one stream by number)."""
            return [self.objects[n] for n in sorted(self.objects, key=lambda n: (self.where[n], n))
                    if isinstance(self.objects[n], dict) and self.objects[n].get("Type") == kind]

        def _walk(self, node, resources, out, seen, depth):
            node = self.get(node)
            if not isinstance(node, dict) or id(node) in seen or depth > 64:
                return
            seen.add(id(node))
            res = self.get(node.get("Resources"))
            res = res if isinstance(res, dict) else resources
            kids = self.get(node.get("Kids"))
            if isinstance(kids, list) and node.get("Type") != "Page":
                for kid in kids:
                    self._walk(kid, res, out, seen, depth + 1)
            elif node.get("Type") == "Page" or "Contents" in node:
                out.append((node, res))


