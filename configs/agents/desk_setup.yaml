# @description DESK CHECK step 0 (product role). No model. Writes the run's input (state/desk/
# input.md: the hypothesis, the evidence rules - fixed ones and the defaults a bar may set aside
# in its own words - and every assumption with its pass and kill bars; one file per
# assumption in state/desk/assumptions/) and two helpers into state/desk/: cite.py (exact page
# text through curl's default user agent, PDFs through pdftotext, every page read kept in
# state/desk/pages/; public datasets downloaded whole into state/desk/data/) and check_desk.py
# (the mechanical check, run by the researchers, the synthesizer and desk_final). Clears the
# previous run's files first (state/desk/history/ is left alone). Prints the assumption slots
# (A1..An) that decide which researcher slots run. Part of workflows/desk_check.yaml.
# From the command line, run it with --workspace <folder>: without it `temper run` gives script
# steps no workspace_path, and this step stops rather than write into the home folder.
# POSIX sh. No dollar-brace env syntax anywhere in this file (config-loader substitution) and
# no Jinja delimiters inside the helpers.
agent:
  name: desk_setup
  version: 1
  type: script
  timeout_seconds: 60
  script_template: |
    #!/bin/sh
    set -e
    WS={{ workspace_path }}
    if [ -z "$WS" ]; then echo "desk_check needs a workspace: run it with --workspace <folder>" >&2; exit 1; fi
    cd "$WS"
    mkdir -p state/desk
    PY=python3
    command -v python3 >/dev/null 2>&1 || PY="$TEMPER_PYTHON"
    "$PY" - <<'PYEOF'
    import ast
    import json
    import os
    import shutil
    import time

    DESK = os.path.join("state", "desk")
    hypothesis = (os.environ.get("{{ hypothesis | env }}") or "").strip()
    raw = (os.environ.get("{{ assumptions | env }}") or "").strip()
    if not hypothesis or not raw:
        raise SystemExit("desk_check needs two inputs: hypothesis and assumptions")
    try:
        items = json.loads(raw)
    except ValueError:
        try:
            items = ast.literal_eval(raw)    # the CLI parses a JSON input into a list
        except (ValueError, SyntaxError):
            raise SystemExit("assumptions must be a JSON list")
    if isinstance(items, str):
        items = json.loads(items)
    if not isinstance(items, list) or not 1 <= len(items) <= 6:
        raise SystemExit("assumptions: a list of 1 to 6 entries")
    for n, item in enumerate(items, 1):
        if not isinstance(item, dict):
            raise SystemExit("assumption %d is not an object" % n)
        if str(item.get("id", "")).strip() != "A%d" % n:
            raise SystemExit("assumption %d: its id must be A%d (ids A1..An in order)" % (n, n))
        for key in ("assumption", "pass_if", "kill_if"):
            if not str(item.get(key) or "").strip():
                raise SystemExit("assumption A%d has no %s" % (n, key))

    for sub in ("assumptions", "checks", "pages", "data", "work"):
        shutil.rmtree(os.path.join(DESK, sub), ignore_errors=True)
        os.makedirs(os.path.join(DESK, sub))
    for name in ("report.json", "report.md", "input.md", "setup.json"):
        if os.path.exists(os.path.join(DESK, name)):
            os.remove(os.path.join(DESK, name))

    # The evidence rules check_desk.py applies to a pass or a kill. The bar governs: D1-D3 are
    # defaults, held only where an assumption's own pass or kill words are silent on them.
    rules = [
        "## Evidence rules",
        "",
        "Each assumption is judged by its own pass and kill bars, below. state/desk/check_desk.py "
        "checks every pass or kill against these rules.",
        "",
        "Fixed, whatever the bar says:",
        "- F1 checkable claims: every claim has a URL, a date and its tags (quality, party, how); "
        "a quoted claim's words are on the page cite.py kept; a counted claim's script, run again, "
        "prints its result.",
        "- F2 no listicles or snippets: listicles and search-snippet claims never count as support.",
        "- F3 one checked claim: a pass or a kill rests on at least one usable decisive claim read "
        "with cite.py or counted from a public dataset (a WebFetch summary has no checked quote).",
        "",
        "Defaults, held only where an assumption's own bar is silent on them:",
        "- D1 two sources: a pass or a kill rests on at least 2 usable decisive claims from at "
        "least 2 different sources.",
        "- D2 a neutral source: the F3 claim comes from a party with no stake in the answer, not "
        "a company about its own product, a vendor about its own results or a group about its "
        "own cause.",
        "- D3 a primary source: the F3 claim is the original document (the study, the dataset, "
        "the company's own page about its own product), not a report about it.",
        "",
        "A bar sets a default aside only by saying so in its own pass or kill words, for example "
        "\"the operator's own stated figure counts\" (D2), \"one source is enough\" (D1) or "
        "\"a trade-press report of the figure counts\" (D3). A verdict that relies on that names "
        "the default and quotes those words (rules.set_aside). The hypothesis, the pointers and a "
        "researcher's or reviewer's judgement never set a default aside. A verdict held at unknown "
        "because its evidence meets the bar's words but not a default names that default "
        "(rules.decided_by).",
        "",
    ]
    parts = ["# Desk check input", "", "Written by desk_setup, " + time.strftime("%Y-%m-%d %H:%M %Z") + ".",
             "", "## Hypothesis", "", hypothesis, ""] + rules + [
             "## Assumptions (bars fixed before the run: judge against them as written, never move them)", ""]
    slots = []
    for item in items:
        slot = "A%d" % (len(slots) + 1)
        slots.append(slot)
        entry = {
            "id": slot,
            "assumption": str(item["assumption"]).strip(),
            "pass_if": str(item["pass_if"]).strip(),
            "kill_if": str(item["kill_if"]).strip(),
            "fatal": item.get("fatal", True) is not False,
            "pointers": item.get("pointers") or [],
        }
        if isinstance(entry["pointers"], str):
            entry["pointers"] = [entry["pointers"]]
        with open(os.path.join(DESK, "assumptions", slot + ".json"), "w", encoding="utf-8") as f:
            json.dump(entry, f, indent=1)
        parts += ["### %s. %s" % (slot, entry["assumption"]), "",
                  "- Pass if: " + entry["pass_if"],
                  "- Kill if: " + entry["kill_if"],
                  "- Fatal: " + ("yes, a kill ends the hypothesis" if entry["fatal"] else "no"),
                  ]
        parts += ["- Pointer: " + str(p) for p in entry["pointers"]]
        parts.append("")
    with open(os.path.join(DESK, "input.md"), "w", encoding="utf-8") as f:
        f.write("\n".join(parts))
    with open(os.path.join(DESK, "setup.json"), "w", encoding="utf-8") as f:
        json.dump({"status": "completed", "input_path": "state/desk/input.md", "slots": slots,
                   "helpers": ["state/desk/cite.py", "state/desk/check_desk.py"]}, f)
    PYEOF
    cat > state/desk/cite.py <<'CITEEOF'
    #!/usr/bin/env python3
    """Exact page text for citing, and public datasets for counting (desk_check). Plain curl with
    its default user agent; PDFs through pdftotext. A page or file that doesn't answer 200 is
    INACCESSIBLE: log it and move on, never work around it. Run from the workspace root.

      python3 state/desk/cite.py page <url> [kw1,kw2]   status, dates on the page, text near the keywords
      python3 state/desk/cite.py quote <url> "<words>"  FOUND / NOT FOUND: are these exact words on the page?
      python3 state/desk/cite.py data <url> <name>      download a public dataset whole to state/desk/data/<name>

    Every page read is kept in state/desk/pages/ (first line: its URL, HTTP code and fetch time;
    then the text) so its words can be checked later. A dataset keeps its own record next to it
    (<name>.meta.json: URL, HTTP code, fetch time, size), which the check reads.
    """
    import hashlib
    import html
    import json
    import os
    import re
    import subprocess
    import sys
    import time

    HERE = os.path.dirname(os.path.abspath(__file__))
    PAGES = os.path.join(HERE, "pages")
    DATA = os.path.join(HERE, "data")
    META_DATE = (r"(?:datePublished|dateModified|published_time|modified_time|updated_time|"
                 r"dateCreated)[^0-9<>]{0,40}(\d{4}-\d{2}-\d{2})")
    TEXT_DATE = (r"(?i)\b(last updated|last modified|updated|effective(?: date)?|published|posted|"
                 r"release date|revised)\s*(?:on|:)?\s*([A-Z][a-z]{2,8}\.? \d{1,2},? \d{4}|"
                 r"\d{4}-\d{2}-\d{2}|\d{1,2}/\d{1,2}/\d{2,4})")


    def norm(s):
        for a, b in (("\u2019", "'"), ("\u2018", "'"), ("\u201c", '"'), ("\u201d", '"'),
                     ("\u2013", "-"), ("\u2014", "-"), ("\u00a0", " ")):
            s = s.replace(a, b)
        return re.sub(r"\s+", " ", s).strip()


    def pdf_text(path):
        try:
            out = subprocess.run(["pdftotext", "-layout", path, "-"], capture_output=True,
                                 timeout=120)
            return norm(out.stdout.decode("utf-8", "replace")), ""
        except (OSError, subprocess.TimeoutExpired):
            return "", ("PDF but no pdftotext here: read it with WebFetch and tag its claims "
                        "how: webfetch, with no quote")


    def html_text(raw):
        body = raw.decode("utf-8", "replace")
        dates = set(re.findall(META_DATE, body))
        dates |= set(re.findall(r'<time[^>]*datetime="(\d{4}-\d{2}-\d{2})', body))
        body = re.sub(r"(?is)<(script|style|noscript|svg)[^>]*>.*?</(script|style|noscript|svg)>",
                      " ", body)
        text = norm(html.unescape(re.sub(r"<[^>]+>", " ", body)))
        return text, sorted(dates)


    def curl(url, dest, max_time):
        out = subprocess.run(["curl", "-sS", "-L", "--compressed", "--max-time", str(max_time),
                              "--max-filesize", "400000000", "-o", dest,
                              "-w", "%{http_code}\t%{content_type}\t%{url_effective}", url],
                             capture_output=True, text=True)
        code, ctype, final = (out.stdout.split("\t") + ["", "", ""])[:3]
        meta = {"url": url, "final_url": final or url, "http": code or "000",
                "content_type": ctype, "fetched": time.strftime("%Y-%m-%d %H:%M %Z")}
        if meta["http"] != "200" and out.stderr.strip():
            meta["error"] = out.stderr.strip()[:200]
        return meta


    def fetch(url):
        os.makedirs(PAGES, exist_ok=True)
        path = os.path.join(PAGES, hashlib.sha1(url.encode()).hexdigest()[:16] + ".txt")
        if os.path.exists(path):
            with open(path, encoding="utf-8") as f:
                head, _, text = f.read().partition("\n")
            return json.loads(head), text
        raw_path = "%s.%d.raw" % (path, os.getpid())
        meta = curl(url, raw_path, 45)
        text = ""
        if meta["http"] == "200" and os.path.exists(raw_path):
            with open(raw_path, "rb") as f:
                raw = f.read()
            if "pdf" in meta["content_type"].lower() or raw[:5] == b"%PDF-":
                text, note = pdf_text(raw_path)
                meta["pdf"] = True
            else:
                text, meta["dates_on_page"] = html_text(raw)
                note = ""
            meta["dated_text"] = ["%s %s" % pair for pair in re.findall(TEXT_DATE, text)[:6]]
            if not note and not text.strip():
                note = ("200 but no readable text (a script-only page?): read it with WebFetch "
                        "and tag its claims how: webfetch, with no quote")
            if note:
                meta["note"] = note
        if os.path.exists(raw_path):
            os.remove(raw_path)
        if meta["http"] == "200" or meta["http"].startswith("4"):
            # Kept, so its words can be checked later and a block is never asked twice. A timeout
            # or a server error is not kept. Researchers run side by side: write whole, then move.
            tmp = "%s.%d.tmp" % (path, os.getpid())
            with open(tmp, "w", encoding="utf-8") as f:
                f.write(json.dumps(meta) + "\n" + text[:3000000])
            os.replace(tmp, path)
        return meta, text


    def header(meta):
        print("HTTP", meta["http"], meta.get("final_url"), "|", meta.get("content_type", ""),
              "| fetched", meta.get("fetched"))
        if meta["http"] != "200":
            print("-> INACCESSIBLE (%s): log it, never work around it" % meta.get("error", "status"))
            return False
        if meta.get("dates_on_page") or meta.get("dated_text"):
            print("dates on page:", meta.get("dates_on_page", []), meta.get("dated_text", []))
        if meta.get("note"):
            print("->", meta["note"])
        return True


    def page(url, keywords=""):
        meta, text = fetch(url)
        if not header(meta):
            return
        kws = [k.strip() for k in keywords.split(",") if k.strip()]
        if not kws:
            print(text[:5000])
            return
        spots = sorted(m.start() for k in kws for m in re.finditer(re.escape(k), text, re.I))
        hits, shown_to = 0, -1
        for pos in spots:
            if pos < shown_to:
                continue
            print("...", text[max(0, pos - 350):pos + 450], "...")
            shown_to, hits = pos + 450, hits + 1
            if hits >= 12:
                break
        print("keyword hits shown:", hits, "of", len(spots), "| page length", len(text))


    def quote(url, words):
        meta, text = fetch(url)
        if not header(meta):
            return
        want = norm(words).lower()
        flat = norm(text)
        at = flat.lower().find(want)
        if at < 0:
            print("NOT FOUND on the page: don't cite these words; quote what the page says")
            return
        print("FOUND: ..." + flat[max(0, at - 200):at + len(want) + 200] + "...")


    def data(url, name):
        if not re.match(r"^[A-Za-z0-9][A-Za-z0-9._-]{0,80}$", name) or name.endswith(".meta.json"):
            print("name: letters, digits, dots, dashes and underscores (e.g. hospital_owners.csv)")
            return
        os.makedirs(DATA, exist_ok=True)
        path = os.path.join(DATA, name)
        meta_path = path + ".meta.json"
        if os.path.exists(meta_path):
            with open(meta_path, encoding="utf-8") as f:
                meta = json.load(f)
            if meta.get("url") != url:
                print("state/desk/data/%s holds another URL (%s): pick another name" % (name, meta.get("url")))
                return
            print("already fetched:", json.dumps(meta))
            return
        part = "%s.%d.part" % (path, os.getpid())
        meta = curl(url, part, 600)
        if meta["http"] == "200" and os.path.exists(part):
            os.replace(part, path)
            digest = hashlib.sha1()
            lines = 0
            with open(path, "rb") as f:
                for chunk in iter(lambda: f.read(1 << 20), b""):
                    digest.update(chunk)
                    lines += chunk.count(b"\n")
            meta.update({"file": "state/desk/data/" + name, "bytes": os.path.getsize(path),
                         "lines": lines, "sha1": digest.hexdigest()})
        elif os.path.exists(part):
            os.remove(part)
        with open(meta_path, "w", encoding="utf-8") as f:
            json.dump(meta, f, indent=1)
        if not header(meta):
            return
        print("saved state/desk/data/%s: %d bytes, %d lines" % (name, meta["bytes"], meta["lines"]))
        with open(path, "rb") as f:
            head = f.read(4000).decode("utf-8", "replace").splitlines()
        for line in head[:5]:
            print("  " + line[:400])


    def main(argv):
        if len(argv) > 2 and argv[1] == "page":
            page(argv[2], argv[3] if len(argv) > 3 else "")
        elif len(argv) > 3 and argv[1] == "quote":
            quote(argv[2], argv[3])
        elif len(argv) > 3 and argv[1] == "data":
            data(argv[2], argv[3])
        else:
            print(__doc__)


    if __name__ == "__main__":
        main(sys.argv)
    CITEEOF
    cat > state/desk/check_desk.py <<'CHECKEOF'
    #!/usr/bin/env python3
    """Mechanical check of a desk check (desk_check workflow). Run from the workspace root.

      python3 state/desk/check_desk.py           everything written so far, one problem per line
      python3 state/desk/check_desk.py A2        one assumption's file only (a researcher's own check)
      python3 state/desk/check_desk.py --final   the whole check as one JSON object (the last step)

    Per assumption (state/desk/checks/<id>.json): a verdict, pass, kill or unknown, with its
    reason and how the evidence compares with each bar. The bar governs, and the evidence rules
    (input.md lists them) apply to a pass or a kill: fixed F3, at least one usable decisive claim
    read with cite.py or counted from a dataset; and the defaults, held only where the
    assumption's own bar is silent on them: D1, at least 2 usable decisive claims from at least 2
    sources; D2 and D3, that one of the F3 claims is from a neutral party (D2) and primary (D3).
    Each verdict states its rules: set_aside, each default the bar sets aside, quoting the bar's
    own words (found in its pass_if or kill_if), and decided_by, each default that held an
    unknown back (the decisive claims must really fail it). An unknown says what was looked for
    and the next cheapest test. Every claim has a URL and a date; a quoted claim's words are on
    the page cite.py kept; a counted claim's datasets were fetched with cite.py and its script,
    run again, prints the claimed result. Listicles and search snippets never count as support.
    The report (state/desk/report.json) covers every assumption, says why a verdict changed, and
    its hypothesis status follows from the verdicts. The final output lists each verdict's
    decisive claims and rules for the person who re-reads them by hand: whether a verdict follows
    from its sources, and whether the quoted bar words really set a default aside, is that
    person's call, not this script's.

    An assumption whose researcher left no usable output fails by name: its checks/<id>.json and
    .md missing, empty, not valid JSON or an account-limit message. With --final, each
    researcher's final answer, which the workflow passes in as --answer <id>=<environment
    variable>, must not be such a message either (an account limit can end a researcher's turn
    with "You've hit your session limit" and nothing else).
    """
    import glob
    import hashlib
    import json
    import os
    import re
    import subprocess
    import sys

    DESK = os.path.dirname(os.path.abspath(__file__))
    ROOT = os.path.dirname(os.path.dirname(DESK))
    VERDICTS = ("pass", "kill", "unknown")
    STATUSES = ("holds", "open", "killed")
    QUALITIES = ("primary", "secondary", "vendor", "listicle")
    HOWS = ("cite", "data", "webfetch", "snippet")
    CONFIDENCE = ("low", "med", "high")
    # The evidence rules a bar may set aside in its own words (input.md lists them all).
    DEFAULT_RULES = ("D1", "D2", "D3")
    # What a part says when its account or the service stopped it, instead of research.
    NON_ANSWER = re.compile(
        r"session limit|usage limit|weekly limit|daily limit|rate[ _-]?limit|limit (?:reached|exceeded)"
        r"|hit (?:your|the) (?:\w+ )?limit|quota|overloaded|too many requests|credit balance"
        r"|pool exhausted|try again later|resets? (?:at |in |on )?\d|api error|authentication_error"
        r"|oauth token|not logged in|/login|invalid api key|out of (?:extra )?usage|prompt is too long"
        r"|\Aerror: ",  # the Claude provider's failed call: "Error: <stderr>", "Error: Claude Code CLI timed out"
        re.I)
    # The Claude provider's other failed call, whatever its length: "[claude_code error] stream ended
    # with no result event: <stderr>". Its finish_reason "error" is not read yet (temper #55).
    PROVIDER_ERROR = re.compile(r"\[claude_code error\]", re.I)
    NOT_PASSED = "__unwired__"  # what the workflow passes for an answer it could not find


    def norm(s):
        for a, b in (("\u2019", "'"), ("\u2018", "'"), ("\u201c", '"'), ("\u201d", '"'),
                     ("\u2013", "-"), ("\u2014", "-"), ("\u00a0", " ")):
            s = s.replace(a, b)
        return re.sub(r"\s+", " ", s).strip()


    def text_of(value):
        return value.strip() if isinstance(value, str) else ""


    def load_json(path):
        try:
            with open(path, encoding="utf-8") as f:
                return json.load(f), ""
        except FileNotFoundError:
            return None, "missing"
        except ValueError as exc:
            return None, "not valid JSON (%s)" % exc


    def non_answer(text):
        """Why a part's text is no research ('' when it may be): empty, a short message about an
        account limit, a quota, an overload, a login or a failed call with no JSON in it, or the
        Claude provider's failed-call text."""
        text = (text or "").strip()
        if not text:
            return "empty"
        if PROVIDER_ERROR.match(text) or (
                len(text) <= 600 and text[0] not in "{[" and "```" not in text and NON_ANSWER.search(text)):
            return 'an account-limit or error message ("%s")' % norm(text)[:160]
        return ""


    def read_part(path):
        """A researcher's file: (its text, '') or (None, why it is no usable output)."""
        try:
            with open(path, encoding="utf-8") as f:
                text = f.read()
        except FileNotFoundError:
            return None, "missing"
        except (OSError, ValueError) as exc:
            return None, "unreadable (%s)" % exc
        why = non_answer(text)
        return (None, why) if why else (text, "")


    def split_args(argv):
        """(--final given, {id: final answer}, the other words). Each --answer <id>=<variable>
        reads that researcher's final answer from the environment; one the workflow could not
        find is left out, and that assumption's files are still checked."""
        final, answers, rest = False, dict(), []
        words = list(argv[1:])
        while words:
            word = words.pop(0)
            if word == "--final":
                final = True
            elif word == "--answer" and words:
                slot, _, variable = words.pop(0).partition("=")
                value = os.environ.get(variable)
                if value is not None and value != NOT_PASSED:
                    answers[slot] = value
            else:
                rest.append(word)
        return final, answers, rest


    def kept_page(url):
        path = os.path.join(DESK, "pages", hashlib.sha1(url.encode()).hexdigest()[:16] + ".txt")
        if not os.path.exists(path):
            return None
        with open(path, encoding="utf-8") as f:
            return f.read().partition("\n")[2]


    def inside(path, folder):
        """The real path of a workspace-relative path when it lies in state/desk/<folder>/."""
        if not path:
            return None
        full = os.path.realpath(os.path.join(ROOT, path))
        base = os.path.realpath(os.path.join(DESK, folder))
        return full if full.startswith(base + os.sep) else None


    def rerun(script):
        try:
            out = subprocess.run([sys.executable, script], cwd=ROOT, capture_output=True,
                                 text=True, timeout=300)
        except subprocess.TimeoutExpired:
            return None, "its script took over 300 s"
        if out.returncode != 0:
            return None, "its script failed: " + norm(out.stderr)[-240:]
        return out.stdout, ""


    def claim_problem(claim, slot, runs):
        """Why a claim can't be used, or an empty string when it can."""
        if not text_of(claim.get("id")).startswith(slot + "-"):
            return "its id should start with %s-" % slot
        url = text_of(claim.get("url"))
        if not url.startswith("http"):
            return "no URL"
        if not (text_of(claim.get("date")) or text_of(claim.get("fetched"))):
            return "no date"
        if claim.get("quality") not in QUALITIES:
            return "quality must be one of: " + ", ".join(QUALITIES)
        if claim.get("party", "neutral") not in ("neutral", "interested"):
            return "party must be neutral or interested"
        how = claim.get("how")
        if how not in HOWS:
            return "how must be one of: " + ", ".join(HOWS)
        if how == "cite":
            page = kept_page(url)
            words = norm(text_of(claim.get("quote"))).lower()
            if page is None:
                return "how is cite, but cite.py never read this URL"
            if not words:
                return "how is cite, but no quote"
            if words not in norm(page).lower():
                return "its quote is not on the page cite.py kept"
        if how == "data":
            files = claim.get("data_files") or []
            if isinstance(files, str):
                files = [files]
            urls = set()
            for name in files:
                full = inside(text_of(name), "data")
                meta, err = load_json(full + ".meta.json") if full else (None, "outside state/desk/data/")
                if not full or not os.path.exists(full) or err or meta.get("http") != "200":
                    return "data file %s was not fetched with cite.py data" % name
                urls.add(meta.get("url"))
            if not files:
                return "how is data, but no data_files"
            if url not in urls:
                return "its URL is not one its data files were fetched from"
            script = inside(text_of(claim.get("script")), "work")
            if not script or not os.path.exists(script):
                return "how is data, but its script is not a file in state/desk/work/"
            result = norm(text_of(claim.get("result")))
            if not result:
                return "how is data, but no result"
            if script not in runs:
                runs[script] = rerun(script)
            out, err = runs[script]
            if err:
                return err
            if result not in norm(out):
                return "its script, run again, does not print %r" % result
        return ""


    def support_failures(ids, claims, bad, aside=()):
        """What keeps these decisive claims from carrying a pass or a kill, as {rule: why}; empty
        when nothing does. F3 is fixed: at least one usable decisive claim read with cite.py or
        counted from data. The defaults count unless the bar set them aside (aside): D1, at least
        2 usable decisive claims from at least 2 sources; D2 and D3, that one F3 claim is from a
        neutral party (D2) and primary (D3). When no F3 claim meets D2 and D3 together, the
        defaults named are the ones that, set aside alone, would leave one that does; when neither
        alone would, both."""
        usable = [claims[c] for c in ids if c in claims and not bad.get(c)
                  and claims[c].get("quality") != "listicle" and claims[c].get("how") != "snippet"]
        sources = set(text_of(c.get("url")) for c in usable)
        checked = [c for c in usable if c.get("how") in ("cite", "data")]
        failed = dict()
        if "D1" not in aside and (len(usable) < 2 or len(sources) < 2):
            failed["D1"] = ("%d usable decisive claims from %d sources; default D1 asks for at least 2 "
                            "from at least 2" % (len(usable), len(sources)))
        if not checked:
            failed["F3"] = ("no usable decisive claim is read with cite.py or counted from data (fixed "
                            "rule F3: a pass or a kill always needs one)")
            return failed
        tests = {"D2": lambda c: c.get("party", "neutral") == "neutral",
                 "D3": lambda c: c.get("quality") == "primary"}
        wanted = [rule for rule in ("D2", "D3") if rule not in aside]
        if any(all(tests[rule](c) for rule in wanted) for c in checked):
            return failed
        alone = [rule for rule in wanted
                 if any(all(tests[other](c) for other in wanted if other != rule) for c in checked)]
        words = {"D2": "from a neutral party", "D3": "primary"}
        failing = alone or wanted
        why = ("no decisive claim read with cite.py or counted from data is %s (default %s)"
               % (" and ".join(words[rule] for rule in wanted), (" or " if alone else " and ").join(failing)))
        for rule in failing:
            failed[rule] = why
        return failed


    def support_problem(ids, claims, bad, aside=()):
        """Why these decisive claims can't carry a pass or a kill, or an empty string."""
        said = []
        for why in support_failures(ids, claims, bad, aside).values():
            if why not in said:
                said.append(why)
        return "; ".join(said)


    def bar_of(slot):
        """The assumption's own bar: its pass_if and kill_if, as written in state/desk/assumptions/."""
        spec, _ = load_json(os.path.join(DESK, "assumptions", slot + ".json"))
        spec = spec if isinstance(spec, dict) else dict()
        return [norm(text_of(spec.get(key))).lower() for key in ("pass_if", "kill_if")]


    def rules_problems(where, rules, verdict, bar, ids, claims, bad):
        """A verdict's rules: {"decided_by": [default, ...], "set_aside": [{"rule", "bar_words",
        "why"}, ...]}. Returns (the defaults set aside, problems). A default is set aside only by
        at least 3 words found in the assumption's own pass_if or kill_if; a default named in
        decided_by must really fail on the decisive claims, and only an unknown has one."""
        if not isinstance(rules, dict):
            return set(), ["%s: rules is missing: {\"decided_by\": [...], \"set_aside\": [...]} "
                           "(each may be an empty list)" % where]
        problems, aside = [], set()
        entries = rules.get("set_aside")
        if not isinstance(entries, list):
            problems.append("%s: rules.set_aside must be a list" % where)
            entries = []
        for entry in entries:
            entry = entry if isinstance(entry, dict) else dict()
            rule = text_of(entry.get("rule"))
            words = norm(text_of(entry.get("bar_words"))).lower()
            if rule not in DEFAULT_RULES:
                problems.append("%s: rules.set_aside names %r: only the defaults D1, D2 and D3 can be "
                                "set aside" % (where, rule))
            elif rule in aside:
                problems.append("%s: rules.set_aside names %s twice" % (where, rule))
            elif len(words.split()) < 3 or not any(words in part for part in bar):
                problems.append("%s: setting %s aside needs bar_words: at least 3 words exactly as this "
                                "assumption's pass_if or kill_if has them (only the bar's own words set "
                                "a default aside)" % (where, rule))
            elif len(text_of(entry.get("why"))) < 20:
                problems.append("%s: setting %s aside needs its why" % (where, rule))
            else:
                aside.add(rule)
        decided = rules.get("decided_by")
        if not isinstance(decided, list):
            problems.append("%s: rules.decided_by must be a list" % where)
            decided = []
        decided = [text_of(rule) for rule in decided]
        if decided and verdict != "unknown":
            problems.append("%s: rules.decided_by names a default that held the verdict back, so it "
                            "belongs to an unknown, not a %s" % (where, verdict))
        elif decided:
            failed = support_failures(ids, claims, bad, aside)
            for rule in decided:
                if rule not in DEFAULT_RULES:
                    problems.append("%s: rules.decided_by names %r: only D1, D2 or D3" % (where, rule))
                elif rule in aside:
                    problems.append("%s: rules.decided_by names %s, which the bar sets aside" % (where, rule))
                elif rule not in failed:
                    problems.append("%s: rules.decided_by names %s, but the decisive claims meet it"
                                    % (where, rule))
        return aside, problems


    def rules_of(rules):
        """A verdict's rules for the hand check, as given."""
        rules = rules if isinstance(rules, dict) else dict()
        aside = rules.get("set_aside") if isinstance(rules.get("set_aside"), list) else []
        decided = rules.get("decided_by") if isinstance(rules.get("decided_by"), list) else []
        return {"decided_by": [text_of(r) for r in decided],
                "set_aside": [{"rule": text_of(e.get("rule")), "bar_words": text_of(e.get("bar_words")),
                               "why": text_of(e.get("why"))} for e in aside if isinstance(e, dict)]}


    def check_assumption(slot, runs):
        text, err = read_part(os.path.join(DESK, "checks", slot + ".json"))
        data = None
        if not err:
            try:
                data = json.loads(text)
            except ValueError as exc:
                err = "not valid JSON (%s)" % exc
        if err or not isinstance(data, dict):
            return None, ["%s: state/desk/checks/%s.json is %s" % (slot, slot, err or "not a JSON object")]
        problems = []
        _, err = read_part(os.path.join(DESK, "checks", slot + ".md"))
        if err:
            problems.append("%s: state/desk/checks/%s.md is %s" % (slot, slot, err))
        if text_of(data.get("id")) != slot:
            problems.append("%s: its id should be %s" % (slot, slot))
        verdict = data.get("verdict")
        if verdict not in VERDICTS:
            problems.append("%s: verdict must be pass, kill or unknown" % slot)
        for key, least in (("why", 40), ("against_bar", 40), ("next_test", 20)):
            if len(text_of(data.get(key))) < least:
                problems.append("%s: %s is missing or too short" % (slot, key))
        if data.get("confidence") not in CONFIDENCE:
            problems.append("%s: confidence must be low, med or high" % slot)
        claims = dict()
        for claim in data.get("claims") or []:
            cid = text_of(claim.get("id")) if isinstance(claim, dict) else ""
            if not cid:
                problems.append("%s: a claim with no id" % slot)
            elif cid in claims:
                problems.append("%s: claim id %s is used twice" % (slot, cid))
            else:
                claims[cid] = claim
        bad = dict((cid, claim_problem(c, slot, runs)) for cid, c in claims.items())
        for cid in sorted(c for c in bad if bad[c]):
            problems.append("%s: claim %s: %s" % (slot, cid, bad[cid]))
        decisive = [text_of(c) for c in data.get("decisive") or []]
        listed = decisive + [text_of(c) for c in data.get("counter") or []]
        unknown_ids = [c for c in listed if c not in claims]
        if unknown_ids:
            problems.append("%s: decisive or counter names claims it doesn't have: %s"
                            % (slot, ", ".join(unknown_ids)))
        if len(decisive) > 5:
            problems.append("%s: at most 5 decisive claims" % slot)
        aside, found = rules_problems(slot, data.get("rules"), verdict, bar_of(slot), decisive, claims, bad)
        problems += found
        if verdict in ("pass", "kill"):
            why_not = support_problem(decisive, claims, bad, aside)
            if why_not:
                problems.append("%s: %s" % (slot, why_not))
        if verdict == "unknown" and not (data.get("not_found") or data.get("searched")):
            problems.append("%s: an unknown lists what was looked for and not found" % slot)
        return {"verdict": verdict, "claims": claims, "bad": bad, "decisive": decisive,
                "rules": rules_of(data.get("rules"))}, problems


    def check_report(slots, results):
        report, err = load_json(os.path.join(DESK, "report.json"))
        if err or not isinstance(report, dict):
            return None, ["report: state/desk/report.json is %s" % (err or "not a JSON object")]
        problems = []
        if not os.path.exists(os.path.join(DESK, "report.md")):
            problems.append("report: state/desk/report.md is missing")
        rows = dict()
        for row in report.get("verdicts") or []:
            if isinstance(row, dict):
                rows[text_of(row.get("id"))] = row
        if sorted(rows) != sorted(slots):
            problems.append("report: verdicts cover %s; they should cover exactly %s"
                            % (", ".join(sorted(rows)) or "nothing", ", ".join(slots)))
        killed = False
        for slot in slots:
            row, res = rows.get(slot), results.get(slot)
            if row is None or res is None:
                continue
            verdict = row.get("verdict")
            if verdict not in VERDICTS:
                problems.append("report: %s: verdict must be pass, kill or unknown" % slot)
            if row.get("researcher_verdict") != res["verdict"]:
                problems.append("report: %s: researcher_verdict should be %s, as in its check file"
                                % (slot, res["verdict"]))
            if verdict != res["verdict"] and len(text_of(row.get("changed_because"))) < 20:
                problems.append("report: %s: the verdict changed with no reason in changed_because" % slot)
            if len(text_of(row.get("why"))) < 40:
                problems.append("report: %s: why is missing or too short" % slot)
            decisive = [text_of(c) for c in row.get("decisive") or []]
            stray = [c for c in decisive if c not in res["claims"]]
            if stray:
                problems.append("report: %s: decisive names claims %s's check doesn't have: %s"
                                % (slot, slot, ", ".join(stray)))
            aside, found = rules_problems("report: " + slot, row.get("rules"), verdict, bar_of(slot), decisive,
                                          res["claims"], res["bad"])
            problems += found
            if verdict in ("pass", "kill"):
                why_not = support_problem(decisive, res["claims"], res["bad"], aside)
                if why_not:
                    problems.append("report: %s: %s" % (slot, why_not))
            if verdict == "unknown" and len(text_of(row.get("next_test"))) < 20:
                problems.append("report: %s: an unknown needs its next_test" % slot)
            spec, _ = load_json(os.path.join(DESK, "assumptions", slot + ".json"))
            if verdict == "kill" and (spec or {}).get("fatal", True):
                killed = True
        finals = [rows[s].get("verdict") for s in slots if s in rows]
        expected = "killed" if killed else (
            "holds" if finals and len(finals) == len(slots) and all(v == "pass" for v in finals) else "open")
        status = report.get("hypothesis_status")
        if status not in STATUSES:
            problems.append("report: hypothesis_status must be holds, open or killed")
        elif status != expected:
            problems.append("report: hypothesis_status should be %s (a fatal kill: killed; every "
                            "assumption passed: holds; otherwise open)" % expected)
        if len(text_of(report.get("status_why"))) < 40:
            problems.append("report: status_why is missing or too short")
        if not report.get("next_steps"):
            problems.append("report: next_steps is empty")
        return report, problems


    def slots_listed():
        names = [os.path.basename(p)[:-5] for p in glob.glob(os.path.join(DESK, "assumptions", "A*.json"))]
        return sorted((n for n in names if re.match(r"^A[1-9]$", n)), key=lambda n: int(n[1:]))


    def main(argv):
        final, answers, args = split_args(argv)
        only = args[0] if args else ""
        slots = slots_listed()
        if only and only not in slots:
            print("no assumption %s here (assumptions: %s)" % (only, ", ".join(slots)))
            return 2
        runs, results, problems = dict(), dict(), []
        for slot in [only] if only else slots:
            res, found = check_assumption(slot, runs)
            problems += found
            if res:
                results[slot] = res
        lost = [p for p in problems if re.match(r"^A[1-9]: state/desk/checks/A[1-9]\.(json|md) is ", p)]
        if final:
            for slot in slots:
                why = non_answer(answers[slot]) if slot in answers else ""
                if why:
                    lost.append("%s: its final answer is %s" % (slot, why))
            problems = lost + [p for p in problems if p not in lost]
        report = None
        if not only and (final or os.path.exists(os.path.join(DESK, "report.json"))):
            report, found = check_report(slots, results)
            problems += found
        if not final:
            for problem in problems:
                print("- " + problem)
            print("verdict:", "fail" if problems else "pass", "| checked:",
                  ", ".join(sorted(results)) or "nothing yet", "| report:", "checked" if report else "not yet")
            return 1 if problems else 0
        rows = dict()
        for row in (report or dict()).get("verdicts") or []:
            if isinstance(row, dict):
                rows[text_of(row.get("id"))] = row
        per, hand = dict(), []
        for slot in slots:
            res = results.get(slot)
            if not res:
                continue
            row = rows.get(slot) or dict()
            items = []
            for cid in [text_of(c) for c in row.get("decisive") or res["decisive"]]:
                c = res["claims"].get(cid)
                if c:
                    items.append({"id": cid, "claim": c.get("claim"), "quote": c.get("quote"),
                                  "url": c.get("url"), "quality": c.get("quality"),
                                  "party": c.get("party", "neutral"), "how": c.get("how"),
                                  "result": c.get("result", ""), "problem": res["bad"].get(cid, "")})
            per[slot] = {"researcher_verdict": res["verdict"], "verdict": row.get("verdict", res["verdict"]),
                         "rules": rules_of(row["rules"]) if isinstance(row.get("rules"), dict) else res["rules"],
                         "decisive": items}
            hand += items
        parts = dict((slot, "; ".join(p[len(slot) + 2:] for p in lost if p.startswith(slot + ": ")) or "ok")
                     for slot in slots)
        print(json.dumps({"verdict": "fail" if problems else "pass", "problems": problems,
                          "hypothesis_status": (report or dict()).get("hypothesis_status"),
                          "assumptions": per, "spot_check": hand, "parts": parts,
                          "rules": dict((slot, per[slot]["rules"]) for slot in per),
                          "answers_checked": [slot for slot in slots if slot in answers],
                          "report_path": "state/desk/report.md"}, indent=1))
        return 0


    if __name__ == "__main__":
        sys.exit(main(sys.argv))
    CHECKEOF
    cat state/desk/setup.json
