# @description PRODUCT FEATURE SCREEN step 1 (product role, queue #26): stage the frozen method,
# the page fetcher and the checker into state/feature/, copy the product's evidence folder into
# state/feature/evidence/ and write state/feature/input.md (the idea, its real problems, the
# seeds, the players to check and what it can build on). No model. A missing idea, problems or
# evidence folder, an evidence folder outside the run workspace, or a used state/feature/ stops
# here at $0 (status not_ready). The known-taken cases (planted_taken) are not given here: only
# the check sees them, so no agent knows which seeds are expected to come out taken. Part of
# workflows/feature_screen.yaml.
agent:
  name: feature_screen_setup
  version: 1
  type: script
  timeout_seconds: 120
  script_template: |
    #!/bin/sh
    set -eu
    cd "{{ workspace_path }}"
    python3 - <<'PY'
    import json
    import os
    import shutil
    import subprocess
    import sys
    from pathlib import Path


    def stop(problem):
        print(json.dumps({"status": "not_ready", "seeds": [], "evidence_files": 0, "problems": [problem]}))
        sys.exit(0)


    # `or ''`: the server passes an input the run did not give as None, which the value stash
    # would hand over as the text 'None' (signal_grade's first benchmark run, 1b7aef1a).
    assets = Path((os.environ.get('{{ (assets_dir or '') | env }}') or '').strip()
                  or '/app/configs/agents/feature_screen_assets')
    dest = Path('state/feature')
    if dest.exists() and any(dest.iterdir()):
        stop('state/feature already holds a screen: run in a fresh workspace')
    names = ('check_features.py', 'cite.py', 'method.md')
    for name in names:
        if not (assets / name).is_file():
            stop(f'assets_dir {assets} has no {name}')
    dest.mkdir(parents=True, exist_ok=True)
    for name in names:
        shutil.copyfile(assets / name, dest / name)
    sys.exit(subprocess.call([
        sys.executable, str(dest / 'check_features.py'), 'setup', '--assets', str(assets),
        '--idea', '{{ (idea or '') | env }}', '--problems', '{{ (problems or '') | env }}',
        '--evidence-dir', '{{ (evidence_dir or '') | env }}', '--seeds', '{{ (seeds or '') | env }}',
        '--players', '{{ (players or '') | env }}', '--build-on', '{{ (build_on or '') | env }}',
        '--run-id', '{{ (run_id or '') | env }}']))
    PY
