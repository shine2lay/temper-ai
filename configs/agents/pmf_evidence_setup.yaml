# @description PRODUCT FIT AND REVENUE step 1 (product role): stage the kit, the params file and
# the four CSV exports, validate every required parameter and measure. No model. A missing,
# misspelt or invalid parameter, a missing file or column blocks here at $0 with one problem per
# item; nothing is guessed or defaulted. Otherwise it writes the metrics (survey, retention,
# payment, revenue kept apart), the numbered facts the interpretation must cite and the rejected
# rows, all under state/pmf/. Part of workflows/pmf_evidence.yaml.
agent:
  name: pmf_evidence_setup
  version: 1
  type: script
  timeout_seconds: 120
  script_template: |
    #!/bin/sh
    set -eu
    cd "{{ workspace_path }}"
    python3 - <<'PY'
    import os
    import shutil
    import subprocess
    import sys
    from pathlib import Path

    KIT = ('pmf_kit.py', 'data_dictionary.md', 'interpretation_contract.md')
    # `or ''`, not the workflow default: the server passes an input the run did not give as None,
    # which the value stash hands over as the text 'None' (first live run, 66f59019). Left out,
    # the kit is the deployed copy.
    given = (os.environ.get('{{ (assets_dir or '') | env }}') or '').strip()
    assets = Path(given or '/app/configs/agents/pmf_evidence_assets')
    missing = [name for name in KIT if not (assets / name).is_file()]
    if missing:
        raise SystemExit('assets_dir ' + str(assets) + ' has no ' + ', '.join(missing))
    dest = Path('state/pmf')
    if dest.exists() and any(dest.iterdir()):
        raise SystemExit('Refusing to overwrite an existing fit and revenue run: use a fresh workspace')
    dest.mkdir(parents=True, exist_ok=True)
    for name in KIT:
        shutil.copyfile(assets / name, dest / name)
    sys.exit(subprocess.call([sys.executable, 'state/pmf/pmf_kit.py', 'setup',
                              os.environ['{{ params_path | env }}'], os.environ['{{ data_dir | env }}']]))
    PY
