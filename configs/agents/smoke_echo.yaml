# Zero-LLM agent: echoes its input as JSON.
#
# Used by the `smoke_test` workflow to check an installation end to end
# (engine, database, events, dashboard) without an API key or any spend.
#
# Note how the inputs are used: the script agent shell-quotes every value
# before rendering, so `{{ message }}` is already a safe shell token and
# must NOT be wrapped in quotes again. Values are handed to python through
# the environment so a message containing quotes still produces valid JSON.
agent:
  name: smoke_echo
  type: script
  timeout_seconds: 10
  script_template: |
    #!/bin/bash
    MSG={{ message | default("hello") }} \
    WS={{ workspace_path | default("") }} \
    python3 -c 'import json, os; print(json.dumps({"echoed": os.environ["MSG"], "workspace": os.environ["WS"]}))'
