# System architecture, first_app_check (Architecture queues #91, #92, 2026-10-16). No model.
#
# QA's frozen critical journey (kit qa-first-app-critical-v1, CASE-KIT.json SHA256 49813ec9...) run in
# temper's playwright-mcp browser by configs/architecture/bin/first_app_check.py, by default against the
# Team's first app (Project d9f807c3, the offline to-do list) as served at https://spark.tailbb5055.ts.net:8960/;
# with profile (mode=live only; one JSON object as text, see the script's docstring), against a new build:
# its origin, pins, kit and page wording. A profile that is not valid is REFUSED before the browser is used.
#   mode=controls: the checker's own controls on a synthetic to-do page written from the kit's wording
#     (configs/architecture/fixtures/first_app, served from this run's container): the working page must
#     PASS all 8 rows, each broken variant FAIL at its row, the wrong pin be REFUSED before any row.
#   mode=live: the served app, once: in-browser SHA-256 of index.html, style.css, app.js and the "/" document
#     against the pins (mismatch = REFUSED, no row run), then the 8 rows in a fresh 1280x800 en-US UTC context,
#     each read back from the rendered page, stop at the first failure, screenshot after the reload rows,
#     every request and page error recorded, browser closed and confirmed.
# Shared journey (Architecture queue #97, 2026-10-18): Team Project 2's shared to-do list, QA kit
# qa-project2-critical-v1, by configs/architecture/bin/first_app_shared.py (loaded only for it):
#   mode=controls_shared: its 18 controls on a synthetic shared page and server (fixtures/shared_app) that this run
#     starts, stops and restarts itself with the same data folder.
#   mode=live with a profile holding "journey": "shared": three people (A, B, C) in separate browser contexts,
#     the host (Ops) stopping and starting the app at rows R-1, D-1 and D-5: the check writes
#     check/host/WAITING-<row>.json and waits for check/host/<row>.json. Up to 3500 s; the first app's modes keep 840 s.
# Project 3 journey (Architecture queue #124, rows wired to QA #32's spec on Product FINAL v3.1 by #125): by
# configs/architecture/bin/first_app_p3.py (loaded only for it, rows in first_app_p3_rows.py): Chromium 1280x800
# contexts and WebKit phone contexts (390x844, touch; the second browser service, default
# http://playwright-mcp-webkit:8931/mcp) on a second, fresh copy of the build. WebKit runs only with a checked W1
# before-reading (webkit-reading/1 from Ops' reading tool, DECISION-11) and W1 admission; otherwise its rows are
# NOT RUN, never PASS. Its results stay PROVISIONAL until first_app_p3_w1.py finalize says COUNT. Host rows
# go only through #126's ops_host_client (BLOCKED until that wire is received). W4: an off-origin request that isn't
# a declared plant stops the batch (exit 4, nothing further runs in that invocation); the request list goes to
# Security and work resumes once the cause is known. That cross-run hold is an operator rule (DECISION-9 (b)): the
# checker refuses no later run for it. Before its first browser call each run (and each control case) writes a
# create-once started.json beside its receipt.json; a run that ends without a final receipt.json counts as a failed
# teardown, and W1 admission refuses its services until Ops' W2 recreation (Security #105 A6).
#   mode=controls_p3: its controls on a synthetic Project-3-style page and two servers (fixtures/p3_app). Input
#     w1_before (controls_p3 only; one JSON object as text, {path, sha256}) names the WebKit W1 before-reading
#     (webkit-reading/1) taken before the run and goes to first_app_p3.py as --w1-before, which checks it; with any
#     other mode it is refused (a live profile names its own w1_before). Left out = the command line exactly as
#     before, and the WebKit rows stay NOT RUN (Architecture queue #337). Inline variant (#351): exactly
#     {data_base64, sha256} stages exact bytes at check/w1-input/before.json as the run identity, then uses the
#     unchanged W1 reader. Ordinary workflow input/events RETAIN the envelope; this is not secret transport.
#     See docs/p3-w1-input.md for authority, collision and retention limits.
#   mode=live with a profile holding "journey_p3": the served build. Up to 3500 s.
# Writes check/ in the workspace: receipt.json + summary.md (+ after-reload.png for the first app), or one folder per
# control plus controls.json. A FAIL, REFUSED or BLOCKED verdict is a result, not a step failure: the step
# fails only when the checker gives no result at all.
# POSIX sh. No dollar-brace env syntax anywhere in this file (config-loader substitution).
agent:
  name: first_app_check
  version: 1
  type: script
  timeout_seconds: 3600
  script_template: |
    #!/bin/sh
    set -e
    WS="{{ workspace_path }}"
    [ -n "$WS" ] || { echo "first_app_check needs the run's workspace_path (its check/ folder holds the receipt)" >&2; exit 2; }
    cd "$WS"
    mkdir -p check
    "$TEMPER_PYTHON" - <<'PYEOF'
    import json
    import os
    import pathlib
    import subprocess
    import sys

    mode = (os.environ.get("{{ mode | env }}") or "").strip()
    profile = os.environ.get("{{ profile | env }}") or ""
    w1_before_env = "{{ w1_before | env }}"
    w1_before = os.environ.get(w1_before_env) or ""
    if mode not in ("controls", "live", "controls_shared", "controls_p3"):
        raise SystemExit("first_app_check needs mode = controls, live, controls_shared or controls_p3, got %r" % mode)
    if profile.strip() and mode != "live":
        raise SystemExit("first_app_check: profile is for mode=live; the controls bring their own")
    if w1_before.strip() and mode != "controls_p3":
        raise SystemExit("first_app_check: w1_before is for mode=controls_p3, not %s; a live profile names its W1 "
                         "before-reading itself (w1_before)" % mode)
    try:
        p3 = mode == "controls_p3" or "journey_p3" in json.loads(profile)
    except (ValueError, TypeError):
        p3 = False
    script = "/app/configs/architecture/bin/first_app_check.py"
    if p3:
        script = "/app/configs/architecture/bin/first_app_p3.py"
    cmd = [sys.executable, "-u", script, "--mode", mode, "--out", "check"]
    if profile.strip():
        cmd += ["--profile", profile]
    w1_input_staging = None
    if w1_before.strip() and mode == "controls_p3":
        sys.path.insert(0, "/app/configs/architecture/bin")
        from first_app_p3_w1_input import Refused, prepare
        try:
            w1_before, w1_input_staging = prepare(w1_before, pathlib.Path.cwd())
        except Refused as exc:
            raise SystemExit("first_app_check: " + str(exc)) from None
        if w1_input_staging is not None:
            # Only the inline slot: no environment enumeration, copy or legacy behavior change.
            os.environ.pop(w1_before_env, None)
        cmd += ["--w1-before", w1_before]
    try:
        shared = mode == "controls_shared" or "journey" in json.loads(profile)
    except (ValueError, TypeError):
        shared = False
    res = subprocess.run(cmd, capture_output=True, text=True, timeout=3500 if shared or p3 else 840)
    log = [x for x in res.stdout.strip().splitlines() if not x.startswith("{")]
    sys.stderr.write("\n".join(log)[-40000:] + "\n" + res.stderr[-20000:])
    with open("check/run.log", "w", encoding="utf-8") as f:
        f.write(res.stdout + res.stderr)
    lines = [x for x in res.stdout.strip().splitlines() if x.startswith("{")]
    if not lines:
        raise SystemExit("%s gave no result (exit %d)" % (os.path.basename(script), res.returncode))
    out = json.loads(lines[-1])
    out.update({"status": "completed", "exit_code": res.returncode, "workspace": os.getcwd(),
                "summary_path": "check/summary.md" if mode == "live" else "check/controls.json"})
    out.setdefault("journey", "p3" if p3 else "shared" if shared else "first_app")
    if w1_input_staging is not None:
        out["w1_input_staging"] = w1_input_staging
    print(json.dumps(out))
    PYEOF
