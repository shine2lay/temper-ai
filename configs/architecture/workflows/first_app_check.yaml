workflow:
  name: first_app_check
  version: 1
  description: |
    System architecture's direct browser check of the Team's to-do app (Architecture queues #91,
    #92, 2026-10-16): QA's frozen critical journey (kit qa-first-app-critical-v1, 8 rows) run with
    no model in temper's playwright-mcp browser, after an in-browser hash check of the app's three
    files and of the "/" document. By default it checks the first app (Project d9f807c3) as served
    at https://spark.tailbb5055.ts.net:8960/. A new build is checked through profile (mode=live
    only): one JSON object as text with origin (https://spark.tailbb5055.ts.net:<port> only),
    pins (index.html, style.css, app.js SHA256), kit_id, kit_sha256, kit_not_checked and wording
    (heading, textbox, add_button, delete_button "... {item} ...", empty_text); anything missing,
    extra or malformed is REFUSED before the browser is contacted. Today's values in that form:
    first_app_check.py --print-default-profile.
    mode=controls proves the checker first: a synthetic working page passes all 8 rows, each broken
    variant fails at its row, outside traffic fails the traffic gate, a wrong pin is refused, a
    reworded page passes with its profile and fails without it, a bad profile is refused unseen.
    mode=live checks the served app once. PASS covers only these 8 rows plus the traffic, error
    and cleanup gates; not full QA, accessibility, mobile, offline or owner acceptance (receipts
    list the kit's NOT CHECKED items). QA reads the receipts and gives its own verdict. Network is
    observed, not blocked.
    Shared journey (queue #97, 2026-10-18): Team Project 2's shared to-do list, QA's kit
    qa-project2-critical-v1 (30 browser and host rows), three people in separate browser contexts, the
    host (Ops) restarting and stopping the app in the middle (the check waits for its receipts in
    check/host/). mode=controls_shared proves it on a synthetic shared server first (18 controls);
    mode=live with a profile holding "journey": "shared" checks the served app (profile form:
    first_app_check.py --print-shared-profile). Without a journey key nothing changes.
    Project 3 journey (queue #124; rows wired by #125 to QA #32's spec on Product FINAL v3.1):
    first_app_p3.py runs Chromium 1280x800 contexts and WebKit phone contexts (390x844, touch, a
    second browser service on a second fresh copy of the build; without W1 image readings and
    admission the WebKit rows are NOT RUN, never PASS), exact code points after a reload, rtl
    direction, two-step delete, busy and pending timing, limits and outage messages. Host rows go
    only through #126's ops_host_client. An unexpected off-origin request is W4 (exit 4).
    mode=controls_p3 proves it on a synthetic Project-3-style page and servers; mode=live with a
    profile holding "journey_p3" checks a served build (form: first_app_p3.py --print-p3-profile).
    w1_before (mode=controls_p3 only, queue #337) names the WebKit W1 before-reading taken before the
    run (webkit-reading/1, from chromium-reading take --webkit), as one JSON object as text with
    exactly path and sha256 (64 lowercase hex). The path is absolute and is read inside the run's
    box, so the box's user must be able to read it; first_app_p3.py checks it (--w1-before).
    Left out, the WebKit rows stay NOT RUN, exactly as before; with any other mode it is refused
    (a live profile names its own w1_before). An inline variant (#351), exactly {data_base64, sha256},
    stages exact operator-supplied bytes at check/w1-input/before.json under the run identity before
    the unchanged W1 checks. Standard base64, existing 65536-byte W1 bound, verified digest, private
    create-once file; invalid transport/unsafe path/collision refuses before the checker. No host
    source path is read. This is NOT secret transport: ordinary workflow input/events retain the
    envelope. The operator needs authority for that boundary; base64/private modes grant none.
    See docs/p3-w1-input.md. Optional w1_input_staging is non-content identity/mode metadata only,
    absent/null for legacy input; it authenticates neither the caller nor custody.
    Start it with a workspace_path: an existing folder under workspaces/ the run's box may write
    (the receipt, summary, screenshot and log land in its check/ folder).
  inputs:
    mode: {type: string, required: true}      # controls | live | controls_shared | controls_p3
    profile: {type: string, required: false}  # live only; left out = the first app, exactly as before
    w1_before: {type: string, required: false}  # controls_p3 only; left out = WebKit rows NOT RUN, as before
  outputs:
    mode: check.structured.mode
    verdict: check.structured.verdict
    why: check.structured.why
    rows: check.structured.rows
    traffic_gate: check.structured.traffic_gate
    traffic_gates: check.structured.traffic_gates
    profile: check.structured.profile
    all_ok: check.structured.all_ok
    verdicts: check.structured.verdicts
    statuses: check.structured.statuses
    not_run: check.structured.not_run
    webkit: check.structured.webkit
    summary_path: check.structured.summary_path
    workspace: check.structured.workspace
    journey: check.structured.journey
    pins_ok: check.structured.pins_ok
    list_equal_after_restart: check.structured.list_equal_after_restart
    cleanup_confirmed: check.structured.cleanup_confirmed
    w1_input_staging: check.structured.w1_input_staging

  nodes:
    - name: check
      type: agent
      agent: first_app_check
      input_map:
        mode: input.mode
        profile: input.profile
        w1_before: input.w1_before
