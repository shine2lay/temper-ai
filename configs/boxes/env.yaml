# What a run box gets from the server's environment: only the names below.
# Anything not listed stays in the server (docs/boxes.md). This install's own
# names go in configs/boxes/local/env.yaml (git-ignored), in the same shape.
#
# Each group: names, why (who in the box reads them), and agent_tools: true when
# the box's agent tool processes (the Claude CLI, Bash, script steps, git) may see
# them too. Without it only the box's own Python process holds them.
# A secret (database URL, secret key, *_KEY, *_TOKEN, *_SECRET, *_PASSWORD) may
# never have agent_tools: true; the GitHub app's keys may never be listed at all,
# nor may the Pi switch and box config (TEMPER_PI_AGENT, TEMPER_PI_BOX_CONFIG)
# and the Pi lane's settings (TEMPER_LANE, TEMPER_PI_DRAIN_MARK): Pi steps never
# run in a run box (docs/pi-agent.md, docs/pi-lane.md).
# TEMPER_RUN_CONTAINER is always set by the spawner. `temper check` reads this file.

box_env:
  - names: [HOME, PATH, LANG, LANGUAGE, LC_ALL, TZ, PYTHONDONTWRITEBYTECODE,
            HTTP_PROXY, HTTPS_PROXY, NO_PROXY, http_proxy, https_proxy, no_proxy]
    why: every process needs a home, a PATH, a locale and the proxy settings
    agent_tools: true

  - names: [CLAUDE_CONFIG_DIR, DISABLE_AUTOUPDATER]
    why: >-
      a sealed box sets these itself (TEMPER_BOX_RUNTIME_BOUNDARY=sealed,
      docs/boxes.md): the Claude CLI keeps its state in the box's own tmpfs and
      never updates itself. The server sets neither, so a legacy box gets nothing new
    agent_tools: true

  - names: [WORKSPACE_DIR, TEMPER_API, TEMPER_SERVER_URL, TEMPER_UI_URL]
    why: >-
      scripts and the temper CLI in a box find the run's workspace and the
      server with them (EPD task_claim/cleanup print WORKSPACE_DIR). Reading
      needs nothing; a write needs a key, and only a starts_runs workflow's
      script steps get one (TEMPER_RUN_TOKEN, docs/api-access.md)
    agent_tools: true

  - names: [TEMPER_DATABASE_URL, DATABASE_URL, TEMPER_REDIS_URL, REDIS_URL]
    why: >-
      the runner records the run and streams its events (runner/bootstrap.py,
      database/engine.py, streaming/redis_streams.py, llm/shared_cooldowns.py)

  - names: [TEMPER_SECRET_KEY]
    why: tools/mcp_auth.py decrypts the stored MCP sign-ins (Notion MCP and others)

  - names: [TEMPER_LOG_LEVEL, TEMPER_LOG_DIR, TEMPER_CONFIG_DIR, TEMPER_DEFAULT_PROVIDER,
            TEMPER_MEMORY_BACKEND, TEMPER_MEMORY_PATH, TEMPER_LLM_MODEL,
            TEMPER_WEBHOOK_URL, TEMPER_WEBHOOK_TIMEOUT, TEMPER_API_GUARD]
    why: >-
      the runner's own settings (cli/run_workflow.py, memory service; a Pi
      team's start check reads the write guard's mode: Bash is off until it is
      enforce)

  - names: [TEMPER_API_TOKEN]
    why: >-
      the box asks the server for GitHub tokens and starts runs with it
      (integrations/github/app.py ServerApp, cli/run_on_server.py)

  - names: [ANTHROPIC_API_KEY, ANTHROPIC_MODEL, OPENAI_API_KEY, OPENAI_OAUTH_TOKEN,
            OPENAI_BASE_URL, OPENAI_MODEL, OPENAI_CODEX_BASE_URL, GEMINI_API_KEY,
            GEMINI_MODEL, OLLAMA_BASE_URL, OLLAMA_MODEL, VLLM_BASE_URL, VLLM_MODEL,
            TYPESAFE_API_KEY, TYPESAFE_BASE_URL,
            CLAUDE_CODE_MODEL,
            CLAUDE_CODE_OAUTH_TOKEN, CLAUDE_CODE_OAUTH_TOKEN_ACCOUNT,
            CLAUDE_CODE_OAUTH_TOKEN_BACKUP, CLAUDE_CODE_OAUTH_TOKEN_BACKUP_ACCOUNT,
            CLAUDE_CODE_OAUTH_TOKEN_2, CLAUDE_CODE_OAUTH_TOKEN_2_ACCOUNT,
            CLAUDE_CODE_OAUTH_TOKEN_3, CLAUDE_CODE_OAUTH_TOKEN_3_ACCOUNT,
            CLAUDE_CODE_OAUTH_TOKEN_4, CLAUDE_CODE_OAUTH_TOKEN_4_ACCOUNT,
            CLAUDE_CODE_OAUTH_TOKEN_5, CLAUDE_CODE_OAUTH_TOKEN_5_ACCOUNT,
            CLAUDE_CODE_OAUTH_TOKEN_6, CLAUDE_CODE_OAUTH_TOKEN_6_ACCOUNT,
            CLAUDE_CODE_OAUTH_TOKEN_7, CLAUDE_CODE_OAUTH_TOKEN_7_ACCOUNT,
            CLAUDE_CODE_OAUTH_TOKEN_8, CLAUDE_CODE_OAUTH_TOKEN_8_ACCOUNT,
            CLAUDE_CODE_OAUTH_TOKEN_9, CLAUDE_CODE_OAUTH_TOKEN_9_ACCOUNT]
    why: >-
      the box calls the models itself (llm/providers, the Claude CLI provider
      hands each CLI the one slot it uses, agent/jev_agent.py)

  - names: [GITHUB_APP_ID, GITHUB_API_URL, TEMPER_GITHUB_TOKEN, TEMPER_GITHUB_PR_REPOS]
    why: tools/github_pr.py opens pull requests; the app's key itself stays in the server

  - names: [NOTION_TOKEN]
    why: the Notion tools (tools/notion.py) used by the Notion answer and report agents

  - names: [LINEAR_CLIENT_ID, LINEAR_CLIENT_SECRET, LINEAR_SCOPE, TEMPER_LINEAR_STATES]
    why: >-
      configs/mcp_servers/linear.yaml signs in with client credentials for the
      Linear agents; tools/linear_state.py
  - names: [ROAMEE_READER_SOCKET, SEARXNG_URL, MCP_SERVERS, PLAYWRIGHT_MCP_URL, CHROME_MCP_URL,
            GIT_WORKSPACE]
    why: tools and MCP server configs read them in the box's process (${VAR} in configs/mcp_servers)
