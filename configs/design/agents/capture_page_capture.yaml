# Owner: Design. New isolated context per view; no model calls.
agent:
  name: capture_page_capture
  version: 1
  type: script
  strict_undefined: true
  timeout_seconds: 3600
  script_template: |
    #!/bin/sh
    set -eu
    "$TEMPER_PYTHON" /app/configs/design/bin/capture_page.py capture \
      --workspace {{ workspace_path }} --receipt {{ preflight_receipt }}
