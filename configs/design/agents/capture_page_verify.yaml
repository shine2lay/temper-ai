# Owner: Design. Independent saved-PNG, text, consent, slices and status checks.
agent:
  name: capture_page_verify
  version: 1
  type: script
  strict_undefined: true
  timeout_seconds: 3600
  script_template: |
    #!/bin/sh
    set -eu
    "$TEMPER_PYTHON" /app/configs/design/bin/capture_page.py verify \
      --workspace {{ workspace_path }} --receipt {{ capture_receipt }}
