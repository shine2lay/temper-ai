# @description Design-owned script steps of design_app_screen_v1: runs one step (the eight stages, the
# review half of checks, the two owner gates and the bookkeeping after the final gate) through
# bin/design_app_screen.py, which validates the step's output against its contract and fails loud.
# No model, no network; standard library + jsonschema (temper's own interpreter). Gate answers come
# from temper's gate response. Docs: docs/design-app-screen.md.
agent:
  name: design_app_screen_stage_v1
  version: 1
  type: script
  timeout_seconds: 1800
  script_template: |
    #!/bin/sh
    set -e
    "$TEMPER_PYTHON" - <<'PYEOF'
    import os
    import subprocess
    import sys

    step = os.environ.get("{{ step | env }}", "")
    workspace = (
        os.environ.get("{{ workspace | default('', true) | env }}", "")
        or os.environ.get("{{ workspace_path | default('', true) | env }}", "")
    )
    product = os.environ.get("{{ product | default('', true) | env }}", "")
    raw = os.environ.get("{{ data | default('', true) | env }}", "")
    base_url = os.environ.get("{{ base_url | default('', true) | env }}", "")
    stack_commit = os.environ.get("{{ stack_commit | default('', true) | env }}", "")
    stack_short_commit = os.environ.get("{{ stack_short_commit | default('', true) | env }}", "")
    stack_ref = os.environ.get("{{ stack_ref | default('', true) | env }}", "")
    stack_env_name = os.environ.get("{{ stack_env_name | default('', true) | env }}", "")
    stack_reused = os.environ.get("{{ stack_reused | default('', true) | env }}", "")
    allow_red_commit = os.environ.get("{{ allow_red_commit | default('', true) | env }}", "")
    credentials = os.environ.get("{{ credentials | default('', true) | env }}", "")
    {% if gate is defined %}
    raw = os.environ.get("{{ gate.response | default('', true) | env }}", "") or raw
    {% endif %}
    if not step or not workspace:
        raise SystemExit("app-screen step and workspace required")
    os.environ["APP_SCREEN_DATA"] = raw
    if base_url:
        os.environ["APP_SCREEN_BASE_URL"] = base_url
    if stack_commit:
        os.environ["APP_SCREEN_STACK_COMMIT"] = stack_commit
    if stack_short_commit:
        os.environ["APP_SCREEN_STACK_SHORT_COMMIT"] = stack_short_commit
    if stack_ref:
        os.environ["APP_SCREEN_STACK_REF"] = stack_ref
    if stack_env_name:
        os.environ["APP_SCREEN_STACK_ENV_NAME"] = stack_env_name
    if stack_reused:
        os.environ["APP_SCREEN_STACK_REUSED"] = stack_reused
    if allow_red_commit:
        os.environ["APP_SCREEN_ALLOW_RED_COMMIT"] = allow_red_commit
    if credentials:
        os.environ["APP_SCREEN_CREDENTIALS"] = credentials
    cmd = [sys.executable, "/app/configs/design/bin/design_app_screen.py", step, "--workspace", workspace]
    if product:
        cmd += ["--product", product]
    if base_url:
        cmd += ["--base-url", base_url]
    if stack_commit:
        cmd += ["--stack-commit", stack_commit]
    if stack_ref:
        cmd += ["--stack-ref", stack_ref]
    if allow_red_commit:
        cmd += ["--allow-red-commit", allow_red_commit]
    subprocess.run(cmd, env=os.environ, check=True)
    PYEOF
