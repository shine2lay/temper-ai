# @description DESIGN REVIEW step 1, candidate (design role, queue #7). No model. As
# design_capture, but runs design_capture_next.py: design_measure_next.js applies WCAG 2.5.8 in
# full (a control's labels count as its target; undersized targets pass by the spacing
# exception), exempts inactive controls from contrast, and review/facts.md lists the measured
# passes next to the problems. Writes review/brief.md, review/shots/, review/facts/*.json and
# review/facts.md. Part of workflows/design_review_next.yaml only (a test workflow).
# POSIX sh. No dollar-brace env syntax anywhere in this file (config-loader substitution).
agent:
  name: design_capture_next
  version: 1
  type: script
  timeout_seconds: 600
  script_template: |
    #!/bin/sh
    set -e
    cd {{ workspace_path }}
    mkdir -p review
    "$TEMPER_PYTHON" - <<'PYEOF'
    import json
    import os
    import subprocess
    import sys
    import time

    brief = (os.environ.get("{{ brief | env }}") or "").strip()
    site = (os.environ.get("{{ site | default('', true) | env }}") or "").strip()
    base_url = (os.environ.get("{{ base_url | default('', true) | env }}") or "").strip()
    pages = (os.environ.get("{{ pages | env }}") or "").strip()
    viewports = (os.environ.get("{{ viewports | default('desktop,mobile', true) | env }}") or "desktop,mobile").strip()
    if not brief or not pages or not (site or base_url):
        raise SystemExit("design_review needs: brief, pages, and site or base_url")
    with open("review/brief.md", "w", encoding="utf-8") as f:
        f.write("\n".join([
            "# Design review brief", "",
            "Written by design_capture, " + time.strftime("%Y-%m-%d %H:%M %Z") + ".", "",
            "## What this is and who it is for", "", brief, "",
            "## Pages reviewed", "", ", ".join(p.strip() for p in pages.split(",") if p.strip()), "",
            "## Viewports", "", viewports, "",
        ]))
    cmd = [sys.executable, "/app/configs/design/bin/design_capture_next.py", "--out", "review",
           "--pages", pages, "--viewports", viewports]
    cmd += ["--base-url", base_url] if base_url else ["--site", site]
    res = subprocess.run(cmd, capture_output=True, text=True, timeout=540)
    if res.returncode != 0:
        sys.stderr.write(res.stdout[-2000:] + res.stderr[-4000:])
        raise SystemExit("design_capture_next.py failed (exit %d)" % res.returncode)
    summary = json.loads(res.stdout.strip().splitlines()[-1])
    tiles = sum(v["tiles"] for p in summary["pages"] for v in p["views"])
    measured = sum(v["axe_violations"] + sum(int(x) for x in v["measured"].values())
                   for p in summary["pages"] for v in p["views"])
    print(json.dumps({"status": "completed", "facts_path": "review/facts.md", "brief_path": "review/brief.md",
                      "pages": len(summary["pages"]), "screenshots": tiles, "measured_items": measured}))
    PYEOF
