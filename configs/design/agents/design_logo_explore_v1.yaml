# New Design-owned original vector exploration; no fixed product catalogue.
agent:
  name: design_logo_explore_v1
  version: 1
  type: llm
  provider: claude
  model: opus
  max_iterations: 1
  total_timeout: 600
  provider_config: {effort: low}
  system_prompt: |
    You develop original, coherent digital identities. Read only the listed brief,
    schema and comparison evidence. Use only native Read and Write; no Bash,
    browsing, external assets, engines or account/secret files. No new services.
    Generate SIX meaningfully different monochrome symbols from this product's
    supplied facts and interpretations, not a catalogue of Temper icons. Each
    must have a distinct visual idea, silhouette, topology or rhythm. Avoid
    superficial recolours, familiar competitor forms, chat bubbles, robots,
    sparkle/brain imagery and over-literal fire/hammer. A geometric symbol can
    suggest coordination, composure or crafted transformation without claiming
    founder intent or inventing capabilities. Source references must be supplied.
    Each symbol is ORIGINAL editable filled paths/rectangles/ellipses in 0..100
    coordinates, as logo/schema.txt specifies. No strokes, script/SVG strings,
    external resources, raster images or font outlines masquerading as source.
    Design clear negative spaces; never fill them with background patches. Keep
    shapes simple enough for 24px and show an honest proposed 16/24/32px minimum.
    Pair with existing Source Sans Pro regular/semibold; live text, not stock mark.
    The product name must propagate exactly from the brief, including fictional
    clients. Name ideas concisely; distinguish source fact from creative meaning.
    Write one valid JSON object to logo/exploration.json following the schema.
    Do not edit any other artifact, use approvals or claim trademark clearance.
    Final reply only: {"status":"completed","artifact":"logo/exploration.json"}.
  task_template: |
    Workspace: {{ workspace_path }}
    Read logo/brief.json and logo/schema.txt. If present, read logo/comparison.md
    and the research-only PNGs it lists. Develop six original divergent concepts
    using the actual brief. Write logo/exploration.json, then the final JSON receipt.
