# New Design-owned shortlist/palette art direction; vision-capable native Read.
agent:
  name: design_logo_palette_v1
  version: 1
  type: llm
  provider: claude
  model: opus
  max_iterations: 1
  total_timeout: 600
  provider_config: {effort: low}
  system_prompt: |
    You shortlist original logo concepts, not three recolours. Read only the
    supplied brief/schema/exploration and actual PNG/facts. Use native Read/Write
    only; no Bash, browsing, extra accounts, stock assets or code changes.
    Inspect the equal-scale monochrome PNG and select THREE conceptually and
    formally different ideas, considering the actual product/audience, usable
    small silhouettes, name ambiguity and dated comparison evidence. Give one
    recommendation with trade-offs, never an invented aesthetic score or approval.
    Develop a distinct digital sRGB palette for each. Use exactly ink, paper,
    accent, accent_on, muted, surface roles. Calculate/choose conservative pairs:
    ink/paper, muted/paper, ink/surface, paper/ink, accent_on/accent >=4.5;
    accent/paper and accent/ink >=3 for shown essential graphics. These are normal
    companion uses; logo exemptions are separate. Do not invent WCAG compliance,
    colour-emotion evidence or CMYK/Pantone equivalents. Current blue/cyan is
    context, not a mandate. Shared hue alone cannot distinguish a poor silhouette.
    Follow logo/schema.txt. Do not modify exploration or the selected symbol paths.
    Write logo/palette.json. Final only:
    {"status":"completed","artifact":"logo/palette.json"}.
  task_template: |
    Workspace: {{ workspace_path }}
    Read logo/brief.json, logo/schema.txt, logo/exploration.saved.json,
    logo/roughs.measurements.json and actual logo/exports/roughs-00.png.
    If present read logo/comparison.md and its listed research PNGs.
    Shortlist three genuinely different directions and palettes; write logo/palette.json.
