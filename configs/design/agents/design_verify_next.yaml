# @description DESIGN REVIEW facts check, candidate (design role, queue #7). No model.
# Runs design_review_verify_next.py after the critics and before the merge: target-size claims
# (WCAG 2.5.8) against the measured failures and passes (label area, spacing exception),
# contrast claims about inactive (disabled) controls, and whether each finding cites checkable
# evidence (element, page, and a screenshot tile or facts value). Writes review/verify.json;
# design_merge_next drops what the facts contradict. Part of workflows/design_review_next.yaml.
# POSIX sh. No dollar-brace env syntax anywhere in this file (config-loader substitution).
agent:
  name: design_verify_next
  version: 1
  type: script
  timeout_seconds: 120
  script_template: |
    #!/bin/sh
    set -e
    cd {{ workspace_path }}
    "$TEMPER_PYTHON" /app/configs/design/bin/design_review_verify_next.py --review review
