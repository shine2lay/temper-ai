<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roomwise offices (vacancy-v1: flex-between)</title>
<link rel="stylesheet" href="vacancy.css">
<style>
  /* Two fixed-width flex items spread to the ends of the row: the space between them is spread space. */
  .flex-between { display: flex; justify-content: space-between; }
  .flex-between > .office { width: 360px; height: 400px; }
</style>
</head>
<body>
<main>
  <section data-section="Intro">
    <div class="wrap">
      <p class="kicker">Roomwise, layout fixture</p>
      <div class="rule"></div>
    </div>
  </section>
  <section data-section="Offices">
    <div class="wrap">
      <h2>Offices</h2>
      <div class="rule"></div>
      <div class="flex-between">
        <article class="card office"><h3>North office</h3><p>Twelve rooms on two floors, one display by every door.</p></article>
        <article class="card office"><h3>South office</h3><p>Six rooms and a large hall that can be split in two.</p></article>
      </div>
    </div>
  </section>
</main>
</body>
</html>
