<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roomwise (vacancy-v1: hero-flex-no-media)</title>
<link rel="stylesheet" href="vacancy.css">
<style>
  /* A flex-row hero whose picture item was removed: only the copy is left, at the start of the row. */
  .hero-flex { display: flex; gap: 64px; }
  .hero-flex > .hero-copy { flex: 0 1 528px; }
</style>
</head>
<body>
<main>
  <section data-section="Intro">
    <div class="wrap">
      <p class="kicker">Roomwise, layout fixture</p>
      <div class="rule"></div>
    </div>
  </section>
  <section data-section="Hero">
    <div class="wrap">
      <div class="hero-flex">
        <div class="hero-copy">
          <h1>Book the right room before the meeting starts</h1>
          <p>Roomwise shows which rooms are free right now, holds one for you in two taps and frees it again when nobody turns up.</p>
          <p>No sign-up form and no card: your whole office is in within a minute.</p>
          <p><a class="button" href="#start">Start a free trial</a></p>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
