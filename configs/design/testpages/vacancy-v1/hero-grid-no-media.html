<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roomwise (vacancy-v1: hero-grid-no-media)</title>
<link rel="stylesheet" href="vacancy.css">
<style>
  /* A two-track hero whose picture item was removed: only the copy is left, in track 1. */
  .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; }
</style>
</head>
<body>
<main>
  <section data-section="Intro">
    <div class="wrap">
      <p class="kicker">Roomwise, layout fixture</p>
      <div class="rule"></div>
    </div>
  </section>
  <section data-section="Hero">
    <div class="wrap">
      <div class="hero-grid">
        <div class="hero-copy">
          <h1>Book the right room before the meeting starts</h1>
          <p>Roomwise shows which rooms are free right now, holds one for you in two taps and frees it again when nobody turns up.</p>
          <p>No sign-up form and no card: your whole office is in within a minute.</p>
          <p><a class="button" href="#start">Start a free trial</a></p>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
