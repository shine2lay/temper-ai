<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roomwise trial (vacancy-v1: pitch-form)</title>
<link rel="stylesheet" href="vacancy.css">
<style>
  /* A short pitch beside a tall sign-up form card: the pitch column ends early. */
  .pitch-form { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: start; }
  .pitch ul { margin: 0; padding-left: 24px; }
  .signup label { display: block; margin: 0 0 16px; font-weight: 700; }
  .signup input, .signup select {
    display: block; width: 100%; height: 48px; margin-top: 6px; padding: 0 12px;
    font: inherit; font-weight: 400; border: 1px solid #6b7280; border-radius: 6px; background: #ffffff; color: #1f2937;
  }
  .signup .button { border: 0; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<main>
  <section data-section="Intro">
    <div class="wrap">
      <p class="kicker">Roomwise, layout fixture</p>
      <div class="rule"></div>
    </div>
  </section>
  <section data-section="Trial">
    <div class="wrap">
      <div class="pitch-form">
        <div class="pitch">
          <h2>Start your free trial</h2>
          <p>Thirty days with every feature. Add a card only when you decide to stay.</p>
          <ul>
            <li>Set up in a minute</li>
            <li>Invite your whole office</li>
            <li>Cancel any time</li>
          </ul>
        </div>
        <form class="card signup" action="#" onsubmit="return false">
          <label>Work email <input type="email" name="email" autocomplete="email"></label>
          <label>Your name <input type="text" name="name" autocomplete="name"></label>
          <label>Company <input type="text" name="company" autocomplete="organization"></label>
          <label>Office size
            <select name="size">
              <option>Up to 20 people</option>
              <option>20 to 100 people</option>
              <option>More than 100 people</option>
            </select>
          </label>
          <label>Password <input type="password" name="password" autocomplete="new-password"></label>
          <button type="submit" class="button">Create my account</button>
        </form>
      </div>
    </div>
  </section>
</main>
</body>
</html>
