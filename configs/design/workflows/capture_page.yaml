workflow:
  name: capture_page
  version: 1
  description: >-
    Library tool candidate: capture a web page as-is and in full, with exact slices, positioned text and an honest status.
    Untouched first screen, reject-only cookie handling, honest completeness. No models.
  inputs:
    workspace_path: {type: string, required: true}
    url: {type: string, required: true}
    ready_selector: {type: string, default: body}
    viewports:
      type: array
      default:
        - {name: desktop, width: 1440, height: 900}
        - {name: mobile, width: 390, height: 844}
    timeout_ms: {type: integer, default: 30000}
    browser_url: {type: string, default: 'http://playwright-mcp:8931/mcp'}
  outputs:
    verified: verify.structured.verified
    receipt_path: verify.structured.receipt_path
    captures: verify.structured.captures
  nodes:
    - name: preflight
      type: agent
      agent: capture_page_preflight
      input_map:
        workspace_path: input.workspace_path
        url: input.url
        ready_selector: input.ready_selector
        viewports: input.viewports
        timeout_ms: input.timeout_ms
        browser_url: input.browser_url
    - name: capture
      type: agent
      agent: capture_page_capture
      depends_on: [preflight]
      input_map:
        workspace_path: input.workspace_path
        preflight_receipt: preflight.structured.receipt_path
    - name: verify
      type: agent
      agent: capture_page_verify
      depends_on: [capture]
      input_map:
        workspace_path: input.workspace_path
        capture_receipt: capture.structured.receipt_path
