# The same complete capture workflow reused as one stage, not collapsed to one step.
workflow:
  name: capture_page_example
  inputs:
    workspace_path: {type: string, required: true}
    url: {type: string, required: true}
  outputs:
    verified: page_evidence.structured.verified
    captures: page_evidence.structured.captures
    receipt_path: page_evidence.structured.receipt_path
  nodes:
    - name: page_evidence
      type: stage
      ref: capture_page
      input_map:
        workspace_path: input.workspace_path
        url: input.url
