# Design-owned app-screen workflow, v1 (docs/design-app-screen.md): the eight-stage product-design flow
# Design ran by hand for RollCall and Inkflow, encoded (owner 2026-11-04: "lets try to encode the
# different stages you had of your flow into temper wf"). Two owner gates for now, direction and final,
# "to gather information and maybe taste", to be encoded later for full autonomy. Every step's output is
# validated against its contract (configs/design/bin/app_screen/contracts.py). Until a stage's own task
# builds it, the stage runs in fixture mode only: it copies a frozen known case's output (packed into the
# workspace by the host: design_app_screen.py pack) and validates it. Real mode fails at the first
# unbuilt stage.
workflow:
  name: design_app_screen_v1
  version: 1
  description: |
    intake (the owner's words as requirements, verbatim, and open questions; a fenced model step
    between measured checks) -> existing
    (today's screens, captured and measured on the host beforehand; a fenced model step reads the
    contact sheet and the measures into journeys, every problem held to its captures and measures) -> ground
    (the design files, capability map, knowledge files and fixture prepared on the host beforehand; a fenced
    model step maps every page, API route, screen and requirement onto the screens x states x actions
    inventory, every entry held to its source ids; the shared fixture checked for its invariants) -> directions (two or more clickable directions with measured
    checks) -> DIRECTION gate -> build (the chosen direction, shell + one file per screen) -> checks
    (measured, by script) -> review (findings rated 0-4, Must/Should/Could/Won't; a Must loops back to
    build, at most twice) -> show (one Show&Tell share, the owner's comments) -> FINAL gate (approve, or
    changes: back to build as targeted edits, at most twice) -> handoff (spec per screen, design file,
    follow-ups). Each gate answer records choice, decided_by (owner or design), the owner's words
    verbatim, source and reason in gate_<name>.json. mode fixture runs the known case at $0.
  inputs:
    product: {type: string, required: true}
    mode: {type: string, default: real}
    request_json: {type: string, default: ""}
  outputs:
    direction: gate_direction.structured.choice
    direction_decided_by: gate_direction.structured.decided_by
    rounds: review.structured.round
    review_verdict: review.structured.verdict
    final_verdict: gate_final.structured.verdict
    final_decided_by: gate_final.structured.decided_by
  nodes:
    # Stage 1, intake (built, Design #206): the sources checked -> the model drafts requirements and
    # questions -> measured checks -> one revision only if a check failed -> final checks, outputs.
    - name: intake_collect
      type: agent
      agent: design_app_screen_stage_v1
      input_map: {step: intake_collect, product: input.product, mode: input.mode, data: input.request_json}
    - name: intake_read
      type: agent
      agent: design_app_screen_intake_v1
      depends_on: [intake_collect]
      condition: {source: intake_collect.structured.model, operator: equals, value: "yes"}
      input_map: {phase: draft}
    - name: intake_check
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [intake_read]
      input_map: {step: intake_check, product: input.product, mode: input.mode}
    - name: intake_revise
      type: agent
      agent: design_app_screen_intake_v1
      depends_on: [intake_check]
      condition: {source: intake_check.structured.verdict, operator: equals, value: retry}
      input_map: {phase: revise}
    - name: intake
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [intake_revise]
      input_map: {step: intake, product: input.product, mode: input.mode}
    - name: existing_collect
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [intake]
      input_map: {step: existing_collect, product: input.product, mode: input.mode}
    - name: existing_sheet
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [existing_collect]
      input_map: {step: existing_sheet, product: input.product, mode: input.mode}
    - name: existing_read
      type: agent
      agent: design_app_screen_existing_v1
      depends_on: [existing_collect, existing_sheet]
      condition: {source: existing_collect.structured.model, operator: equals, value: "yes"}
      input_map: {task: existing_collect.structured.task, sheet: existing_sheet.structured.sheet}
    - name: existing_check
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [existing_read]
      input_map: {step: existing_check, product: input.product, mode: input.mode, data: existing_read.output}
    - name: existing_revise
      type: agent
      agent: design_app_screen_existing_v1
      depends_on: [existing_sheet, existing_check]
      condition: {source: existing_check.structured.verdict, operator: equals, value: retry}
      input_map: {task: existing_check.structured.revise_task, sheet: existing_sheet.structured.sheet}
    - name: existing
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [existing_revise]
      input_map: {step: existing, product: input.product, mode: input.mode, data: existing_revise.output}
    - name: ground_collect
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [existing]
      input_map: {step: ground_collect, product: input.product, mode: input.mode}
    - name: ground_read
      type: agent
      agent: design_app_screen_ground_v1
      depends_on: [ground_collect]
      condition: {source: ground_collect.structured.model, operator: equals, value: "yes"}
      input_map: {task: ground_collect.structured.task}
    - name: ground_check
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [ground_read]
      input_map: {step: ground_check, product: input.product, mode: input.mode, data: ground_read.output}
    - name: ground_revise
      type: agent
      agent: design_app_screen_ground_v1
      depends_on: [ground_check]
      condition: {source: ground_check.structured.verdict, operator: equals, value: retry}
      input_map: {task: ground_check.structured.revise_task}
    - name: ground
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [ground_revise]
      input_map: {step: ground, product: input.product, mode: input.mode, data: ground_revise.output}
    - name: directions_collect
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [ground]
      input_map: {step: directions_collect, product: input.product, mode: input.mode}
    - name: directions_read
      type: agent
      agent: design_app_screen_directions_v1
      depends_on: [directions_collect]
      condition: {source: directions_collect.structured.model, operator: equals, value: "yes"}
      input_map: {task: directions_collect.structured.task}
    - name: directions_check
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [directions_read]
      condition: {source: directions_collect.structured.model, operator: equals, value: "yes"}
      input_map: {step: directions_check, product: input.product, mode: input.mode, data: directions_read.output}
    - name: directions_revise
      type: agent
      agent: design_app_screen_directions_v1
      depends_on: [directions_check]
      condition: {source: directions_check.structured.verdict, operator: equals, value: retry}
      input_map: {task: directions_check.structured.revise_task}
    - name: directions
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [directions_revise]
      input_map: {step: directions, product: input.product, mode: input.mode, data: directions_revise.output}
    - name: gate_direction
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [directions]
      gate: true
      input_map: {step: gate_direction, product: input.product, mode: input.mode}
    - name: build
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [gate_direction]
      input_map: {step: build, product: input.product, mode: input.mode}
    - name: build_read
      type: agent
      agent: design_app_screen_build_v1
      depends_on: [build]
      condition: {source: build.structured.model, operator: equals, value: "yes"}
      input_map: {task: build.structured.task}
    - name: build_check
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [build_read]
      input_map: {step: build_check, product: input.product, mode: input.mode, data: build_read.output}
    - name: build_revise
      type: agent
      agent: design_app_screen_build_v1
      depends_on: [build_check]
      condition: {source: build_check.structured.verdict, operator: equals, value: retry}
      input_map: {task: build_check.structured.revise_task}
    - name: build_finish
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [build_revise]
      input_map: {step: build_finish, product: input.product, mode: input.mode, data: build_revise.output}
    - name: checks
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [build_finish]
      input_map: {step: checks, product: input.product, mode: input.mode}
    - name: review_collect
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [checks]
      input_map: {step: review_collect, product: input.product, mode: input.mode}
    - name: review_read
      type: agent
      agent: design_app_screen_review_v1
      depends_on: [review_collect]
      condition: {source: review_collect.structured.model, operator: equals, value: "yes"}
      input_map: {task: review_collect.structured.task, sheet: review_collect.structured.sheet}
    - name: review_check
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [review_read]
      input_map: {step: review_check, product: input.product, mode: input.mode, data: review_read.output}
    - name: review_revise
      type: agent
      agent: design_app_screen_review_v1
      depends_on: [review_collect, review_check]
      condition: {source: review_check.structured.verdict, operator: equals, value: retry}
      input_map: {task: review_check.structured.revise_task, sheet: review_collect.structured.sheet}
    - name: review
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [review_revise]
      loop_to: build
      max_loops: 2
      on_max_loops: fail
      loop_condition: {source: review.structured.verdict, operator: equals, value: revise}
      input_map: {step: review, product: input.product, mode: input.mode, data: review_revise.output}
    - name: show
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [review]
      input_map: {step: show, product: input.product, mode: input.mode}
    - name: gate_final
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [show]
      gate: true
      input_map: {step: gate_final, product: input.product, mode: input.mode}
    - name: gate_final_next
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [gate_final]
      loop_to: build
      max_loops: 2
      on_max_loops: fail
      loop_condition: {source: gate_final_next.structured.verdict, operator: equals, value: changes}
      input_map: {step: gate_final_next, product: input.product, mode: input.mode}
    - name: handoff
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [gate_final_next]
      input_map: {step: handoff, product: input.product, mode: input.mode}
