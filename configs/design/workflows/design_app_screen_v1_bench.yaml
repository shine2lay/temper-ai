# Design-owned benchmark/harness twin of design_app_screen_v1 (Rule 36 / Rule 42):
# Runs all 8 stages + 2 gates of design_app_screen_v1 through the production stage code path
# on prepared known-case inputs, replacing only the fenced model steps (and browser measurement boundary)
# with `design_app_screen_replay` at the boundary so CI and harness runs execute at $0 with zero live model calls.
workflow:
  name: design_app_screen_v1_bench
  version: 1
  description: |
    Outside harness/bench twin of design_app_screen_v1: runs every collect, check, finish, and gate step
    via design_app_screen_stage_v1 while replaying recorded/synthesized model drafts at the
    model boundary via design_app_screen_replay.
  inputs:
    product: {type: string, required: true}
    request_json: {type: string, default: ""}
  outputs:
    direction: gate_direction.structured.choice
    direction_decided_by: gate_direction.structured.decided_by
    rounds: review.structured.round
    review_verdict: review.structured.verdict
    final_verdict: gate_final.structured.verdict
    final_decided_by: gate_final.structured.decided_by
  nodes:
    - name: workspace_startup
      type: agent
      agent: design_app_screen_replay
      input_map:
        step: workspace_startup
        product: input.product
        run_slug: design
        task_name: input.product
        ref: origin/master
        department: design
        exclude_dirs: '[".temper/design"]'

    - name: intake
      type: stage
      depends_on: [workspace_startup]
      input_map:
        product: input.product
        request_json: input.request_json
        workspace_path: workspace_startup.structured.department_path
      nodes:
        - name: intake_collect
          type: agent
          agent: design_app_screen_stage_v1
          input_map: {step: intake_collect, product: input.product, data: input.request_json, workspace_path: input.workspace_path}
        - name: intake_read
          type: agent
          agent: design_app_screen_replay
          depends_on: [intake_collect]
          condition: {source: intake_collect.structured.model, operator: equals, value: "yes"}
          input_map: {step: intake, product: input.product}
        - name: intake_check
          type: agent
          agent: design_app_screen_stage_v1
          depends_on: [intake_read]
          input_map: {step: intake_check, product: input.product, workspace_path: input.workspace_path}
        - name: intake_revise
          type: agent
          agent: design_app_screen_replay
          depends_on: [intake_check]
          condition: {source: intake_check.structured.verdict, operator: equals, value: retry}
          input_map: {step: intake, product: input.product}
        - name: intake_finish
          type: agent
          agent: design_app_screen_stage_v1
          depends_on: [intake_revise]
          input_map: {step: intake, product: input.product, workspace_path: input.workspace_path}

    - name: existing
      type: stage
      depends_on: [intake]
      input_map:
        product: input.product
        credentials: input.credentials
        workspace_path: workspace_startup.structured.department_path
      nodes:
        - name: stack_up_ref
          type: agent
          agent: design_app_screen_replay
          input_map: {step: stack_up_ref, product: input.product, ref: origin/master, slug: design}
        - name: stack_seed
          type: agent
          agent: design_app_screen_replay
          depends_on: [stack_up_ref]
          input_map: {step: stack_seed, env_name: stack_up_ref.structured.env_name, product: input.product, slug: design}
        - name: existing_collect
          type: agent
          agent: design_app_screen_stage_v1
          depends_on: [stack_seed]
          input_map:
            step: existing_collect
            product: input.product
            workspace_path: input.workspace_path
            base_url: stack_up_ref.structured.base_url
            stack_commit: stack_up_ref.structured.commit
            stack_env_name: stack_up_ref.structured.env_name
            stack_reused: stack_up_ref.structured.reused
            credentials: input.credentials
        - name: existing_sheet
          type: agent
          agent: design_app_screen_stage_v1
          depends_on: [existing_collect]
          input_map: {step: existing_sheet, product: input.product, workspace_path: input.workspace_path}
        - name: existing_read
          type: agent
          agent: design_app_screen_replay
          depends_on: [existing_collect, existing_sheet]
          condition: {source: existing_collect.structured.model, operator: equals, value: "yes"}
          input_map: {step: existing, product: input.product}
        - name: existing_check
          type: agent
          agent: design_app_screen_stage_v1
          depends_on: [existing_read]
          input_map: {step: existing_check, product: input.product, data: existing_read.output, workspace_path: input.workspace_path}
        - name: existing_revise
          type: agent
          agent: design_app_screen_replay
          depends_on: [existing_sheet, existing_check]
          condition: {source: existing_check.structured.verdict, operator: equals, value: retry}
          input_map: {step: existing, product: input.product}
        - name: existing_finish
          type: agent
          agent: design_app_screen_stage_v1
          depends_on: [existing_revise]
          input_map: {step: existing, product: input.product, data: existing_revise.output, workspace_path: input.workspace_path}

    - name: ground
      type: stage
      depends_on: [existing]
      input_map: {product: input.product, workspace_path: workspace_startup.structured.department_path}
      nodes:
        - name: ground_collect
          type: agent
          agent: design_app_screen_stage_v1
          input_map: {step: ground_collect, product: input.product, workspace_path: input.workspace_path}
        - name: ground_read
          type: agent
          agent: design_app_screen_replay
          depends_on: [ground_collect]
          condition: {source: ground_collect.structured.model, operator: equals, value: "yes"}
          input_map: {step: ground, product: input.product}
        - name: ground_check
          type: agent
          agent: design_app_screen_stage_v1
          depends_on: [ground_read]
          input_map: {step: ground_check, product: input.product, data: ground_read.output, workspace_path: input.workspace_path}
        - name: ground_revise
          type: agent
          agent: design_app_screen_replay
          depends_on: [ground_check]
          condition: {source: ground_check.structured.verdict, operator: equals, value: retry}
          input_map: {step: ground, product: input.product}
        - name: ground_finish
          type: agent
          agent: design_app_screen_stage_v1
          depends_on: [ground_revise]
          input_map: {step: ground, product: input.product, data: ground_revise.output, workspace_path: input.workspace_path}

    - name: directions
      type: stage
      depends_on: [ground]
      input_map: {product: input.product, workspace_path: workspace_startup.structured.department_path}
      nodes:
        - name: directions_collect
          type: agent
          agent: design_app_screen_stage_v1
          input_map: {step: directions_collect, product: input.product, workspace_path: input.workspace_path}
        - name: directions_read
          type: agent
          agent: design_app_screen_replay
          depends_on: [directions_collect]
          condition: {source: directions_collect.structured.model, operator: equals, value: "yes"}
          input_map: {step: directions, product: input.product}
        - name: directions_check
          type: agent
          agent: design_app_screen_stage_v1
          depends_on: [directions_read]
          condition: {source: directions_collect.structured.model, operator: equals, value: "yes"}
          input_map: {step: directions_check, product: input.product, data: directions_read.output, workspace_path: input.workspace_path}
        - name: directions_revise
          type: agent
          agent: design_app_screen_replay
          depends_on: [directions_check]
          condition: {source: directions_check.structured.verdict, operator: equals, value: retry}
          input_map: {step: directions, product: input.product}
        - name: directions_finish
          type: agent
          agent: design_app_screen_stage_v1
          depends_on: [directions_revise]
          input_map: {step: directions, product: input.product, data: directions_revise.output, workspace_path: input.workspace_path}

    - name: gate_direction
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [directions]
      gate: true
      input_map:
        step: gate_direction
        product: input.product
        workspace_path: workspace_startup.structured.department_path

    - name: build
      type: stage
      depends_on: [gate_direction]
      input_map: {product: input.product, workspace_path: workspace_startup.structured.department_path}
      nodes:
        - name: build_collect
          type: agent
          agent: design_app_screen_stage_v1
          input_map: {step: build, product: input.product, workspace_path: input.workspace_path}
        - name: build_read
          type: agent
          agent: design_app_screen_replay
          depends_on: [build_collect]
          condition: {source: build_collect.structured.model, operator: equals, value: "yes"}
          input_map: {step: build, product: input.product}
        - name: build_check
          type: agent
          agent: design_app_screen_stage_v1
          depends_on: [build_read]
          input_map: {step: build_check, product: input.product, data: build_read.output, workspace_path: input.workspace_path}
        - name: build_revise
          type: agent
          agent: design_app_screen_replay
          depends_on: [build_check]
          condition: {source: build_check.structured.verdict, operator: equals, value: retry}
          input_map: {step: build, product: input.product}
        - name: build_finish
          type: agent
          agent: design_app_screen_stage_v1
          depends_on: [build_revise]
          input_map: {step: build_finish, product: input.product, data: build_revise.output, workspace_path: input.workspace_path}

    - name: checks
      type: stage
      depends_on: [build]
      input_map: {product: input.product, workspace_path: workspace_startup.structured.department_path}
      nodes:
        - name: checks_finish
          type: agent
          agent: design_app_screen_replay
          input_map: {step: checks, product: input.product, workspace_path: input.workspace_path}

    - name: review
      type: stage
      depends_on: [checks]
      loop_to: build
      max_loops: 2
      on_max_loops: fail
      loop_condition: {source: review.structured.verdict, operator: equals, value: revise}
      input_map: {product: input.product, workspace_path: workspace_startup.structured.department_path}
      nodes:
        - name: review_collect
          type: agent
          agent: design_app_screen_stage_v1
          input_map: {step: review_collect, product: input.product, workspace_path: input.workspace_path}
        - name: review_read
          type: agent
          agent: design_app_screen_replay
          depends_on: [review_collect]
          condition: {source: review_collect.structured.model, operator: equals, value: "yes"}
          input_map: {step: review, product: input.product}
        - name: review_check
          type: agent
          agent: design_app_screen_stage_v1
          depends_on: [review_read]
          input_map: {step: review_check, product: input.product, data: review_read.output, workspace_path: input.workspace_path}
        - name: review_revise
          type: agent
          agent: design_app_screen_replay
          depends_on: [review_collect, review_check]
          condition: {source: review_check.structured.verdict, operator: equals, value: retry}
          input_map: {step: review, product: input.product}
        - name: review_finish
          type: agent
          agent: design_app_screen_stage_v1
          depends_on: [review_revise]
          input_map: {step: review, product: input.product, data: review_revise.output, workspace_path: input.workspace_path}

    - name: show
      type: stage
      depends_on: [review]
      input_map: {product: input.product, workspace_path: workspace_startup.structured.department_path}
      nodes:
        - name: show_finish
          type: agent
          agent: design_app_screen_stage_v1
          input_map: {step: show, product: input.product, workspace_path: input.workspace_path}

    - name: gate_final
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [show]
      gate: true
      loop_to: build
      max_loops: 2
      on_max_loops: fail
      loop_condition: {source: gate_final.structured.verdict, operator: equals, value: changes}
      input_map:
        step: gate_final
        product: input.product
        workspace_path: workspace_startup.structured.department_path

    - name: handoff
      type: stage
      depends_on: [gate_final]
      input_map: {product: input.product, workspace_path: workspace_startup.structured.department_path}
      nodes:
        - name: handoff_finish
          type: agent
          agent: design_app_screen_stage_v1
          input_map: {step: handoff, product: input.product, workspace_path: input.workspace_path}

    - name: stack_down
      type: agent
      agent: design_app_screen_replay
      depends_on: [handoff]
      run_after_failure: true
      input_map: {step: stack_down, product: input.product, slug: design}

    - name: workspace_cleanup
      type: agent
      agent: design_app_screen_replay
      depends_on: [handoff]
      run_after_failure: true
      input_map:
        step: workspace_cleanup
        product: input.product
        run_slug: design
        task_name: input.product
        department: design
        force: "false"
