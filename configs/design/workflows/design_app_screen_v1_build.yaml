# Stage 5 (build) standalone workflow for testing and stage-by-stage trials (rule 16).
# Uses the exact same five Stage 5 nodes (`build` -> `build_read` -> `build_check` -> `build_revise` -> `build_finish`)
# as `design_app_screen_v1.yaml`.
workflow:
  name: design_app_screen_v1_build
  version: 1
  description: |
    Stage 5 of design_app_screen_v1 alone: validates 03-ground/ and 04-directions/, writes the base
    HTML/JS shell, router, and tokens.css, calls the fenced model screen writer (design_app_screen_build_v1)
    to produce 05-build/draft.json, compiles real per-state screens in 05-build/screens/<id>.js, and
    runs deterministic build_check (with one revision pass if needed).
  inputs:
    product: {type: string, required: true}
  outputs:
    direction: build.structured.direction
    round: build.structured.round
    screens: build.structured.screens
    views: build.structured.views
    verdict: build_finish.structured.verdict
  nodes:
    - name: build
      type: agent
      agent: design_app_screen_stage_v1
      input_map: {step: build, product: input.product}
    - name: build_read
      type: agent
      agent: design_app_screen_build_v1
      depends_on: [build]
      condition: {source: build.structured.model, operator: equals, value: "yes"}
      input_map: {task: build.structured.task}
    - name: build_check
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [build_read]
      input_map: {step: build_check, product: input.product, data: build_read.output}
    - name: build_revise
      type: agent
      agent: design_app_screen_build_v1
      depends_on: [build_check]
      condition: {source: build_check.structured.verdict, operator: equals, value: retry}
      input_map: {task: build_check.structured.revise_task}
    - name: build_finish
      type: agent
      agent: design_app_screen_stage_v1
      depends_on: [build_revise]
      input_map: {step: build_finish, product: input.product, data: build_revise.output}
