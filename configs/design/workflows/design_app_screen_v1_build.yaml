# Stage 5a (build, deterministic half) of design_app_screen_v1 on its own (rule 16: each stage tested alone
# on known cases): the same build node as the whole workflow, ending at 05-build/build.json. Used for the
# stage's trials and re-runs (docs/design-app-screen.md, "Stage 5: build"). Before a run the workspace holds
# 01-request/, 03-ground/ and 04-directions/ (with gate_direction.json). No model runs in Stage 5a.
# Keep its node identical to the whole workflow's, since a trial proves the stage only while they match
# (tests/test_design_app_screen_build.py checks that they do).
workflow:
  name: design_app_screen_v1_build
  version: 1
  description: |
    Stage 5a (build, deterministic half) of design_app_screen_v1 alone: stage 3's 03-ground/ (inventory.json,
    fixture.json, design-files/tokens.json, DESIGN.md) and stage 4's 04-directions/ (directions.json,
    gate_direction.json) validated at the boundary -> deterministic prototype scaffold written to 05-build/
    (index.html shell, styles/tokens.css, shell/router.js, screens/<screen-id>.js one file per screen with
    data-build-placeholder="<screen-id>", fixture.json and build.json) -> verified by build_check.py (screen
    files, routing targets, data-req fields in fixture.json, no hardcoded figures, tokens from product file).
    No model, $0.
  inputs:
    product: {type: string, required: true}
    mode: {type: string, default: real}
  outputs:
    verdict: build.structured.verdict
    direction: build.structured.direction
    screens: build.structured.screens
    views: build.structured.views
  nodes:
    - name: build
      type: agent
      agent: design_app_screen_stage_v1
      input_map: {step: build, product: input.product, mode: input.mode}
