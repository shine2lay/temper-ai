# CRAFT-CRITIC BENCHMARK (design role, queue #10). One page of a craft test site (configs/design/
# testpages/craft-v1: two clean homepages and variants with one measurable craft problem each) goes
# through the same capture and craft facts as a live design_homepage_v2 round, then the LIVE craft
# critic, unchanged, judges it:
#
#   prepare (script) -> craft (design_homepage_craft_critic_v2) -> collect (script)
#
# The answer key stays on the host (~/design-lab/answers/), where findings are graded for recall,
# false alarms on clean pages and run-to-run stability. One run per page; docs/design.md has how to
# run and grade the set. About $0.6-0.7 a run.
workflow:
  name: design_craft_bench_next
  # CANDIDATE (queue #39): the page checks in facts.md and the candidate craft critic (severity
  # anchors, empty column, pictures judged by section purpose). Renamed only if it wins.
  version: 2
  description: |
    Benchmark of the homepage craft critic on one test page: the page is captured and measured
    exactly as in a design_homepage_v2 review round (screenshots, usability facts, craft facts,
    brief, direction), then the live craft critic writes review/craft/craft.json, and collect
    checks and summarises it. Graded on the host against a key the box never sees.
  inputs:
    site:
      type: string
      required: true    # a craft test site folder inside the run container, e.g. /app/configs/design/testpages/craft-v1
    page:
      type: string
      required: true    # one page of that site, e.g. page-03
  outputs:
    craft_path: collect.structured.craft_path
    findings: collect.structured.findings
    severity_counts: collect.structured.severity_counts
    checks: collect.structured.checks
  nodes:
    - name: prepare
      type: agent
      agent: design_craft_bench_stage_next
      input_map: {stage: prepare, site: input.site, page: input.page}
    - name: craft
      type: agent
      agent: design_homepage_craft_critic_v2_next
      depends_on: [prepare]
    - name: collect
      type: agent
      agent: design_craft_bench_stage_next
      depends_on: [craft]
      input_map: {stage: collect}
