# Benchmark twin of design_homepage_v2 (queue #10, Design's scoreboard). Same nodes, agents,
# checks and loops; every script stage runs with mode: bench, and the two owner gates are
# plain steps: direction builds the art director's recommended concept (concepts.json
# "recommended"), final records "benchmark_skipped" and labels the page not owner-approved.
# Fictional briefs only (the brief stage refuses real deliverables); never a taste entry
# (it reads the owner's taste file like a real run). The owner judges benchmark pages blind
# on ~/design-lab/scoreboard.md; AI judging is advisory. tests/test_design_homepage_v2.py
# keeps it in step with v2.
workflow:
  name: design_homepage_v2_bench
  version: 1
  description: |
    Benchmark run of design_homepage_v2 on a fixed fictional brief (paid models, same
    stages and checks): copy deck + content critic, references, three concepts and the
    art director's recommendation, then the recommended concept is built (no owner
    direction gate), review rounds with runtime checks and the content critic, Penpot
    conversion and verification, handoff, and a skipped final gate (verdict
    benchmark_skipped, not owner-approved). Used to compare workflow versions blind;
    real products refuse this workflow at the brief stage.
  inputs:
    brief_json: {type: string, required: true}
    references_json: {type: string, required: true}
    direction_json: {type: string, default: ""}
    taste_md: {type: string, default: ""}
  outputs:
    copy_diff: copy_check.structured.diff_path
    contact_sheet: check.structured.contact_sheet
    handoff_path: handoff.structured.handoff_path
    manifest_path: handoff.structured.manifest_path
    penpot_url: handoff.structured.penpot_url
    final_verdict: final.structured.verdict
  nodes:
    - name: brief
      type: agent
      agent: design_homepage_stage_v2
      input_map: {stage: brief, mode: bench, data: input.brief_json}
    - name: references
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [brief]
      input_map: {stage: references, mode: bench, data: input.references_json}
    - name: taste
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [brief]
      input_map: {stage: taste, mode: bench, data: input.taste_md}
    - name: copy
      type: agent
      agent: design_homepage_copywriter_v2
      depends_on: [taste]
      input_map: {phase: draft}
    - name: copy_check_draft
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [copy]
      input_map: {stage: copy_check, mode: bench, phase: draft}
    - name: copy_review
      type: agent
      agent: design_homepage_content_critic_v2
      depends_on: [copy_check_draft]
      input_map: {target: deck}
    - name: copy_revise
      type: agent
      agent: design_homepage_copywriter_v2
      depends_on: [copy_review]
      input_map: {phase: revise}
    - name: copy_check
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [copy_revise]
      input_map: {stage: copy_check, mode: bench, phase: final}
    - name: copy_next
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [copy_check]
      loop_to: copy_revise
      max_loops: 2
      on_max_loops: fail
      loop_condition: {source: copy_next.structured.verdict, operator: equals, value: retry}
      input_map: {stage: copy_next, mode: bench}
    - name: pairings
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [copy_next]
      input_map: {stage: pairings, mode: bench}
    - name: concepts
      type: agent
      agent: design_homepage_art_director_v2
      depends_on: [references, copy_next, pairings]
      input_map: {phase: draft}
    - name: check_draft
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [concepts]
      input_map: {stage: concepts_check, mode: bench, phase: draft}
    - name: refine
      type: agent
      agent: design_homepage_art_director_v2
      depends_on: [check_draft]
      input_map: {phase: refine}
    - name: check
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [refine]
      input_map: {stage: concepts_check, mode: bench, phase: final}
    - name: concepts_next
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [check]
      loop_to: refine
      max_loops: 3
      on_max_loops: fail
      loop_condition: {source: concepts_next.structured.verdict, operator: equals, value: retry}
      input_map: {stage: concepts_next, mode: bench}
    - name: direction
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [concepts_next]
      input_map: {stage: direction, mode: bench}
    - name: build
      type: agent
      agent: design_homepage_designer_v2
      depends_on: [direction]
    - name: plan_round
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [build]
      input_map: {stage: plan_round, mode: bench}
    - name: revise
      type: agent
      agent: design_homepage_reviser_v2
      depends_on: [plan_round]
      condition: {source: plan_round.structured.action, operator: equals, value: revise}
    - name: measure
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [revise]
      input_map: {stage: measure, mode: bench}
    - name: critic_a
      type: agent
      agent: design_critic
      depends_on: [measure]
    - name: critic_b
      type: agent
      agent: design_critic
      depends_on: [measure]
    - name: craft
      type: agent
      agent: design_homepage_craft_critic_v2
      depends_on: [measure]
    - name: runtime
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [measure]
      input_map: {stage: runtime, mode: bench}
    - name: content
      type: agent
      agent: design_homepage_content_critic_v2
      depends_on: [runtime]
      input_map: {target: page}
    - name: merge
      type: agent
      agent: design_merge
      depends_on: [critic_a, critic_b]
    - name: combine
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [merge, craft, runtime, content]
      input_map: {stage: combine, mode: bench}
    - name: next_round
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [combine]
      loop_to: plan_round
      max_loops: 3
      on_max_loops: fail
      loop_condition: {source: next_round.structured.verdict, operator: equals, value: revise}
      input_map: {stage: next_round, mode: bench}
    - name: convert
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [next_round]
      input_map: {stage: convert, mode: bench}
    - name: verify
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [convert]
      input_map: {stage: verify, mode: bench}
    - name: handoff
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [verify]
      input_map: {stage: handoff, mode: bench}
    - name: final
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [handoff]
      input_map: {stage: final, mode: bench}
    - name: after_final
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [final]
      loop_to: plan_round
      max_loops: 3
      on_max_loops: fail
      loop_condition: {source: final.structured.verdict, operator: equals, value: request_changes}
      input_map: {stage: next_round, mode: bench}
