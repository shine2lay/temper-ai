# Design-owned $0 proof of design_homepage_v2's plumbing: the same script stages, gates
# and loops with model-free stand-ins for the researcher and the director (queue #38,
# configs/design/fixtures/research/<product>/), the art director, designer, critics and
# reviser. It renders, measures and converts to a real Penpot file (design-agent Drafts), so
# it proves the research step, gates, cancel/resume with the same run id, review loops, the
# converter and saving the design files. The host packs a product from a fixture registry
# first (design_files.py pack). Gate answers say decided_by "fixture-test": never a Design or
# owner decision.
workflow:
  name: design_homepage_v2_fixture
  version: 1
  description: |
    Model-free fixture of design_homepage_v2: inventory of the fixture product's design
    files -> stand-in users profile and category pick, checked by the real checks (quotes
    re-opened in the pack) -> real capture of local fixture pages with the five audience
    axes -> stand-in direction candidates checked against the playbook -> research.json,
    RESEARCH.md and the board (rendered and checked) -> RESEARCH gate -> decision and
    research/FOR_DESIGN.md -> fixture brief, the taste file passed in, stand-in copy deck, content review and revision with the real copy checks
    (quotes, before/after), references (local fixture pages) -> fixture concepts (three
    converter test pages) -> real concept check -> DIRECTION gate (taste entry saved) ->
    fixture build -> review round 1 (fixture findings, severity 3; real runtime checks,
    advisory here; stand-in content review with one quote the page lacks) ->
    fixture revision -> round 2 (severity 1) -> convert to Penpot -> verify -> handoff ->
    FINAL gate (request changes loops back once; approve ends) -> design files saved on
    approval. Costs $0.
  inputs:
    research_json: {type: string, required: true}
    direction_json: {type: string, default: ""}
    taste_md: {type: string, default: ""}
  outputs:
    design_status: research.structured.status
    research_path: research_assemble.structured.research_path
    research_board: research_assemble.structured.board
    research_decided_by: research_decision.structured.decided_by
    research_direction: research_decision.structured.direction
    copy_diff: copy_check.structured.diff_path
    contact_sheet: check.structured.contact_sheet
    handoff_path: handoff.structured.handoff_path
    penpot_url: handoff.structured.penpot_url
    final_verdict: final.structured.verdict
    direction_approved: final.structured.direction_approved
    final_approved: final.structured.final_approved
    design_files: save_files.structured.saved
    design_files_approved_by: save_files.structured.approved_by
  nodes:
    - name: brief
      type: agent
      agent: design_homepage_stage_v2
      input_map: {stage: brief, mode: fixture}
    - name: references
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [brief]
      input_map: {stage: references, mode: fixture}
    - name: taste
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [brief]
      input_map: {stage: taste, mode: fixture, data: input.taste_md}
    # ---- research step with stand-ins for the two research agents
    - name: research
      type: agent
      agent: design_research_stage_v1
      depends_on: [taste]
      input_map: {stage: inventory, mode: fixture, data: input.research_json}
    - name: research_users
      type: agent
      agent: design_research_stage_v1
      depends_on: [research]
      condition: {source: research.structured.research_agent, operator: equals, value: "yes"}
      input_map: {stage: fixture, mode: fixture, phase: users}
    - name: research_check
      type: agent
      agent: design_research_stage_v1
      depends_on: [research_users]
      input_map: {stage: check, mode: fixture, phase: final}
    - name: research_check_next
      type: agent
      agent: design_research_stage_v1
      depends_on: [research_check]
      loop_to: research_users
      max_loops: 1
      on_max_loops: fail
      loop_condition: {source: research_check_next.structured.verdict, operator: equals, value: retry}
      input_map: {stage: next, mode: fixture, phase: check}
    - name: research_capture
      type: agent
      agent: design_research_stage_v1
      depends_on: [research_check_next]
      condition: {source: research.structured.research_category, operator: equals, value: "yes"}
      input_map: {stage: capture, mode: fixture}
    - name: research_direction
      type: agent
      agent: design_research_stage_v1
      depends_on: [research_capture]
      condition: {source: research.structured.research_direction, operator: equals, value: "yes"}
      input_map: {stage: fixture, mode: fixture, phase: direction}
    - name: research_assemble
      type: agent
      agent: design_research_stage_v1
      depends_on: [research_direction]
      input_map: {stage: assemble, mode: fixture, phase: final}
    - name: research_assemble_next
      type: agent
      agent: design_research_stage_v1
      depends_on: [research_assemble]
      loop_to: research_direction
      max_loops: 1
      on_max_loops: fail
      loop_condition: {source: research_assemble_next.structured.verdict, operator: equals, value: retry}
      input_map: {stage: next, mode: fixture, phase: assemble}
    - name: research_gate
      type: agent
      agent: design_research_stage_v1
      depends_on: [research_assemble_next]
      gate: true
      condition: {source: research.structured.gate, operator: equals, value: "on"}
      input_map: {stage: gate, mode: fixture}
    - name: research_decision
      type: agent
      agent: design_research_stage_v1
      depends_on: [research_gate]
      input_map: {stage: decision, mode: fixture}
    # ---- the homepage fixture stages
    - name: copy
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [research_decision]
      input_map: {stage: copy_fixture, mode: fixture, phase: draft}
    - name: copy_check_draft
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [copy]
      input_map: {stage: copy_check, mode: fixture, phase: draft}
    - name: copy_review
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [copy_check_draft]
      input_map: {stage: copy_fixture, mode: fixture, phase: review}
    - name: copy_revise
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [copy_review]
      input_map: {stage: copy_fixture, mode: fixture, phase: revise}
    - name: copy_check
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [copy_revise]
      input_map: {stage: copy_check, mode: fixture, phase: final}
    - name: copy_next
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [copy_check]
      loop_to: copy_revise
      max_loops: 2
      on_max_loops: fail
      loop_condition: {source: copy_next.structured.verdict, operator: equals, value: retry}
      input_map: {stage: copy_next, mode: fixture}
    - name: pairings
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [copy_next]
      input_map: {stage: pairings, mode: fixture}
    - name: concepts
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [references, copy_next, pairings]
      input_map: {stage: concepts_fixture, mode: fixture}
    - name: check
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [concepts]
      input_map: {stage: concepts_check, mode: fixture, phase: final}
    - name: concepts_next
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [check]
      loop_to: concepts
      max_loops: 2
      on_max_loops: fail
      loop_condition: {source: concepts_next.structured.verdict, operator: equals, value: retry}
      input_map: {stage: concepts_next, mode: fixture}
    - name: direction
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [concepts_next]
      gate: true
      input_map: {stage: direction, mode: fixture, data: input.direction_json}
    - name: build
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [direction]
      input_map: {stage: build_fixture, mode: fixture}
    - name: plan_round
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [build]
      input_map: {stage: plan_round, mode: fixture}
    - name: revise
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [plan_round]
      condition: {source: plan_round.structured.action, operator: equals, value: revise}
      input_map: {stage: revise_fixture, mode: fixture}
    - name: measure
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [revise]
      input_map: {stage: measure, mode: fixture}
    - name: review
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [measure]
      input_map: {stage: review_fixture, mode: fixture}
    - name: runtime
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [measure]
      input_map: {stage: runtime, mode: fixture}
    - name: content
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [runtime]
      input_map: {stage: content_fixture, mode: fixture}
    - name: combine
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [review, runtime, content]
      input_map: {stage: combine, mode: fixture}
    - name: next_round
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [combine]
      loop_to: plan_round
      max_loops: 3
      on_max_loops: fail
      loop_condition: {source: next_round.structured.verdict, operator: equals, value: revise}
      input_map: {stage: next_round, mode: fixture}
    - name: convert
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [next_round]
      input_map: {stage: convert, mode: fixture}
    - name: verify
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [convert]
      input_map: {stage: verify, mode: fixture}
    - name: handoff
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [verify]
      input_map: {stage: handoff, mode: fixture}
    - name: final
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [handoff]
      gate: true
      input_map: {stage: final, mode: fixture}
    - name: after_final
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [final]
      loop_to: plan_round
      max_loops: 3
      on_max_loops: fail
      loop_condition: {source: final.structured.verdict, operator: equals, value: request_changes}
      input_map: {stage: next_round, mode: fixture}
    - name: save_files
      type: agent
      agent: design_research_stage_v1
      depends_on: [after_final]
      condition: {source: final.structured.verdict, operator: equals, value: approved}
      input_map: {stage: save, mode: fixture}
