# CANDIDATE (Design, W4e, hypotheses H4-H7 in ~/design-lab/homepage-workflow/HYPOTHESES.md):
# design_homepage_v2 with the countable review work moved from models to scripts. Beside the live
# workflow, never instead of it: the live design_homepage_v2 and its agents are unchanged, and this
# file is promoted to the live name only after W8, W10 and W11 win (a later task). What changes:
#   H4  a facts check (design_verify, review_verify node) between the two critics and the merge;
#       the merge has no fallback that does the check itself.
#   H5  review/measured.json: every measured problem of the capture, levelled by the rules
#       (measured step); the critics and the merge take it as given (design_critic_next,
#       design_merge_next) and merge_join puts it in review/findings.json, one finding per problem.
#       Empty columns are craft candidates the craft critic answers yes or no.
#   H6  review/anchors.json: the settled craft numbers (craft_anchors step); the craft critic takes
#       them as given (design_homepage_craft_critic_v2_next) and craft_join writes review/craft/craft.json.
#   H7  the countable word checks on the draft deck (deck_words, after copy_check_draft) and on the
#       page (page_words); the content critic takes them as given
#       (design_homepage_content_critic_v2_next) and the joins write what copy_check and combine read.
# The script steps run bin/design_homepage_next.py (design_homepage_stage_next); the measure step
# counts the spacing share from 4 px up (hairlines left out). Test twins: design_homepage_review_next
# (W8), design_craft_bench_next (W10), design_homepage_copy_review_next and
# design_homepage_content_next (W11).
#
# Design-owned homepage workflow, v2 (design in code, then editable Penpot), with the research
# step first (queue #38, docs/design-files.md): the product's design files decide what is
# researched (none -> users, category and direction; partial -> only the missing parts, the
# approved ones fixed; defined -> no research, the files are followed). The host packs the
# product's files into the workspace first (design_files.py pack). The chat running the run
# answers the research, direction and final gates as Design (decided_by design); decided_by
# owner only for the owner's own words, kept verbatim. No agent answers a gate. v1 stays as
# it is; the pilot and bench twins have no research step.
workflow:
  name: design_homepage_v2_next
  version: 2
  description: |
    CANDIDATE of design_homepage_v2 (W4e): the same workflow, with scripts doing the review's
    countable work. Measured problems (review/measured.json), the settled craft numbers
    (review/anchors.json) and the countable word checks (homepage/copy/words.json on the draft
    deck, review/words.json on the page) are found by scripts and taken as given by the critics,
    who judge only what no script measures and answer fenced yes/no questions (is this the
    primary action? is this empty column dead space?) that a script applies at a fixed level.
    A facts check (design_verify) runs between the two usability critics and the merge, and join
    scripts put the scripts' findings beside the critics' in the files combine and copy_check read,
    one finding per problem. Everything else is design_homepage_v2's:
    Research first: inventory of the product's design files (defined, partial or none) ->
    when research is needed, a researcher writes the product, its users and contexts (every
    claim quoted from the source pack or the web, or marked an assumption; a script
    re-opens every source) and picks 6-10 category sites -> the category's first screens
    are captured and measured on five audience axes -> a director matches the product to
    the context playbook and writes 2-3 direction candidates (playbook families only,
    evidence ids, five audience targets) -> research.json, RESEARCH.md and a one-page board
    (checked: text 16 px+, contrast 4.5:1) -> RESEARCH gate (users + direction; on by
    default when research ran) -> the decision, approved parts and targets for the design
    stages (research/FOR_DESIGN.md), which bind the copywriter and the art director.
    Then the homepage, designed by AI in real HTML/CSS and converted to an editable Penpot
    file: brief + the owner's taste file -> copy deck (copywriter draft -> fixed word rules ->
    content critic -> copywriter revision -> quotes checked, before/after written) and
    8-12 category references (research only) -> art director drafts three bold,
    distinct concepts (hero + one section at 1440 and 390) -> automatic check (contract,
    licensed fonts, renders, distinctness, axe, the five audience axes and the fixed
    parts) -> only when that check fails, the art
    director refines from the renders ->
    DIRECTION gate -> designer builds the full page -> measure (capture, axe, craft
    metrics) -> two unchanged usability critics + merge, a craft critic, runtime checks
    in a real browser (Tab order and focus, names, 320 px reflow, 400% zoom, text
    spacing, reduced motion, hover) and a content critic on the page's text -> combine
    (at most 2 automatic revisions) -> convert to Penpot (named boards per width, text
    layers, shared colours/typographies, components) -> verify fidelity and editability ->
    handoff -> FINAL gate (approve, or request changes: back to a revision round, at most
    twice). Every gate answer records decided_by (design, or owner for his own words), the
    choice and the reasons; result flags direction_approved and final_approved carry
    decided_by. Each answer's choice, rejected options and notes are saved for the host's
    private taste file, which the launcher passes back in as taste_md. On final approval the
    product's design files (DESIGN.md + DTCG tokens.json, approved_by from the final gate)
    are written for the host to apply. Stage receipts make cancel/resume safe; no paid stage
    repeats. No publication. Gate answers and inputs: docs/design.md, docs/design-files.md.
  inputs:
    brief_json: {type: string, required: true}
    references_json: {type: string, required: true}
    research_json: {type: string, required: true}
    direction_json: {type: string, default: ""}
    taste_md: {type: string, default: ""}
  outputs:
    design_status: research.structured.status
    research_path: research_assemble.structured.research_path
    research_board: research_assemble.structured.board
    research_decided_by: research_decision.structured.decided_by
    research_direction: research_decision.structured.direction
    copy_diff: copy_check.structured.diff_path
    contact_sheet: check.structured.contact_sheet
    handoff_path: handoff.structured.handoff_path
    manifest_path: handoff.structured.manifest_path
    penpot_url: handoff.structured.penpot_url
    final_verdict: final.structured.verdict
    direction_approved: final.structured.direction_approved
    final_approved: final.structured.final_approved
    design_files: save_files.structured.saved
    design_files_approved_by: save_files.structured.approved_by
  nodes:
    - name: brief
      type: agent
      agent: design_homepage_stage_v2
      input_map: {stage: brief, mode: real, data: input.brief_json}
    - name: references
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [brief]
      input_map: {stage: references, mode: real, data: input.references_json}
    - name: taste
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [brief]
      input_map: {stage: taste, mode: real, data: input.taste_md}
    # ---- research step (design_research.py; shared with every design workflow)
    - name: research
      type: agent
      agent: design_research_stage_v1
      depends_on: [taste]
      input_map: {stage: inventory, mode: real, data: input.research_json}
    - name: research_users
      type: agent
      agent: design_research_users_v1
      depends_on: [research]
      condition: {source: research.structured.research_agent, operator: equals, value: "yes"}
      input_map: {phase: draft}
    - name: research_check_draft
      type: agent
      agent: design_research_stage_v1
      depends_on: [research_users]
      input_map: {stage: check, mode: real, phase: draft}
    - name: research_users_revise
      type: agent
      agent: design_research_users_v1
      depends_on: [research_check_draft]
      condition: {source: research_check_draft.structured.verdict, operator: equals, value: retry}
      input_map: {phase: revise}
    - name: research_check
      type: agent
      agent: design_research_stage_v1
      depends_on: [research_users_revise]
      input_map: {stage: check, mode: real, phase: final}
    - name: research_check_next
      type: agent
      agent: design_research_stage_v1
      depends_on: [research_check]
      loop_to: research_users_revise
      max_loops: 2
      on_max_loops: fail
      loop_condition: {source: research_check_next.structured.verdict, operator: equals, value: retry}
      input_map: {stage: next, mode: real, phase: check}
    - name: research_capture
      type: agent
      agent: design_research_stage_v1
      depends_on: [research_check_next]
      condition: {source: research.structured.research_category, operator: equals, value: "yes"}
      input_map: {stage: capture, mode: real}
    - name: research_direction
      type: agent
      agent: design_research_direction_v1
      depends_on: [research_capture]
      condition: {source: research.structured.research_direction, operator: equals, value: "yes"}
      input_map: {phase: draft}
    - name: research_assemble_draft
      type: agent
      agent: design_research_stage_v1
      depends_on: [research_direction]
      input_map: {stage: assemble, mode: real, phase: draft}
    - name: research_direction_revise
      type: agent
      agent: design_research_direction_v1
      depends_on: [research_assemble_draft]
      condition: {source: research_assemble_draft.structured.verdict, operator: equals, value: retry}
      input_map: {phase: revise}
    - name: research_assemble
      type: agent
      agent: design_research_stage_v1
      depends_on: [research_direction_revise]
      input_map: {stage: assemble, mode: real, phase: final}
    - name: research_assemble_next
      type: agent
      agent: design_research_stage_v1
      depends_on: [research_assemble]
      loop_to: research_direction_revise
      max_loops: 2
      on_max_loops: fail
      loop_condition: {source: research_assemble_next.structured.verdict, operator: equals, value: retry}
      input_map: {stage: next, mode: real, phase: assemble}
    - name: research_gate
      type: agent
      agent: design_research_stage_v1
      depends_on: [research_assemble_next]
      gate: true
      condition: {source: research.structured.gate, operator: equals, value: "on"}
      input_map: {stage: gate, mode: real}
    - name: research_decision
      type: agent
      agent: design_research_stage_v1
      depends_on: [research_gate]
      input_map: {stage: decision, mode: real}
    # ---- the homepage stages, bound by research/FOR_DESIGN.md
    - name: copy
      type: agent
      agent: design_homepage_copywriter_v2
      depends_on: [research_decision]
      input_map: {phase: draft}
    - name: copy_check_draft
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [copy]
      input_map: {stage: copy_check, mode: real, phase: draft}
    - name: deck_words
      type: agent
      agent: design_homepage_stage_next
      depends_on: [copy_check_draft]
      input_map: {stage: deck_words, mode: real}
    - name: copy_review
      type: agent
      agent: design_homepage_content_critic_v2_next
      depends_on: [deck_words]
      input_map: {target: deck}
    - name: copy_review_join
      type: agent
      agent: design_homepage_stage_next
      depends_on: [copy_review]
      input_map: {stage: copy_review_join, mode: real}
    - name: copy_revise
      type: agent
      agent: design_homepage_copywriter_v2
      depends_on: [copy_review_join]
      input_map: {phase: revise}
    - name: copy_check
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [copy_revise]
      input_map: {stage: copy_check, mode: real, phase: final}
    - name: copy_next
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [copy_check]
      loop_to: copy_revise
      max_loops: 2
      on_max_loops: fail
      loop_condition: {source: copy_next.structured.verdict, operator: equals, value: retry}
      input_map: {stage: copy_next, mode: real}
    - name: pairings
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [copy_next]
      input_map: {stage: pairings, mode: real}
    - name: concepts
      type: agent
      agent: design_homepage_art_director_v2
      depends_on: [references, copy_next, pairings]
      input_map: {phase: draft}
    - name: check_draft
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [concepts]
      input_map: {stage: concepts_check, mode: real, phase: draft}
    - name: refine
      type: agent
      agent: design_homepage_art_director_v2
      depends_on: [check_draft]
      condition: {source: check_draft.structured.verdict, operator: equals, value: retry}
      input_map: {phase: refine}
    - name: check
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [refine]
      input_map: {stage: concepts_check, mode: real, phase: final}
    - name: concepts_next
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [check]
      loop_to: refine
      max_loops: 3
      on_max_loops: fail
      loop_condition: {source: concepts_next.structured.verdict, operator: equals, value: retry}
      input_map: {stage: concepts_next, mode: real}
    - name: direction
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [concepts_next]
      gate: true
      input_map: {stage: direction, mode: real, data: input.direction_json}
    - name: build
      type: agent
      agent: design_homepage_designer_v2
      depends_on: [direction]
    - name: plan_round
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [build]
      input_map: {stage: plan_round, mode: real}
    - name: revise
      type: agent
      agent: design_homepage_reviser_v2
      depends_on: [plan_round]
      condition: {source: plan_round.structured.action, operator: equals, value: revise}
    - name: measure
      type: agent
      agent: design_homepage_stage_next
      depends_on: [revise]
      input_map: {stage: measure, mode: real}
    # ---- scripts first (H5, H6): the measured problems and the settled craft numbers
    - name: measured
      type: agent
      agent: design_homepage_stage_next
      depends_on: [measure]
      input_map: {stage: measured, mode: real}
    - name: craft_anchors
      type: agent
      agent: design_homepage_stage_next
      depends_on: [measure]
      input_map: {stage: craft_anchors, mode: real}
    - name: critic_a
      type: agent
      agent: design_critic_next
      depends_on: [measured]
    - name: critic_b
      type: agent
      agent: design_critic_next
      depends_on: [measured]
    # ---- the facts check (H4) between the critics and the merge; the merge never does it itself
    - name: review_verify
      type: agent
      agent: design_verify
      depends_on: [critic_a, critic_b]
    - name: merge
      type: agent
      agent: design_merge_next
      depends_on: [review_verify]
    - name: merge_join
      type: agent
      agent: design_homepage_stage_next
      depends_on: [merge]
      input_map: {stage: merge_join, mode: real}
    - name: craft
      type: agent
      agent: design_homepage_craft_critic_v2_next
      depends_on: [craft_anchors]
    - name: craft_join
      type: agent
      agent: design_homepage_stage_next
      depends_on: [craft]
      input_map: {stage: craft_join, mode: real}
    - name: runtime
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [measure]
      input_map: {stage: runtime, mode: real}
    # ---- the countable word checks on the page (H7), then the content critic
    - name: page_words
      type: agent
      agent: design_homepage_stage_next
      depends_on: [runtime]
      input_map: {stage: page_words, mode: real}
    - name: content
      type: agent
      agent: design_homepage_content_critic_v2_next
      depends_on: [page_words]
      input_map: {target: page}
    - name: content_join
      type: agent
      agent: design_homepage_stage_next
      depends_on: [content]
      input_map: {stage: content_join, mode: real}
    - name: combine
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [merge_join, craft_join, runtime, content_join]
      input_map: {stage: combine, mode: real}
    - name: next_round
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [combine]
      loop_to: plan_round
      max_loops: 3
      on_max_loops: fail
      loop_condition: {source: next_round.structured.verdict, operator: equals, value: revise}
      input_map: {stage: next_round, mode: real}
    - name: convert
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [next_round]
      input_map: {stage: convert, mode: real}
    - name: verify
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [convert]
      input_map: {stage: verify, mode: real}
    - name: handoff
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [verify]
      input_map: {stage: handoff, mode: real}
    - name: final
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [handoff]
      gate: true
      input_map: {stage: final, mode: real}
    - name: after_final
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [final]
      loop_to: plan_round
      max_loops: 3
      on_max_loops: fail
      loop_condition: {source: final.structured.verdict, operator: equals, value: request_changes}
      input_map: {stage: next_round, mode: real}
    # ---- the product's design files, written after the final approval (the host applies them)
    - name: save_files
      type: agent
      agent: design_research_stage_v1
      depends_on: [after_final]
      condition: {source: final.structured.verdict, operator: equals, value: approved}
      input_map: {stage: save, mode: real}
