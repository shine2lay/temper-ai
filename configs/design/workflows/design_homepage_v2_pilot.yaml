# Fictional-only companion of design_homepage_v2 (like design_homepage_pilot_v1 for v1).
# Same design nodes and checks, without v2's research step (queue #38): the copywriter and art
# director are the pre-research prompts (design_homepage_*_v2_no_research), so pilot runs stay
# comparable with earlier ones. Every script stage runs with mode: pilot, which refuses
# real deliverables and takes the worker's provisional direction pick (decided_by design,
# with reasons; direction_approved stays false). Pilot runs never write taste entries. The
# final gate is answered like v2's (decided_by design, or owner for his own words).
# tests/test_design_homepage_v2.py keeps it in step with v2.
workflow:
  name: design_homepage_v2_pilot
  version: 1
  description: |
    Fictional-only trial of design_homepage_v2 (paid models, same stages and checks):
    copy deck + content critic, three concepts, the worker's provisional direction
    (decided_by design, provisional: never an approval, never a taste entry),
    full build, review rounds with runtime checks and the content critic on the page,
    Penpot conversion, handoff, and the final gate. Real products refuse this
    workflow at the brief stage; they go through design_homepage_v2.
  inputs:
    brief_json: {type: string, required: true}
    references_json: {type: string, required: true}
    direction_json: {type: string, default: ""}
    taste_md: {type: string, default: ""}
  outputs:
    copy_diff: copy_check.structured.diff_path
    contact_sheet: check.structured.contact_sheet
    handoff_path: handoff.structured.handoff_path
    manifest_path: handoff.structured.manifest_path
    penpot_url: handoff.structured.penpot_url
    final_verdict: final.structured.verdict
    direction_approved: final.structured.direction_approved
    final_approved: final.structured.final_approved
  nodes:
    - name: brief
      type: agent
      agent: design_homepage_stage_v2
      input_map: {stage: brief, mode: pilot, data: input.brief_json}
    - name: references
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [brief]
      input_map: {stage: references, mode: pilot, data: input.references_json}
    - name: taste
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [brief]
      input_map: {stage: taste, mode: pilot, data: input.taste_md}
    - name: copy
      type: agent
      agent: design_homepage_copywriter_v2_no_research
      depends_on: [taste]
      input_map: {phase: draft}
    - name: copy_check_draft
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [copy]
      input_map: {stage: copy_check, mode: pilot, phase: draft}
    - name: copy_review
      type: agent
      agent: design_homepage_content_critic_v2
      depends_on: [copy_check_draft]
      input_map: {target: deck}
    - name: copy_revise
      type: agent
      agent: design_homepage_copywriter_v2_no_research
      depends_on: [copy_review]
      input_map: {phase: revise}
    - name: copy_check
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [copy_revise]
      input_map: {stage: copy_check, mode: pilot, phase: final}
    - name: copy_next
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [copy_check]
      loop_to: copy_revise
      max_loops: 2
      on_max_loops: fail
      loop_condition: {source: copy_next.structured.verdict, operator: equals, value: retry}
      input_map: {stage: copy_next, mode: pilot}
    - name: pairings
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [copy_next]
      input_map: {stage: pairings, mode: pilot}
    - name: concepts
      type: agent
      agent: design_homepage_art_director_v2_no_research
      depends_on: [references, copy_next, pairings]
      input_map: {phase: draft}
    - name: check_draft
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [concepts]
      input_map: {stage: concepts_check, mode: pilot, phase: draft}
    - name: refine
      type: agent
      agent: design_homepage_art_director_v2_no_research
      depends_on: [check_draft]
      condition: {source: check_draft.structured.verdict, operator: equals, value: retry}
      input_map: {phase: refine}
    - name: check
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [refine]
      input_map: {stage: concepts_check, mode: pilot, phase: final}
    - name: concepts_next
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [check]
      loop_to: refine
      max_loops: 3
      on_max_loops: fail
      loop_condition: {source: concepts_next.structured.verdict, operator: equals, value: retry}
      input_map: {stage: concepts_next, mode: pilot}
    - name: direction
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [concepts_next]
      gate: true
      input_map: {stage: direction, mode: pilot, data: input.direction_json}
    - name: build
      type: agent
      agent: design_homepage_designer_v2
      depends_on: [direction]
    - name: plan_round
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [build]
      input_map: {stage: plan_round, mode: pilot}
    - name: revise
      type: agent
      agent: design_homepage_reviser_v2
      depends_on: [plan_round]
      condition: {source: plan_round.structured.action, operator: equals, value: revise}
    - name: measure
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [revise]
      input_map: {stage: measure, mode: pilot}
    - name: critic_a
      type: agent
      agent: design_critic
      depends_on: [measure]
    - name: critic_b
      type: agent
      agent: design_critic
      depends_on: [measure]
    - name: craft
      type: agent
      agent: design_homepage_craft_critic_v2
      depends_on: [measure]
    - name: runtime
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [measure]
      input_map: {stage: runtime, mode: pilot}
    - name: content
      type: agent
      agent: design_homepage_content_critic_v2
      depends_on: [runtime]
      input_map: {target: page}
    - name: merge
      type: agent
      agent: design_merge
      depends_on: [critic_a, critic_b]
    - name: combine
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [merge, craft, runtime, content]
      input_map: {stage: combine, mode: pilot}
    - name: next_round
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [combine]
      loop_to: plan_round
      max_loops: 3
      on_max_loops: fail
      loop_condition: {source: next_round.structured.verdict, operator: equals, value: revise}
      input_map: {stage: next_round, mode: pilot}
    - name: convert
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [next_round]
      input_map: {stage: convert, mode: pilot}
    - name: verify
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [convert]
      input_map: {stage: verify, mode: pilot}
    - name: handoff
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [verify]
      input_map: {stage: handoff, mode: pilot}
    - name: final
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [handoff]
      gate: true
      input_map: {stage: final, mode: pilot}
    - name: after_final
      type: agent
      agent: design_homepage_stage_v2
      depends_on: [final]
      loop_to: plan_round
      max_loops: 3
      on_max_loops: fail
      loop_condition: {source: final.structured.verdict, operator: equals, value: request_changes}
      input_map: {stage: next_round, mode: pilot}
