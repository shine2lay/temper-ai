workflow:
  name: design_review_next
  # DESIGN REVIEW, candidate (design role, queue #7 "make design review findings trustworthy",
  # 2026-10-04). A test workflow next to design_review, graded on the sealed planted-problem sites
  # before anything replaces the live reviewer (docs/departments.md method):
  #
  #   capture_next (script) -> [ critic_a | critic_b ] (critic_next) -> verify_next (script) -> merge_next
  #
  # What differs from design_review, each aimed at a weakness the benchmark runs showed (results
  # and answer keys stay on the host, outside every run container):
  #   - design_measure_next.js applies WCAG 2.5.8 in full: a control's labels count as its target,
  #     and undersized targets pass by the spacing exception; inactive (disabled) controls are
  #     exempt from contrast. facts.md lists the measured passes, so critics stop calling spaced
  #     or labelled targets failures.
  #   - design_verify_next (no model) checks each critic claim on target size and on inactive
  #     controls' contrast against the facts, and whether it cites checkable evidence; the merge
  #     drops what the facts contradict and keeps a one-critic finding only when it is checkable.
  #   - critic_next and merge_next rate severity on anchored Nielsen 0-4 definitions with worked
  #     examples from other products (the live reviewer tended to rate one step high).
  # provider: claude = Claude Code CLI (Read shows PNGs to the model); no temper tools: blocks.
  version: 1
  description: |
    Candidate of design_review (test workflow): the same expert design review of a site's pages,
    with target size measured by WCAG 2.5.8 in full and the measured passes listed, a
    no-model facts check of the critics' claims before the merge, and anchored severity.
  inputs:
    brief:
      type: string
      required: true    # what the product is, who uses it, what the pages are for
    pages:
      type: string
      required: true    # comma-separated paths relative to the site, e.g. "index.html,pricing.html"
    site:
      type: string
      default: ""       # a folder inside the run container to serve, e.g. /app/configs/design/testpages/fernway-v1
    base_url:
      type: string
      default: ""       # or a deployed site (the browser must reach it)
    viewports:
      type: string
      default: "desktop,mobile"
  outputs:
    report_path: merge.structured.report_path
    findings_path: merge.structured.findings_path
    confirmed: merge.structured.confirmed
    single: merge.structured.single
    rejected: merge.structured.rejected
    dropped_by_facts: merge.structured.dropped_by_facts
    severity_counts: merge.structured.severity_counts
    contradicted_claims: verify.structured.contradicted
    partly_contradicted_claims: verify.structured.partly_contradicted
    screenshots: capture.structured.screenshots
    measured_items: capture.structured.measured_items

  nodes:
    - name: capture
      type: agent
      agent: design_capture_next
      input_map:
        brief: input.brief
        pages: input.pages
        site: input.site
        base_url: input.base_url
        viewports: input.viewports

    - name: critic_a
      type: agent
      agent: design_critic_next
      depends_on: [capture]

    - name: critic_b
      type: agent
      agent: design_critic_next
      depends_on: [capture]

    - name: verify
      type: agent
      agent: design_verify_next
      depends_on: [critic_a, critic_b]

    - name: merge
      type: agent
      agent: design_merge_next
      depends_on: [verify]
