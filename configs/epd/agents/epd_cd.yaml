# RollCall's continuous deployer, one tick: ask the host whether master's HEAD is due to go live
# (configs/epd/bin/rollcall_cd_deploy.py tick), and then check finished master CI runs for verdicts
# and money-test undos (configs/epd/bin/rollcall_cd_verdict.py), in one script agent run.
#
# Why over ssh: a release needs the host's docker, standee, systemd and the live product's files,
# none of which this container has. The key is the epd-ship key, pinned to a forced command on the
# host (local/host-bin/epd-ship-only) that admits `epd-cd tick` and `epd-cd deploy <sha>`.
#
# No model (rule 17): one script, one JSON line out combining the deployer decision and the CI
# verdict summary (`verdict`). A tick that refuses or fails either step fails the node.
#
# POSIX sh; no dollar-brace env syntax (config-loader substitution).
agent:
  name: epd_cd
  version: 2
  type: script
  timeout_seconds: 120
  script_template: |
    #!/bin/sh
    set -eu
    KEYDIR=/app/standee-ssh
    KEY_SRC="$KEYDIR/id_ed25519_ship"
    fail() {
      python3 -c 'import json,sys; print(json.dumps({"decision": "error", "reason": sys.argv[1]}))' "$1"
      echo "epd_cd failed: $1" >&2
      exit 1
    }
    [ -f "$KEY_SRC" ] || fail "no epd-ship key at $KEY_SRC (run local/standee-ssh/setup.sh, mount it)"
    KEY=$(mktemp)
    trap 'rm -f "$KEY" /tmp/epd_cd.out' EXIT
    install -m 600 "$KEY_SRC" "$KEY"
    set +e
    ssh -i "$KEY" -o IdentitiesOnly=yes -o UserKnownHostsFile="$KEYDIR/known_hosts" \
        -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10 \
        shinelay@host.docker.internal "epd-cd tick" > /tmp/epd_cd.out 2>&1
    RC=$?
    set -e
    # `epd-cd tick` runs rollcall_cd_deploy.py tick then rollcall_cd_verdict.py; merge their JSON lines.
    if [ "$RC" = 0 ] && COMBINED=$(python3 - /tmp/epd_cd.out <<'PY'
    import json, sys
    objs = []
    with open(sys.argv[1]) as f:
        for line in f:
            line = line.strip()
            if line.startswith("{") and line.endswith("}"):
                try:
                    objs.append(json.loads(line))
                except ValueError:
                    pass
    deploy = next((o for o in reversed(objs) if isinstance(o, dict) and "decision" in o), None)
    summary = next((o["summary"] for o in reversed(objs) if isinstance(o, dict) and "summary" in o), None)
    if deploy is None or summary is None:
        sys.exit(1)
    out = dict(deploy)
    out["verdict"] = {"summary": summary,
                      "decisions": [o for o in objs if isinstance(o, dict) and "run" in o]}
    print(json.dumps(out))
    PY
    ); then
      printf '%s\n' "$COMBINED"
      exit 0
    fi
    fail "host tick exited $RC: $(tail -n 5 /tmp/epd_cd.out | tr '\n' ' ')"
