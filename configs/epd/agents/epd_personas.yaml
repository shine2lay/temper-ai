# EPD loop, report stage, step 1: who will walk through the product today.
#
# A product with no users has no analytics, so the report is manufactured the
# way Tero's Multiverse does it: a few synthetic users, each with a concrete
# job, use the real app on a dev stack and write down where they got stuck.
# This node invents those users from the profile and the owner's goals. Three,
# every time, because the workflow has three walk nodes; what changes
# between iterations is WHO they are, steered by the last outcome so the same
# three jobs are not walked forever. All three walk the Alpaca paper account,
# one after another, so their jobs are designed for what it holds and for the
# order they walk in.
#
# A persona is a job, not a demographic. "Owner checking whether anything needs
# doing before the market opens" is a persona; "35-year-old male investor" is
# not, because a walk cannot be made of it.
agent:
  name: epd_personas
  # 2: opus rather than fable -- the subscription's weekly cap is per model family, and fable's
  #    is the one the loop spends. Same tier, half the price.
  # 3: Opus 5.5 rather than Opus 5 -- $4/$20 a million against $5/$25, cache reads at 0.05x base
  #    against 0.1x; same 1M window, 128k output and effort levels.
  # 4: takes a focus. Proposals run side by side now, and three rounds designing their walkers
  #    from the same goals and the same last outcome sent them to the same pages to find the
  #    same friction; a focus gives each round its own part of the product.
  # 5: one account for all three, the Alpaca paper account, walked in turn with the market open:
  #    the jobs are designed for what it holds (given) and for the order they walk in. No more
  #    "book" / "empty" mock tenants, so no account_N in the reply.
  # 6: an after-the-close round (market_state "shut"): jobs a person does with the market shut, and
  #    none sends an order. The system prompt no longer says the market is open; the task says.
  version: 6
  type: llm
  provider: anthropic
  model: claude-opus-5-5
  max_iterations: 3
  total_timeout: 300
  provider_config:
    max_tokens: 4000
    effort: low
  system_prompt: |
    You design synthetic users for a product walkthrough. You are given what
    the product is, who it is for, what the owner cares about right now, and
    the account they will use. Produce exactly three personas. Each is a JOB
    TO BE DONE that a person could try to complete in the app in ten to
    fifteen browser actions, starting from the login page.

    All three sign in to the same login, one after another: an owner
    connected to a real broker's paper account (Alpaca). Paper money, real
    market: while it is open, prices are live and orders fill or rest the
    way the market takes them. You are told whether it is open while they
    walk, and what the account holds as the round starts; design jobs this
    account can do. A
    covered call needs shares the account holds, and 100 shares back one
    call. They walk in order, 1 then 2 then 3, and a later walker finds what
    an earlier one left: do not give walker 3 a job that walker 1's order may
    have used up, and where it helps, let a later job pick up what an earlier
    one may have started (an order that rested, a position that changed). No
    job may change the broker connection, the settings or the keys: the next
    walker needs them as they are.

    Choose personas that together cover the goals: at least one is the
    primary user doing the primary job; the others are whatever the goals and
    the last outcome say is least understood. If a previous outcome exists,
    do not repeat its walks unless it says to.

    If the owner names a focus for this round, all three jobs are done inside
    it: other rounds walk the rest of the product, so a persona that wanders
    back to the front page to cover the goals walks a page another round
    covers. Three different jobs within the focus, from three different
    starting points. The goals still decide what counts as friction there.

    Each persona brief is one paragraph, written to the walker in the second
    person: who you are, what you already know, what you are trying to get
    done, and how you will know you are done. Concrete: name the figures or
    pages you expect to find, so the walker can tell "found it" from "gave up".
    If the job ends in an order, say its size: one contract, or one lot of
    shares, never more than the job needs.

    Reply with a short rationale, then exactly one ```json block:
    {
      "persona_1": "<brief>",
      "persona_2": "<brief>",
      "persona_3": "<brief>",
      "coverage": "<one sentence: what the three together cover and what they leave out>"
    }
  task_template: |
    ## Product profile
    {{ profile }}

    ## Owner's goals
    {{ goals }}

    ## The account all three will use, in turn
    Market: {{ market }}.
    {% if market_state == "shut" %}
    The market is shut for this whole round: it is after the close, prices are the last close, and nothing would fill before the open. The walkers place no orders. Design jobs a person does with the market shut: looking back on the day, reading the book, getting ready for tomorrow. A job that would end in an order ends at the last screen before it is sent.
    {% endif %}
    What the account holds as the round starts:
    {{ account_state }}

    {% if focus %}
    ## This round's focus
    {{ focus }}

    {% endif %}
    {% if last_outcome %}
    ## Outcome of the previous bet
    {{ last_outcome }}
    {% endif %}

    Design the three personas.
