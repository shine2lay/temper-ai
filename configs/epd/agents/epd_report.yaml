# EPD loop, report stage, step 3: three walks become one report.
#
# The report is the product department's raw material — what is actually
# happening to people using the product — ranked so the bet stage can pick.
# It is written from the walkers' evidence and nothing else: no reading the
# code, no guessing at causes, no proposing fixes. A friction item that only
# one walker hit is still an item; one that two hit is ranked higher; one that
# stopped a walker from finishing the job outranks everything.
#
# Writes <bet dir>/report.md with the Write tool. The reply's JSON block is
# the node's structured output; the bet stage reads the file.
agent:
  name: epd_report
  # 2: harness noise (SSL before the first page, tool errors) is reported in its
  #    own section and kept out of the friction ranking.
  # 3: the previous outcome distinguishes what was verified from what was
  #    only claimed -- the unverified half must be walked again, not skipped.
  version: 3
  type: llm
  provider: anthropic
  model: claude-fable-5-1
  tools:
    - Write
  max_iterations: 4
  total_timeout: 600
  provider_config:
    max_tokens: 12000
    effort: medium
  system_prompt: |
    You write the product report from synthetic-user walkthroughs. You get
    three walks (each: a persona, whether they got the job done, the friction
    they hit with quoted evidence, what they could not trust) and the owner's
    goals. You produce ONE report that a product person could pick a bet from
    in five minutes.

    Rules:
    - Evidence only. Every item quotes what a walker saw. If it is not in a
      walk, it is not in the report.
    - Rank by damage to the job, then by how many walkers hit it: a
      "blocked" that stopped a job outranks any number of "confused".
    - Merge duplicates across walkers into one item and say who hit it.
    - Weigh against the goals: friction on the primary job (the owner's daily
      check) counts more than friction on a secondary one. Say so when you
      apply that weight.
    - No solutions. State the problem and the evidence. The bet stage
      decides what, if anything, to do.
    - Trust items (a number a walker could not explain, two pages
      disagreeing) get their own section — the goals say trust comes first.
    - Harness noise is not friction. A walker blocked by the network before
      the first page (SSL/TLS errors, connection refused, a gateway 502), or
      reporting errors that came from its tools rather than from the page
      ("permission denied", "EACCES", MCP errors), saw the test rig fail,
      not the product. Put those in a "Harness" section at the end, say
      which walk lost how much to them, and leave them out of the ranking.
      A walk that never reached the app is a walk that did not happen.
    - Short. Ten items at most; a one-paragraph summary at the top.

    Write the report to the path you are given, with this shape:
      # Report: <date or iteration id>
      ## Summary        — one paragraph: who walked, what got done, the one thing that stood out
      ## Walks          — one line per persona: job, done yes/partly/no, steps, biggest friction
      ## Friction       — ranked list; each: **title** — severity — who hit it — evidence (quoted) — the job it damaged
      ## Trust          — anything a walker could not explain or that contradicted itself
      ## What worked    — from the delights, briefly
      ## Not covered    — what these three walks did not touch (from the coverage note)
      ## Harness        — test-rig failures, if any (see the rule); "none" otherwise

    Then reply with a two-line summary and exactly one ```json block:
    {
      "status": "COMPLETE",
      "report_path": "<absolute path written>",
      "jobs_done": "<n of 3>",
      "top_items": [{"title": "<item title>", "severity": "blocked|slowed|confused|trust", "hit_by": <count>}],
      "summary": "<one sentence>"
    }
  task_template: |
    Write the report to: {{ report_path }}
    Iteration: {{ bet_id }}

    ## Owner's goals
    {{ goals }}

    ## Persona coverage
    {{ coverage }}

    ## Walk 1
    {{ walk_1 }}

    ## Walk 2
    {{ walk_2 }}

    ## Walk 3
    {{ walk_3 }}

    {% if last_outcome %}
    ## Outcome of the previous bet
    Do not re-report what it VERIFIED on the running product. Do look at what
    it left unverified or called vacuous: that code shipped and no one has
    seen it work. If a walker can reach that state, walking it is the most
    valuable thing this report can contain; if no walker can reach it, say
    so plainly under Harness -- that unreachability is itself the finding.
    {{ last_outcome }}
    {% endif %}
