# EPD loop: put the approved build in front of the owner, as a pull request.
#
# Push the branch and open the PR. That is where this node stops: the PR is
# the loop's second gate, and what happens to it -- merge, request changes,
# close -- is the owner's word, given in the UI on the `deploy` node that
# follows (configs/epd/agents/epd_deploy.yaml acts on it). Until 2026-09-20
# this node also merged and deployed; it no longer does, because a PR the
# loop merges itself is not a decision anyone made, and the owner's decisions
# are the one measure of the loop that is not the loop grading its own work.
#
# None of the shipping logic is here. It lives in the loop's driver
# (`epd_loop.py stage ship`), where it was written, tested and used for b001,
# and this node is the thing that asks for it — because the loop now runs as
# one workflow and ship sits in the middle of it, between the build and the
# measurement of what shipped.
#
# The asking is deliberately awkward, and that is the design:
#
#   * This node runs in the temper container. Ship is a host job — it holds the
#     GitHub token, the production checkout and standee. So it goes over ssh.
#   * The key it uses is pinned to a forced command (`epd-ship-only`) that runs
#     `epd-ship <bet-id> [deploy]` and nothing else, with the id matched against
#     a literal pattern. No shell, no flags, no second command. If this key
#     leaks, what leaks is the ability to open a PR for a bet the pipeline
#     already built and already approved — not a shell on the host.
#   * The decision to ship is not made here either. The driver re-checks the
#     build's own verdict before it pushes anything, so a node wired to the
#     wrong place cannot ship a rejected build by asking nicely.
#
# What this node does contribute is the record: it writes build.json and
# bet.json into the bet directory, which is the shared mount both sides see, so
# the host driver reads the same facts the workflow just produced rather than
# needing to have run those stages itself.
#
# POSIX sh; no dollar-brace env syntax (config-loader substitution).
agent:
  name: epd_ship
  # 3: records the screenshot prefix and list, so the driver can put the pictures on the PR.
  # 4: records QA's clause-by-clause walk of the threshold, for the PR body.
  # 5: the gate card, in plain words -- a `summary` the dashboard renders as markdown, a one-line
  #    `detail`, and what each button does written out under the button.
  version: 5
  type: script
  timeout_seconds: 2400
  # A blank here is not a blank field, it is a shifted one: these values are written by position,
  # so a missing `branch` would record the verdict as the branch. Fail the node instead.
  strict_undefined: true
  script_template: |
    #!/bin/sh
    set -eu

    BET_ID={{ bet_id }}
    BET_DIR={{ bet_dir }}
    KEYDIR=/app/standee-ssh
    KEY_SRC="$KEYDIR/id_ed25519_ship"

    emit() {
      python3 -c 'import json,sys; print(json.dumps({"status": sys.argv[1], "detail": sys.argv[2], "pr": sys.argv[3], "pr_number": 0, "questions_for_owner": []}))' \
        "$1" "$2" "${3:-}"
    }
    fail() { echo "ship failed: $1" >&2; emit failed "$1"; exit 1; }

    [ -d "$BET_DIR" ] || fail "bet directory not found: $BET_DIR"
    [ -f "$KEY_SRC" ] || fail "no epd-ship key at $KEY_SRC (run local/standee-ssh/setup.sh, mount it)"

    # ---- the record ------------------------------------------------------------------
    # What the earlier stages produced, written where the host driver reads it.
    #
    # Every value goes in as its own argv entry and is turned into JSON by json.dump, not by this
    # file. A bet title is prose an agent wrote: it can hold a quote, a newline, a $(…). None of
    # that is interpolated into the script text either — ScriptAgent stashes each value in an
    # environment variable and leaves a reference here — so there is no layer where it is parsed
    # as code. `default('', true)` because an input that went unused arrives as None, which would
    # otherwise be recorded as the four-letter word "None". `verify_screenshots` and
    # `verify_threshold_checks` are lists; `tojson` makes each the one text that is read back as
    # data, and `[]` when verify took none, walked none, or did not run.
    python3 - "$BET_DIR/build.json" \
      {{ branch }} {{ worktree_path | default('', true) }} {{ verdict }} \
      {{ verdict_summary | default('', true) }} {{ review_verdict | default('', true) }} \
      {{ verify_verdict | default('', true) }} {{ security_verdict | default('', true) }} \
      {{ deploy_url | default('', true) }} {{ implement_commit | default('', true) }} \
      {{ implement_summary | default('', true) }} {{ task_slug | default('', true) }} \
      {{ verify_screenshots | default([], true) | tojson }} \
      {{ verify_threshold_checks | default([], true) | tojson }} <<'PY'
    import json, sys
    keys = ["branch", "worktree_path", "verdict", "verdict_summary", "review_verdict",
            "verify_verdict", "security_verdict", "deploy_url", "implement_commit",
            "implement_summary", "task_slug"]
    path, values = sys.argv[1], sys.argv[2:]
    record = dict(zip(keys, values))
    for i, name in enumerate(("verify_screenshots", "verify_threshold_checks")):
        try:
            items = json.loads(values[len(keys) + i])
        except (IndexError, ValueError):
            items = []
        record[name] = items if isinstance(items, list) else []
    json.dump(record, open(path, "w"), indent=2)
    PY

    python3 - "$BET_DIR/bet.json" \
      {{ title }} {{ problem | default('', true) }} \
      {{ invariant | default('', true) }} {{ threshold | default('', true) }} <<'PY'
    import json, sys
    keys = ["title", "problem", "invariant", "threshold"]
    path, values = sys.argv[1], sys.argv[2:]
    json.dump(dict(zip(keys, values)), open(path, "w"), indent=2)
    PY

    echo "recorded $BET_DIR/build.json and bet.json"

    # ---- the ask ---------------------------------------------------------------------
    KEY=$(mktemp)
    trap 'rm -f "$KEY"' EXIT
    install -m 600 "$KEY_SRC" "$KEY"

    echo "opening the PR for $BET_ID (the host driver decides whether the build has earned it)"
    set +e
    ssh -i "$KEY" -o IdentitiesOnly=yes -o UserKnownHostsFile="$KEYDIR/known_hosts" \
        -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10 \
        shinelay@host.docker.internal "epd-ship $BET_ID" 2>&1 | tee /tmp/ship.log
    RC=$?
    set -e
    [ "$RC" = 0 ] || fail "$(tail -3 /tmp/ship.log | tr '\n' ' ')"

    # ---- what happened, and the question ---------------------------------------------
    # From the state file the driver just wrote, not from parsing its log: the driver
    # records the PR as data, and a log line is prose.
    #
    # The question is the gate's form. The next node (`deploy`) has gate: true, and the
    # dashboard renders whatever `questions_for_owner` its upstream -- this node -- asked,
    # so the owner sees the PR link, the checks, the stack to try it on, and three buttons.
    # The labels are matched exactly by the driver (PR_DECISIONS in epd_loop.py): change one
    # here, change it there.
    #
    # Where each piece lands on screen (frontend/src/components/layout/GateModal.tsx):
    #   `summary`  -- rendered as markdown, above the buttons. The brief goes here. It is read
    #                 out of this node's output by PROSE_KEYS in temper_ai/stage/gate.py, which
    #                 looks for `summary` and not for `detail`: until v5 the brief was in
    #                 `detail`, so that panel was empty and everything piled into one line.
    #   `detail`   -- one plain <p>, no markdown and newlines collapse: one sentence only.
    #   `preview`  -- markdown, shown when that button is picked. What that choice does goes
    #                 here, so the owner reads about a choice when he is making it.
    # Plain words throughout: the reader is the owner deciding, not the pipeline.
    python3 - "$BET_DIR/state.json" "$BET_DIR/build.json" <<'PY'
    import json, sys
    ship = (json.load(open(sys.argv[1])).get("stages") or {}).get("ship") or {}
    build = json.load(open(sys.argv[2]))
    pr, n = ship.get("pr") or "", ship.get("pr_number")
    title = ship.get("title") or ""

    # Each check in words a reader does not have to decode: the pipeline's own vocabulary
    # (approve / request_changes / pass) says what the judge typed, not what it means.
    SAID = {"approve": "passed", "pass": "passed", "request_changes": "asked for changes",
            "reject": "said no", "fail": "failed", "blocked": "found a problem"}
    PASSED = ("approve", "pass")
    def said(key, name):
        v = (build.get(key) or "").strip()
        # A check that did not pass is marked, not just worded differently: this line is
        # skimmed, and "asked for changes" among two passes is exactly what must not be
        # skimmed past.
        return f"{name}: {SAID.get(v, v or 'not run')}" + ("" if v in PASSED else " ⚠")
    checks = " · ".join([said("review_verdict", "Code review"),
                         said("verify_verdict", "Clicked through in a browser"),
                         said("security_verdict", "Security check")])

    # What QA checked, one line per promise the bet made. ✓ met, ✗ not met, ? nothing
    # reached it -- the last of which is the owner's to judge, so it is worth showing.
    MARK = {"met": "✓", "unmet": "✗", "unverified": "?"}
    walked = []
    for c in (build.get("verify_threshold_checks") or [])[:6]:
        if isinstance(c, dict) and c.get("clause"):
            status = str(c.get("status") or "").strip().lower()
            tail = " — nothing in the app reached this" if status == "unverified" else ""
            walked.append(f"- {MARK.get(status, '?')} {str(c['clause']).strip()}{tail}")

    what = (build.get("implement_summary") or "").strip()
    if len(what) > 400:
        what = what[:400].rsplit(" ", 1)[0] + "… (the rest is on the PR)"
    url = build.get("deploy_url") or ""
    where = (f"[{url}]({url})" if url else "no test copy is up any more")

    # The brief. Markdown, and the one panel the owner actually reads before deciding.
    # Blocks, joined by a blank line: in markdown a single newline is not a line break,
    # so without the blank line between them the whole card renders as one paragraph.
    blocks = [f"### PR #{n} — {title}\n\n{pr}"]
    if what:
        blocks.append(f"**What it does** — {what}")
    blocks.append(f"**Checks** — {checks}")
    blocks.append(f"**Try it yourself** — {where}  \n"
                  f"branch `{build.get('branch') or '?'}`, "
                  f"commit `{(build.get('implement_commit') or '')[:12]}`")
    if walked:
        blocks.append("**What QA checked**\n\n" + "\n".join(walked))
    summary = "\n\n".join(blocks)

    print(json.dumps({
        "status": "pr_opened" if n else "incomplete",
        "detail": f"PR #{n} opened; waiting for the owner's decision" if n else "no PR recorded",
        "summary": summary if n else "No PR was opened, so there is nothing to decide.",
        "pr": pr,
        "pr_number": n or 0,
        "questions_for_owner": [{
            "id": "pr",
            "header": f"PR #{n}",
            "question": "Do you want this?",
            "detail": "Pick one below. You can also merge or close it on GitHub instead — "
                      "whatever you do there is what counts.",
            "options": [
                {"label": "Merge",
                 "description": "Yes — put it live.",
                 "preview": "Then, without asking again:\n\n"
                            "1. It becomes one commit on `master`.\n"
                            "2. Production is backed up first.\n"
                            "3. The merged code goes live.\n"
                            "4. The test tenant is checked, to see the deploy did not break it.\n"
                            "5. The promise above is measured on the live site."},
                {"label": "Request changes",
                 "description": "Not yet — send it back with a note saying what to fix.",
                 "preview": "Then:\n\n"
                            "1. Your note is posted on the PR.\n"
                            "2. The PR stays open; nothing goes live.\n"
                            "3. This run stops here.\n"
                            "4. The next bet is written knowing what you said.\n\n"
                            "Write the note in the box below — it is the only thing that carries."},
                {"label": "Close",
                 "description": "No — drop it.",
                 "preview": "Then:\n\n"
                            "1. The PR is closed without merging, with your note on it.\n"
                            "2. The branch stays, so the work is not lost.\n"
                            "3. This run stops here."},
            ],
        }] if n else [],
    }))
    PY
