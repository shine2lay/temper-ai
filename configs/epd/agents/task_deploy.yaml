# EPD task pipeline: put the candidate commit on the environment, so the QA
# step has the change to use and review has it to look at.
#
# Runs BEFORE review, not after it: QA and review judge the same round in
# parallel, and the implementer gets both sets of findings in one go. What is
# deployed is therefore a candidate, not an approved commit — which is exactly
# what a throwaway spike is for. On a loop rewind this runs again, so the
# environment always serves the round being judged, and the last deploy of the
# run is the commit that ended it.
#
# The stack has been up since stack_up, but it was built when the worktree
# still held the base branch — an agent's live instance to look at while it
# worked, not the finished change. This re-ups it:
#
#   standee up <host worktree> --project <repo> --as <slug> --tier dev --gateway
#
# Re-running updates the environment in place (same name, same URL) and
# rebuilds the images. standee waits for every service to be healthy and rolls
# back to the previous images if they never are, so a deploy that breaks the
# stack leaves the old one running rather than nothing. Then the seed runs
# again (`standee seed`), from the candidate's code: the stack was seeded once,
# at stack_up, from the base branch, so an account or fixture this change adds
# did not exist for QA (b008's qa-thin@ never did). RollCall's seed is
# idempotent and refreshes each test account to its known book, so every QA
# round starts from the same data.
#
# With `paper_account` (e.g. QA), QA signs in to a real Alpaca paper account
# rather than the seed's book. The seed signs the stack's paper login
# (`paper_email`) in to the machine's shared paper account, the unsuffixed
# ROLLCALL_DEV_ALPACA_* pair, on every seed; so after it, that login's keys are
# moved to EPD's own account from ROLLCALL_DEV_ALPACA_*_<ACCOUNT>. The stack's
# container already has those (compose reads the host's dev.env when the stack
# is stood up), so the keys never pass through this script or its log. RollCall
# keeps a login's broker for the life of its process: the service restarts.
#
# The commit check is the point of the stage: deploy a commit, or say why not.
# A dirty worktree means what is judged is not what is committed — QA would
# pass on work that lives nowhere, and the next round would start from a
# different tree than the one the findings describe.
# POSIX sh; no dollar-brace env syntax (config-loader substitution).
agent:
  name: task_deploy
  # 2: seeds the stack again after each deploy, from the candidate's code, and
  #    says so (`seeded`). A seed that fails is a failed deploy: the commit
  #    ships a seed that does not run.
  # 3: with paper_account, puts the stack's paper login on that EPD paper
  #    account after the seed, and restarts the server so it takes the keys.
  version: 3
  type: script
  timeout_seconds: 1200
  script_template: |
    #!/bin/sh
    set -eu
    WT={{ worktree_path }}
    HOST_WT={{ host_worktree_path }}
    PROJECT={{ project }}
    TASK_SLUG={{ task_slug }}
    # stack_up's name first (what standee really called it, possibly truncated),
    # the composed one only as a fallback. default('', true) because an unused
    # input arrives as None, which would otherwise render as the word "None".
    ENV_NAME={{ env_name_actual | default('', true) or env_name }}
    TTL={{ ttl | default('') }}
    HAS_DOCKER={{ has_docker | default('false') }}
    RUN_VERIFY={{ run_verify | default('true') }}
    CANDIDATE={{ candidate_commit | default('') }}
    PAPER_ACCOUNT={{ paper_account | default('', true) }}
    PAPER_EMAIL={{ paper_email | default('', true) }}
    [ "$PAPER_ACCOUNT" = None ] && PAPER_ACCOUNT=""
    [ "$PAPER_EMAIL" = None ] && PAPER_EMAIL=""
    [ "$TTL" = None ] && TTL=""
    [ "$CANDIDATE" = None ] && CANDIDATE=""
    case "$HAS_DOCKER" in true|True|1) HAS_DOCKER=true ;; *) HAS_DOCKER=false ;; esac
    case "$RUN_VERIFY" in false|False|0) RUN_VERIFY=false ;; *) RUN_VERIFY=true ;; esac

    emit() {
      python3 -c 'import json,sys; print(json.dumps({"status": sys.argv[1], "url": sys.argv[2], "commit": sys.argv[3], "verify": sys.argv[4]=="true", "detail": sys.argv[5], "seeded": sys.argv[6]=="true"}))' \
        "$1" "$2" "$3" "$4" "$5" "$6"
    }
    fail() { echo "deploy failed: $1" >&2; emit failed "" "$CANDIDATE" false "$1" false; exit 1; }

    # No stack to deploy to is not a failure: most repos in this pipeline have
    # none, and the run should carry on to teardown and cleanup.
    if [ "$HAS_DOCKER" != true ]; then
      echo "deploy: no stack for this repo (has_docker=false) — nothing to deploy"
      emit skipped "" "$CANDIDATE" false "no compose file in the worktree" false
      exit 0
    fi

    [ -d "$WT" ] || fail "worktree not found: $WT"
    if [ -n "$PAPER_ACCOUNT" ]; then
      case "$PAPER_ACCOUNT" in *[!A-Z]*) fail "paper_account is capital letters only (QA, WALK): $PAPER_ACCOUNT" ;; esac
      case "$PAPER_EMAIL" in ''|*[!A-Za-z0-9@._+-]*) fail "paper_account $PAPER_ACCOUNT needs a paper_email, an address: $PAPER_EMAIL" ;; esac
    fi

    # What is actually about to be built: the worktree is what standee mounts
    # and builds from, so its HEAD — not the reviewed sha from an input — is
    # the truth about what ships.
    HEAD=$(git -C "$WT" rev-parse HEAD)
    DIRTY=$(git -C "$WT" status --porcelain | head -20)
    if [ -n "$DIRTY" ]; then
      echo "$DIRTY" >&2
      fail "worktree is dirty: the change must be committed before it is judged, or QA and review are looking at work that exists nowhere"
    fi
    if [ -n "$CANDIDATE" ]; then
      case "$HEAD" in
        "$CANDIDATE"*) : ;;
        *) fail "HEAD ($HEAD) is not the commit the implementer reported ($CANDIDATE)" ;;
      esac
    fi

    KEYDIR=/app/standee-ssh
    [ -f "$KEYDIR/id_ed25519" ] || fail "no standee ssh key at $KEYDIR (run local/standee-ssh/setup.sh, mount it)"
    KEY=$(mktemp)
    trap 'rm -f "$KEY"' EXIT
    install -m 600 "$KEYDIR/id_ed25519" "$KEY"
    standee() {
      ssh -i "$KEY" -o IdentitiesOnly=yes -o UserKnownHostsFile="$KEYDIR/known_hosts" -o StrictHostKeyChecking=yes \
          -o BatchMode=yes -o ConnectTimeout=10 shinelay@host.docker.internal standee "$@"
    }

    set -- up "$HOST_WT" --project "$PROJECT" --as "$TASK_SLUG" --tier dev --gateway
    [ -n "$TTL" ] && set -- "$@" --ttl "$TTL"
    echo "deploying $HEAD to $ENV_NAME: standee $*"
    OUT=$(standee "$@" 2>&1) || { echo "$OUT"; fail "standee up failed for $ENV_NAME (it rolls back to the previous images; the old build may still be serving)"; }
    echo "$OUT"

    # The env name and URL come from standee's own report, not from the name we
    # composed: standee caps an env name at 62 characters, so a long task slug
    # is truncated and a lookup by the composed name finds nothing.
    ENV_REPORTED=$(printf '%s\n' "$OUT" | sed -n 's/^env  *\([^ ]*\).*/\1/p' | head -1)
    URL=$(printf '%s\n' "$OUT" | sed -n 's|^url  *\(https*://[^ ]*\).*|\1|p' | head -1)
    [ -n "$ENV_REPORTED" ] && ENV_NAME="$ENV_REPORTED"
    [ -n "$URL" ] || URL=$(standee url "$ENV_NAME" 2>/dev/null | tr -d '\r\n')
    [ -n "$URL" ] || fail "standee up reported no URL for $ENV_NAME"

    # standee waited for the containers to be healthy; this waits for the app
    # to answer through the gateway, which is what the browser step will use.
    echo "probing $URL"
    CODE=$(python3 - "$URL" <<'PY'
    import sys, time, urllib.error, urllib.request
    url, last = sys.argv[1], "no response"
    for attempt in range(12):
        try:
            with urllib.request.urlopen(url, timeout=10) as r:
                last = str(r.status)
                if r.status < 500:
                    break
        except urllib.error.HTTPError as e:
            last = str(e.code)
            if e.code < 500:
                break
        except Exception as e:
            last = type(e).__name__
        time.sleep(5)
    print(last)
    PY
    )
    case "$CODE" in
      ''|*[!0-9]*) fail "$URL did not answer after the deploy ($CODE)" ;;
      5*) fail "$URL answered $CODE after the deploy" ;;
    esac

    # The seed again, from this commit's code, before QA signs in with its accounts.
    echo "seeding $ENV_NAME again from $HEAD"
    SEED_OUT=$(standee seed "$ENV_NAME" 2>&1) || { echo "$SEED_OUT"; fail "standee seed failed for $ENV_NAME on $HEAD: the seed this commit ships does not run"; }
    printf '%s\n' "$SEED_OUT" | tail -15

    DETAIL="HTTP $CODE; seeded again from this commit"
    if [ -n "$PAPER_ACCOUNT" ]; then
      # Inside the container, from its own environment: the keys are never in this script's output.
      # One argument with no single quote in it, quoted once more for the ssh forced command, which
      # splits what it is sent the way a shell would.
      REKEY='set -eu; k=$(printenv ROLLCALL_DEV_ALPACA_API_KEY_'"$PAPER_ACCOUNT"' || true); s=$(printenv ROLLCALL_DEV_ALPACA_SECRET_KEY_'"$PAPER_ACCOUNT"' || true); if [ -z "$k" ] || [ -z "$s" ]; then echo "this stack has no ROLLCALL_DEV_ALPACA_API_KEY_'"$PAPER_ACCOUNT"' / _SECRET_KEY_'"$PAPER_ACCOUNT"': they go in the host dev.env, which a stack reads when it is stood up"; exit 3; fi; rollcall tenant set-secret '"$PAPER_EMAIL"' alpaca ALPACA_API_KEY "$k"; rollcall tenant set-secret '"$PAPER_EMAIL"' alpaca ALPACA_SECRET_KEY "$s"'
      echo "putting $PAPER_EMAIL on the $PAPER_ACCOUNT paper account"
      REKEY_OUT=$(standee exec "$ENV_NAME" rollcall sh -c "'$REKEY'" 2>&1) || { echo "$REKEY_OUT"; fail "could not put $PAPER_EMAIL on the $PAPER_ACCOUNT paper account on $ENV_NAME"; }
      printf '%s\n' "$REKEY_OUT" | grep '^ok:' || true
      RESTART_OUT=$(standee restart "$ENV_NAME" rollcall 2>&1) || { echo "$RESTART_OUT"; fail "$ENV_NAME's server did not restart after its paper keys changed"; }
      CODE=$(python3 - "$URL" <<'PY'
    import sys, time, urllib.error, urllib.request
    url, last = sys.argv[1], "no response"
    for attempt in range(24):
        try:
            with urllib.request.urlopen(url, timeout=10) as r:
                last = str(r.status)
                if r.status < 500:
                    break
        except urllib.error.HTTPError as e:
            last = str(e.code)
            if e.code < 500:
                break
        except Exception as e:
            last = type(e).__name__
        time.sleep(5)
    print(last)
    PY
      )
      case "$CODE" in
        ''|*[!0-9]*) fail "$URL did not answer after the restart for the paper keys ($CODE)" ;;
        5*) fail "$URL answered $CODE after the restart for the paper keys" ;;
      esac
      DETAIL="$DETAIL; $PAPER_EMAIL on the $PAPER_ACCOUNT paper account"
    fi

    echo "deployed: $ENV_NAME -> $URL ($HEAD, $DETAIL)"
    emit deployed "$URL" "$HEAD" "$RUN_VERIFY" "$DETAIL" true
