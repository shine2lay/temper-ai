# EPD task pipeline: one decision out of several judgements.
#
# Review reads the diff, QA uses the running application, security reads what
# the branch added, and the test step runs the repository's CI checks on it.
# They judge the same round at the same time and none of them
# outranks the others: a change that reads well but does not work is not done,
# a change that works but leaves a wrong comment behind is not done, and a
# change that does both while committing a key is certainly not done. This node
# turns their verdicts into the single one the loop runs on, so the implementer
# gets every list of findings in the same round instead of each judge arriving
# after the last one approved.
#
# It is also the road the findings take back to the implementer. A rewind keeps
# only the triggering node's result (executor: loop_feedback[trigger] = result)
# and clears every judge's, so a list the implementer read from a judge arrived
# as nothing: until v7 no finding ever reached a fix round (b007 and five other
# runs), and the implementer was told it had been sent back for no reason it
# could see. So every list comes through here and goes out unchanged. Values
# reach the script as JSON in the environment, never in the shell text, so a
# finding with a quote, a backtick or a newline in it is data, not a problem.
#
# A judge that did not run (no stack, verify=false, implement skipped) renders
# as an empty string or the literal None, and counts as "did not object".
#
# Values reach the Python through the environment, by name (`| env`): the body
# is a quoted heredoc, in which the shell expands nothing, so a value written
# into it would arrive as the text `$TEMPER_V1`. It did, for a whole afternoon
# (b003): every verdict read as "temper_v", which is not "approve", so every
# build was sent back for changes it had not been asked for.
agent:
  name: task_gate
  # 2: a minor finding is recorded, not a veto -- only a blocking one holds the
  #    build.
  # 3: verdicts read from the environment by name; the quoted heredoc was
  #    delivering the variable reference as text (b003: every gate said
  #    request_changes).
  # 4: the threshold clauses QA could not walk ride along in the summary, the
  #    way the security actions do. Not a veto -- nothing the implementer can
  #    do about a clause no browser reaches -- but not silence either.
  # 5: that reasoning was wrong, and it cost two bets. There usually IS
  #    something the implementer can do about a clause no browser reaches:
  #    build the route -- a control, a fixture, a seed -- which is what the
  #    bet stage tells the NEXT round to do a week later. b004 and b005 both
  #    shipped with an unwalked clause noted in this summary, and `measure`
  #    then found the same clause unreachable on production and recorded
  #    `iterate`. So an unwalked clause now asks for changes. The clauses no
  #    build can settle arrive separately as `qa_out_of_build` and keep the
  #    old behaviour: a note, not a veto, because a fix round spent on "no
  #    confused item in the next report" is a round spent on nothing.
  # 6: the send-back in v5 had no floor. A clause whose route cannot be built --
  #    the implementer tries, the state is still unreachable -- would ask again
  #    every round, and `on_max_loops: silent` leaves the last verdict standing:
  #    request_changes, which epd_loop turns into `build_failed` and then refuses
  #    to ship (bin/epd_loop.py:1428,1460). Working code, reviewed and deployed,
  #    thrown away over a clause nobody can walk -- worse than v4, which at least
  #    shipped it. So the veto now has a budget: UNREACHABLE_VETO_ROUNDS rounds to
  #    ask for the route, after which QA's inability to reach the state is
  #    accepted and the build goes out with the clause named on the pull request.
  #    The gate counts its own rounds, because the engine's loop count never
  #    reaches the node.
  # 7: two things. The test step is a fourth judge: CI's checks on the candidate,
  #    `fail` only for a failure the base branch does not have, `skipped` when it
  #    could not run at all (a harness fault: noted, never a veto). And every
  #    judge's list now passes through here to the implementer, because a rewind
  #    clears the judges' outputs and no finding was reaching a fix round.
  version: 7
  type: script
  timeout_seconds: 30
  script_template: |
    python3 - <<'PYEOF'
    import json
    import os
    import re

    def value(name: str) -> str:
        return os.environ.get(name, "")

    # How many rounds an unreachable clause may hold the build. One: the
    # implementer gets a round to build the route (a control, a fixture, a seed),
    # and if the state is still unreachable after it, that is the answer -- asking
    # a third time costs a round and returns the same sentence. A clause that was
    # WALKED and came out wrong is not this case and keeps its full max_loops.
    UNREACHABLE_VETO_ROUNDS = 1

    # label, raw verdict, the word that means "fine", the word that means "not fine",
    # and the words by which a judge says it did not judge at all. A judge is one row.
    # Adding one is adding a row, not editing the logic.
    JUDGES = [
        ("review", value("{{ review_verdict | default('') | env }}"), "approve", "request_changes", ()),
        ("QA", value("{{ qa_verdict | default('') | env }}"), "pass", "fail", ()),
        ("security", value("{{ security_verdict | default('') | env }}"), "pass", "fail", ()),
        # `skipped`: the test step could not run (no git, an unreadable workflow file,
        # its own crash). A harness fault must not send a build back, nor throw one
        # away at max_loops, so it abstains -- and the summary says so.
        ("tests", value("{{ test_verdict | default('') | env }}"), "pass", "fail", ("skipped",)),
    ]


    def read(raw: str) -> str:
        """A verdict is a bare word. Anything else — empty, None, or something a model
        invented — is reduced to the word characters in it, so nothing that arrives here
        can be more than a word."""
        word = re.sub(r"[^a-z_]", "", str(raw).strip().lower())
        return "" if word in ("", "none", "null") else word


    verdicts, unknown, wants, ran, abstained = {}, [], [], [], []
    for label, raw, ok, no, abstain in JUDGES:
        v = read(raw)
        verdicts[label] = v or None
        if not v:
            continue  # did not run
        if v in abstain:
            abstained.append(label)
            continue
        ran.append(label)
        # A judge that ran and said something nobody recognises has not approved
        # anything: it counts as wanting changes, never as consent. The judges re-run
        # on the rewind, so a one-off malformed verdict corrects itself; a persistent
        # one stops at max_loops with `unreadable` in the outputs saying why.
        if v == no:
            wants.append(label)
        elif v != ok:
            unknown.append(f"{label}={v}")
            wants.append(label)

    # Things no round of the loop can discharge — rotating a credential that was
    # committed, above all. They must not block the loop (the implementer cannot do
    # them) and must not be silently approved past either, so they ride along in the
    # one line a human actually reads.
    try:
        human_actions = int(value("{{ security_human_actions_count | default('0') | env }}") or 0)
    except ValueError:
        human_actions = 0

    # The threshold clauses QA could not walk: lists from the verify agent, read
    # back as JSON from the environment (`tojson` on the way in), so they are data
    # whatever punctuation the clauses hold; anything that is not a list is none.
    def clauses(raw: str) -> list:
        try:
            got = json.loads(raw or "[]")
        except ValueError:
            return []
        return [str(c) for c in got if str(c).strip()] if isinstance(got, list) else []

    # No route on this stack yet -- one could be built, so this asks for changes.
    unverified = clauses(value("{{ qa_unverified | default([], true) | tojson | env }}"))
    # Outside any build (names a future report, an owner decision): a note only.
    out_of_build = clauses(value("{{ qa_out_of_build | default([], true) | tojson | env }}"))
    # Walked and wrong. These are a defect in the change, not a missing route.
    unmet = clauses(value("{{ qa_unmet | default([], true) | tojson | env }}"))
    # The lists each judge wrote for the implementer, kept as they came (objects with
    # where/what/fix), to go back out unchanged; at most 40 of each; the full lists are
    # in each judge's report file. No slicing of the LIST on the template side: a slice
    # of anything but a list is an undefined there, and `tojson` of one stops the gate.
    # The JSON text is cut at 120,000 characters instead (tojson's output is ASCII): one
    # environment variable holds at most 128 KB, and a gate that cannot start is a lost
    # build. A list cut short parses as no list; the judge's report still has it.
    def listed(raw: str) -> list:
        try:
            got = json.loads(raw or "[]")
        except ValueError:
            return []
        return got[:40] if isinstance(got, list) else []

    review_findings = listed(value("{{ (review_findings | default([], true) | tojson)[:120000] | env }}"))
    security_findings = listed(value("{{ (security_findings | default([], true) | tojson)[:120000] | env }}"))
    test_failures = listed(value("{{ (test_failures | default([], true) | tojson)[:120000] | env }}"))
    # Bugs QA found that are not about the threshold at all.
    qa_issue_list = listed(value("{{ (qa_issues | default([], true) | tojson)[:120000] | env }}"))
    qa_issues = [str(i) for i in qa_issue_list if str(i).strip()]
    qa_summary = value("{{ qa_summary | default('', true) | env }}")
    test_summary = value("{{ test_summary | default('', true) | env }}")

    # Which round is this? The engine keeps its loop count to itself (executor:
    # loop_counts is local), so the gate counts its own runs -- one file per run,
    # under .epd/, which survives the implementer's `git clean` between rounds.
    # If it cannot be counted the veto is off: an uncountable round must not be
    # what throws away a reviewed, deployed build.
    def this_round() -> int | None:
        workspace = value("{{ workspace_path | default('') | env }}") or "/tmp"
        run = re.sub(r"[^A-Za-z0-9_-]", "", value("{{ run_id | default('') | env }}")) or "norun"
        path = os.path.join(workspace, ".epd", f"gate-rounds-{run}")
        try:
            os.makedirs(os.path.dirname(path), exist_ok=True)
            try:
                with open(path) as f:
                    seen = int((f.read() or "0").strip() or 0)
            except (FileNotFoundError, ValueError):
                seen = 0
            seen += 1
            with open(path, "w") as f:
                f.write(str(seen))
            return seen
        except OSError:
            return None

    round_no = this_round()
    # The veto is live while there are rounds left in the budget to spend on it.
    may_veto = round_no is not None and round_no <= UNREACHABLE_VETO_ROUNDS
    veto_expired = bool(unverified) and not may_veto

    # A clause nobody could walk is not a pass. The implementer's job on the way
    # back is the route to it, not more of the feature: the state has to become
    # reachable before anything can say the threshold holds.
    if unverified and may_veto and "QA" not in wants:
        wants.append("QA")

    # Budget spent. QA fails the round for an unreachable clause (task_verify v5),
    # so accepting one means lifting that `fail` too -- but ONLY when being unable
    # to reach it was the whole of QA's complaint. A clause walked and wrong
    # (`unmet`), a bug QA found off the threshold (`issues`), or a verdict nobody
    # can read is a different objection and keeps the build back.
    if veto_expired and not unmet and not qa_issues and verdicts["QA"] == "fail":
        wants = [w for w in wants if w != "QA"]

    if wants:
        verdict = "request_changes"
        summary = f"{' and '.join(wants)} asked for changes"
        if unverified:
            summary += (
                f" — {len(unverified)} threshold clause(s) no browser action reached: "
                "build the route to that state (a control, a fixture, a seed) so it can be walked"
            )
        if unknown:
            summary += f" (unreadable verdict: {', '.join(unknown)} — not treated as approval)"
    else:
        verdict = "approve"
        summary = f"{' and '.join(ran)} approved" if ran else "nothing judged this round"
    if human_actions:
        summary += (
            f" — {human_actions} action(s) still need a human "
            "(see security_human_actions: committing a credential is not undone by removing it)"
        )
    # Accepted means it WENT OUT unproven. A build held back by another judge ships
    # nothing, so nothing was accepted -- and those clauses go back to the implementer
    # with the round that is being spent anyway.
    accepted_unreachable = unverified if (veto_expired and verdict == "approve") else []
    if accepted_unreachable:
        summary += (
            f" — {len(accepted_unreachable)} threshold clause(s) still unreachable after "
            f"{UNREACHABLE_VETO_ROUNDS} round(s) asking for a route: accepted as unwalkable and "
            "shipped unproven (see verify_unverified; this clause was never shown to hold)"
        )
    if out_of_build:
        summary += (
            f" — {len(out_of_build)} threshold clause(s) no build can settle "
            "(see verify_out_of_build; the owner judges those on the PR)"
        )
    if round_no is None and unverified:
        summary += " — (gate could not count its rounds; the unreachable-clause veto was off)"
    if "tests" in abstained:
        summary += (
            f" — CI's checks were not run on this commit ({test_summary or 'the test step could not run'}); "
            "CI on the pull request is the first to run them"
        )

    print(json.dumps({
        "verdict": verdict,
        "summary": summary,
        "review_verdict": verdicts["review"],
        "qa_verdict": verdicts["QA"],
        "security_verdict": verdicts["security"],
        "test_verdict": verdicts["tests"],
        "changes_wanted_by": wants,
        "unreadable": unknown,
        "human_actions": human_actions,
        # Both lists are re-emitted here because a gate rewind preserves only THIS
        # node's result (executor: loop_feedback[trigger] = result); verify's own
        # output is cleared with the rest of the batch, so the implementer can only
        # be told which clauses to open up through the gate.
        "qa_unverified": unverified,
        "qa_out_of_build": out_of_build,
        # Named separately so ship, the PR body and measure can all say which
        # clauses went out unproven rather than passing.
        "qa_accepted_unreachable": accepted_unreachable,
        "gate_round": round_no,
        # What the implementer answers on a send-back, for the same reason as the
        # clause lists above: after the rewind this is the only copy there is.
        "review_findings": review_findings,
        "qa_issues": qa_issue_list,
        "qa_summary": qa_summary,
        "security_findings": security_findings,
        "test_failures": test_failures,
    }))
    PYEOF
