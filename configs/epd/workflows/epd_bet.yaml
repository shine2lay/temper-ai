workflow:
  name: epd_bet
  # 2: takes the last bet's unfinished business, so a half-verified bet is
  #    inherited by the agent that chooses what to do next.
  # 3: takes the report as a path and reads it, so the stage can be wired straight to epd_report's
  #    output instead of needing a driver to read the file in between.
  # 4: writes one to five candidates into pre-made slots instead of one bet to one path. The pick
  #    moved out of the run and into a file the owner edits (backlog.md).
  # 5: takes the round's lens (who walked, when the owner asked for someone other than the
  #    profile's user), so the bets are written for that person too.
  version: 5
  description: |
    EPD loop, stage 2 of the proposal: the bets. Replaces the product
    department's decision -- or rather, prepares it. One agent reads the
    report, the goals, the profile and the ledger of past bets, and writes
    every bet the evidence supports (one to five), each as a pitch with ONE
    falsifiable invariant and a pre-registered success threshold, each to
    its own slot under the bets directory, in the order it would build them.

    Ends with status DECIDE, always: the owner reads the candidates, edits
    the ones worth building, and lists them in backlog.md in the order the
    loop should take them. That file is the product judgement lever, and it
    is the only place a human is required.

    The slots are directories the driver makes before the run (the
    container's user cannot make directories the host can then write its
    records into). The agent fills the first N and leaves the rest; the
    driver removes the empty ones when it collects the run.

    Isolated: inputs are strings and paths. Run it alone on any report to
    work on the product judgement.
  inputs:
    round_id: {type: string, required: true}
    bets_dir: {type: string, required: true}    # container path of the bets directory
    slots: {type: string, required: true}       # bet ids, space-separated, whose directories exist and are empty
    goals: {type: string, required: true}
    profile: {type: string, required: true}
    report_path: {type: string, required: true}
    bets_tsv: {type: string, required: true}
    unfinished: {type: string, required: false}
    lens: {type: string, required: false}       # who walked, instead of the profile's user; empty = the profile's user
  outputs:
    status: bet.structured.status
    candidates: bet.structured.candidates
    left_out: bet.structured.left_out
    questions_for_owner: bet.structured.questions_for_owner

  nodes:
    - name: bet
      type: agent
      agent: epd_bet
      input_map:
        round_id: input.round_id
        bets_dir: input.bets_dir
        slots: input.slots
        goals: input.goals
        profile: input.profile
        report_path: input.report_path
        bets_tsv: input.bets_tsv
        unfinished: input.unfinished
        lens: input.lens
