# System engineering's continuous deployer for RollCall: one free step (epd_cd), run every minute by
# configs/triggers/epd_cd.yaml.
#
# RollCall's master goes live by itself: two minutes after the last land, master's HEAD is released
# through epd_loop.release_prod / deploy_prod (backup, up, migrate, health, QA seed, owner Telegram
# ping, its own undo), one release at a time, and lands that come in during a release go out together
# in the next one. Each tick then runs rollcall_cd_verdict.py to inspect finished master CI runs,
# rerun a first money-test failure once, and undo to the last green commit if a money test fails
# again (unless a migration sits between). The host does the work; this run only asks.
workflow:
  name: epd_cd
  version: 2
  description: |
    One tick of RollCall's continuous deployer: on the host, run the debounced deployer tick and then
    the CI verdict step in one script agent run. No model.

  outputs:
    decision: tick.structured.decision
    reason: tick.structured.reason
    head: tick.structured.head
    deployed_sha: tick.structured.deployed_sha
    unit: tick.structured.unit
    verdict: tick.structured.verdict

  nodes:
    - name: tick
      type: agent
      agent: epd_cd
