workflow:
  name: epd_loop
  # 3: the build keeps what ship needs. Standalone, epd_task tears its own worktree and branch down
  #    at the end; here the branch is what the next node pushes, so the build is told to keep it.
  # 4: one bet from the backlog, already approved. The report and the bet moved to epd_propose,
  #    which writes several candidates for the owner to choose from on disk; this run starts at
  #    `tasks`, ungated, on the bet the driver took from the top of backlog.md.
  # 5: the build's screenshots reach ship, which puts them on the PR.
  # 6: the bet's invariant and threshold reach the build, whose QA walks the threshold clause by
  #    clause; the clause table reaches ship, which puts it on the PR beside the pictures.
  # 7: QA and measure can sign in to a real Alpaca paper account instead of the seed's book (the
  #    owner, 2026-09-23: "we have the paper trading account, lets just [use] it for QA instead of
  #    stale-seed"). The build's deploy puts the stack's paper login on `paper_account`, and QA and
  #    measure are each told what that login is (`login_note`, `measure_note`); measure signs in as
  #    `measure_email`, which on prod is not the build's QA login when the bet is about the seed.
  version: 7
  description: |
    The EPD loop, as one run, for one bet the owner has already approved.

      tasks → build → ship (PR) → [OWNER DECIDES] → deploy → measure

    Nothing here is new. Each node references a workflow that already exists and is already used on
    its own; this file is only the wiring between them. That is the point: the loop used to be a
    sequence a Python driver performed, so the shape of the process lived in a script and only the
    individual stages were visible to temper. A run showed one stage at a time and could not be
    resumed across them, the gate was a person reading a terminal, and the order of the work was an
    implementation detail of a file nobody could see from the UI.

    The referenced graphs are unchanged and still run standalone — that is what makes them worth
    referencing, and how each one gets worked on.

    Where the bet comes from. The walks and the pitches are a separate run (epd_propose): it writes
    one to five candidates from one set of walks, and stops. The owner reads them, edits the ones
    worth building, and lists them in backlog.md in the order the loop should take them. The driver
    takes the first, records that as the owner's approval of the invariant as it stands in the file,
    and submits this run for it. So there is no gate on `tasks` any more: the question it asked --
    is this bet worth building -- was answered before the run was submitted, and a run that parks
    to ask it again is a run the owner has to come back to. The report is only walked when the
    backlog is empty (or the owner asks for more): what the proposal buys is the owner's attention
    in one sitting and the loop working through the list without it.

    The owner decides once in this run, at `deploy`: the build is a pull request by then, and
    nothing reaches production until the owner says merge -- in the UI, or on GitHub itself. That
    decision, and the approval that put the bet in the backlog, are recorded by the driver
    (decisions.jsonl, `epd_loop.py scorecard`) against the config versions that earned them: they
    are the measure of whether the loop is getting better that is not the loop grading its own work.

    The stages hand each other file paths, not text. Each writes its artefact to the bet directory
    and the next one reads it — so the wiring stays a few strings, and the evidence is on disk where
    a person can read it too. The bet's own words (title, invariant, threshold) come in as inputs,
    read off bet.json by the driver, because the node that wrote them is not in this run.

    `ship` and `deploy` are the nodes that touch the repository and production, and neither contains
    the work: each asks the host driver to do it, over an ssh key pinned to those two commands. The
    driver re-checks the build's verdict before it pushes, and reads the owner's decision off GitHub
    as well as off the gate, so neither decision rests on this file being wired right.

  inputs:
    # Identity and where the artefacts live
    bet_id:       {type: string, required: true}
    bet_dir:      {type: string, required: true}
    report_path:  {type: string, required: true}   # the report this bet came from (measure reads it)
    bet_path:     {type: string, required: true}
    tasks_path:   {type: string, required: true}
    outcome_path: {type: string, required: true}

    # The bet's own words, off bet.json (the PR body quotes them)
    title:        {type: string, required: true}
    problem:      {type: string, required: false}
    invariant:    {type: string, required: true}
    threshold:    {type: string, required: true}

    # The product's own context
    profile:      {type: string, required: true}

    # Where to measure, and as whom
    measure_url:  {type: string, required: true}   # the build people use, once shipped
    data_url:     {type: string, required: false}  # only if the measured stack has no QA tenant
    email:        {type: string, required: true}   # who verify signs in as, on the branch's dev stack
    empty_email:  {type: string, required: true}
    password:     {type: string, required: true}   # the QA password on the branch's dev stack (verify)
    measure_email: {type: string, required: true}  # who measure signs in as, on measure_url
    measure_password: {type: string, required: true}
    paper_account: {type: string, required: false} # EPD's paper account the stack's paper login goes on (QA); none: the seed's book
    login_note:   {type: string, required: false}  # what verify is told about its login
    measure_note: {type: string, required: false}  # what measure is told about its login

    # What the build stage needs
    repo_url:     {type: string, required: true}
    repo_path:    {type: string, required: true}
    base_branch:  {type: string, required: true}
    task_name:    {type: string, required: true}
    task_description: {type: string, required: true}
    stack_ttl:    {type: string, required: false}

  outputs:
    task_count:      tasks.structured.task_count
    branch:          build.structured.branch
    pr:              ship.structured.pr
    pr_decision:     deploy.structured.decision
    merge_sha:       deploy.structured.merge_sha
    shipped:         deploy.structured.status
    build_verdict:   build.structured.verdict
    implement_commit: build.structured.implement_commit
    deploy_url:      build.structured.deploy_url
    env_name:        build.structured.env_name    # the build's dev stack; the driver takes it down on collect
    verdict:         measure.structured.verdict
    threshold_met:   measure.structured.threshold_met
    vacuous_criteria: measure.structured.vacuous_criteria
    right_threshold: measure.structured.right_threshold
    outcome_summary: measure.structured.summary

  nodes:
    # 1 — The signed bet becomes tasks with boolean acceptance. Writes tasks.json.
    #     Ungated: the approval is the line in backlog.md that put this bet here (v4).
    - name: tasks
      type: stage
      ref: workflows/epd_tasks
      input_map:
        bet_id: input.bet_id
        tasks_path: input.tasks_path
        repo_path: input.repo_path
        bet_path: input.bet_path
        profile: input.profile

    # 2 — The whole build pipeline: claim, worktree, stack, plan, implement, review, QA, security,
    #     verify, deploy. Its own judges decide its verdict; this node does not second-guess them.
    #
    #     keep: on its own, epd_task ends by removing its worktree and branch and releasing the
    #     claim -- and refuses the branch when it holds commits that are nowhere else, which in this
    #     loop is the success case: the commit `ship` is about to push. So the build keeps all of it,
    #     and its dev stack too, which means the PR the owner is asked to decide on links to a
    #     running candidate rather than a URL that went down with the gate (the stack's ttl bounds
    #     the wait). The driver releases the three and takes the stack down when it collects the run.
    #     force: a claim left by an earlier attempt at the same bet is this bet's own; it does not
    #     block a retry.
    - name: build
      type: stage
      ref: workflows/epd_task
      depends_on: [tasks]
      input_map:
        repo_url: input.repo_url
        task_name: input.task_name
        task_description: input.task_description
        invariant: input.invariant
        threshold: input.threshold
        base_branch: input.base_branch
        stack_ttl: input.stack_ttl
        verify_email: input.email
        verify_password: input.password
        verify_login_note: input.login_note
        paper_account: input.paper_account
        keep: true
        force: true

    # 3 — Push and open the PR. Conditioned on the build's own judges, and the host driver checks
    #     the same thing again before it pushes: a gate worth having is worth having on both sides
    #     of the wire. It stops at the PR: the owner's word on it is the next node's gate.
    - name: ship
      type: stage
      ref: workflows/epd_ship
      depends_on: [build]
      condition:
        source: build.structured.verdict
        operator: equals
        value: approve
      input_map:
        bet_id: input.bet_id
        bet_dir: input.bet_dir
        branch: build.structured.branch
        verdict: build.structured.verdict
        worktree_path: build.structured.worktree_path
        verdict_summary: build.structured.verdict_summary
        review_verdict: build.structured.review_verdict
        verify_verdict: build.structured.verify_verdict
        security_verdict: build.structured.security_verdict
        deploy_url: build.structured.deploy_url
        implement_commit: build.structured.implement_commit
        implement_summary: build.structured.implement_summary
        task_slug: build.structured.task_slug
        verify_screenshots: build.structured.verify_screenshots
        verify_threshold_checks: build.structured.verify_threshold_checks
        title: input.title
        problem: input.problem
        invariant: input.invariant
        threshold: input.threshold

    # 4 — THE GATE. The PR is open; the owner says what happens to it. `ship` asked the question
    #     (Merge / Request changes / Close), this node carries the answer: merge means squash-merge,
    #     back production up, deploy the merge commit, confirm the QA tenant survived; the other two
    #     put the note on the PR and end the run. The answer is recorded either way, with the note
    #     and the configs that earned it -- the owner's verdicts on bets and PRs are the measure of
    #     the loop that is not the loop grading itself.
    - name: deploy
      type: stage
      ref: workflows/epd_deploy
      depends_on: [ship]
      gate: true
      condition:
        source: ship.structured.status
        operator: equals
        value: pr_opened
      input_map:
        bet_id: input.bet_id
        bet_dir: input.bet_dir
        pr: ship.structured.pr

    # 5 — Did the bet's invariant hold on the build people actually use? Writes outcome.md.
    #     Depends on deploy, not on build: measuring before the merge measures the old product, and
    #     the outcome it wrote would enter the next proposal's context as evidence about this one.
    - name: measure
      type: stage
      ref: workflows/epd_measure
      depends_on: [deploy]
      condition:
        source: deploy.structured.status
        operator: equals
        value: shipped
      input_map:
        bet_id: input.bet_id
        outcome_path: input.outcome_path
        app_url: input.measure_url
        data_url: input.data_url
        email: input.measure_email
        empty_email: input.empty_email
        password: input.measure_password
        login_note: input.measure_note
        bet_path: input.bet_path
        report_path: input.report_path
        build_summary: build.structured.implement_summary
