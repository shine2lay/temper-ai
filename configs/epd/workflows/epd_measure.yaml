workflow:
  name: epd_measure
  # 2: takes data_url as well as app_url.
  # 3: carries the per-criterion results out, so a vacuous pass reaches the
  #    ledger instead of dying in the prose.
  # 4: bet and report arrive as paths and are read by the agent, so this stage can be wired directly
  #    to the stages that produced them.
  # 5: `login_note` says what the login is when it is not the seed's book (a real paper account).
  version: 5
  description: |
    EPD loop, stage 7 of 7: measure. Replaces the product department's
    accountability. On the shipped build's URL, one agent checks the bet's
    invariant, measures the pre-registered threshold the way the bet said,
    re-walks the friction the bet was meant to remove, looks for regressions
    nearby, and writes <bet dir>/outcome.md with kept / iterate / killed —
    and whether the threshold was the right thing to measure at all.

    The next iteration's report stage reads the outcome file.
  inputs:
    bet_id: {type: string, required: true}
    outcome_path: {type: string, required: true}
    app_url: {type: string, required: true}
    data_url: {type: string, required: false}
    email: {type: string, required: true}
    empty_email: {type: string, required: false}
    password: {type: string, required: true}
    login_note: {type: string, required: false}
    bet_path: {type: string, required: true}
    report_path: {type: string, required: true}
    build_summary: {type: string, required: false}
  outputs:
    status: measure.structured.status
    outcome_path: measure.structured.outcome_path
    verdict: measure.structured.verdict
    invariant_holds: measure.structured.invariant_holds
    threshold_met: measure.structured.threshold_met
    criteria: measure.structured.criteria
    vacuous_criteria: measure.structured.vacuous_criteria
    unverified: measure.structured.unverified
    regressions: measure.structured.regressions
    right_threshold: measure.structured.right_threshold
    summary: measure.structured.summary

  nodes:
    - name: measure
      type: agent
      agent: epd_measure
      input_map:
        bet_id: input.bet_id
        outcome_path: input.outcome_path
        app_url: input.app_url
        data_url: input.data_url
        email: input.email
        empty_email: input.empty_email
        password: input.password
        login_note: input.login_note
        bet_path: input.bet_path
        report_path: input.report_path
        build_summary: input.build_summary
