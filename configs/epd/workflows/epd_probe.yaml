# The back half of epd_task, on its own: claim a repo, stand a spike up, deploy HEAD to it, look at it
# in a browser. No planner, no implementer, no judges — so it costs cents instead of dollars and answers
# one question only: do the mechanical steps work?
#
# What it is for: proving deploy/verify wiring after a change to either, without paying for a full run.
# It deploys the branch exactly as it comes off base, so verify has no change to find — `change_visible`
# is expected to be "no" here, and a `pass` verdict means the application came up and its pages hold the
# seeded data. Judging a real change is epd_task's job.
workflow:
  name: epd_probe
  version: 1
  description: |
    Mechanical probe of the deploy + verify stages (no LLM work except the browser check).

    claim → worktree → stack_detect → stack_up → deploy → verify → stack_down → cleanup

    keep=true leaves the environment and worktree up for inspection.
  inputs:
    repo_url:
      type: string
      required: true
    task_name:
      type: string
      required: false
      default: "Deploy probe"
    # The browser agent is told the truth: there is no change to find here, so it spends its calls on
    # whether the application and its seeded data are healthy.
    task_description:
      type: string
      required: false
      default: |
        This is a mechanical probe of the deployment machinery. NOTHING was changed: the branch is
        identical to its base. Check that the application came up, that you can sign in, and that the
        pages hold the seeded test data. Report change_visible "no" with that as the reason — it is
        expected here and is not a failure.
    implement_summary:
      type: string
      required: false
      default: ""
    base_branch:
      type: string
      required: false
    keep:
      type: boolean
      required: false
    force:
      type: boolean
      required: false
    workspaces_root:
      type: string
      required: false
    stack_ttl:
      type: string
      required: false
    verify_email:
      type: string
      required: false
    verify_password:
      type: string
      required: false

  outputs:
    branch: worktree.structured.branch
    stack_url: stack_up.structured.url
    deploy_status: deploy.structured.status
    deploy_url: deploy.structured.url
    deploy_commit: deploy.structured.commit
    verify_verdict: verify.structured.verdict
    verify_summary: verify.structured.summary
    verify_change_visible: verify.structured.change_visible
    verify_pages: verify.structured.pages
    verify_issues: verify.structured.issues
    stack: stack_down.structured.status

  nodes:
    - name: claim
      type: agent
      agent: task_claim
      input_map:
        repo_url: input.repo_url
        task_name: input.task_name
        force: input.force
        workspaces_root: input.workspaces_root

    - name: worktree
      type: agent
      agent: task_worktree
      depends_on: [claim]
      input_map:
        repo_url: input.repo_url
        root: claim.structured.root
        task_slug: claim.structured.task_slug
        claim_path: claim.structured.claim_path
        base_branch: input.base_branch

    - name: stack_detect
      type: agent
      agent: task_stack_detect
      depends_on: [worktree]
      input_map:
        worktree_path: worktree.structured.worktree_path
        repo: claim.structured.repo
        task_slug: claim.structured.task_slug
        keep: input.keep

    - name: stack_up
      type: agent
      agent: task_stack_up
      depends_on: [stack_detect]
      condition:
        source: stack_detect.structured.has_docker
        operator: equals
        value: true
      input_map:
        host_worktree_path: stack_detect.structured.host_worktree_path
        project: stack_detect.structured.project
        task_slug: claim.structured.task_slug
        env_name: stack_detect.structured.env_name
        ttl: input.stack_ttl

    # No candidate_commit: nothing was implemented, so deploy takes the worktree's HEAD as it is. This is
    # the redeploy path exercised all the same — standee up again on a stack that is already running.
    - name: deploy
      type: agent
      agent: task_deploy
      depends_on: [stack_up]
      condition:
        source: stack_detect.structured.has_docker
        operator: equals
        value: true
      input_map:
        worktree_path: worktree.structured.worktree_path
        host_worktree_path: stack_detect.structured.host_worktree_path
        project: stack_detect.structured.project
        task_slug: claim.structured.task_slug
        env_name: stack_detect.structured.env_name
        has_docker: stack_detect.structured.has_docker
        run_verify: stack_detect.structured.run_verify
        ttl: input.stack_ttl

    - name: verify
      type: agent
      agent: task_verify
      depends_on: [deploy]
      condition:
        source: deploy.structured.verify
        operator: equals
        value: true
      input_map:
        app_url: deploy.structured.url
        email: input.verify_email
        password: input.verify_password
        task_name: input.task_name
        task_description: input.task_description
        implement_summary: input.implement_summary

    - name: stack_down
      type: agent
      agent: task_stack_down
      depends_on: [verify]
      condition:
        source: stack_detect.structured.stack_teardown
        operator: equals
        value: true
      input_map:
        env_name: stack_detect.structured.env_name

    - name: cleanup
      type: agent
      agent: task_cleanup
      depends_on: [stack_down]
      condition:
        source: stack_detect.structured.teardown
        operator: equals
        value: true
      input_map:
        repo_url: input.repo_url
        task_name: input.task_name
        force: input.force
        workspaces_root: input.workspaces_root
