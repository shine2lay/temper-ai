workflow:
  name: epd_propose
  # 2: an optional focus for the walkers. Rounds run side by side (`propose --count N`), and N
  #    rounds walking from the same goals walked the same pages; a focus each spreads them out.
  # 3: the walkers take turns on the Alpaca paper account (epd_report v3), so the round is given the
  #    login, what the account holds and when the market closes; rounds no longer run side by side.
  # 4: market_state, handed to epd_report v4: "shut" is an after-the-close round, whose walkers
  #    place no orders (`propose --after-close`).
  # 5: an optional lens (`propose --lens`), handed to epd_report v5 and epd_bet v5: who walks, when
  #    the owner asks for someone other than the profile's user.
  # 6: the bets come from the pitch stage (epd_bet v6): every problem in the report that is not on
  #    file goes through workflows/epd_pitch, at most 4 at once (queue task 3, 2026-09-26). So the
  #    round is given what that stage reads: the code at the round's commit (code_dir), the live
  #    reach sheet, the checkers' configs, and the problems it already found not real (no_bets).
  version: 6
  description: |
    The proposal half of the EPD loop, as one run.

      report → bet → [OWNER DECIDES, on disk]

    Three synthetic users take turns walking a dev stack of main, signed in to the Alpaca paper
    account while the market is open, and the friction is ranked (epd_report); from
    that report, the goals and the ledger, the bet stage sends every problem not already on file
    through the pitch stage, which writes a pitch with a falsifiable invariant and a pre-registered
    threshold to the problem's own slot under the bets directory, or finds the problem not real
    (epd_bet). Then it stops. There is no gate in this run: the
    decision is made on disk, where the owner reads the candidates, edits the ones worth building
    and lists them in backlog.md in the order the loop should take them. The loop (epd_loop) takes
    them from the top, one run per bet, and runs this proposal only when the backlog is empty --
    or when the owner asks for more.

    That split is the point. The loop used to walk, propose one bet and park at a gate every
    iteration, so the owner decided one bet at a time with the run waiting on them, and the walks
    were paid for again each time. The proposal is the part that needs the owner's attention and
    the walks; the work is the part that does not. Proposing several bets from one set of walks
    and keeping them in a file lets the owner decide in one sitting and the loop work through the
    list without asking again.

    Not here, and deliberately: bringing the stack up that `report` walks, which the driver does
    before the run (the ssh key that can do it belongs to the host); and making the slot
    directories, for the same reason -- the container's user cannot make a directory the host can
    then write its records into.

  inputs:
    # Identity and where the artefacts live
    round_id:     {type: string, required: true}   # r001, r002, ...: one per proposal
    report_path:  {type: string, required: true}
    bets_dir:     {type: string, required: true}
    slots:        {type: string, required: true}   # bet ids whose directories exist and are empty

    # The product's own context
    goals:        {type: string, required: true}
    profile:      {type: string, required: true}
    last_outcome: {type: string, required: false}
    unfinished:   {type: string, required: false}
    bets_tsv:     {type: string, required: true}
    focus:        {type: string, required: false}  # the part of the product this round's walkers stay in; empty = wherever the goals say
    lens:         {type: string, required: false}  # who walks, instead of the profile's user; empty = the profile's user
    no_bets:      {type: string, required: false}  # problems the pitch stage found not real, with its reasons

    # What the pitch stage reads (epd_bet v6)
    code_dir:     {type: string, required: true}   # the product's code at the round's commit, read-only
    reach:        {type: string, required: true}   # what the checkers can reach (the live reach sheet)
    qa_config_path: {type: string, required: true}       # task_verify's agent config
    measure_config_path: {type: string, required: true}  # epd_measure's agent config

    # Where to look at the product, and as whom
    app_url:      {type: string, required: true}   # the stack to walk (the driver brings it up)
    env_name:     {type: string, required: false}  # what standee calls that stack; for the record
    paper_email:  {type: string, required: true}   # the login all three walkers use, one after another
    password:     {type: string, required: true}
    account_state: {type: string, required: true}  # what the paper account holds as the round starts
    market:       {type: string, required: true}   # "the market is open; it closes <when>"
    market_state: {type: string, required: false}  # "shut": an after-the-close round, whose walkers place no orders

  outputs:
    report_path:     report.structured.report_path
    report_summary:  report.structured.summary
    top_items:       report.structured.top_items
    walk_1:          report.structured.walk_1
    walk_2:          report.structured.walk_2
    walk_3:          report.structured.walk_3
    candidates:      bet.structured.candidates
    left_out:        bet.structured.left_out
    questions_for_owner: bet.structured.questions_for_owner

  nodes:
    # 1 — Three synthetic users walk the product and the friction is ranked. Writes report.md.
    #     epd_report labels the report with what it calls bet_id; here that is the round.
    - name: report
      type: stage
      ref: workflows/epd_report
      input_map:
        app_url: input.app_url
        paper_email: input.paper_email
        password: input.password
        account_state: input.account_state
        market: input.market
        market_state: input.market_state
        goals: input.goals
        profile: input.profile
        last_outcome: input.last_outcome
        bet_id: input.round_id
        report_path: input.report_path
        focus: input.focus
        lens: input.lens

    # 2 — One pitch per problem not on file, each with a falsifiable invariant and a pre-registered
    #     threshold, each to its own slot, in the report's order. The owner decides on disk.
    - name: bet
      type: stage
      ref: workflows/epd_bet
      depends_on: [report]
      input_map:
        round_id: input.round_id
        bets_dir: input.bets_dir
        slots: input.slots
        goals: input.goals
        profile: input.profile
        report_path: report.structured.report_path
        bets_tsv: input.bets_tsv
        no_bets: input.no_bets
        unfinished: input.unfinished
        lens: input.lens
        code_dir: input.code_dir
        reach: input.reach
        qa_config_path: input.qa_config_path
        measure_config_path: input.measure_config_path
