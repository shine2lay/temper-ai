# QA's seeded-defect test, one case: run the build's two checks on a planted bug (or a control).
#
# A case is a branch in a git bundle: a past merged change with one known bug planted in its code, or
# a control with none. This runs the live checks on it, unchanged, exactly as the build calls them:
#
#   prepare -> test                                    task_test: the repository's own CI on the case's
#                                                      commit, the clean commit as base, so only a new
#                                                      failure fails it
#   prepare -> claim -> worktree -> stack_detect -> stack_up -> deploy -> verify -> stack_down
#                                                      task_verify: the case deployed to a dev stack as
#                                                      epd_probe does, checked in a browser against the
#                                                      bet's criteria
#   both -> finish                                     keep the reports, remove the case folder
#
# run_test and run_verify pick the paths (test only by default: it needs no model). The case never
# leaves the machine: the build's claim and worktree clone a bare copy made from the bundle, and
# nothing is pushed. Whether a check caught the bug is not decided here: epd_qa_grade scores a whole
# round against the corpus manifest, which says before any run what each bug breaks.
#
# The corpus, its manifest and the round's results stay with whoever owns the project's data; this
# workflow only needs their paths, under the workspaces folder the runs can see.
workflow:
  name: epd_qa_case
  version: 1
  description: |
    One seeded-defect case through the build's checks: task_test (the repo's CI on the case commit,
    the clean commit as base) and, when run_verify is on, task_verify on the case deployed to a dev
    stack. Live agents, unchanged; nothing is pushed. Scored by epd_qa_grade.
  inputs:
    # The corpus: a git bundle holding every case branch, and which case to run.
    bundle:
      type: string
      required: true
    # Names the bare copy, so the claim, the stack and the deploy see the project (e.g. "rollcall").
    project:
      type: string
      required: true
    case_id:
      type: string
      required: true
    case_branch:
      type: string
      required: true
    # The past merged commit the case was planted on: task_test's base.
    clean_commit:
      type: string
      required: true
    # When given, the case branch must be at this commit.
    case_commit:
      type: string
      required: false
    run_test:
      type: boolean
      required: false
      default: true
    run_verify:
      type: boolean
      required: false
      default: false
    # Where the case folder is made; default: a cases/ folder beside the bundle.
    work_root:
      type: string
      required: false
    # Where task_test's report and logs (and the browser check's .epd) are copied.
    keep_reports_in:
      type: string
      required: false
    # Leave the case folder and the dev stack up for inspection.
    keep:
      type: boolean
      required: false
    stack_ttl:
      type: string
      required: false
    # For the browser check: what the bet's own verify was given.
    task_name:
      type: string
      required: false
      default: "Seeded-defect case"
    task_description:
      type: string
      required: false
    invariant:
      type: string
      required: false
    threshold:
      type: string
      required: false
    criteria_reach:
      type: array
      required: false
    implement_summary:
      type: string
      required: false
    same_value:
      type: array
      required: false
    sent_back_because:
      type: string
      required: false
    verify_email:
      type: string
      required: false
    verify_password:
      type: string
      required: false
    verify_login_note:
      type: string
      required: false
    before_url:
      type: string
      required: false
    before_email:
      type: string
      required: false
    before_password:
      type: string
      required: false

  outputs:
    case_id: prepare.structured.case_id
    head: prepare.structured.head
    clean_commit: prepare.structured.clean_commit
    test_verdict: test.structured.verdict
    test_summary: test.structured.summary
    test_failures: test.structured.failures
    test_checks: test.structured.checks
    deploy_status: deploy.structured.status
    deploy_url: deploy.structured.url
    deploy_commit: deploy.structured.commit
    verify_verdict: verify.structured.verdict
    verify_summary: verify.structured.summary
    verify_unmet: verify.structured.unmet
    verify_threshold_checks: verify.structured.threshold_checks
    verify_issues: verify.structured.issues
    verify_same_value: verify.structured.same_value_checks
    stack: stack_down.structured.status
    reports: finish.structured.reports

  nodes:
    - name: prepare
      type: agent
      agent: epd_qa_prepare
      input_map:
        bundle: input.bundle
        project: input.project
        case_id: input.case_id
        case_branch: input.case_branch
        clean_commit: input.clean_commit
        case_commit: input.case_commit
        run_test: input.run_test
        run_verify: input.run_verify
        work_root: input.work_root

    - name: test
      type: agent
      agent: task_test
      depends_on: [prepare]
      condition:
        source: prepare.structured.run_test
        operator: equals
        value: true
      input_map:
        workspace_path: prepare.structured.workspace_path
        base_branch: prepare.structured.clean_commit

    # The browser path: epd_probe's chain on a bare copy of the bundle. Each step has its own
    # condition, because a step skipped by its condition lets the steps after it run.
    - name: claim
      type: agent
      agent: task_claim
      depends_on: [prepare]
      condition:
        source: prepare.structured.run_verify
        operator: equals
        value: true
      input_map:
        repo_url: prepare.structured.repo_url
        task_name: prepare.structured.claim_name
        workspaces_root: prepare.structured.workspaces_root

    - name: worktree
      type: agent
      agent: task_worktree
      depends_on: [claim]
      condition:
        source: claim.structured.task_slug
        operator: exists
      input_map:
        repo_url: prepare.structured.repo_url
        root: claim.structured.root
        task_slug: claim.structured.task_slug
        claim_path: claim.structured.claim_path
        base_branch: prepare.structured.base_branch

    - name: stack_detect
      type: agent
      agent: task_stack_detect
      depends_on: [worktree]
      condition:
        source: worktree.structured.worktree_path
        operator: exists
      input_map:
        worktree_path: worktree.structured.worktree_path
        repo: claim.structured.repo
        task_slug: claim.structured.task_slug
        keep: input.keep

    - name: stack_up
      type: agent
      agent: task_stack_up
      depends_on: [stack_detect]
      condition:
        source: stack_detect.structured.has_docker
        operator: equals
        value: true
      input_map:
        host_worktree_path: stack_detect.structured.host_worktree_path
        project: stack_detect.structured.project
        task_slug: claim.structured.task_slug
        env_name: stack_detect.structured.env_name
        ttl: input.stack_ttl

    # No candidate_commit: deploy takes the worktree's HEAD, the case commit, and seeds the stack
    # from it, as the build's deploy does.
    - name: deploy
      type: agent
      agent: task_deploy
      depends_on: [stack_up]
      condition:
        source: stack_detect.structured.has_docker
        operator: equals
        value: true
      input_map:
        worktree_path: worktree.structured.worktree_path
        host_worktree_path: stack_detect.structured.host_worktree_path
        project: stack_detect.structured.project
        task_slug: claim.structured.task_slug
        env_name: stack_detect.structured.env_name
        has_docker: stack_detect.structured.has_docker
        run_verify: stack_detect.structured.run_verify
        ttl: input.stack_ttl

    - name: verify
      type: agent
      agent: task_verify
      depends_on: [deploy]
      condition:
        source: deploy.structured.verify
        operator: equals
        value: true
      input_map:
        app_url: deploy.structured.url
        email: input.verify_email
        password: input.verify_password
        login_note: input.verify_login_note
        task_name: input.task_name
        task_description: input.task_description
        invariant: input.invariant
        threshold: input.threshold
        implement_summary: input.implement_summary
        task_slug: claim.structured.task_slug
        sent_back_because: input.sent_back_because
        same_value: input.same_value
        before_url: input.before_url
        before_email: input.before_email
        before_password: input.before_password
        criteria_reach: input.criteria_reach

    - name: stack_down
      type: agent
      agent: task_stack_down
      depends_on: [verify]
      # A failed check still has a stack to take down.
      run_after_failure: true
      condition:
        source: stack_detect.structured.stack_teardown
        operator: equals
        value: true
      input_map:
        env_name: stack_detect.structured.env_name

    - name: finish
      type: agent
      agent: epd_qa_finish
      depends_on: [test, stack_down]
      run_after_failure: true
      input_map:
        case_root: prepare.structured.case_root
        test_tree: prepare.structured.workspace_path
        verify_worktree: worktree.structured.worktree_path
        keep_reports_in: input.keep_reports_in
        keep: input.keep
