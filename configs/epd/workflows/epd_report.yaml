workflow:
  name: epd_report
  # 2: an optional focus, handed to the personas: the part of the product this report is for.
  # 3: the walkers take turns on the Alpaca paper account -- one login, real prices and fills, the
  #    market open -- instead of each seeding a mock-broker tenant of its own. No seed nodes; the
  #    walks run one after another; the personas and the report are told what the account held.
  version: 3
  description: |
    EPD loop, stage 1 of 7: the report. Replaces user research and analytics
    for a product that has neither yet.

      personas → walk_1 → walk_2 → walk_3 → report

    Three synthetic users, each with a job to be done, use the app at a URL
    (a dev stack of main) and record where they got stuck. The report ranks
    that friction with the evidence and writes <bet dir>/report.md. No code is
    read; no fixes are proposed. The bet stage reads the file.

    The walkers sign in to the paper login (paper_email): an owner connected
    to a real broker's paper account (Alpaca), with real prices, real fills
    and a market that is open or shut. Every walk before this one ran on the
    seed's mock broker, most of them with the market shut, and five walks in
    three rounds reported as the product's friction an entry the practice
    broker could not fill (b017). The driver starts a round only while the
    market is open, with time left for three walks.

    One account means the walkers take turns: walk_2 starts when walk_1 is
    done, walk_3 when walk_2 is. Two walkers on one book at once would move it
    under each other -- one places an order while the other reads its
    positions -- and the second would report that as friction the product
    caused. Each still gets its own browser (MCP sessions are keyed by calling
    agent, tools/mcp_client.py). A later walker can find an earlier one's
    orders: the personas are designed knowing the order they walk in, and the
    report writer knows it too.

    The personas and the report get what the account held as the round
    started (account_state, which the driver reads from Alpaca) and when the
    market closes (market).

    Isolated: every input is a string or a path. Run it alone against any dev
    stack that has the paper login, while the market is open, to work on the
    walkers or the report writer.
  inputs:
    app_url: {type: string, required: true}
    paper_email: {type: string, required: true}    # the login all three walkers use: the Alpaca paper account
    password: {type: string, required: true}
    account_state: {type: string, required: true}  # what the paper account held as the round started
    market: {type: string, required: true}         # "the market is open; it closes <when>"
    goals: {type: string, required: true}
    profile: {type: string, required: true}
    last_outcome: {type: string, required: false}
    bet_id: {type: string, required: true}
    report_path: {type: string, required: true}
    focus: {type: string, required: false}      # what part of the product the walkers stay in; empty = wherever the goals say
  outputs:
    status: report.structured.status
    report_path: report.structured.report_path
    jobs_done: report.structured.jobs_done
    top_items: report.structured.top_items
    summary: report.structured.summary
    coverage: personas.structured.coverage
    walk_1: walk_1.output
    walk_2: walk_2.output
    walk_3: walk_3.output

  nodes:
    - name: personas
      type: agent
      agent: epd_personas
      input_map:
        profile: input.profile
        goals: input.goals
        last_outcome: input.last_outcome
        focus: input.focus
        account_state: input.account_state
        market: input.market

    # One account, so one walker at a time: each walk waits for the one before it.
    - name: walk_1
      type: agent
      agent: epd_walk
      depends_on: [personas]
      input_map:
        app_url: input.app_url
        persona: personas.structured.persona_1
        turn: "1"
        email: input.paper_email
        password: input.password
        market: input.market

    - name: walk_2
      type: agent
      agent: epd_walk
      depends_on: [personas, walk_1]
      input_map:
        app_url: input.app_url
        persona: personas.structured.persona_2
        turn: "2"
        email: input.paper_email
        password: input.password
        market: input.market

    - name: walk_3
      type: agent
      agent: epd_walk
      depends_on: [personas, walk_2]
      input_map:
        app_url: input.app_url
        persona: personas.structured.persona_3
        turn: "3"
        email: input.paper_email
        password: input.password
        market: input.market

    - name: report
      type: agent
      agent: epd_report
      depends_on: [walk_1, walk_2, walk_3]
      input_map:
        report_path: input.report_path
        bet_id: input.bet_id
        goals: input.goals
        coverage: personas.structured.coverage
        account_state: input.account_state
        market: input.market
        walk_1: walk_1.output
        walk_2: walk_2.output
        walk_3: walk_3.output
        last_outcome: input.last_outcome
