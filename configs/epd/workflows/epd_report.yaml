workflow:
  name: epd_report
  version: 1
  description: |
    EPD loop, stage 1 of 7: the report. Replaces user research and analytics
    for a product that has neither yet.

      personas ┐
      seed_1 ──┴→ walk_1 ┐
      seed_2 ───→ walk_2 ├→ report
      seed_3 ───→ walk_3 ┘

    Three synthetic users, each with a job to be done, use the app at a URL
    (a dev stack of the branch being measured — main, at the top of a loop)
    and record where they got stuck. The report ranks that friction with
    the evidence and writes <bet dir>/report.md. No code is read; no fixes
    are proposed. The bet stage reads the file.

    The three walks depend only on personas, so they run at the same time —
    a walker is mostly waiting for a page. They used to be chained because
    all three shared one browser: an MCP session was keyed by server, so
    every agent in the run got the same one and concurrent walkers would
    read each other's pages. Sessions are keyed by calling agent now
    (tools/mcp_client.py), so each walker gets its own browser and its own
    cookies, and it is closed when that node ends.

    A browser each is not enough: two walkers in one tenant would move each
    other's book — one places an order while the other is reading its
    positions — and the second would report that as friction the product
    caused. So each walker seeds its own tenant first: seed_N runs
    `standee seed <env> -- --slot N` and reports the accounts it made
    (qa<N>@ with a scanned book, qa-empty<N>@ with none), and walk_N signs in
    with those. The seeding is part of the walker's own lane, not a count the
    environment has to be told when it is stood up — adding a fourth walker is
    a seed node and a walk node, and nothing else changes.

    Isolated: every input is a string or a path. Run it alone against any dev
    stack (env_name is what standee calls it) with any goals file to work on
    the walkers or the report writer.
  inputs:
    app_url: {type: string, required: true}
    env_name: {type: string, required: true}   # the standee environment behind app_url: the walkers seed it
    password: {type: string, required: true}
    goals: {type: string, required: true}
    profile: {type: string, required: true}
    last_outcome: {type: string, required: false}
    bet_id: {type: string, required: true}
    report_path: {type: string, required: true}
  outputs:
    status: report.structured.status
    report_path: report.structured.report_path
    jobs_done: report.structured.jobs_done
    top_items: report.structured.top_items
    summary: report.structured.summary
    coverage: personas.structured.coverage
    walk_1: walk_1.output
    walk_2: walk_2.output
    walk_3: walk_3.output

  nodes:
    - name: personas
      type: agent
      agent: epd_personas
      input_map:
        profile: input.profile
        goals: input.goals
        last_outcome: input.last_outcome

    # Slot N for walker N. These do not depend on personas: the accounts do not depend on who will use
    # them, so the seeding runs while the personas are being written.
    - name: seed_1
      type: agent
      agent: task_seed_slot
      input_map: {env_name: input.env_name, slot: "1", password: input.password}

    - name: seed_2
      type: agent
      agent: task_seed_slot
      input_map: {env_name: input.env_name, slot: "2", password: input.password}

    - name: seed_3
      type: agent
      agent: task_seed_slot
      input_map: {env_name: input.env_name, slot: "3", password: input.password}

    - name: walk_1
      type: agent
      agent: epd_walk
      depends_on: [personas, seed_1]
      input_map:
        app_url: input.app_url
        persona: personas.structured.persona_1
        account: personas.structured.account_1
        email: seed_1.structured.email
        empty_email: seed_1.structured.empty_email
        password: seed_1.structured.password

    - name: walk_2
      type: agent
      agent: epd_walk
      depends_on: [personas, seed_2]
      input_map:
        app_url: input.app_url
        persona: personas.structured.persona_2
        account: personas.structured.account_2
        email: seed_2.structured.email
        empty_email: seed_2.structured.empty_email
        password: seed_2.structured.password

    - name: walk_3
      type: agent
      agent: epd_walk
      depends_on: [personas, seed_3]
      input_map:
        app_url: input.app_url
        persona: personas.structured.persona_3
        account: personas.structured.account_3
        email: seed_3.structured.email
        empty_email: seed_3.structured.empty_email
        password: seed_3.structured.password

    - name: report
      type: agent
      agent: epd_report
      depends_on: [walk_1, walk_2, walk_3]
      input_map:
        report_path: input.report_path
        bet_id: input.bet_id
        goals: input.goals
        coverage: personas.structured.coverage
        walk_1: walk_1.output
        walk_2: walk_2.output
        walk_3: walk_3.output
        last_outcome: input.last_outcome
