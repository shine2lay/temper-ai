# QA's flaky-test report: which tests pass and fail on the same code.
#
# Runs the repository's own CI on one fixed commit N times, with the live task_test, unchanged, and
# counts per test how often it failed. A test that failed in some repetitions and passed in others is
# flaky: it fails builds for nothing, and a retry would only hide it. One that failed every time is
# broken, and one whose check failed without naming any test (an install or launch that went wrong)
# is counted apart, as an infrastructure flake.
#
#   prepare                     one fresh copy of the commit per repetition
#   run_<i> -> keep_<i>         task_test on copy i, its base set to the commit itself (so it skips
#                               its base rerun and lists every failure, each with its test id, as
#                               old); keep_<i> saves its answer and report to out/runs/run_<i> and
#                               removes the copy. `parallel` repetitions run at a time: run_<i>
#                               starts after keep_<i - parallel>.
#   tally                       qa_flaky_tally.py: the counts, the classes, out/report.md and
#                               out/report.json; with history on and a test flaky or broken, how
#                               often the live build's task_test counted it as a new failure
#                               (runs API, GET only)
#
# It only reports: no messages, no change to any repository, nothing pushed. Whoever owns the
# repository gets the fix request from QA. No model anywhere ($0), but CI time: RollCall's took
# 10 to 15 minutes per repetition with 3 at a time, so 20 repetitions took 75 to 115 minutes
# (longer on a busy machine).
#
# Start it through the API or the dashboard: the steps are laid out from `runs` and `parallel` when
# the run starts (template nodes), which `temper run` on the command line cannot do.
workflow:
  name: qa_flaky_report
  version: 1
  description: |
    Flaky-test report: the repository's CI (the live task_test) N times on one commit, then per test
    how often it failed, flaky or broken, its first error line and the repetitions; checks that
    failed without test lines counted apart. Writes report.md and report.json to out. No model.
  inputs:
    # A git bundle, a repository folder or a file:// URL the run can read (under the workspaces folder).
    repo:
      type: string
      required: true
    # A commit id or a branch of repo.
    commit:
      type: string
      required: true
    runs:
      type: integer
      required: false
      default: 20
    parallel:
      type: integer
      required: false
      default: 3
    # An absolute folder the run can write, for report.md, report.json and runs/.
    out:
      type: string
      required: true
    # Where the copies are made; default: the run box's temporary folder.
    work_root:
      type: string
      required: false
    history:
      type: boolean
      required: false
      default: true
    history_api:
      type: string
      required: false
      default: "http://server:8420"
    # Which workflows' task_test steps count as the live build (comma-separated).
    history_workflows:
      type: string
      required: false
      default: "epd_loop"

  outputs:
    status: tally.structured.status
    summary: tally.structured.summary
    commit: prepare.structured.commit
    flaky: tally.structured.flaky
    broken: tally.structured.broken
    infrastructure: tally.structured.infrastructure
    never_completes: tally.structured.never_completes
    report: tally.structured.report
    report_json: tally.structured.report_json

  nodes:
    - name: prepare
      type: agent
      agent: qa_flaky_prepare
      input_map:
        repo: input.repo
        commit: input.commit
        runs: input.runs
        parallel: input.parallel
        out: input.out
        work_root: input.work_root

    - name: repetitions
      type: template
      for_each: input.runs
      as: i
      template:
        - name: "run_{{ i }}"
          type: agent
          agent: task_test
          # The first `parallel` start at once; each later one waits for a lane to free up.
          # (A parallel below 1 is laid out as 1 here and refused by prepare.)
          depends_on: ["{% set p = [input.parallel | int, 1] | max %}{{ 'keep_%d' % (i - p) if i >= p else 'prepare' }}"]
          # One repetition that times out must not stop the others: it is a result too.
          run_after_failure: true
          condition:
            source: prepare.structured.status
            operator: equals
            value: ready
          input_map:
            workspace_path: "prepare.structured.slot_{{ i }}"
            base_branch: prepare.structured.commit

        - name: "keep_{{ i }}"
          type: agent
          agent: qa_flaky_keep
          depends_on: ["run_{{ i }}"]
          run_after_failure: true
          condition:
            source: prepare.structured.status
            operator: equals
            value: ready
          input_map:
            # A bare word that names no input is passed as it is: the repetition's number.
            index: "{{ i }}"
            result: "run_{{ i }}.output"
            step_status: "run_{{ i }}.status"
            step_error: "run_{{ i }}.error"
            tree: "prepare.structured.slot_{{ i }}"
            out: prepare.structured.out

    # A template of one, so that its depends_on can name every keep_<i>.
    - name: report
      type: template
      for_each: 1
      as: _
      template:
        - name: tally
          type: agent
          agent: qa_flaky_tally
          depends_on: "[\"prepare\"{% for k in range(input.runs | int) %}, \"keep_{{ k }}\"{% endfor %}]"
          run_after_failure: true
          input_map:
            prepare_status: prepare.structured.status
            prepare_error: prepare.structured.error
            out: prepare.structured.out
            runs: prepare.structured.runs
            commit: prepare.structured.commit
            repo: prepare.structured.repo
            subject: prepare.structured.subject
            parallel: prepare.structured.parallel
            work_root: prepare.structured.work_root
            history: input.history
            history_api: input.history_api
            history_workflows: input.history_workflows
