# temper's Slack app settings (docs/slack.md). This tracked file documents
# the format; the real settings go in configs/slack/local/slack.yaml
# (git-ignored, since it names people's Slack ids), which is used instead
# when it exists. Changes are picked up without a restart.
#
# Where notices and questions go (a gate waiting, stuck, failed, finished)
# is no longer set here: it is the notify file, configs/notify/notify.yaml
# (docs/notify.md), shared by Slack and Telegram. A run started from Slack
# still keeps its notices in the thread it was started in. The old
# notify: and workflows: keys below are read but no longer used.
slack:
  # dashboard_url: https://temper.example.com   # run links in @temper's answers
  # Where the agent tools (SlackPost, SlackReply, SlackReadThread) may post
  # and read; nowhere else. Threads temper opened for a run are allowed too.
  # A destination is {channel: ..., dm: ...}: channel is a channel id (C...)
  # or #name (the bot must be in a private channel to post there); dm is a
  # user id (U...). Either may be a list.
  agents: []
