# The Team page's settings (docs/pi-team-api.md). Not a config: the configs
# importer skips this folder. This install's own values go in
# configs/team/local/team.yaml (git-ignored), in the same shape; a key there
# replaces the one here.
#
# project_roots: the folders a team trial may work on, as absolute host paths
#   ("~" is /app inside the containers). "/a/b" is that folder itself;
#   "/a/*" is any folder directly inside /a. None by default: a trial then has
#   no project folder. The owner lists them at switch-on.
# owner_callers: the API key names that count as the owner, shown as "You"
#   on the Team page; any other named caller is shown by its name.
# account_slots: the host helper's account slots a Pi run may use. The Pi
#   lane picks one per run when it starts the run, as account_pick says, and
#   keeps it for the whole run. Account 1 ("anthropic") is never allowed.
# account_pick: how that pick is made. "room" (the default): the slot with
#   the most weekly room under 85% of its 5 h and 90% of its 7 d use, read
#   from account_room_file. "settings_order": the first allowed slot in
#   account_slots order, with no capacity check at all (no file, no usage
#   call; the run records its capacity as not checked); it takes no
#   account_room_file. Any other value, or settings_order with an
#   account_room_file, stops every Pi run until it is fixed. This file leaves
#   it at room; an install's local file may say settings_order.
# account_room_file: where the Pi lane reads the slots' room figures (an
#   absolute host path, written on the host). Unset under the room pick: a
#   Pi run doesn't start.

project_roots: []
owner_callers: [owner-dashboard]
account_slots: [anthropic-2, anthropic-3]
