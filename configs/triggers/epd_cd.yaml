# RollCall's continuous deployer, every minute: each tick runs the deployer tick (debounced 2-minute
# release of master's HEAD) and the CI verdict step (money-test rerun/undo and non-money red notices)
# in one script-agent run (configs/epd/workflows/epd_cd.yaml, configs/epd/bin/rollcall_cd_deploy.py,
# configs/epd/bin/rollcall_cd_verdict.py).
#
# Off until RollCall says go: `enabled: true` switches it on (read on every tick, no restart).
trigger:
  name: epd_cd
  source: schedule
  enabled: false
  on:
    every: 1m
    catch_up: false
  workflow: epd_cd
