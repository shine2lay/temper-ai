# Put the label "temper" on a Linear issue and temper reads it and replies
# with a comment.
#
# Fires once, when the label is added (or the issue is created with it),
# not on every later edit of a labelled issue. temper's own changes never
# fire it (ignore_self defaults to true).
#
# Linear must be sending Issue events to POST /api/hooks/linear, signed with
# LINEAR_WEBHOOK_SECRET; see docs/linear.md.
trigger:
  name: linear_reply
  source: linear
  on:
    type: Issue
    label_added: temper
  workflow: linear_reply
  inputs:
    issue_id: "{{ data.id }}"
    identifier: "{{ data.identifier }}"
