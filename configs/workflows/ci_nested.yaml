workflow:
  name: ci_nested
  description: |
    The machine check's nesting test: a stage inside a stage. Script agents
    only — no LLM call, no API key, no spend — so the throwaway stack
    `temper-ci box` brings up can run it with no model keys at all.

      temper run ci_nested
      POST /api/runs {"workflow": "ci_nested"}

    Real runs get this shape whenever a stage groups work that is itself a
    stage: `epd_task` has `environment` inside it, an `epd_propose` run has a
    `pitch_*` stage per idea. The dashboard has to open a details panel for
    such an inner stage, and the end-to-end check `nestedStages.spec.ts`
    clicks every node of a run of this workflow to prove it does.

  outputs:
    finished: finish.output

  nodes:
    - name: begin
      type: agent
      agent: ci_step
      input_map:
        step: "begin"

    - name: outer
      type: stage
      depends_on: [begin]
      nodes:
        - name: inner
          type: stage
          nodes:
            - name: deep_one
              type: agent
              agent: ci_step
              input_map:
                step: "deep_one"

            - name: deep_two
              type: agent
              agent: ci_step
              depends_on: [deep_one]
              input_map:
                step: "deep_two"
                saw: deep_one.structured.step

        - name: after_inner
          type: agent
          agent: ci_step
          depends_on: [inner]
          input_map:
            step: "after_inner"

    - name: finish
      type: agent
      agent: ci_step
      depends_on: [outer]
      input_map:
        step: "finish"
