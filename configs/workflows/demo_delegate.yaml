workflow:
  name: demo_delegate
  description: |
    Demo: coordinator delegates to researchers (mid-agent), then the
    workflow continues to a summarizer that receives the coordinator's output.
  inputs:
    topic:
      type: string
      required: true
  # No provider here: whichever one you configured is used. Pin one with
  # `provider:` + `model:`, or set TEMPER_DEFAULT_PROVIDER.
  nodes:
    - name: research
      type: agent
      agent: demo_coordinator

    - name: summarize
      type: agent
      agent: demo_summarizer
      depends_on: [research]
      input_map:
        synthesis: research.output
