workflow:
  name: desk_check
  # DESK CHECK (product role; built 2026-10-02). The free rung of assumption testing (Teresa
  # Torres, Continuous Discovery Habits): before any paid test, check an idea's riskiest
  # assumptions against public documents. Input: a hypothesis and its assumptions, each with a
  # pass bar and a kill bar fixed before the run (usually the "desk" tests an opportunity brief
  # lists). Output: per assumption pass / kill / unknown, each resting on fetched, quoted primary
  # sources (or a count made from a public dataset), and what the verdicts mean for the
  # hypothesis.
  #
  #   setup (script) -> [ check_1 | ... | check_6, one per assumption ] -> synth -> final (script)
  #
  # Six fixed researcher slots, each run only when its assumption exists (setup lists the slots;
  # a condition skips the rest). Not a `type: template` fan-out: `temper run` loads a workflow
  # without its inputs, so a template can't expand from the command line.
  #
  # Evidence discipline, same as opportunity_brief: every load-bearing claim has a URL, a date
  # and an exact quote confirmed on the page (cite.py keeps each page read); a count made from a
  # public dataset keeps the dataset and the script, which the check runs again; primary = the
  # original document; vendor marketing is tagged vendor; an interested party's own survey is
  # tagged interested; listicles never count; never invent; never get around a block; desk
  # research only (no sign-ups, demos, quotes or contact). check_desk.py checks each verdict's
  # support and lists its decisive claims for a person to re-read by hand.
  #
  # The bar governs (queue #24, after run 2a2f6850 held an assumption at unknown under a neutral-
  # source rule its bar had set aside). Evidence rules, listed in each run's state/desk/input.md:
  # fixed F1-F3 (checkable claims; no listicles or snippets; a pass or kill rests on at least one
  # claim read with cite.py or counted from data) and the defaults D1 two sources, D2 a neutral
  # source, D3 a primary source, held only where an assumption's own pass_if or kill_if is
  # silent on them. A bar sets a default aside only in its own words; a verdict that relies on
  # that quotes them (rules.set_aside), and an unknown held back by a default names it
  # (rules.decided_by). check_desk.py checks both against the bar and the decisive claims.
  #
  # PDFs and who is speaking (queue #28, after the travel study left PDF reports unread: the run
  # containers have no pdftotext). cite.py reads PDFs with pdftext.py, a standard-library reader
  # desk_setup writes next to it, so a PDF reads the same everywhere; a PDF its publisher locks
  # stays unread. Every claim carries party (neutral or interested), stake (an interested
  # source's gain), source and signal (pays, does, says or fact); each verdict states carried_by,
  # the strongest signal among its decisive claims (money over behaviour over words), checked
  # by check_desk.py. The tags inform a verdict and its caveats; they never move a bar or rule.
  #
  # provider: claude = Claude Code CLI (its own WebSearch/WebFetch/Bash); no temper tools: blocks.
  version: 1
  description: |
    Desk check of an idea's riskiest assumptions: one researcher per assumption (in parallel,
    up to 6) judges it pass / kill / unknown against the pass and kill bars given with it, from
    fetched and quoted primary documents and public datasets it counts itself; then a
    synthesizer reviews each verdict against its bar and says what the verdicts mean for the
    hypothesis. The bars govern: the evidence defaults (two sources, a neutral source, a
    primary source) hold only where a bar is silent, and each verdict names any default its bar
    set aside or that decided it. A script checks every verdict's support and lists the
    decisive claims for a hand check. Each verdict also shows what carried it (pays, does, says
    or fact) and who is speaking (neutral or interested sources, with their stake). PDF
    reports are read like any page.
  inputs:
    hypothesis:
      type: string
      required: true    # the idea, its current hypothesis and the evidence so far (a few paragraphs)
    assumptions:
      type: string
      required: true    # JSON list, 1-6 entries: [{"id": "A1", "assumption", "pass_if", "kill_if", "pointers"}], ids A1..An in order
      description: >-
        JSON list of 1-6 assumptions, ids A1..An in order, each {"id", "assumption", "pass_if",
        "kill_if", "fatal", "pointers"}. Each is judged by its own pass_if and kill_if. Evidence
        rules: fixed, a pass or kill rests on at least one claim quoted from a kept page or
        counted from a public dataset, never on listicles or search snippets; defaults, held
        only where the bar is silent: D1 at least 2 sources, D2 one checked claim from a
        neutral party (not the company, vendor or group with a stake in the answer), D3 that
        claim primary. To set a default aside, say so in pass_if or kill_if, for example "the
        operator's own stated figure counts" (D2) or "one source is enough" (D1).
        The hypothesis text never sets one aside.
  outputs:
    report_path: synth.structured.report_path
    hypothesis_status: synth.structured.hypothesis_status
    verdicts: synth.structured.verdicts
    check_verdict: final.structured.verdict
    check_problems: final.structured.problems
    spot_check: final.structured.spot_check
    rules: final.structured.rules    # per assumption: decided_by (defaults that held it back), set_aside (with the bar's words)
    evidence: final.structured.evidence    # per assumption: carried_by (pays, does, says, fact or none), signals, speaking (neutral, interested or both), sources with party and stake

  nodes:
    # Input files + the three helpers (cite.py, pdftext.py, check_desk.py) into the workspace.
    # No model.
    - name: setup
      type: agent
      agent: desk_setup
      input_map:
        hypothesis: input.hypothesis
        assumptions: input.assumptions

    # One researcher per assumption, side by side.
    - name: check_1
      type: agent
      agent: desk_assumption
      depends_on: [setup]
      condition: {source: setup.structured.slots, operator: contains, value: A1}
      input_map: {slot: A1}
    - name: check_2
      type: agent
      agent: desk_assumption
      depends_on: [setup]
      condition: {source: setup.structured.slots, operator: contains, value: A2}
      input_map: {slot: A2}
    - name: check_3
      type: agent
      agent: desk_assumption
      depends_on: [setup]
      condition: {source: setup.structured.slots, operator: contains, value: A3}
      input_map: {slot: A3}
    - name: check_4
      type: agent
      agent: desk_assumption
      depends_on: [setup]
      condition: {source: setup.structured.slots, operator: contains, value: A4}
      input_map: {slot: A4}
    - name: check_5
      type: agent
      agent: desk_assumption
      depends_on: [setup]
      condition: {source: setup.structured.slots, operator: contains, value: A5}
      input_map: {slot: A5}
    - name: check_6
      type: agent
      agent: desk_assumption
      depends_on: [setup]
      condition: {source: setup.structured.slots, operator: contains, value: A6}
      input_map: {slot: A6}

    # Reviews each verdict against its bar and writes the report. Runs check_desk.py itself.
    - name: synth
      type: agent
      agent: desk_synthesize
      depends_on: [check_1, check_2, check_3, check_4, check_5, check_6]

    # The report's mechanical check and the hand-check list. No model. It gets each researcher's
    # final answer, so an assumption an account limit stopped fails the check by name.
    - name: final
      type: agent
      agent: desk_final
      depends_on: [synth]
      input_map:
        a1: check_1.output
        a2: check_2.output
        a3: check_3.output
        a4: check_4.output
        a5: check_5.output
        a6: check_6.output
