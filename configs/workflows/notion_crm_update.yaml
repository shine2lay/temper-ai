workflow:
  name: notion_crm_update
  description: |
    Update a Notion table like a CRM from web pages or text: reads each
    source, pulls out the fields the table has (company, website, industry,
    size, ...), and creates or updates one row per company, found by the
    table's key so running it again never makes duplicates. The table is a
    named target in the Notion config (default "crm").
      temper run notion_crm_update --input urls="https://a.com/about, https://b.com"
      temper run notion_crm_update --input table=crm --input text="Acme raised..."
  inputs:
    urls:
      type: string
      required: false
    text:
      type: string
      required: false
    table:
      type: string
      required: false
    instructions:
      type: string
      required: false
  outputs:
    rows: update.structured.rows
  nodes:
    - name: update
      type: agent
      agent: notion_crm_update
      input_map:
        urls: input.urls
        text: input.text
        table: input.table
        instructions: input.instructions
