workflow:
  name: opportunity_brief_consumer
  # OPPORTUNITY BRIEF, CONSUMER VERSION (product role; travel study #20, landed by queue #27).
  # Use it for an idea whose users are consumers (or a mix); opportunity_brief is the version for
  # software sold to businesses. Same inputs, outputs, setup and check (brief_setup, brief_check);
  # the four lenses and the synthesizer are consumer versions: who pays when users don't
  # (affiliate, subscription share), how often the need comes back (from a sampled source) and
  # what that means for retention and measuring fit, revenue and cost per active user a year (low
  # and high case), consumer channels and distribution inside AI assistants, a coverage row for
  # every player the focus names, and serving barriers (store and assistant reviews, partner
  # approvals, licences, privacy) weighed apart from the build. On the travel study's inputs it
  # beat opportunity_brief on these six items by the bar written before the runs (V1 03dbaeff,
  # V2 fc575760; ~/product-autopilot/research/travel-discovery/inputs/brief-candidate-bar.md).
  #
  #   setup (script) -> [ feasibility | viability | go_to_market | competition ] -> synthesize (leader) -> check (script)
  #
  # Evidence discipline, same as scan/signal: every load-bearing claim has a URL, a date and an
  # exact quote confirmed on the page (cite.py keeps each page read, so the words can be checked
  # again); primary = the original document; vendor marketing is tagged vendor; listicles never
  # count; never invent; never get around a block; desk research only (no sign-ups, demos,
  # quotes or contact). check_brief.py checks the brief's structure and quotes and draws the
  # 10-claim spot-check sample a person re-fetches by hand.
  #
  # provider: claude = Claude Code CLI (its own WebSearch/WebFetch/Bash); no temper tools: blocks.
  version: 1
  description: |
    Opportunity brief for one consumer idea (opportunity_brief is the business version): four
    desk-research lenses (feasibility and usability, viability with revenue per active user
    and how often the need recurs, go-to-market with consumer channels and AI assistants,
    competition with a row for every named player) with cited claims, then a synthesizer
    that answers Cagan's 10 opportunity-assessment questions, rates the four big risks plus
    go-to-market (low/med/high, with evidence), lists the riskiest assumptions with their
    cheapest tests, sets kill criteria and recommends advance to the paid test / change the
    wedge / kill. A script checks the brief and samples claims for a hand spot check.
  inputs:
    idea:
      type: string
      required: true    # name, target user, problem and wedge (one paragraph)
    signal_evidence:
      type: string
      required: true    # the idea's free-signal evidence: its signal-scorecard section + quote-bank lines
    focus:
      type: string
      default: ""       # idea-specific research pointers, one line per lens (feasibility:, viability:, go_to_market:, competition:)
  outputs:
    brief_path: brief.structured.brief_path
    recommendation: brief.structured.recommendation
    risks: brief.structured.risks
    check_verdict: check.structured.verdict
    check_problems: check.structured.problems
    spot_check: check.structured.spot_check

  nodes:
    # Input file + the two helpers (cite.py, check_brief.py) into the workspace. No model.
    - name: setup
      type: agent
      agent: brief_setup
      input_map:
        idea: input.idea
        signal_evidence: input.signal_evidence
        focus: input.focus

    # Four parallel desk-research lenses + a leader that writes the brief.
    - name: brief
      type: stage
      strategy: leader
      depends_on: [setup]
      input_map:
        idea: input.idea
        focus: input.focus
      agents:
        - agent: brief_feasibility_consumer
        - agent: brief_viability_consumer
        - agent: brief_gtm_consumer
        - agent: brief_competition_consumer
        - agent: brief_synthesize_consumer
          role: leader

    # The brief's mechanical check and the spot-check sample. No model. It gets each lens's final
    # answer, so a lens an account limit stopped fails the brief by name (run 99732fd1).
    - name: check
      type: agent
      agent: brief_check
      depends_on: [brief]
      input_map:
        feasibility_answer: brief.brief_feasibility_consumer.output
        viability_answer: brief.brief_viability_consumer.output
        gtm_answer: brief.brief_gtm_consumer.output
        competition_answer: brief.brief_competition_consumer.output
