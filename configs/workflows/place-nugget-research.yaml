workflow:
  name: place-nugget-research
  description: |
    Place-driven nugget enrichment. Given a specific place
    (name + city + optional category/context), surfaces practical
    tips / warnings / timing / cost / photo / vibe insights from
    real web sources, each cited.

    Single-stage workflow: pn_research does WebSearch + WebFetch +
    LLM extraction in one. Citation validation moved to the
    backend persister (backend/research_pipeline/place_nugget_enricher.py)
    — simpler than wiring it as a temper script-agent stage, and
    avoids the script-template / Jinja-tojson edge cases that the
    in-temper validator kept tripping on.

    Output goes straight into backend's persister, which:
      1. Validates every nugget cites a URL that appears in
         sources_fetched (drops uncited).
      2. Persists each fetched URL as a new research_articles row
         (with new source_kind values: forum, reddit, review, etc.).
      3. Persists each nugget as a research_nuggets row FK'd to its
         source article.

    Existing concierge string-match lookup picks up the new
    nuggets automatically (zero schema change).

  defaults:
    provider: claude
    model: opus

  inputs:
    place_name:
      type: string
      required: true
    city:
      type: string
      required: true
    category:
      type: string
      required: false
    context:
      type: string
      required: false

  outputs:
    queries_run: research.structured.queries_run
    sources_fetched: research.structured.sources_fetched
    nuggets: research.structured.nuggets
    diagnostics: research.structured.diagnostics

  nodes:
    - name: research
      type: agent
      agent: pn_research
      input_map:
        place_name: input.place_name
        city: input.city
        category: input.category
        context: input.context
