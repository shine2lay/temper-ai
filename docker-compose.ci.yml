# The throwaway stack the machine check runs a commit in.
#
# Never layered on the live stack: `temper-ci box` always runs it under a
# project name of its own (`temper-box-<sha>`), so its containers, network
# and database volume are separate objects from the live `temper-ai` ones.
# `docker compose -p temper-box-… down -v` can therefore only remove what
# this file declares for that project.
#
#   docker compose -p temper-box-abc1234 \
#       -f docker-compose.yml -f docker-compose.ci.yml \
#       --env-file <the box's env file> --profile worker up -d server worker
#
# What it changes about the base file:
#
#   * the server's published port comes from the env (the base file pins
#     8420, which the live server already holds);
#   * no frontend/dist mount — a commit's worktree has no built dashboard,
#     and an empty bind mount would serve a blank page over the one the
#     image built from that same commit;
#   * no host docker socket on the server, and no .env: the box has no
#     model keys, so nothing it runs can spend money;
#   * Slack, Telegram and Notion off, and no webhook;
#   * the worker gets the socket (that is how a run gets a box of its own),
#     TEMPER_SPAWNER=docker, and templates its runs from the box's own
#     server container, never the live one.
services:
  postgres:
    # Throwaway data: a tmpfs is both faster and impossible to leave behind.
    volumes: !override []
    tmpfs:
      - /var/lib/postgresql/data
    restart: "no"

  redis:
    restart: "no"

  # The browser service is not part of the smoke set (a browser agent costs
  # money, and the box has no keys). Put behind a profile nothing here
  # turns on, and given a port from the env, so it can neither start by
  # accident nor ever collide with the live stack's 8931.
  playwright-mcp:
    profiles: !override ["browser"]
    restart: "no"
    ports: !override
      - "127.0.0.1:${PLAYWRIGHT_MCP_PORT:-0}:8931"

  server:
    build:
      context: .
      target: server
    image: ${TEMPER_CI_IMAGE_SERVER:-temper-ci-server:latest}
    restart: "no"
    ports: !override
      - "127.0.0.1:${TEMPER_CI_SERVER_PORT:-8440}:8420"
    volumes: !override
      - ./temper_ai:/app/temper_ai:ro
      - ./configs:/app/configs:ro
      - ${WORKSPACE_DIR:?the box needs a workspace dir of its own}:${WORKSPACE_DIR}
    env_file: !override []
    environment: !override
      HOME: /app
      PYTHONDONTWRITEBYTECODE: "1"
      TEMPER_DATABASE_URL: postgresql://temper_ai:${POSTGRES_PASSWORD:-temper_dev}@postgres:5432/temper_ai
      TEMPER_REDIS_URL: redis://redis:6379/0
      TEMPER_LOG_LEVEL: ${TEMPER_LOG_LEVEL:-INFO}
      WORKSPACE_DIR: ${WORKSPACE_DIR}
      TEMPER_EXECUTION_MODE: external
      TEMPER_API: http://server:8420
      # Named so a run's box can reach this server, not the live one.
      TEMPER_MCP_ALLOWED_HOSTS: ""
      # Deliberately empty, all of them. A box that cannot authenticate to a
      # model cannot spend the owner's money, and the smoke set is script
      # agents only.
      OPENAI_API_KEY: ""
      OPENAI_OAUTH_TOKEN: ""
      ANTHROPIC_API_KEY: ""
      CLAUDE_CODE_OAUTH_TOKEN: ""
      CLAUDE_CODE_OAUTH_TOKEN_BACKUP: ""
      GEMINI_API_KEY: ""
      TYPESAFE_API_KEY: ""
      VLLM_BASE_URL: ""
      OLLAMA_BASE_URL: ""
      # Off: the box must not reach the owner's Slack, Telegram or Notion,
      # and must not answer the live ones.
      SLACK_BOT_TOKEN: ""
      SLACK_APP_TOKEN: ""
      SLACK_SIGNING_SECRET: ""
      TELEGRAM_BOT_TOKEN: ""
      NOTION_API_KEY: ""
      TEMPER_WEBHOOK_URL: ""
      GITHUB_APP_PRIVATE_KEY: ""
      GITHUB_APP_WEBHOOK_SECRET: ""
      # The public hooks' signing secrets: test values, so the smoke set can
      # sign a request the way Linear and Notion do and see it accepted,
      # while a request signed with the live secret is refused here.
      LINEAR_WEBHOOK_SECRET: ${TEMPER_CI_LINEAR_SECRET:-box-linear-secret}
      NOTION_WEBHOOK_SECRET: ${TEMPER_CI_NOTION_SECRET:-box-notion-secret}
      # The Slack test entry's own secret, so the smoke set can knock on it
      # with the right token and with the wrong one. Slack itself is off
      # here (no bot token), so nothing a fake does can reach the owner's
      # workspace.
      TEMPER_SLACK_TEST_TOKEN: ${TEMPER_CI_SLACK_TEST_TOKEN:-box-slack-test-token}

  worker:
    build:
      context: .
      target: worker
    image: ${TEMPER_CI_IMAGE_WORKER:-temper-ci-worker:latest}
    restart: "no"
    volumes: !override
      - ./temper_ai:/app/temper_ai:ro
      - ./configs:/app/configs:ro
      - ${WORKSPACE_DIR}:${WORKSPACE_DIR}
      # The socket is how a run gets a box of its own. The worker alone
      # holds it; the run containers it starts never see it.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-988}"
    env_file: !override []
    environment: !override
      HOME: /home/temperai-worker
      PYTHONDONTWRITEBYTECODE: "1"
      TEMPER_DATABASE_URL: postgresql://temper_ai:${POSTGRES_PASSWORD:-temper_dev}@postgres:5432/temper_ai
      TEMPER_REDIS_URL: redis://redis:6379/0
      TEMPER_LOG_LEVEL: ${TEMPER_LOG_LEVEL:-INFO}
      WORKSPACE_DIR: ${WORKSPACE_DIR}
      TEMPER_SPAWNER: docker
      # The box's own server container, so a run inherits this stack's
      # database and network — never the live server's.
      TEMPER_DOCKER_TEMPLATE_CONTAINER: ${TEMPER_CI_TEMPLATE_CONTAINER:?the box needs its own template container}
      TEMPER_DOCKER_WORKSPACES: all
      TEMPER_DOCKER_RUN_COMMAND: .venv/bin/python -m temper_ai.cli.main run-workflow
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      CLAUDE_CODE_OAUTH_TOKEN: ""
      TYPESAFE_API_KEY: ""
      GITHUB_APP_PRIVATE_KEY: ""
      GITHUB_APP_WEBHOOK_SECRET: ""
