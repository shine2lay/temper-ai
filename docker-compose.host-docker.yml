# Opt-in overlay: give the worker the host's docker socket.
#
# Only for runs that need it — engineer agents bringing a repository's own
# compose stack up (qa_release_discover, devops_engineer, task_deploy) do;
# a research or coding run does not. What it costs: a node's Bash runs as
# the worker's uid, and a uid that can reach the socket can start a
# container with the host's filesystem mounted, i.e. is root on the host.
# The platform baseline policy refuses and records a command that names
# the socket (see docs/reference/policies/index.md), but that is a
# tripwire on the command text, not a boundary. Do not leave this on for
# runs that do not need it.
#
# Layer it on top of the base file (and your local override, if any):
#
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#       -f docker-compose.host-docker.yml --profile worker up -d worker
#
# or, to make it the default for this checkout, in .env:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.override.yml:docker-compose.host-docker.yml
#
# Volumes and group_add merge with the base file's lists.
services:
  worker:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # The host's docker socket GID, so the worker's uid can use the socket
    # without sudo. Set DOCKER_GID in .env if your host's docker group has a
    # non-default GID (Linux: `stat -c '%g' /var/run/docker.sock`).
    group_add:
      - "${DOCKER_GID:-999}"
