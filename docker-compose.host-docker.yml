# Opt-in overlay: give the worker the host's docker socket.
#
# What the socket costs: a uid that can reach it can start a container
# with the host's filesystem mounted, i.e. is root on the host. Who gets
# to reach it depends on TEMPER_SPAWNER:
#
#   TEMPER_SPAWNER=docker      The worker uses the socket for one thing:
#                              starting a sibling container per run (see
#                              temper_ai/spawner/docker_spawner.py), a copy
#                              of the worker or of the container named by
#                              TEMPER_DOCKER_TEMPLATE_CONTAINER. Runs
#                              execute in those containers and never see
#                              the socket. This is the sandbox; use it.
#
#   TEMPER_SPAWNER=subprocess  Refused: the worker won't start (H1, see
#                              temper_ai/spawner/factory.py). Runs would
#                              execute inside the worker container, as the
#                              same uid, so every node's Bash could reach
#                              the socket. Only the Pi lane's pi-worker
#                              (TEMPER_LANE=pi, docs/pi-lane.md) runs
#                              child processes beside a socket: it runs
#                              nothing but Pi steps, whose members run in
#                              boxes of their own. It holds its own socket
#                              in the base file, not through this overlay.
#
# Layer it on top of the base file (and your local override, if any):
#
#   TEMPER_SPAWNER=docker docker compose \
#       -f docker-compose.yml -f docker-compose.override.yml \
#       -f docker-compose.host-docker.yml --profile worker up -d worker
#
# or, to make it the default for this checkout, in .env:
#
#   TEMPER_SPAWNER=docker
#   COMPOSE_FILE=docker-compose.yml:docker-compose.override.yml:docker-compose.host-docker.yml
#
# Volumes and group_add merge with the base file's lists.
services:
  worker:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # The host's docker socket GID, so the worker's uid can use the socket
    # without sudo. Set DOCKER_GID in .env if your host's docker group has a
    # non-default GID (Linux: `stat -c '%g' /var/run/docker.sock`).
    group_add:
      - "${DOCKER_GID:-999}"
