# Published ports bind to loopback by default: the dashboard and the MCP
# endpoint have no authentication, so nothing here should be reachable from
# the LAN just because the host has an address on it. To expose the server,
# put a gateway in front of it (TLS + a real hostname on a private network),
# or set TEMPER_BIND=0.0.0.0 deliberately.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: temper_ai
      POSTGRES_USER: temper_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temper_dev}
    ports:
      - "${TEMPER_BIND:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temper_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Redis: used by the worker protocol (phase 4+) for live LLM chunk streaming.
  # Stream `chunks:{execution_id}` is bounded via XADD MAXLEN; chunks expire on TTL.
  # Server is fine without redis until phase 4; service runs ahead of need so
  # local-dev compose stays one command.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly no --save ""
    ports:
      - "${TEMPER_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Playwright MCP: a headless Chromium an agent can drive over MCP, so a node
  # can open a deployed app and read it back. Reached at http://playwright-mcp:8931/mcp
  # on this network (configs/mcp_servers/playwright.yaml); the published port is for
  # a human poking at it, not for the agents.
  #
  # Why its own service and not a browser in the server image: Chromium and its
  # font/codec dependencies are ~1.5 GB that only browser nodes ever use, and the
  # browser gets to crash, leak or hang on its own without taking the API down.
  #
  # --isolated keeps each session's profile in memory: a verify run never inherits
  # the cookies or the logged-in state of the run before it. --no-sandbox because
  # Chromium's own sandbox needs privileges this container deliberately lacks; the
  # container is the sandbox. --output-dir under /tmp: the image runs as `node`
  # and /app is root's, so the default (/app/browser-output) failed with EACCES
  # on nearly every action — noise in every walk's transcript, not a real error.
  #
  # working_dir is that same directory, and it is mounted from the host: a
  # screenshot taken WITH a filename is written relative to the workspace root
  # (the cwd; --output-dir only names the unnamed ones), and the EPD ship stage
  # on the host picks the files up from workspaces/browser-output to put them
  # on the pull request. The host directory must exist and be writable by uid
  # 1000 (`node`) before `up`; docker would otherwise create it owned by root.
  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp:latest
    restart: unless-stopped
    init: true
    ports:
      - "${TEMPER_BIND:-127.0.0.1}:${PLAYWRIGHT_MCP_PORT:-8931}:8931"
    working_dir: /tmp/browser-output
    volumes:
      - ${WORKSPACE_DIR:-./workspaces}/browser-output:/tmp/browser-output
    entrypoint: node
    command: >
      /app/cli.js
      --headless
      --browser chromium
      --no-sandbox
      --isolated
      --port 8931
      --host 0.0.0.0
      --allowed-hosts playwright-mcp:8931,localhost:8931,127.0.0.1:8931
      --output-dir /tmp/browser-output
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    ports:
      - "${TEMPER_BIND:-127.0.0.1}:8420:8420"
    volumes:
      # Hot reload: mount source code over the installed package. Read-only:
      # the host writes, the container reads. Runs execute in this process
      # (TEMPER_EXECUTION_MODE=inprocess) and a node's Bash reaches whatever
      # its uid can write — that must not include the code the next run
      # executes.
      - ./temper_ai:/app/temper_ai:ro
      - ./configs:/app/configs:ro
      - ${WORKSPACE_DIR:-./workspaces}:/app/workspaces
      # Serve the locally built dashboard when there is one, so `npm run
      # build` + restart is enough. Without this the image's own copy is
      # served, and a rebuilt frontend silently never reaches the browser.
      - ${FRONTEND_DIST:-./frontend/dist}:/app/frontend/dist:ro
    environment:
      HOME: /app
      PYTHONDONTWRITEBYTECODE: "1"
      TEMPER_DATABASE_URL: postgresql://temper_ai:${POSTGRES_PASSWORD:-temper_dev}@postgres:5432/temper_ai
      # Redis: live chunk streaming (worker_protocol_v1 phase 4+).
      # Server runs without it pre-phase-4; URL set up early so config doesn't
      # have to change later.
      TEMPER_REDIS_URL: redis://redis:6379/0
      TEMPER_LOG_LEVEL: ${TEMPER_LOG_LEVEL:-INFO}
      # Hostnames the MCP endpoint may be reached under. The SDK rejects
      # any other Host header (DNS-rebinding protection), so a server
      # behind a gateway must name itself here.
      TEMPER_MCP_ALLOWED_HOSTS: ${TEMPER_MCP_ALLOWED_HOSTS:-}
      CLAUDE_CODE_MODEL: ${CLAUDE_CODE_MODEL:-}
      # Set to require a bearer token on the API, the MCP endpoint and the
      # WebSocket. Unset = open to anyone who can reach the server.
      TEMPER_API_TOKEN: ${TEMPER_API_TOKEN:-}
      # POST the outcome of every run to a URL. Off unless set.
      TEMPER_WEBHOOK_URL: ${TEMPER_WEBHOOK_URL:-}
      TEMPER_WEBHOOK_TIMEOUT: ${TEMPER_WEBHOOK_TIMEOUT:-}
      # Named, revocable client tokens: a JSON file of {"client-name":
      # "token"}, re-read when it changes so removing a name takes effect on
      # the next request rather than the next deploy. Mount the file
      # yourself and point this at it, e.g.
      #   volumes: [./my-tokens.json:/app/tokens.json:ro]
      #   TEMPER_API_TOKENS_FILE=/app/tokens.json
      # It is not mounted here by default: a bind mount for a file that does
      # not exist makes Docker create a *directory* of that name, which
      # would break the feature for anyone who has not created one.
      TEMPER_API_TOKENS_FILE: ${TEMPER_API_TOKENS_FILE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # ChatGPT Plus/Pro OAuth token (a JWT): routes to the Codex Responses
      # endpoint instead of api.openai.com. local/sync-openai-oauth-token.sh
      # copies pi's current token here.
      OPENAI_OAUTH_TOKEN: ${OPENAI_OAUTH_TOKEN:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_MODEL: ${VLLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      TEMPER_MEMORY_BACKEND: ${TEMPER_MEMORY_BACKEND:-sql}
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    command: >
      .venv/bin/python -m uvicorn temper_ai.server:app
      --host 0.0.0.0
      --port 8420

  # Worker: polls Postgres for queued workflow runs and spawns each as a
  # subprocess in this container. Has the toolchain (pytest, npm, docker
  # CLI, db clients) the server image deliberately doesn't carry, so
  # engineer agents can actually exercise their work. Server inserts rows
  # with status=queued when TEMPER_EXECUTION_MODE=external; the worker
  # picks them up. Both share the same Postgres + Redis.
  #
  # The host's docker socket is NOT mounted here. A node's Bash runs as
  # this container's uid, and a uid that can reach the socket is root on
  # the host — so the socket is an opt-in overlay for the runs that need
  # it (engineer agents bringing a repo's compose stack up), see
  # docker-compose.host-docker.yml. Workspaces are still mounted at the
  # SAME path as the host (instead of /app/workspaces) so that, with the
  # overlay, `docker compose up` from inside resolves volume paths
  # correctly; without the path-equivalent mount, sibling containers get
  # broken volume mounts.
  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    volumes:
      # Source code mount for hot-reload of agent / CLI changes. Read-only:
      # each run is a subprocess off this mount, and a node's Bash must not
      # be able to rewrite the code the next run executes.
      - ./temper_ai:/app/temper_ai:ro
      - ./configs:/app/configs:ro
      # Workspaces at host-equivalent path, see above
      - ${WORKSPACE_DIR:-./workspaces}:${WORKSPACE_DIR:-./workspaces}
    environment:
      HOME: /home/temperai-worker
      PYTHONDONTWRITEBYTECODE: "1"
      TEMPER_DATABASE_URL: postgresql://temper_ai:${POSTGRES_PASSWORD:-temper_dev}@postgres:5432/temper_ai
      TEMPER_REDIS_URL: redis://redis:6379/0
      TEMPER_LOG_LEVEL: ${TEMPER_LOG_LEVEL:-INFO}
      # Where a claimed run executes: `subprocess` (default) is a child
      # process of the watcher in this container; `docker` is a container
      # of its own per run — the worker's image, env and read-only mounts,
      # only the run's workspace writable, never the docker socket. `docker`
      # needs the socket on the *worker* (docker-compose.host-docker.yml):
      # that is what it spawns with.
      TEMPER_SPAWNER: ${TEMPER_SPAWNER:-subprocess}
      # Workspace path string the server writes into WorkflowRun rows must
      # match what the worker can resolve — same value on both sides.
      WORKSPACE_DIR: ${WORKSPACE_DIR:-./workspaces}
      # LLM provider config — mirror server's defaults; user-specific
      # provider plugins + credentials live in docker-compose.override.yml.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_MODEL: ${VLLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    # Opt-in: only starts when explicitly profiled or named.
    # `docker compose --profile worker up -d` to enable.
    profiles:
      - worker

volumes:
  postgres-data:
